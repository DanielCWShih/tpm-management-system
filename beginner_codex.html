<!-- 
========================================================================
REVISION HISTORY / VERSION LOG
========================================================================
2026-05-29 V6.4: 👑 全域星盤微重構全功能壓縮版。更正時間。沒收醜陋的水平橫向滾動條，上層 7 大 Level 看板正式改制為剛性兩排並列網格流向。左側常駐導航樹全面對標大圖書館設計，依據 1-x、2-x 檔案前綴全自動歸類生成可折疊 Level 導航。修復主面版間距緩衝，徹底根除 Hover 浮起時卡片左側與頂部線條被網頁裁切的 UI 缺陷。同步修正右上角特工名稱讀取鏈條，完全對齊主網頁大廳格式。
========================================================================
-->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初心者寶典大廳 | System TPM Tactical Hub</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
            --color-locked-gray: #E2E8F0;
        }

        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
        }

        * { box-sizing: border-box; }

        /* 頂部導航控制列 */
        .tactical-navbar {
            width: 100vw; height: 85px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px; background-color: var(--bg-color);
            flex-shrink: 0; z-index: 1000;
        }

        .navbar-brand { display: flex; flex-direction: column; }
        .navbar-controls { display: flex; align-items: center; gap: 15px; }

        .auth-panel {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            padding: 10px 20px; border-radius: var(--radius-sm);
            font-size: 0.85rem; font-weight: 900; box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .back-btn {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            padding: 10px 15px; border-radius: var(--radius-sm);
            cursor: pointer; font-weight: 900; text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy); color: var(--text-main);
        }

        .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }

        /* 工作框架 */
        .workspace-container { display: flex; width: 100vw; height: calc(100vh - 85px); overflow: hidden; }

        /* 👑 側邊欄全域天賦樹：全面看齊圖書館折疊式設計 👑 */
        .sidebar-panel {
            display: flex; width: 350px; background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy); padding: 25px 18px;
            flex-direction: column; gap: 12px; overflow-y: auto; flex-shrink: 0;
        }

        .hub-return-btn {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            padding: 12px 15px; border-radius: var(--radius-sm); cursor: pointer;
            font-weight: 900; box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%; margin-bottom: 5px; color: var(--text-main); text-align: center;
        }

        .hub-return-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }

        .menu-category-block { width: 100%; margin-bottom: 2px; }

        .tree-main-toggle {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            padding: 12px 16px; border-radius: var(--radius-sm);
            font-weight: 900; font-size: 0.92rem; text-align: left;
            cursor: pointer; width: 100%; display: flex;
            justify-content: space-between; align-items: center; color: var(--text-main);
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .tree-sub-group {
            padding-left: 10px; border-left: 3px solid var(--border-heavy);
            margin-left: 8px; margin-top: 6px; display: flex; flex-direction: column; gap: 6px;
        }

        .leaf-btn {
            background: var(--card-white); border: 2px solid var(--border-heavy);
            padding: 10px 14px; border-radius: var(--radius-sm); font-weight: 800;
            font-size: 0.82rem; text-align: left; cursor: pointer; width: 100%;
            color: var(--text-main); box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s; line-height: 1.4;
        }

        .leaf-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--border-heavy); }
        .leaf-btn.active { background: var(--color-active-gold) !important; box-shadow: 1px 1px 0px var(--border-heavy) !important; }

        /* 右側主內容畫布 */
        .content-panel {
            flex: 1; height: 100%; padding: 35px 40px;
            background-color: var(--card-white); display: flex; flex-direction: column;
            overflow: visible; /* 👑 剛性防禦：移除 hidden，解鎖外層編譯裁切 👑 */
        }

        /* 容器基礎顯影互鎖 */
        .dashboard-view-hall, .document-canvas, .exam-session-box, .sub-pagination-dots-zone {
            display: none; width: 100%;
        }

        /* 👑 修正點：微型大廳加裝 15px 安全緩衝帶，徹底杜絕 Hover 黑色邊框邊緣切邊 👑 */
        .dashboard-view-hall {
            height: 100%; overflow-y: auto; padding: 15px 15px 40px 15px; 
        }

        /* 👑 修正點：沒收水平滾動，重構為兩排並列剛性矩陣網格 👑 */
        .level-cards-parallel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 第一排4個，第二排3個自動對齊 */
            gap: 20px; width: 100%; margin-bottom: 25px; padding: 5px 2px;
        }

        .progress-card-master {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow-tactical);
            cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* 👑 修正點：確保頂層 Level 卡片在浮起位移時，四周有充足邊界不被裁剪 👑 */
        .progress-card-master:hover {
            transform: translate(-4px, -4px); box-shadow: 8px 8px 0px var(--border-heavy);
        }

        .progress-card-master.active-level {
            background: linear-gradient(135deg, #FFFDF4 0%, #FAFAFA 100%) !important;
            border-width: 4px !important; box-shadow: 6px 6px 0px var(--border-heavy) !important;
        }

        .progress-label { font-family: monospace; font-weight: 900; font-size: 0.8rem; color: var(--text-secondary); }
        .progress-percentage { font-size: 2.5rem; font-weight: 900; margin: 4px 0; color: var(--text-main); line-height: 1; }
        .progress-stats { font-size: 0.8rem; font-weight: 800; color: var(--text-main); }

        .progress-bar-bg { width: 100%; height: 12px; background: #E2E8F0; border: 2px solid var(--border-heavy); border-radius: 6px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--color-completed); width: 0%; transition: width 0.4s ease-out; }

        .cdx-dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; width: 100%; padding: 5px 2px;
        }

        .cdx-dashboard-card {
            border: 3px solid var(--border-heavy); border-radius: var(--radius-sm);
            padding: 22px 20px; cursor: pointer; box-shadow: var(--shadow-tactical);
            transition: all 0.15s; display: flex; flex-direction: column; justify-content: space-between; min-height: 130px;
        }

        .cdx-dashboard-card:hover { transform: translate(-4px, -4px); box-shadow: 8px 8px 0px var(--text-main); }

        .document-canvas { flex: 1; overflow: hidden; }
        .textbook-scroll-box { flex: 1; overflow-y: auto; padding-right: 8px; width: 100%; }

        .sub-pagination-dots-zone { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 15px 0; border-top: 2px dashed #E2E8F0; }
        .slider-dot { width: 14px; height: 14px; border: 3px solid var(--border-heavy); border-radius: 50%; background: #FFF; cursor: pointer; }
        .slider-dot.active { background: var(--text-main); transform: scale(1.2); }
        .slider-dot.exam-dot { border-color: var(--color-fail); background: #FEF2F2; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #B91C1C; }
        .slider-dot.exam-dot.active { background: var(--color-fail); color: #FFF; }
    </style>
</head>
<body>

    <!-- 頂部控制列 -->
    <div class="tactical-navbar">
        <div class="navbar-brand">
            <span style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.8rem;">SYS.BEGINNER_CODEX V6.4</span>
            <h1 style="margin: 3px 0 0 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">初心者寶典大廳</h1>
        </div>
        <div class="navbar-controls">
            <!-- 👑 修正4：同步校正特工憑證欄位，完全與大廳及 Library 名稱格式統一 👑 -->
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：讀取中...</div>
            <a href="index.html" class="back-btn">返回首頁</a>
        </div>
    </div>

    <!-- 工作主框架 -->
    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboardMenu()">↩ 返回戰術大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">DASHBOARD</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">公會戰術天賦大廳</h2>
            </div>

            <!-- 數據化星盤 HUB 大廳 -->
            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <!-- 上層：預留 7 大 Level 的剛性雙排網格 ── 拒絕滾動條 -->
                <div class="level-cards-parallel-grid" id="global-level-flex-deck"></div>
                
                <div style="border-bottom: 3px dashed var(--border-heavy); width: 100%; margin: 5px 0 25px 0;"></div>
                <div style="font-weight: 900; font-size: 1.2rem; margin-bottom: 15px; color: var(--text-main);">
                    🌿 <span id="dynamic-list-title-label">Level 1</span> 子單元大捷攻堅列表：
                </div>
                <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
            </div>

            <!-- 教材大畫布 -->
            <div class="document-canvas" id="textbook-viewport">
                <div class="cdx-sub-nav-bar" id="cdx-sub-nav-wrapper"></div>
                <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.15rem; margin: 0 0 15px 0;">⚡ 實戰知識核心 (Core Knowledge Base)</h3>
                <div class="dynamic-flow-canvas" id="dynamic-flow-renderer-box"></div>
                <div class="textbook-scroll-box" id="lesson-content"></div>
            </div>

            <!-- 10 抽 3 大考場 -->
            <div class="exam-session-box" id="exam-viewport">
                <div style="display:flex; justify-content:space-between; font-weight:900; margin-bottom:10px;">
                    <span style="color:var(--color-fail);">🔥 10 抽 3 隨機閃擊戰 (Exam Mode)</span>
                    <span id="exam-counter">1 / 3</span>
                </div>
                <div class="exam-progress-bar"><div class="exam-progress-fill" id="exam-progress"></div></div>
                <h3 id="exam-question-text" style="font-size:1.2rem; line-height:1.5; margin-bottom:25px; font-weight: 800;">載入中...</h3>
                <div id="exam-options-container"></div>
            </div>

            <div class="sub-pagination-dots-zone" id="universal-dots-bar"></div>
        </main>
    </div>

    <script>
        // 核心子單元全域去中心化配置註冊表
        const globalSubUnitRegistry = [
            { type: 'codex', levelNum: 1, levelKey: 'l1', subUnitId: '1-1', title: '1-1: 基本世界觀與三方賽局', file: 'course_data_1-1.js' },
            { type: 'codex', levelNum: 1, levelKey: 'l1', subUnitId: '1-2', title: '1-2: 硬體生命週期與 NPI 交付', file: 'course_data_1-2.js' },
            { type: 'codex', levelNum: 1, levelKey: 'l1', subUnitId: '1-3', title: '1-3: 工廠地理與 4M1E 線體通識', file: 'course_data_1-3.js' }
        ];

        const globalLevelMetadata = [
            { num: 1, key: 'l1', name: 'LEVEL 1', label: '🌿 基礎通識領域' },
            { num: 2, key: 'l2', name: 'LEVEL 2', label: '🌊 進階跨功能技術' },
            { num: 3, key: 'l3', name: 'LEVEL 3', label: '🔮 高階 TPM 專科' },
            { num: 4, key: 'l4', name: 'LEVEL 4', label: '⏳ 日常速通地下城' },
            { num: 5, key: 'l5', name: 'LEVEL 5', label: '🌐 供應鏈擴展 DLC' },
            { num: 6, key: 'l6', name: 'LEVEL 6', label: '🔒 未知研修領域' },
            { num: 7, key: 'l7', name: 'LEVEL 7', label: '🔒 神聖核心終局' }
        ];

        let selectedActiveLevelNum = 1; 
        let activeCourseIdx = 0, activePageIdx = 0, activeSubMatrixIdx = 0, activeFlowNodeIdx = 0;
        let examActive = false, examCurrentQ = 0, examScoreCount = 0;

        window.showTacticalDict = (t) => { const b = document.getElementById('runtime-dict-box'); if (b) { b.style.display = 'block'; b.innerHTML = `💡 <strong>特工字典反饋：</strong><br>${t}`; } };
        window.triggerSimDecision = (s, f) => { const b = document.getElementById('runtime-sandbox-fallout'); if (b) { b.style.display = 'block'; b.className = s ? 'sandbox-fallout-box success' : 'sandbox-fallout-box fail'; b.innerHTML = f; } };

        window.onload = () => { window.codexCourseEngineData = []; renderGlobalTreeStructure(); routeController(); };

        // 👑 修正1：左側導航樹全自動對位 ── 動態打包 1-x、2-x 摺疊層，看齊大圖書館 👑
        function renderGlobalTreeStructure() {
            const root = document.getElementById('global-tree-root'); root.innerHTML = '';
            
            // 分離並封裝現有 Level
            const presentLevels = [...new Set(globalSubUnitRegistry.map(u => u.levelNum))].sort();
            presentLevels.forEach(lvlNum => {
                const subset = globalSubUnitRegistry.filter(u => u.levelNum === lvlNum);
                const block = document.createElement('div');
                block.className = 'menu-category-block';
                block.innerHTML = `
                    <button class="tree-main-toggle" onclick="toggleMenuSection('lvl-accordion-${lvlNum}')">🗺️ Level ${lvlNum} 展開</button>
                    <div id="lvl-accordion-${lvlNum}" class="tree-sub-group" style="display: flex; flex-direction: column;">
                        ${subset.map(u => `<button class="leaf-btn" id="lf-codex-${u.subUnitId}" onclick="switchUnit('${u.type}','${u.subUnitId}', ${u.levelNum})">${u.title}</button>`).join('')}
                    </div>`;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) { const el = document.getElementById(id); if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none'; }

        function routeController(directType, directC) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramC = directC || urlParams.get('c');
            const paramType = directType || urlParams.get('type') || 'codex';
            syncNavbarState();

            if (!paramC) {
                document.getElementById('cdx-page-header-zone').style.display = 'block';
                document.getElementById('current-chapter-id').innerText = "DASHBOARD";
                document.getElementById('current-chapter-name').innerText = "公會戰術天賦大廳";
                document.getElementById('dashboard-menu-hall').style.display = 'block';
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'none';
                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active'));
                renderMultiLevelHubDashboard();
            } else {
                document.getElementById('dashboard-menu-hall').style.display = 'none';
                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active'));
                const leaf = document.getElementById(`lf-${paramType}-${paramC}`); if (leaf) leaf.classList.add('active');
                injectContentPackScript(paramType, paramC);
            }
        }

        function renderMultiLevelHubDashboard() {
            const deckRow = document.getElementById('global-level-flex-deck');
            const grid = document.getElementById('l1-cards-grid');
            if (!deckRow || !grid) return;
            deckRow.innerHTML = ''; grid.innerHTML = '';

            globalLevelMetadata.forEach(lvl => {
                const subUnitsInLvl = globalSubUnitRegistry.filter(u => u.levelNum === lvl.num);
                let total = subUnitsInLvl.length, done = 0;
                subUnitsInLvl.forEach(u => { if (localStorage.getItem(`codex-L1-A${u.subUnitId.split('-')[1]}-clear`) === 'true') done++; });
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                deckRow.innerHTML += `
                    <div class="progress-card-master ${lvl.num===selectedActiveLevelNum?'active-level':''}" onclick="selectedActiveLevelNum=${lvl.num};renderMultiLevelHubDashboard();">
                        <div class="progress-label">${lvl.name} : ${lvl.label}</div>
                        <div class="progress-percentage">${pct}%</div>
                        <div class="progress-stats">完成指標: ${done} / ${total}</div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%;"></div></div>
                    </div>`;
            });

            document.getElementById('dynamic-list-title-label').innerText = `Level ${selectedActiveLevelNum}`;
            const filteredUnits = globalSubUnitRegistry.filter(u => u.levelNum === selectedActiveLevelNum);
            if (filteredUnits.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; padding: 40px 20px; border: 2px dashed var(--color-locked-gray); text-align: center; font-weight: 800; color: var(--text-secondary); border-radius: var(--radius-sm);">🔒 執政官提示：Level ${selectedActiveLevelNum} 數據包尚未部署上線，敬請期待。</div>`;
                return;
            }

            filteredUnits.forEach(unit => {
                const storageKey = `L1-A${unit.subUnitId.split('-')[1]}`;
                const isClear = localStorage.getItem(`codex-${storageKey}-clear`) === 'true';
                grid.innerHTML += `
                    <div class="cdx-dashboard-card" style="background-color: ${isClear?'#DCFCE7':'#FEF08A'};" onclick="switchUnit('${unit.type}', '${unit.subUnitId}', ${unit.levelNum})">
                        <div>
                            <div style="font-family: monospace; font-size: 0.8rem; font-weight: 900; color: var(--text-secondary);">LEVEL ${selectedActiveLevelNum} SUB-UNIT</div>
                            <h3 style="margin: 6px 0 0 0; font-size: 1.1rem; font-weight: 900; color: var(--text-main);">${unit.title}</h3>
                        </div>
                        <div style="font-size: 0.82rem; font-weight: 900; color: var(--text-main); margin-top: 15px;">${isClear ? `✅ 考核通過 [ 等階: ${localStorage.getItem(`talent-${storageKey}-grade`)} ]` : '⏳ 尚未通過考核'}</div>
                    </div>`;
            });
        }

        function switchUnit(type, subUnitId, lvlNum) { examActive = false; selectedActiveLevelNum = lvlNum; activeCourseIdx = 0; activePageIdx = 0; activeSubMatrixIdx = 0; activeFlowNodeIdx = 0; window.history.pushState(null, '', `${window.location.pathname}?type=${type}&c=${subUnitId}`); routeController(type, subUnitId); }
        function exitToDashboardMenu() { examActive = false; window.history.pushState(null, '', window.location.pathname); routeController(null, null); }

        function injectContentPackScript(type, packId) {
            window.codexCourseEngineData = []; const old = document.getElementById('dynamic-course-pack'); if (old) old.remove();
            const found = globalSubUnitRegistry.find(u => u.subUnitId === packId); if (!found) return;
            const script = document.createElement('script'); script.id = 'dynamic-course-pack';
            script.src = `${found.file}?v=${Date.now()}`;
            script.onload = () => { initEngine(); };
            document.head.appendChild(script);
        }

        function initEngine() {
            if (!window.codexCourseEngineData || window.codexCourseEngineData.length === 0) {
                document.getElementById('current-chapter-name').innerText = "數據解讀失敗";
                document.getElementById('lesson-content').innerHTML = `<div style="padding: 30px; border: 3px solid var(--border-heavy); background-color: #FEE2E2; border-radius: var(--radius-sm); font-weight: 900; color: var(--color-fail);">🚨 [除錯顯影警告] window.codexCourseEngineData 數據結構為空！</div>`;
                return;
            }
            loadCourseState(activeCourseIdx, activePageIdx);
        }

        function loadCourseState(cIdx, pIdx) {
            activeCourseIdx = cIdx; const course = window.codexCourseEngineData[cIdx];
            const dotsBar = document.getElementById('universal-dots-bar'); dotsBar.innerHTML = '';

            if (examActive) {
                document.getElementById('textbook-viewport').style.display = 'none'; document.getElementById('exam-viewport').style.display = 'block'; document.getElementById('universal-dots-bar').style.display = 'flex';
                course.subPages.forEach((_, sIdx) => { dotsBar.innerHTML += `<div class="slider-dot" onclick="exitExamToPage(${sIdx})"></div>`; });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot active">⚔️</div>`;
                runExamEngine();
            } else {
                document.getElementById('textbook-viewport').style.display = 'flex'; document.getElementById('exam-viewport').style.display = 'none'; document.getElementById('universal-dots-bar').style.display = 'flex';
                activePageIdx = pIdx; const page = course.subPages[pIdx];
                document.getElementById('current-chapter-id').innerText = `PAGE ${pIdx + 1} / ${course.subPages.length}`;
                document.getElementById('current-chapter-name').innerText = page.title;

                const subNavWrapper = document.getElementById('cdx-sub-nav-wrapper');
                let targetedText = page.text; let targetedFlow = page.diagramFlowArray;

                if (page.subMatrixBranches) {
                    if (subNavWrapper) {
                        subNavWrapper.style.display = 'flex'; subNavWrapper.innerHTML = '';
                        page.subMatrixBranches.forEach((branch, bIdx) => {
                            subNavWrapper.innerHTML += `<button class="sub-nav-btn ${bIdx===activeSubMatrixIdx?'active':''}" onclick="activeSubMatrixIdx=${bIdx};activeFlowNodeIdx=0;loadCourseState(${cIdx},${pIdx})">${branch.branchLabel}</button>`;
                        });
                    }
                    targetedText = page.subMatrixBranches[activeSubMatrixIdx].text; targetedFlow = page.subMatrixBranches[activeSubMatrixIdx].diagramFlowArray;
                } else { if (subNavWrapper) subNavWrapper.style.display = 'none'; activeSubMatrixIdx = 0; }

                if (targetedFlow && targetedFlow[activeFlowNodeIdx] && targetedFlow[activeFlowNodeIdx].text) {
                    document.getElementById('lesson-content').innerHTML = targetedFlow[activeFlowNodeIdx].text;
                } else { document.getElementById('lesson-content').innerHTML = targetedText; }

                const flowRenderer = document.getElementById('dynamic-flow-renderer-box');
                if (flowRenderer && targetedFlow) {
                    flowRenderer.style.display = 'flex'; flowRenderer.innerHTML = '';
                    targetedFlow.forEach((node, nIdx) => {
                        flowRenderer.innerHTML += `<div class="flow-node-block ${nIdx===activeFlowNodeIdx?'active-node':''}" onclick="activeFlowNodeIdx=${nIdx};loadCourseState(${cIdx},${pIdx})">${node.name}</div>`;
                        if (nIdx < targetedFlow.length - 1) flowRenderer.innerHTML += `<div class="flow-arrow-split">➔</div>`;
                    });
                } else if (flowRenderer) { flowRenderer.style.display = 'none'; }

                course.subPages.forEach((_, sIdx) => { dotsBar.innerHTML += `<div class="slider-dot ${sIdx===pIdx?'active':''}" onclick="activePageIdx=${sIdx};activeFlowNodeIdx=0;loadCourseState(${cIdx},${sIdx})"></div>`; });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot" onclick="enterExamMode()">⚔️</div>`;
            }
        }

        function runExamEngine() {
            const course = window.codexCourseEngineData[activeCourseIdx]; if (examCurrentQ >= 3) { settleExamPayload(); return; }
            const qData = course.examVault[examCurrentQ];
            document.getElementById('current-chapter-id').innerText = "EXAM MODE"; document.getElementById('current-chapter-name').innerText = "10 抽 3 隨機閃擊戰";
            document.getElementById('exam-counter').innerText = `${examCurrentQ + 1} / 3`;
            document.getElementById('exam-progress').style.width = `${(examCurrentQ / 3) * 100}%`;
            document.getElementById('exam-question-text').innerText = `${examCurrentQ + 1}. ${qData.q}`;
            const container = document.getElementById('exam-options-container'); container.innerHTML = '';
            qData.o.forEach((opt, idx) => { container.innerHTML += `<div class="option-card" onclick="submitAnswer(${idx})">${opt}</div>`; });
        }

        function submitAnswer(idx) { const course = window.codexCourseEngineData[activeCourseIdx]; if (idx === course.examVault[examCurrentQ].a) { examScoreCount++; } examCurrentQ++; runExamEngine(); }

        function settleExamPayload() {
            examActive = false; const course = window.codexCourseEngineData[activeCourseIdx];
            let grade = examScoreCount === 3 ? "S" : examScoreCount === 2 ? "A" : "Fail";
            let storageKey = "L1-A" + course.courseId.split('-')[1];
            if (grade === "Fail") { alert(`💥【考核失敗】答對題數 ${examScoreCount}/3，未達 2 題及格線！`); localStorage.setItem(`codex-${storageKey}-clear`, 'false'); localStorage.removeItem(`talent-${storageKey}-grade`); } 
            else { alert(`🏆【考核通過】位階核定為：【 ${grade} 】級！`); localStorage.setItem(`codex-${storageKey}-clear`, 'true'); localStorage.setItem(`talent-${storageKey}-grade`, grade); }
            exitToDashboardMenu();
        }

        // 👑 修正4：對齊主網頁大廳格式，優先拉取本地儲存特工真實名稱 👑
        function syncNavbarState() {
            const name = localStorage.getItem('tpm-user-name') || 'Daniel';
            const rank = localStorage.getItem('tpm-user-rank') || '最高技術執政官';
            document.getElementById('global-user-profile-card').innerHTML = `👤 ${rank}：${name}`;
        }
        function executeLangSwitch(lang) { routeController(); }
    </script>
</body>
