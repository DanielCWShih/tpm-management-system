<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初心者寶典 | Beginner's Codex</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #FEF9E7; 
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            
            --color-locked: #94A3B8;
            --color-available: #3B82F6;
            --color-completed: #F59E0B;
        }
        
        * { 
            box-sizing: border-box; 
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif; 
            color: var(--text-main); 
        }
        
        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* 左側導航羊皮紙 */
        aside {
            width: 320px;
            background-color: var(--sidebar-cream);
            border-right: 3px solid var(--border-heavy);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            flex-shrink: 0;
            height: 100%;
        }

        .aside-header {
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .back-btn {
            display: block;
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            margin-bottom: 20px;
        }
        .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }

        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .chapter-item {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.15s;
            position: relative;
        }

        /* 三態側邊欄按鈕視覺 */
        .chapter-item.locked { border-color: var(--color-locked); box-shadow: 2px 2px 0px var(--color-locked); opacity: 0.6; cursor: not-allowed; }
        .chapter-item.locked * { color: var(--color-locked); }
        .chapter-item.available { border-color: var(--color-available); box-shadow: 3px 3px 0px var(--color-available); }
        .chapter-item.available:hover { transform: translateX(4px); }
        .chapter-item.completed { border-color: var(--color-completed); box-shadow: 3px 3px 0px var(--color-completed); background: #FFFDF4; }
        .chapter-item.completed:hover { transform: translateX(4px); }
        
        .chapter-item.active {
            background: var(--text-main) !important;
        }
        .chapter-item.active * { color: white !important; }

        .chapter-badge {
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            font-family: monospace;
        }
        .chapter-title { font-size: 0.9rem; font-weight: 800; margin-top: 5px; }

        /* 右側聖遺物文獻主閱讀區 */
        main {
            flex: 1;
            height: 100%;
            padding: 40px;
            overflow-y: auto;
            background: var(--card-white);
            position: relative;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .auth-panel {
            background: var(--bg-color);
            border: 2px solid var(--border-heavy);
            padding: 8px 15px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 800;
            box-shadow: 2px 2px 0px var(--border-heavy);
            display: flex;
            align-items: center;
        }

        .document-canvas { width: 100%; }
        .scroll-text { font-size: 1.05rem; line-height: 1.8; font-weight: 600; white-space: pre-line; margin-bottom: 40px; }
        
        /* 守關 Boss 戰情境區 */
        .boss-trial-section {
            border: 3px solid #DC2626;
            border-radius: var(--radius-sm);
            padding: 30px;
            background: #FEF2F2;
            box-shadow: var(--shadow-tactical);
            margin-top: 50px;
        }

        .option-card {
            background: white;
            border: 2px solid var(--border-heavy);
            padding: 18px;
            border-radius: var(--radius-sm);
            margin-top: 15px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.1s;
        }
        .option-card:hover { background: var(--sidebar-cream); }

        /* 仿魔物獵人 Quest Clear 蓋印章特效 */
        .clear-seal-overlay {
            display: none;
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            border: 6px double var(--color-completed);
            background: rgba(254, 249, 231, 0.95);
            padding: 15px 50px;
            z-index: 1000;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
        .clear-seal-overlay text { font-family: 'Segoe UI', Impact, sans-serif; font-size: 36px; font-weight: 900; fill: var(--color-completed); letter-spacing: 3px; }
    </style>
</head>
<body>

    <aside>
        <div class="aside-header">
            <a href="index.html" class="back-btn">↩ 返回公會大廳</a>
            <div style="font-size: 0.8rem; font-weight: 900; font-family: monospace; color: var(--text-secondary);">SYS.CODEX V4.5</div>
            <h2 style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">初心者寶典</h2>
        </div>
        
        <ul class="chapter-list" id="chapter-menu">
            </ul>
    </aside>

    <main>
        <div id="quest-clear-stamp" class="clear-seal-overlay">
            <svg width="300" height="80" viewBox="0 0 300 80">
                <text x="50%" y="60%" text-anchor="middle">QUEST CLEAR</text>
            </svg>
        </div>

        <div class="main-header">
            <div>
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary);">CHAPTER 01</span>
                <h1 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 2rem; font-weight: 900;">加載中...</h1>
            </div>
            
            <div id="user-identity-box" class="auth-panel">
                <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com" data-context="signin" data-ux_mode="popup" data-callback="onGoogleAuthIn" data-auto_select="true"></div>
                <div class="g_id_signin" data-type="standard" data-size="medium"></div>
            </div>
        </div>

        <div class="document-canvas">
            <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.2rem;">📜 聖遺物卷軸 (核心教學)</h3>
            <div id="lesson-content" class="scroll-text"></div>
            
            <div id="boss-battleground" class="boss-trial-section">
                <h3 style="margin-top:0; color:#B91C1C;">⚔️ 守關 Boss 考驗 (情境抉擇)</h3>
                <p id="trial-question" style="font-weight: 800; font-size: 1.1rem; line-height: 1.5;"></p>
                <div id="trial-options-box"></div>
            </div>
        </div>
    </main>

    <script>
        // 初心者寶典核心教材與題庫數據庫
        const codexDatabase = {
            "CH-01": {
                id: "CH-01",
                badge: "Lesson 1 (必修)",
                title: "基本世界觀 (四界雙域)",
                defaultStatus: "available",
                lesson: "在 System TPM 的世界中，運行著「四界雙域」的物理法則。\n\n1. 眾神殿/天界 (Customer/Client)：居住著女神（客戶）。她們手握市場預言術、外觀幻化術與結構熔煉術，負責編撰出最完美的萬物二維圖紙（2D Drawing）。\n2. 🔮 幻界/萬物星塵 (Vendor/Supplier)：控制材料與核心元件晶圓的原研發祕密，負責向天界提供樣品，並源源不絕地向深淵運送星塵物料（零件）。\n3. ⚙️ 機械熔爐/物質深淵 (EMS Factory)：這就是代工廠，接過天界圖紙與幻界物料，在極限生產工時、線平衡與公差的物理結界下進行實體召喚。\n4. 🏘️ 凡間/命運大陸 (End Market)：消費市場。凡人購買產品產生信仰銷售額，反饋天界，完成創世迴圈。",
                question: "當產品在物質深淵（工廠）大量複製時，發現某顆核心感測器晶片大缺料，導致生產中斷。此時，身為兩界平衡特工的 System TPM，該如何做決策？",
                options: [
                    "立刻修改天界（客戶）的外觀幻化圖紙，將缺料空間封死。(❌ 邏輯崩潰，直接滅團)",
                    "即刻開啟與幻界（供應商）的品質審查，同時啟動二線備料策略（Second Source Sourcing）進行認證分流。(⭕ 挑戰成功！點亮星芒！)",
                    "原地待命，等待機械熔爐產線主管自行去跟供應商談判。(❌ 降級為 F-Rank 廢物)"
                ]
            },
            "CH-02": {
                id: "CH-02",
                badge: "Lesson 2 (必修)",
                title: "工廠的基礎 (SMT與良率鐵律)",
                defaultStatus: "locked",
                lesson: "進入物質深淵的第一站，就是 SMT（表面黏著技術）火山熔爐流水線。\n\n空電路板進入後，必須經過鋼網錫膏印刷、SPI（錫膏檢查門）、貼片機吸嘴毫秒級飛速貼片、再進入高溫迴流焊（Reflow Profile）。出爐後必須通過 AOI（自動光學檢測）與 X-Ray 的審判之門。\n\n在深淵中，直通率（FPY, First Pass Yield）是至高無上的血統鐵律。一台裝置如果在途中被拔下來重修三次才及格，即使良率達標，它也帶有物理內傷，到凡間市場後极易暴斃。線平衡（Line Balance）工時不均，則會引發產能堆積的瓶頸詛咒。",
                question: "工廠回報：在 FATP（組裝測試線）最後一站，某一功能測試站（FCT）的良率突然從 99% 雪崩到 80%。作為守線 TPM，你的第一動是？",
                options: [
                    "命令整條產線立刻停線，直到抓出原因。(❌ 停線一小時損失數百萬魔力，高層震怒)",
                    "檢查該測試站的測試治具（Fixture）探針是否磨損，並比對前站 SMT 的 AOI 數據判斷是否為製程偏移。(⭕ 天條認證！精準的硬體 DFM 診斷！)",
                    "直接把不良品倒進廢料桶，維持良率報表好看。(❌ 觸犯公會刑法，永久封號)"
                ]
            },
            "CH-03": {
                id: "CH-03",
                badge: "Lesson 3 (選修)",
                title: "System TPM 基礎概括 (NPI生命長河)",
                defaultStatus: "locked",
                lesson: "硬體產品的轉化，是一條不可逆的時間長河，稱為 NPI（新產品導入）流程生命週期。\n\n1. Proto (原型階段)：神界初次具現化，主要驗證硬體架構可行性。\n2. EVT (工程驗證階段)：核心模組功能與電性對接，排除重大設計干涉。\n3. DVT (設計驗證階段)：外觀 CMF 與結構融合、防水氣密、影像光學與全面信賴性極限拷問。\n4. PVT (生產驗證階段)：工廠流水線製程能力（Cpk）測試、治具模具大規模複製產速（UPH）校正。\n5. MP (大量生產)：全產線全速運作，神器降臨凡間。",
                question: "在專案處於 EVT（工程驗證）Exit 審查關卡時，結構工程師回報某處公差疊加有干涉危險，此時身為 TPM 應做何決策？",
                options: [
                    "直接進入 DVT 開模，到時候量產裝不進去再用手工修銼刀磨。(❌ 撞上物理結界，損失百萬模具費)",
                    "在此階段強行拦截，要求 ME 完成公差分析（Tolerance Stack-up），在虛擬神界修正圖紙後再行放行。(⭕ 完美的階段邊界閘門控管！)"
                ]
            }
        };

        let currentActiveId = "CH-01";

        function initCodex() {
            renderMenu();
            loadChapter(currentActiveId);
        }

        function renderMenu() {
            const menu = document.getElementById('chapter-menu');
            menu.innerHTML = '';
            
            Object.keys(codexDatabase).forEach(key => {
                const item = codexDatabase[key];
                // 從快取讀取過關狀態
                const isCleared = localStorage.getItem(`codex-${item.id}-clear`) === 'true';
                let statusClass = item.defaultStatus;
                
                if (isCleared) {
                    statusClass = "completed";
                } else if (item.id === "CH-01" || localStorage.getItem(`codex-CH-01-clear`) === 'true') {
                    // 若前置通過，解鎖後續
                    if (item.id === "CH-02") statusClass = "available";
                    if (item.id === "CH-03" && localStorage.getItem(`codex-CH-02-clear`) === 'true') statusClass = "available";
                }

                const activeClass = item.id === currentActiveId ? "active" : "";

                menu.innerHTML += `
                    <li class="chapter-item ${statusClass} ${activeClass}" onclick="switchChapter('${item.id}', '${statusClass}')">
                        <div class="chapter-badge">${item.badge}</div>
                        <div class="chapter-title">${item.title}</div>
                    </li>
                `;
            });
        }

        function loadChapter(id) {
            currentActiveId = id;
            const data = codexDatabase[id];
            
            document.getElementById('current-chapter-id').innerText = data.id;
            document.getElementById('current-chapter-name').innerText = data.title;
            document.getElementById('lesson-content').innerText = data.lesson;
            document.getElementById('trial-question').innerText = `⚠️ 實戰情境：${data.question}`;

            // 印章控制
            const stamp = document.getElementById('quest-clear-stamp');
            if (localStorage.getItem(`codex-${id}-clear`) === 'true') {
                stamp.style.display = 'block';
                document.getElementById('boss-battleground').style.display = 'none';
            } else {
                stamp.style.display = 'none';
                document.getElementById('boss-battleground').style.display = 'block';
            }

            const optionsBox = document.getElementById('trial-options-box');
            optionsBox.innerHTML = '';
            data.options.forEach(opt => {
                optionsBox.innerHTML += `
                    <div class="option-card" onclick="checkChoice(this, '${opt.includes('⭕')}', '${id}')">${opt}</div>
                `;
            });
        }

        function switchChapter(id, status) {
            if (status === 'locked') {
                alert("【公會封印】請先通關前置聖遺物章節，此寶典文獻方能解鎖！");
                return;
            }
            currentActiveId = id;
            renderMenu();
            loadChapter(id);
        }

        function checkChoice(element, isCorrect, id) {
            if (isCorrect === "true") {
                element.style.background = "#D1FAE5";
                element.style.borderColor = "#10B981";
                document.getElementById('quest-clear-stamp').style.display = 'block';
                
                setTimeout(() => {
                    alert("🏆 QUEST CLEAR！通關印記已安全銲接至序列位階後台。");
                    localStorage.setItem(`codex-${id}-clear`, 'true');
                    
                    // 自動開通後續章節
                    if (id === "CH-01") codexDatabase["CH-02"].defaultStatus = "available";
                    if (id === "CH-02") codexDatabase["CH-03"].defaultStatus = "available";
                    
                    initCodex();
                }, 300);
            } else {
                element.style.background = "#FEE2E2";
                element.style.borderColor = "#EF4444";
                alert("💥 決策原罪！觸發深淵線路短路，請重讀卷軸文獻！");
            }
        }

        // Google 帳號一鍵認證 SSO 回傳處理
        function onGoogleAuthIn(response) {
            const payload = parseToken(response.credential);
            localStorage.setItem('tpm-user-email', payload.email);
            localStorage.setItem('tpm-user-name', payload.name);
            showUserBadge(payload.name, payload.email);
        }

        function parseToken(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join('')));
        }

        function showUserBadge(name, email) {
            document.getElementById('user-identity-box').innerHTML = `
                <span style="color:#1D4ED8; font-weight:900; font-size:0.8rem;">👤 ${name} (${email})</span>
            `;
        }

        window.onload = () => {
            const cEmail = localStorage.getItem('tpm-user-email');
            const cName = localStorage.getItem('tpm-user-name');
            if (cEmail && cName) showUserBadge(cName, cEmail);
            initCodex();
        };
    </script>
</body>
</html>
