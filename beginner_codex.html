<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初心者寶典大廳 | System TPM Tactical Hub</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
            --color-locked-gray: #E2E8F0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.1s;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .sync-cloud-btn {
            background: #22C55E;
            color: #FFFFFF;
            border: 3px solid var(--border-heavy);
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            font-size: 0.85rem;
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sync-cloud-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        .sidebar-panel {
            display: flex;
            width: 350px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 4px;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leaf-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.82rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            line-height: 1.4;
        }

        .leaf-btn:hover {
            transform: translate(2px, -2px);
            box-shadow: 2px 4px 0px var(--border-heavy);
        }

        .leaf-btn.active {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dashboard-view-hall,
        .document-canvas,
        .exam-session-box,
        .sub-pagination-dots-zone {
            display: none;
            width: 100%;
        }

        .dashboard-view-hall {
            height: 100%;
            overflow-y: auto;
            padding: 5px 5px 30px 5px; 
        }

        .level-cards-parallel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
            padding: 5px 2px;
        }

        .progress-card-master {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            border-radius: 10px;
            padding: 12px 16px;
            box-shadow: var(--shadow-tactical);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .progress-card-master:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--border-heavy);
        }

        .progress-card-master.active-level {
            background: linear-gradient(135deg, #FFFDF4 0%, #FAFAFA 100%) !important;
            border-width: 3px !important;
            box-shadow: 5px 5px 0px var(--border-heavy) !important;
        }

        .progress-label {
            font-family: monospace;
            font-weight: 900;
            font-size: 0.72rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .progress-percentage {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 2px 0;
            color: var(--text-main);
            line-height: 1;
        }

        .progress-stats {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #E2E8F0;
            border: 2px solid var(--border-heavy);
            border-radius: 5px;
            margin-top: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--color-completed);
            width: 0%;
            transition: width 0.4s ease-out;
        }

        .cdx-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            padding: 5px 2px;
        }

        .cdx-dashboard-card {
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            transition: all 0.15s;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            min-height: 52px;
        }

        .cdx-dashboard-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--text-main);
        }

        .document-canvas {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .textbook-scroll-box {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            width: 100%;
            font-size: 0.85rem;
        }

        .textbook-section-block {
            margin-bottom: 10px;
            padding-bottom: 5px;
            width: 100%;
            animation: fadeInBox 0.12s ease-out;
        }

        .dynamic-flow-canvas {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            background: #FEF9E7;
            border: 2px solid var(--border-heavy);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            margin: 0 0 20px 0;
            overflow-x: auto;
            flex-shrink: 0;
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .flow-node-block {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.88rem;
            box-shadow: 2px 2px 0px var(--border-heavy);
            white-space: nowrap;
            text-align: center;
            transition: all 0.1s;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .flow-node-block.active-node {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .flow-arrow-split {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--border-heavy);
            user-select: none;
        }

        .exam-session-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .exam-progress-bar {
            width: 100%;
            background: #E2E8F0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 2px solid #1A1A1A;
        }

        .exam-progress-fill {
            height: 100%;
            background: var(--text-main);
            width: 0%;
            transition: width 0.2s;
        }

        .option-card {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 18px;
            border-radius: var(--radius-sm);
            margin-top: 14px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 3px 3px 0px #1A1A1A;
            transition: all 0.1s;
        }

        .option-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #1A1A1A;
            background: var(--sidebar-cream);
        }

        .sub-pagination-dots-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 15px 0;
            border-top: 2px dashed #E2E8F0;
            margin-top: auto;
            flex-shrink: 0;
        }

        .slider-dot {
            width: 14px;
            height: 14px;
            border: 3px solid var(--border-heavy);
            border-radius: 50%;
            background: #FFF;
            cursor: pointer;
            transition: all 0.1s;
        }

        .slider-dot.active {
            background: var(--text-main);
            transform: scale(1.2);
        }

        .slider-dot.exam-dot {
            border-color: var(--color-fail);
            background: #FEF2F2;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #B91C1C;
        }

        .slider-dot.exam-dot.active {
            background: var(--color-fail);
            color: #FFF;
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">初心者寶典大廳</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：Daniel Shih</div>
            <button class="sync-cloud-btn" id="tpm-query-btn" onclick="triggerCloudPullSync()">📊 查詢與同步成績</button>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active" onclick="executeLangSwitch('tw')">TW</button>
                <button class="lang-btn-core" onclick="executeLangSwitch('en')">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回首頁</a>
        </div>
    </div>

    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboardMenu()">↩ 返回戰術大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">DASHBOARD</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">公會戰術天賦大廳</h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div class="level-cards-parallel-grid" id="global-level-flex-deck"></div>
                <div style="border-bottom: 3px dashed var(--border-heavy); width: 100%; margin: 5px 0 25px 0;"></div>
                <div style="font-weight: 900; font-size: 1rem; margin-bottom: 15px; color: var(--text-main);">子單元列表：</div>
                <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
            </div>

            <div class="document-canvas" id="textbook-viewport">
                <div class="dynamic-flow-canvas" id="dynamic-flow-renderer-box"></div>
                <div class="textbook-scroll-box">
                    <div id="lesson-content"></div>
                </div>
            </div>

            <div class="exam-session-box" id="exam-viewport">
                <div style="display:flex; justify-content:space-between; font-weight:900; margin-bottom:10px;">
                    <span style="color:var(--color-fail);" id="exam-title-text">🔥 隨機能力考核大考</span>
                    <span id="exam-counter">1 / 3</span>
                </div>
                <div class="exam-progress-bar"><div class="exam-progress-fill" id="exam-progress"></div></div>
                <h3 id="exam-question-text" style="font-size:1.2rem; line-height:1.5; margin-bottom:25px; font-weight: 800;">載入中...</h3>
                <div id="exam-options-container"></div>
            </div>

            <div class="sub-pagination-dots-zone" id="universal-dots-bar"></div>
        </main>
    </div>

    <script>
        // 👑 剛性焊接：您的 GAS 網網頁應用程式部署 URL 👑
        const GLOBAL_GAS_URL = "https://script.google.com/a/macros/fih-foxconn.com/s/AKfycbydOQ2Iyk8wVABxUDWJchx1eiCN4Hc_Fg226uJAkLS0wIpsWty-ewDwxQPG3dGSDv3pFQ/exec";

        const globalSubUnitRegistry = [
            { type: 'codex', levelNum: 1, subUnitId: '1-1', title: '1-1: 基本世界觀與三方賽局', file: 'course_data_1-1.js' },
            { type: 'codex', levelNum: 1, subUnitId: '1-2', title: '1-2: 硬體生命週期與 NPI 交付', file: 'course_data_1-2.js' },
            { type: 'codex', levelNum: 1, subUnitId: '1-3', title: '1-3: 工廠地理與 4M1E 線體通識', file: 'course_data_1-3.js' }
        ];

        const globalLevelMetadata = [
            { num: 1, name: 'LEVEL 1', label: '基礎通識' },
            { num: 2, name: 'LEVEL 2', label: '進階跨功能' },
            { num: 3, name: 'LEVEL 3', label: '高階 TPM' },
            { num: 4, name: 'LEVEL 4', label: '日常速通' },
            { num: 5, name: 'LEVEL 5', label: '供應鏈擴展' },
            { num: 6, name: 'LEVEL 6', label: '未知領域' },
            { num: 7, name: 'LEVEL 7', label: '終局修煉' }
        ];

        let selectedActiveLevelNum = 1; 
        let activeCourseIdx = 0, activePageIdx = 0, activeFlowNodeIdx = 0;
        let examActive = false, examCurrentQ = 0, examScoreCount = 0;

        window.onload = () => {
            // 👑 戰術通訊監聽器：精確接引來自高級卡片 UI 視窗的 postMessage 訊號，解除按鈕死鎖狀態機 👑
            window.addEventListener('message', function(event) {
                // 訊號 A：反向拉回成績完畢
                if (event.data && event.data.type === 'TPM_PULL_SYNC') {
                    const lessons = event.data.lessons.split(",");
                    lessons.forEach(function(code) {
                        const cleanCode = code.trim();
                        if (cleanCode !== "") {
                            localStorage.setItem("codex-L1-A" + cleanCode.split('-')[1] + "-clear", "true");
                            localStorage.setItem("talent-L1-A" + cleanCode.split('-')[1] + "-grade", "通過");
                        }
                    });
                    alert("📊 雲端成績同步成功！已成功點亮歷史天賦燈號。");
                    resetQueryButtonState();
                }
                
                // 訊號 B：正向考核改寫完畢
                if (event.data && event.data.type === 'TPM_PUSH_DONE') {
                    console.log("正向考核數據矩陣原位改寫成功。");
                    resetQueryButtonState();
                }
            });

            renderGlobalTreeStructure();
            routeController();
        };

        function resetQueryButtonState() {
            const btn = document.getElementById('tpm-query-btn');
            if (btn) {
                btn.innerHTML = "📊 查詢與同步成績";
                btn.style.background = "#22C55E";
                btn.disabled = false;
            }
            renderMultiLevelHubDashboard();
        }

        function renderGlobalTreeStructure() {
            const root = document.getElementById('global-tree-root'); 
            root.innerHTML = '';
            const presentLevels = [...new Set(globalSubUnitRegistry.map(u => u.levelNum))].sort();
            
            presentLevels.forEach(lvlNum => {
                const subset = globalSubUnitRegistry.filter(u => u.levelNum === lvlNum);
                const block = document.createElement('div'); 
                block.className = 'menu-category-block';
                block.innerHTML = `
                    <button class="tree-main-toggle" onclick="toggleMenuSection('lvl-accordion-${lvlNum}')">🗺️ Level ${lvlNum} 展開</button>
                    <div id="lvl-accordion-${lvlNum}" class="tree-sub-group" style="display: flex; flex-direction: column;">
                        ${subset.map(u => `<button class="leaf-btn" id="lf-codex-${u.subUnitId}" onclick="switchUnit('${u.type}','${u.subUnitId}', ${u.levelNum})">${u.title}</button>`).join('')}
                    </div>`;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) { 
            const el = document.getElementById(id); 
            if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none'; 
        }

        function routeController(directType, directC) {
            document.getElementById('global-user-profile-card').innerHTML = `👤 冒險者：Daniel Shih`;

            const urlParams = new URLSearchParams(window.location.search);
            const paramC = directC || urlParams.get('c');
            const paramType = directType || urlParams.get('type') || 'codex';

            if (!paramC) {
                document.getElementById('cdx-page-header-zone').style.display = 'block'; 
                document.getElementById('current-chapter-id').innerText = "DASHBOARD"; 
                document.getElementById('current-chapter-name').innerText = "公會戰術天賦大廳";
                document.getElementById('dashboard-menu-hall').style.display = 'block'; 
                document.getElementById('textbook-viewport').style.display = 'none'; 
                document.getElementById('exam-viewport').style.display = 'none'; 
                document.getElementById('universal-dots-bar').style.display = 'none';
                renderMultiLevelHubDashboard();
            } else {
                document.getElementById('dashboard-menu-hall').style.display = 'none'; 
                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active')); 
                const leaf = document.getElementById(`lf-${paramType}-${paramC}`); 
                if (leaf) leaf.classList.add('active'); 
                injectContentPackScript(paramType, paramC);
            }
        }

        function renderMultiLevelHubDashboard() {
            const deckRow = document.getElementById('global-level-flex-deck');
            const grid = document.getElementById('l1-cards-grid'); 
            if (!deckRow || !grid) return;
            
            deckRow.innerHTML = ''; 
            grid.innerHTML = '';
            
            globalLevelMetadata.forEach(lvl => {
                const subUnitsInLvl = globalSubUnitRegistry.filter(u => u.levelNum === lvl.num); 
                let total = subUnitsInLvl.length, done = 0;
                subUnitsInLvl.forEach(u => { 
                    if (localStorage.getItem(`codex-L1-A${u.subUnitId.split('-')[1]}-clear`) === 'true') done++; 
                });
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                deckRow.innerHTML += `
                    <div class="progress-card-master ${lvl.num===selectedActiveLevelNum?'active-level':''}" onclick="selectedActiveLevelNum=${lvl.num};renderMultiLevelHubDashboard();">
                        <div class="progress-label">${lvl.name} : ${lvl.label}</div>
                        <div class="progress-percentage">${pct}%</div>
                        <div class="progress-stats">完成指標: ${done} / ${total}</div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%;"></div></div>
                    </div>`;
            });

            const filteredUnits = globalSubUnitRegistry.filter(u => u.levelNum === selectedActiveLevelNum);
            filteredUnits.forEach(unit => {
                const storageKey = `L1-A${unit.subUnitId.split('-')[1]}`;
                const isClear = localStorage.getItem(`codex-${storageKey}-clear`) === 'true';
                grid.innerHTML += `
                    <div class="cdx-dashboard-card" style="background-color: ${isClear?'#DCFCE7':'#FEF08A'};" onclick="switchUnit('${unit.type}', '${unit.subUnitId}', ${unit.levelNum})">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-family:monospace; font-weight:900; background:rgba(0,0,0,0.06); padding:2px 4px; border-radius:4px; font-size:0.75rem;">${unit.subUnitId}</span>
                            <h3 style="margin:0; font-size:0.82rem; font-weight:900; color:var(--text-main);">${unit.title.split(': ')[1] || unit.title}</h3>
                        </div>
                        <div style="font-size:0.75rem; font-weight:900; color:var(--text-main); white-space:nowrap; padding-left:6px;">${isClear ? `✅ [通過]` : '⏳ 待考核'}</div>
                    </div>`;
            });
        }

        function switchUnit(type, subUnitId, lvlNum) { 
            examActive = false; 
            selectedActiveLevelNum = lvlNum; 
            activeCourseIdx = 0; 
            activePageIdx = 0; 
            activeFlowNodeIdx = 0; 
            window.history.pushState(null, '', `${window.location.pathname}?type=${type}&c=${subUnitId}`); 
            routeController(type, subUnitId); 
        }

        function exitToDashboardMenu() { 
            examActive = false; 
            window.history.pushState(null, '', window.location.pathname); 
            routeController(null, null); 
        }

        function injectContentPackScript(type, packId) {
            window.codexCourseEngineData = []; 
            const old = document.getElementById('dynamic-course-pack'); 
            if (old) old.remove();
            
            const script = document.createElement('script'); 
            script.id = 'dynamic-course-pack'; 
            script.src = `${globalSubUnitRegistry.find(u=>u.subUnitId===packId).file}?v=${Date.now()}`;
            script.onload = () => { initEngine(); }; 
            document.head.appendChild(script);
        }

        function initEngine() {
            if (!window.codexCourseEngineData || window.codexCourseEngineData.length === 0) { 
                document.getElementById('current-chapter-name').innerText = "數據解讀失敗"; 
                return; 
            }
            loadCourseState(activeCourseIdx, activePageIdx);
        }

        function exitExamToPage(pIdx) { 
            examActive = false; 
            examCurrentQ = 0; 
            examScoreCount = 0; 
            activeFlowNodeIdx = 0; 
            loadCourseState(activeCourseIdx, pIdx); 
        }

        function loadCourseState(cIdx, pIdx) {
            activeCourseIdx = cIdx; 
            const course = window.codexCourseEngineData[cIdx]; 
            const dotsBar = document.getElementById('universal-dots-bar'); 
            dotsBar.innerHTML = '';
            
            if (examActive) {
                document.getElementById('textbook-viewport').style.display = 'none'; 
                document.getElementById('exam-viewport').style.display = 'block'; 
                document.getElementById('universal-dots-bar').style.display = 'flex';
                course.subPages.forEach((_, sIdx) => { 
                    dotsBar.innerHTML += `<div class="slider-dot" onclick="exitExamToPage(${sIdx})"></div>`; 
                }); 
                dotsBar.innerHTML += `<div class="slider-dot exam-dot active">⚔️</div>`; 
                runExamEngine();
            } else {
                document.getElementById('textbook-viewport').style.display = 'flex'; 
                document.getElementById('exam-viewport').style.display = 'none'; 
                document.getElementById('universal-dots-bar').style.display = 'flex';
                
                activePageIdx = pIdx; 
                const page = course.subPages[pIdx]; 
                document.getElementById('current-chapter-id').innerText = `PAGE ${pIdx + 1} / ${course.subPages.length}`; 
                document.getElementById('current-chapter-name').innerText = page.title;
                
                let targetedText = page.text;
                let targetedFlow = page.diagramFlowArray;
                
                const flowRenderer = document.getElementById('dynamic-flow-renderer-box');
                if (flowRenderer && targetedFlow && targetedFlow.length > 0) {
                    flowRenderer.style.display = 'flex'; 
                    flowRenderer.innerHTML = '';
                    targetedFlow.forEach((node, nIdx) => {
                        flowRenderer.innerHTML += `<div class="flow-node-block ${nIdx===activeFlowNodeIdx?'active-node':''}" onclick="activeFlowNodeIdx=${nIdx};loadCourseState(${cIdx},${pIdx})">${node.name}</div>`;
                        if (nIdx < targetedFlow.length - 1) flowRenderer.innerHTML += `<div class="flow-arrow-split">➔</div>`;
                    });
                } else if (flowRenderer) { 
                    flowRenderer.style.display = 'none'; 
                }

                let compiledHtml = "";
                if (targetedFlow && targetedFlow.length > 0) {
                    if (targetedFlow[activeFlowNodeIdx]) {
                        compiledHtml = `
                            <div class="textbook-section-block">
                                <div style="line-height:1.6;">${targetedFlow[activeFlowNodeIdx].text}</div>
                            </div>`;
                    }
                } else {
                    compiledHtml = `<div style="line-height: 1.6; font-size: 0.88rem;">${targetedText || ""}</div>`;
                }
                document.getElementById('lesson-content').innerHTML = compiledHtml;

                course.subPages.forEach((_, sIdx) => { 
                    dotsBar.innerHTML += `<div class="slider-dot ${sIdx===pIdx?'active':''}" onclick="exitExamToPage(${sIdx})"></div>`; 
                }); 
                dotsBar.innerHTML += `<div class="slider-dot exam-dot" onclick="enterExamMode()">⚔️</div>`;
            }
        }

        function enterExamMode() { 
            examActive = true; 
            examCurrentQ = 0; 
            examScoreCount = 0; 
            loadCourseState(activeCourseIdx, 0); 
        }

        function runExamEngine() {
            const course = window.codexCourseEngineData[activeCourseIdx]; 
            if (examCurrentQ >= 3) { 
                settleExamPayload(); 
                return; 
            }
            const qData = course.examVault[examCurrentQ]; 
            document.getElementById('current-chapter-id').innerText = "EXAM MODE"; 
            document.getElementById('current-chapter-name').innerText = "隨機能力考核大考"; 
            document.getElementById('exam-counter').innerText = `${examCurrentQ + 1} / 3`; 
            document.getElementById('exam-progress').style.width = `${(examCurrentQ / 3) * 100}%`; 
            document.getElementById('exam-question-text').innerText = `${examCurrentQ + 1}. ${qData.q}`;
            
            const container = document.getElementById('exam-options-container'); 
            container.innerHTML = qData.o.map((opt, idx) => `<div class="option-card" onclick="submitAnswer(${idx})">${opt}</div>`).join('');
        }

        function submitAnswer(idx) { 
            const course = window.codexCourseEngineData[activeCourseIdx]; 
            if (idx === course.examVault[examCurrentQ].a) { examScoreCount++; } 
            examCurrentQ++; 
            runExamEngine(); 
        }
        
        function settleExamPayload() {
            examActive = false; 
            const course = window.codexCourseEngineData[activeCourseIdx];
            const storageKey = "L1-A" + course.courseId.split('-')[1];
            
            let finalStatus = "";
            if (examScoreCount < 2) {
                alert("💥 失敗重考");
                finalStatus = "失敗重考";
                localStorage.setItem(`codex-${storageKey}-clear`, 'false');
                localStorage.setItem(`talent-${storageKey}-grade`, '失敗重考');
            } else {
                alert("🏆 通過");
                finalStatus = "通過";
                localStorage.setItem(`codex-${storageKey}-clear`, 'true');
                localStorage.setItem(`talent-${storageKey}-grade`, '通過');
            }

            const cleanId = course.courseId.replace("L", "").trim();
            const currentRegistry = globalSubUnitRegistry.find(function(u) { return u.subUnitId === cleanId; });
            
            let resolvedType = "Beginner Codex";
            if (currentRegistry && currentRegistry.type === 'handbook') { resolvedType = "Handbook Course"; }

            try {
                // 🔥 大考按鈕也一併進入冷卻保護狀態
                const btn = document.getElementById('tpm-query-btn');
                if (btn) {
                    btn.innerHTML = "⏳ 正在上傳成績...";
                    btn.disabled = true;
                }

                const finalPushUrl = GLOBAL_GAS_URL + 
                    "?action=push" +
                    "&courseId=" + encodeURIComponent(course.courseId) + 
                    "&status=" + encodeURIComponent(finalStatus);
                
                window.open(finalPushUrl, '_blank', 'width=500,height=400,scrollbars=no,resizable=no');
            } catch(e) {
                console.log("獨立航線擊發攔截:", e);
            }

            exitToDashboardMenu();
        }

        function triggerCloudPullSync() {
            const btn = document.getElementById('tpm-query-btn');
            btn.innerHTML = "⏳ 正在查詢成績...";
            btn.style.background = "#94A3B8";
            btn.disabled = true;

            try {
                const finalPullUrl = GLOBAL_GAS_URL + "?action=pull";
                window.open(finalPullUrl, '_blank', 'width=500,height=400,scrollbars=no,resizable=no');
            } catch(e) {
                console.log("發動雲端回拉異常:", e);
                resetQueryButtonState();
            }
        }
    </script>
</body>
</html>
