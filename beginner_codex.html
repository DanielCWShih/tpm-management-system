<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初心者寶典大廳 | Beginner's Codex Hall</title>
    
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-locked: #94A3B8;
            --color-completed: #F59E0B;
            --color-fail: #DC2626;
            --color-active-gold: #FDE047;
        }

        html, 
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* 剛性頂部控制列 */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        /* 雙區塊工作主框架 */
        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        /* 側邊欄常駐導航面板 */
        .sidebar-panel {
            display: flex;
            width: 350px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
            background-color: #FAF9F5;
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 4px;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tree-main-toggle::after {
            content: '▼';
            font-size: 0.7rem;
            transition: transform 0.15s;
        }

        .tree-main-toggle.collapsed::after {
            transform: rotate(-90deg);
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tree-level-label {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tree-level-label::after {
            content: '▼';
            font-size: 0.6rem;
            transition: transform 0.15s;
        }

        .tree-level-label.collapsed::after {
            transform: rotate(-90deg);
        }

        .tree-leaf-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 6px;
        }

        .leaf-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.82rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            line-height: 1.4;
        }

        .leaf-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .leaf-btn.active {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        /* 右側主內容面板 */
        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            overflow: hidden;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
        }

        /* 剛性防禦：所有檢視容器預設底層通通鎖死隱藏 */
        .dashboard-view-hall,
        .document-canvas,
        .exam-session-box,
        .sub-pagination-dots-zone {
            display: none;
            width: 100%;
        }

        .dashboard-view-hall {
            height: 100%;
            overflow-y: auto;
        }

        .cdx-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            padding-top: 10px;
        }

        .cdx-dashboard-card {
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 25px 22px;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
        }

        .cdx-dashboard-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0px var(--text-main);
        }

        .document-canvas {
            flex: 1;
            overflow: hidden;
        }

        /* 二級分支導航頁籤列 */
        .cdx-sub-nav-bar {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 12px;
            flex-shrink: 0;
        }

        .sub-nav-btn {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            color: var(--text-main);
        }

        .sub-nav-btn.active {
            background: var(--text-main);
            color: white;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy);
        }

        .textbook-scroll-box {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            width: 100%;
        }

        /* 互動型卡牌結構組件 */
        .edu-overview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .edu-overview-card {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 16px;
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .edu-card-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-heavy);
            padding-bottom: 4px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .edu-card-body-text {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text-main);
        }

        .dict-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .dict-trigger-btn {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .dict-trigger-btn:hover {
            background: #FAF9F5;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .dict-display-box {
            background: #FFFDF2;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 18px;
            margin-bottom: 25px;
            box-shadow: 3px 3px 0px var(--border-heavy);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.6;
            display: none;
            animation: fadeInBox 0.15s ease-out;
        }

        .sandbox-panel-card {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: 4px 4px 0px var(--border-heavy);
            margin-bottom: 25px;
        }

        .sandbox-choice-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .sandbox-choice-btn {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            color: var(--text-main);
            transition: all 0.1s;
        }

        .sandbox-choice-btn:hover {
            background: #FAF5FF;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .sandbox-fallout-box {
            margin-top: 15px;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border-heavy);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.6;
            display: none;
        }

        .sandbox-fallout-box.success {
            background: #F0FDF4;
            border-color: #16A34A;
            color: #14532D;
            box-shadow: 3px 3px 0px #16A34A;
        }

        .sandbox-fallout-box.fail {
            background: #FEF2F2;
            border-color: #DC2626;
            color: #7F1D1D;
            box-shadow: 3px 3px 0px #DC2626;
        }

        /* 流程圖大畫布 */
        .dynamic-flow-canvas {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            background: #F8FAFC;
            border: 2px dashed var(--border-heavy);
            padding: 20px;
            border-radius: var(--radius-sm);
            margin: 15px 0;
            width: 100%;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .flow-node-block {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0px var(--border-heavy);
            white-space: nowrap;
            text-align: center;
            transition: all 0.1s;
            color: var(--text-main);
        }

        .flow-node-block.highlight {
            background: #EFF6FF;
            border-color: var(--border-heavy);
            box-shadow: 2px 2px 0px var(--border-heavy);
            color: var(--text-main);
        }

        .flow-node-block.active-node {
            background: #1A1A1A !important;
            color: #FFFFFF !important;
            border-color: #1A1A1A !important;
            box-shadow: 3px 3px 0px var(--color-completed) !important;
        }

        .flow-arrow-split {
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-main);
            user-select: none;
        }

        .exam-progress-bar {
            width: 100%;
            background: #E2E8F0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1.5px solid #000;
        }

        .exam-progress-fill {
            height: 100%;
            background: var(--text-main);
            width: 0%;
            transition: width 0.2s;
        }

        .option-card {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 18px;
            border-radius: var(--radius-sm);
            margin-top: 14px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        .option-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
            background: var(--sidebar-cream);
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <span style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.8rem;" id="global-inject-tag">SYS.BEGINNER_CODEX V5.17</span>
            <h1 style="margin: 3px 0 0 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">初心者寶典大廳</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">🔒 未讀取公會憑證</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active" id="global-btn-tw" onclick="executeLangSwitch('tw')">TW</button>
                <button class="lang-btn-core" id="global-btn-en" onclick="executeLangSwitch('en')">EN</button>
            </div>
            <a href="index.html" class="back-btn" id="global-nav-home-btn">返回首頁</a>
        </div>
    </div>

    <div class="workspace-container">
        
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboardMenu()">↩ 返回戰術大廳</button>
            <div id="global-tree-root" style="width: 100%; display: flex; flex-direction: column; gap: 12px;"></div>
        </aside>

        <main class="content-panel">
            
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">DASHBOARD</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">公會戰術天賦大廳</h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
            </div>

            <div class="document-canvas" id="textbook-viewport">
                <div class="cdx-sub-nav-bar" id="cdx-sub-nav-wrapper" style="display:none;"></div>
                <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.15rem; margin: 0 0 15px 0;">⚡ 實戰知識核心 (Core Knowledge Base)</h3>
                <div class="dynamic-flow-canvas" id="dynamic-flow-renderer-box"></div>
                <div class="textbook-scroll-box">
                    <div id="lesson-content" class="scroll-text"></div>
                </div>
            </div>

            <div class="exam-session-box" id="exam-viewport">
                <div style="display:flex; justify-content:space-between; font-weight:900; margin-bottom:10px;">
                    <span style="color:#B91C1C;">🔥 終極大會考進行中 (Exam Mode)</span>
                    <span id="exam-counter" style="color:var(--text-secondary);">第 1 / 20 題</span>
                </div>
                <div class="exam-progress-bar">
                    <div class="exam-progress-fill" id="exam-progress"></div>
                </div>
                <h3 id="exam-question-text" style="font-size:1.2rem; line-height:1.5; margin-bottom:25px;">載入中...</h3>
                <div id="exam-options-container"></div>
            </div>

            <div class="sub-pagination-dots-zone" id="universal-dots-bar"></div>
            
        </main>
    </div>

    <script>
        // 去中心化配置註冊表
        const globalSubUnitRegistry = [
            { 
                type: 'codex', 
                level: 'l1', 
                levelTitle: '🌿 Level 1：基礎通識研修領域',
                mainToggleId: 'tg-main-codex',
                mainToggleName: '🗺️ 初心者寶典',
                lvlGroupId: 'group-codex-l1',
                leafContainerId: 'leaf-codex-l1',
                subUnitId: '1-1', 
                title: '單元 1-1: 基礎通識世界觀模型', 
                file: 'course_data_1-1.js' 
            },
            { 
                type: 'codex', 
                level: 'l1', 
                levelTitle: '🌿 Level 1：基礎通識研修領域',
                mainToggleId: 'tg-main-codex',
                mainToggleName: '🗺️ 初心者寶典',
                lvlGroupId: 'group-codex-l1',
                leafContainerId: 'leaf-codex-l1',
                subUnitId: '1-2', 
                title: '單元 1-2: 工廠基礎與良率鐵律', 
                file: 'course_data_1-2.js' 
            },
            { 
                type: 'handbook', 
                level: 'l2', 
                levelTitle: '🌊 Level 2：進階跨功能技術支線',
                mainToggleId: 'tg-main-handbook',
                mainToggleName: '📜 冒險者手冊',
                lvlGroupId: 'group-handbook-l2',
                leafContainerId: 'leaf-handbook-l2',
                subUnitId: '1-1', 
                title: '單元 1-1: 防水設計與環境防護結界', 
                file: 'course_data_2-1.js' 
            }
        ];

        let activeCourseIdx = 0;
        let activePageIdx = 0;
        let activeSubMatrixIdx = 0;
        let activeFlowNodeIdx = 0;
        let examActive = false;
        let examCurrentQ = 0;
        let examScoreCount = 0;

        window.showTacticalDict = function(textPayload) {
            const box = document.getElementById('runtime-dict-box');
            if (box) { box.style.display = 'block'; box.innerHTML = `💡 <strong>公會特工字典反饋：</strong><br>${textPayload}`; }
        };

        window.triggerSimDecision = function(isSuccess, feedbackText) {
            const box = document.getElementById('runtime-sandbox-fallout');
            if (box) { box.style.display = 'block'; box.className = isSuccess ? 'sandbox-fallout-box success' : 'sandbox-fallout-box fail'; box.innerHTML = feedbackText; }
        };

        window.onload = () => {
            window.codexCourseEngineData = []; // 👑 封裝防線：初始化焊接全域 window 大腦 👑
            renderGlobalTreeStructure();
            routeController();
        };

        function renderGlobalTreeStructure() {
            const root = document.getElementById('global-tree-root');
            root.innerHTML = '';
            const categories = ['codex', 'handbook'];
            categories.forEach(catText => {
                const subset = globalSubUnitRegistry.filter(item => item.type === catText);
                if (subset.length === 0) return;
                const first = subset[0];
                const catBlock = document.createElement('div');
                catBlock.className = 'menu-category-block';
                catBlock.innerHTML = `
                    <button class="tree-main-toggle" id="${first.mainToggleId}" onclick="toggleMenuSection('${first.lvlGroupId}', '${first.mainToggleId}')">${first.mainToggleName}</button>
                    <div id="${first.lvlGroupId}" class="tree-sub-group" style="display: flex;">
                        <div style="width: 100%; flex-direction: column; display: flex; gap: 8px;">
                            <div class="tree-level-label" id="lbl-${first.lvlGroupId}" onclick="toggleMenuSection('${first.leafContainerId}', 'lbl-${first.lvlGroupId}')">${first.levelTitle}</div>
                            <div id="${first.leafContainerId}" class="tree-leaf-container" style="display: flex;"></div>
                        </div>
                    </div>
                `;
                root.appendChild(catBlock);
                const leafContainer = catBlock.querySelector(`#${first.leafContainerId}`);
                subset.forEach(unit => {
                    const btnKey = `${unit.type}-${unit.subUnitId}`;
                    leafContainer.innerHTML += `
                        <button class="leaf-btn" id="lf-node-${btnKey}" onclick="switchActiveSubUnit('${unit.type}', '${unit.subUnitId}')">
                            ${unit.title}
                        </button>
                    `;
                });
            });
        }

        function toggleMenuSection(containerId, toggleId) {
            const container = document.getElementById(containerId);
            const toggleBtn = document.getElementById(toggleId);
            if (!container || !toggleBtn) return;
            if (container.style.display === 'none') {
                container.style.display = 'flex';
                toggleBtn.classList.remove('collapsed');
            } else {
                container.style.display = 'none';
                toggleBtn.classList.add('collapsed');
            }
        }

        // 👑 剛性修復2：支援直接參數注入，實時秒殺 window.location.search 不同步延遲黑洞 👑
        function routeController(directType, directC) {
            const currentLang = localStorage.getItem('tpm-lang-pref') || 'tw';
            const urlParams = new URLSearchParams(window.location.search);
            
            // 優先吃點擊注入的實體參數，無參數才降級抓網址
            const paramC = directC || urlParams.get('c');
            const paramType = directType || urlParams.get('type') || 'codex';

            syncNavbarState(currentLang);

            if (!paramC) {
                // 大廳整備狀態點亮
                document.getElementById('cdx-page-header-zone').style.display = 'block';
                document.getElementById('current-chapter-id').innerText = "DASHBOARD";
                document.getElementById('current-chapter-name').innerText = "公會戰術天賦大廳";

                document.getElementById('dashboard-menu-hall').style.display = 'block';
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'none';

                document.querySelectorAll('.leaf-btn').forEach(btn => btn.classList.remove('active'));
                renderMicroDashboard();
            } else {
                // 特定單元狀態點亮
                document.getElementById('dashboard-menu-hall').style.display = 'none';

                const subUnitKey = `${paramType}-${paramC}`;
                document.querySelectorAll('.leaf-btn').forEach(btn => btn.classList.remove('active'));
                const activeLeaf = document.getElementById(`lf-node-${subUnitKey}`);
                if (activeLeaf) activeLeaf.classList.add('active');

                injectContentPackScript(paramType, paramC);
            }
        }

        function renderMicroDashboard() {
            const grid = document.getElementById('l1-cards-grid');
            if (!grid) return;
            grid.innerHTML = '';

            globalSubUnitRegistry.forEach(unit => {
                let storageKey = "";
                let prefixLabel = "";
                if (unit.type === 'codex') {
                    storageKey = "L1-A" + unit.subUnitId.split('-')[1];
                    prefixLabel = "Level 1 通識單元";
                } else {
                    storageKey = "L2-W" + unit.subUnitId.split('-')[1];
                    prefixLabel = "Level 2 專科支線";
                }

                const isClear = localStorage.getItem(`codex-${storageKey}-clear`) === 'true';
                const savedGrade = localStorage.getItem(`talent-${storageKey}-grade`);

                let cardStyle = "background-color: #FEF08A; border: 3px solid var(--border-heavy);"; 
                let statusBadge = "⏳ 尚未通過考核";
                if (isClear && savedGrade && savedGrade !== "Fail") {
                    cardStyle = "background-color: #DCFCE7; border: 3px solid var(--border-heavy);"; 
                    statusBadge = `✅ 考核通過 [ 位階核定: ${savedGrade} ]`;
                }

                grid.innerHTML += `
                    <div class="cdx-dashboard-card" style="${cardStyle}" onclick="switchActiveSubUnit('${unit.type}', '${unit.subUnitId}')">
                        <div>
                            <div style="font-family: monospace; font-size: 0.8rem; font-weight: 900; color: var(--text-secondary);">${prefixLabel}</div>
                            <h3 style="margin: 8px 0 0 0; font-size: 1.15rem; font-weight: 900; color: var(--text-main);">${unit.title}</h3>
                        </div>
                        <div style="font-size: 0.82rem; font-weight: 900; color: var(--text-main); margin-top: 15px;">${statusBadge}</div>
                    </div>
                `;
            });
        }

        function switchActiveSubUnit(type, subUnitId) {
            examActive = false;
            activeCourseIdx = 0;
            activePageIdx = 0;
            activeSubMatrixIdx = 0;
            activeFlowNodeIdx = 0;
            
            const newUrl = `${window.location.pathname}?type=${type}&c=${subUnitId}`;
            window.history.pushState(null, '', newUrl);
            
            // 👑 銲死控制：原地參數直發，不給 pushState 任何卡頓反應時間 👑
            routeController(type, subUnitId);
        }

        function exitToDashboardMenu() {
            examActive = false;
            const newUrl = window.location.pathname;
            window.history.pushState(null, '', newUrl);
            routeController(null, null); // 降級還原微型大廳
        }

        /* 👑 剛性修復3：appendChild 歸位，並加裝舊節點排他自我清空解構器 👑 */
        function injectContentPackScript(type, packId) {
            const found = globalSubUnitRegistry.find(item => item.type === type && item.subUnitId === packId);
            if (!found) return;

            window.codexCourseEngineData = []; // 重置 window Namespace 緩衝區
            
            // 剛性排他：掃除舊有 Script 標籤防止干擾
            const oldScript = document.getElementById('dynamic-course-pack');
            if (oldScript) {
                oldScript.remove();
            }

            const script = document.createElement('script');
            script.id = 'dynamic-course-pack';
            const isLocalFile = window.location.protocol === 'file:';
            script.src = isLocalFile ? found.file : `${found.file}?v=${Date.now()}`;
            
            script.onload = () => { 
                initEngine(); 
            };
            script.onerror = () => { 
                document.getElementById('current-chapter-name').innerText = "數據包載入失敗";
                document.getElementById('lesson-content').innerHTML = `
                    <div style="padding: 30px; border: 2px dashed var(--border-heavy); border-radius: var(--radius-sm); text-align: center; font-weight: 900; color: var(--color-fail);">
                        💥 找不到數據檔案 [ ${found.file} ]。
                    </div>`;
                document.getElementById('dynamic-flow-renderer-box').style.display = 'none';
                document.getElementById('universal-dots-bar').innerHTML = '';
            };
            
            // 👑 鐵血對位：正式將生好的節點推入 head 頂層，發動實體下載！ 👑
            document.head.appendChild(script);
        }

        function initEngine() {
            // 👑 剛性對位：改向 window 頂層直接清查數據包 👑
            if (!window.codexCourseEngineData || window.codexCourseEngineData.length === 0) return;
            loadCourseState(activeCourseIdx, activePageIdx);
        }

        function loadCourseState(cIdx, pIdx) {
            activeCourseIdx = cIdx;
            const course = window.codexCourseEngineData[cIdx];
            const dotsBar = document.getElementById('universal-dots-bar');
            dotsBar.innerHTML = '';

            if (examActive) {
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'block';
                document.getElementById('universal-dots-bar').style.display = 'flex';
                course.subPages.forEach((_, sIdx) => {
                    dotsBar.innerHTML += `<div class="slider-dot" onclick="exitExamToPage(${sIdx})"></div>`;
                });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot active">⚔️</div>`;
                runExamEngine();
            } else {
                document.getElementById('textbook-viewport').style.display = 'flex';
                document.getElementById('exam-viewport').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'flex';
                activePageIdx = pIdx;
                const page = course.subPages[pIdx];

                document.getElementById('current-chapter-id').innerText = `SECTION ${pIdx + 1} / ${course.subPages.length}`;
                document.getElementById('current-chapter-name').innerText = page.title;

                const subNavWrapper = document.getElementById('cdx-sub-nav-wrapper');
                let targetedText = page.text;
                let targetedFlow = page.diagramFlowArray;

                if (page.subMatrixBranches) {
                    if (subNavWrapper) {
                        subNavWrapper.style.display = 'flex';
                        subNavWrapper.innerHTML = '';
                        page.subMatrixBranches.forEach((branch, bIdx) => {
                            const activeBranchClass = bIdx === activeSubMatrixIdx ? 'active' : '';
                            subNavWrapper.innerHTML += `<button class="sub-nav-btn ${activeBranchClass}" onclick="switchSubMatrixBranch(${bIdx})">${branch.branchLabel}</button>`;
                        });
                    }
                    targetedText = page.subMatrixBranches[activeSubMatrixIdx].text;
                    targetedFlow = page.subMatrixBranches[activeSubMatrixIdx].diagramFlowArray;
                } else {
                    if (subNavWrapper) subNavWrapper.style.display = 'none';
                    activeSubMatrixIdx = 0;
                }

                if (targetedFlow && targetedFlow[activeFlowNodeIdx] && targetedFlow[activeFlowNodeIdx].text) {
                    document.getElementById('lesson-content').innerHTML = targetedFlow[activeFlowNodeIdx].text;
                } else {
                    document.getElementById('lesson-content').innerHTML = targetedText;
                }

                const flowRenderer = document.getElementById('dynamic-flow-renderer-box');
                if (flowRenderer && targetedFlow) {
                    flowRenderer.style.display = 'flex';
                    flowRenderer.innerHTML = '';
                    targetedFlow.forEach((node, nIdx) => {
                        const isSelected = nIdx === activeFlowNodeIdx;
                        let nodeClass = 'flow-node-block';
                        if (isSelected) nodeClass += ' active-node';
                        else if (node.highlight) nodeClass += ' highlight';
                        flowRenderer.innerHTML += `<div class="${nodeClass}" style="cursor:pointer;" onclick="switchFlowNode(${nIdx})">${node.name}</div>`;
                        if (nIdx < targetedFlow.length - 1) flowRenderer.innerHTML += `<div class="flow-arrow-split">➔</div>`;
                    });
                } else if (flowRenderer) {
                    flowRenderer.style.display = 'none';
                }

                course.subPages.forEach((_, sIdx) => {
                    const dotActive = sIdx === pIdx ? "active" : "";
                    dotsBar.innerHTML += `<div class="slider-dot ${dotActive}" onclick="triggerMainPageChange(${sIdx})"></div>`;
                });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot" onclick="enterExamMode()">⚔️</div>`;
            }
        }

        function triggerMainPageChange(sIdx) { activeSubMatrixIdx = 0; activeFlowNodeIdx = 0; loadCourseState(activeCourseIdx, sIdx); }
        function switchSubMatrixBranch(bIdx) { activeSubMatrixIdx = bIdx; activeFlowNodeIdx = 0; loadCourseState(activeCourseIdx, activePageIdx); }
        function switchFlowNode(nIdx) { activeFlowNodeIdx = nIdx; loadCourseState(activeCourseIdx, activePageIdx); }
        function exitExamToPage(pIdx) { examActive = false; activeSubMatrixIdx = 0; activeFlowNodeIdx = 0; loadCourseState(activeCourseIdx, pIdx); }
        function enterExamMode() { examActive = true; examCurrentQ = 0; examScoreCount = 0; loadCourseState(activeCourseIdx, 0); }

        function syncNavbarState(lang) {
            localStorage.setItem('tpm-lang-pref', lang);
            const cachedName = localStorage.getItem('tpm-user-name');
            const cachedRank = localStorage.getItem('tpm-user-rank') || globalUiTranslations[lang]["rank-default"];
            if (cachedName) {
                document.getElementById('global-user-profile-card').innerHTML = `👤 ${cachedRank}：${cachedName}`;
            }
        }

        function executeLangSwitch(lang) { syncNavbarState(lang); routeController(); }

        function runExamEngine() {
            const course = window.codexCourseEngineData[activeCourseIdx];
            if (examCurrentQ >= course.examVault.length) { settleExamPayload(); return; }
            const qData = course.examVault[examCurrentQ];
            document.getElementById('current-chapter-id').innerText = "EXAM MODE";
            document.getElementById('current-chapter-name').innerText = "L1 階段終極大考";
            document.getElementById('exam-counter').innerText = `第 ${examCurrentQ + 1} / ${course.examVault.length} 題`;

            const progressPct = (examCurrentQ / course.examVault.length) * 100;
            document.getElementById('exam-progress').style.width = `${progressPct}%`;
            document.getElementById('exam-question-text').innerText = `${examCurrentQ + 1}. ${qData.q}`;

            const container = document.getElementById('exam-options-container');
            container.innerHTML = '';
            qData.o.forEach((opt, idx) => {
                container.innerHTML += `<div class="option-card" onclick="submitAnswer(${idx})">${opt}</div>`;
            });
        }

        function submitAnswer(idx) {
            const course = window.codexCourseEngineData[activeCourseIdx];
            if (idx === course.examVault[examCurrentQ].a) { examScoreCount++; }
            examCurrentQ++;
            runExamEngine();
        }

        function settleExamPayload() {
            examActive = false;
            const course = window.codexCourseEngineData[activeCourseIdx];
            const finalPct = (examScoreCount / course.examVault.length) * 100;
            let grade = finalPct === 100 ? "S" : finalPct >= 90 ? "A" : finalPct >= 80 ? "B" : finalPct >= 70 ? "C" : finalPct >= 60 ? "D" : "Fail";

            let storageKey = "L1-A" + course.courseId.split('-')[1];

            if (grade === "Fail") {
                alert(`💥【考核失敗】判定為 Fail！通行證已鎖定，強退重考！`);
                localStorage.setItem(`codex-${storageKey}-clear`, 'false');
                localStorage.removeItem(`talent-${storageKey}-grade`);
            } else {
                alert(`🏆【考核通過】戰力位階核定為：【 ${grade} 】級！`);
                localStorage.setItem(`codex-${storageKey}-clear`, 'true');
                localStorage.setItem(`talent-${storageKey}-grade`, grade);
            }
            exitToDashboardMenu();
        }
    </script>
</body>
</html>
