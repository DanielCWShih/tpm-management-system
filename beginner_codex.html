<head>

    <style>
        :root {
            --bg-color: #FEF9E7; 
            --sidebar-cream: #FDF2D0; 
            --card-white: #FFFFFF;
            --text-main: #1A1A1A; 
            --text-secondary: #475569; 
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A; 
            --radius-sm: 8px;
            --color-locked: #94A3B8; 
            --color-available: #3B82F6; 
            --color-completed: #F59E0B;
        }
        * { box-sizing: border-box; font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif; color: var(--text-main); }
        body { background-color: var(--bg-color); margin: 0; padding: 0; width: 100vw; height: 100vh; display: flex; overflow: hidden; }
        
        /* 左側大綱導航欄 */
        aside { width: 340px; background-color: var(--sidebar-cream); border-right: 3px solid var(--border-heavy); display: flex; flex-direction: column; padding: 30px 20px; flex-shrink: 0; height: 100%; }
        .aside-header { border-bottom: 3px solid var(--border-heavy); padding-bottom: 20px; margin-bottom: 25px; }
        .back-btn { display: block; background: var(--card-white); border: 2px solid var(--border-heavy); padding: 10px; border-radius: var(--radius-sm); text-align: center; font-weight: 900; text-decoration: none; box-shadow: 3px 3px 0px var(--border-heavy); margin-bottom: 20px; }
        .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }
        
        .chapter-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        
        /* 👑 核心視覺升級：左側選單卡牌三態與金屬勳章底色樣式表 👑 */
        .chapter-tab { 
            background: var(--card-white); border: 2px solid var(--border-heavy); border-radius: var(--radius-sm); 
            padding: 16px; margin-bottom: 14px; cursor: pointer; box-shadow: 3px 3px 0px var(--border-heavy); 
            font-weight: 900; font-size: 0.9rem; transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .chapter-tab:hover { transform: translateX(4px); }
        .chapter-tab.active { background: var(--text-main) !important; color: white !important; transform: translateX(2px); }
        .chapter-tab.active * { color: white !important; }
        
        /* 🎖️ 完美過關：淺黃金金屬質感勳章底色 (Perfect 100% / S) */
        .chapter-tab.medal-gold {
            background: linear-gradient(135deg, #FFFDF4 0%, #FDE047 100%) !important;
            border-color: #B45309 !important;
            box-shadow: 3px 3px 0px #B45309 !important;
        }
        .chapter-tab.medal-gold * { color: #B45309 !important; }

        /* 🥈 一般通過：灰銀色金屬質感勳章底色 (Passed >= 60%) */
        .chapter-tab.medal-silver {
            background: linear-gradient(135deg, #F8FAFC 0%, #CBD5E1 100%) !important;
            border-color: #475569 !important;
            box-shadow: 3px 3px 0px #475569 !important;
        }
        .chapter-tab.medal-silver * { color: #475569 !important; }
        
        /* 右側主畫布 */
        main { flex: 1; height: 100%; padding: 40px; overflow-y: auto; background: var(--card-white); display: flex; flex-direction: column; position: relative; }
        .main-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--border-heavy); padding-bottom: 20px; margin-bottom: 30px; flex-shrink: 0; }
        
        /* 剛性切換與身分欄 */
        .lang-switcher-wrapper { display: flex; background: var(--card-white); border: 3px solid var(--border-heavy); border-radius: var(--radius-sm); box-shadow: 3px 3px 0px var(--border-heavy); padding: 2px; }
        .lang-btn-core { width: 50px; height: 35px; border: none; background: transparent; cursor: pointer; font-size: 0.8rem; font-weight: 900; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .lang-btn-core.active { background: var(--text-main); color: white; }
        .auth-panel { background: var(--card-white); border: 2px solid var(--border-heavy); padding: 10px 20px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 900; box-shadow: 3px 3px 0px var(--border-heavy); white-space: nowrap; }

        /* 教材展示區佈局 */
        .document-canvas { width: 100%; flex: 1; display: flex; flex-direction: column; }
        .textbook-scroll-box { flex: 1; min-height: 200px; }
        .scroll-text { font-size: 1.05rem; line-height: 1.8; font-weight: 600; white-space: pre-line; margin-bottom: 20px; }
        .diagram-placeholder { background: #F8FAFC; border: 2px dashed var(--color-locked); padding: 25px; text-align: center; border-radius: var(--radius-sm); margin: 20px 0; font-weight: 700; color: var(--text-secondary); }

        /* 👑 需求重構：內文子分頁小點點導航外殼 (Inner Slider Dots) 👑 */
        .sub-pagination-dots-zone {
            display: flex; justify-content: center; align-items: center; gap: 14px;
            padding: 20px 0; width: 100%; flex-shrink: 0; margin-top: auto;
        }
        .slider-dot {
            width: 14px; height: 14px; border: 3px solid var(--border-heavy);
            border-radius: 50%; background: white; cursor: pointer; transition: all 0.1s;
        }
        .slider-dot.active { background: var(--text-main); transform: scale(1.2); }
        .slider-dot.exam-dot { border-color: #DC2626; background: #FEF2F2; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #B91C1C; }
        .slider-dot.exam-dot.active { background: #DC2626; color: white; }

        /* 20題大考專用會場 */
        .exam-session-box { display: none; border: 3px solid var(--border-heavy); border-radius: var(--radius-sm); padding: 35px; background: #FFFDF4; box-shadow: var(--shadow-tactical); width: 100%; }
        .exam-progress-bar { width: 100%; background: #E2E8F0; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 25px; border: 1.5px solid #000; }
        .exam-progress-fill { height: 100%; background: var(--color-available); width: 0%; transition: width 0.2s; }
        .option-card { background: white; border: 2px solid var(--border-heavy); padding: 18px; border-radius: var(--radius-sm); margin-top: 14px; cursor: pointer; font-weight: 700; box-shadow: 3px 3px 0px #000; transition: all 0.1s; }
        .option-card:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; background: var(--sidebar-cream); }
    </style>
</head>

    <script>

        // ========================================================================
        const codexCourseEngineData = [
            {

                subPages: [
                    {

                        diagram: "【 供應傳輸鏈因果流向圖解：Client (設計端) ──> Vendor (上游零件) ──> EMS Factory (代工廠) 】",
                        text: "在硬體專案管理的世界中，運行著「三界一域」的實務鏈條。\n\n1. 客戶端：握有最初始的市場需求、外觀工業設計（ID）權、以及內部結構設計（ME）空間壓縮權。核心職責是將市場痛點量化為產品規格書（PRD），並輸出工程圖紙。\n2. 供應商：開發端（如光學鏡片、射頻感測器、特定防水膠材）。負責向客戶端提供樣品，並在大量生產時將電子零件物料（Components）運抵代工廠。\n3. 代工廠：即 EMS / OEM 製造廠。接過客戶端的圖紙指令，吞下供應商的零件原料，進行大規模複製組裝。"
                    },
                    {
                        title: "2. NPI 四大生命週期分期",
                        diagram: "【 NPI Spacetime Timeline: Proto ──> EVT ──> DVT ──> PVT ──> MP 】",
                        text: "新產品導入（NPI）是一條高壓且不可逆的時間軸。TPM 必須精準控管四大驗證里程碑的 Exit 閘門基準：\n\n1. EVT (工程驗證)：核心目標是實現電路原理圖與 PCB Layout 的首版通電打通。排除硬體模組與結構骨架之間的粗糙干涉。\n2. DVT (設計驗證)：此時模具正式開模。核心攻堅目標轉向外觀工藝落地、嚴苛的防水氣密防禦、以及全面信賴性極限拷問。\n3. PVT (生產驗證)：設計檔案全面凍結（Freeze），重心全力轉移至工廠流水線調校生產速率、複製測試治具、驗證製造良率製程能力（Cpk）。\n4. MP (大量生產)：全產線全速運作，神器大批複製出貨。"
                    },
                    {
                        title: "3. 直通率與可製造性防線",

                    {

                        text: "System TPM 絕非只是個傳話的記錄員，而是跨功能團隊（XFN）最高仲裁官。\n\n當專案面臨極限物理干涉時：工業設計師（ID）為了美學要求外殼銳利高光 C 角；結構工程師（ME）則會警告這會導致模具頂針斷裂、引發嚴重溢料；天線工程師則會咆哮金屬皮層過近會引發射頻訊號短路崩潰。\n\n此時，TPM 必須調閱「決策代價矩陣（Trade-off Matrix）」，主導交叉驗證（DOE），逼迫各方在公差疊加的邊界內達成黃金技術妥協。"
                    }
                ],
                // 20題專屬大考題庫

                    { q: "工廠回報最終良率高達 99%，但直通率（FPY）只有 30%，這代表什麼？", o: ["產品品質極其良好，非常健康", "超過三分之二的機器被手工拆解重修過，帶有隱形內傷", "可以立刻開閘放水進入 MP 大量生產"], a: 1 },
                    { q: "在何種階段，TPM 必須強制拦截專案，要求 ME 進行極限公差疊加分析以防模具報廢？", o: ["MP 大量生產階段", "EVT 結束進入 DVT 開模前", "最初市場調研階段"], a: 1 },
                    { q: "在 DVT 階段進行氣密測試（Leak Test）時特定角落連續漏氣，ME 說是工廠膠水問題，你該如何仲裁？", o: ["開單懲罰工廠", "利用千分尺量測組裝間隙，安排扭力對比與膠路寬度微調的 DOE 交叉驗證", "直接將防水規格從 IPX8 降到 IPX4"], a: 1 },
                    { q: "工業設計師（ID）堅持做出銳利無拔模角外殼，工廠警告會發生嚴重縮水痕與出模擦傷，TPM 應？", o: ["全盤聽從 ID，良率隨便工廠去死", "在圖紙端強行妥協微調拔模角與噴砂工藝，維持美學並確保可製造性", "直接取消該專案"], a: 1 },
                    { q: "迴流焊（Reflow）出爐後 AOI 掃描集體回報晶片位移與冷焊，這屬於哪一站的製程偏移？", o: ["FATP 後段組裝線", "SMT 前段流水線站", "後段功能測試 FCT 站"], a: 1 },

                    { q: "天線 EE 與結構 ME 為了 0.2mm 的防護間距在會議上瘋狂吵架，TPM 應扮演的角色是？", o: ["記錄他們吵架的字句並呈報高層", "依據技術底蘊主導 Trade-off Matrix 決策代價矩陣，逼出黃金妥協點", "叫他們去走廊打架"], a: 1 },
                    { q: "產品在市場開箱即損（DOA）故障率超標，客退品（Field Returns）應送往何處進行屍檢分析？", o: ["太古聖堂認證機構", "早期失效分析中中繼站 (EFFA / DOA Autopsy)", "重新塞回 SMT 爐子過火"], a: 1 },

                    { q: "防水橡膠圈（O-Ring）在結構配置中，最神聖的黃金物理壓縮比變形率區間是？", o: ["1% ~ 5%", "25% ~ 40%", "90% ~ 100%"], a: 1 },
                    { q: "高階相機模組為了排除微米級組裝公差，在點亮動態下利用六軸機器手臂微調至最清晰交點的製程叫？", o: ["ICT 針床測試", "AA 主動對位技術 (Active Alignment)", "表面陽極氧化工藝"], a: 1 },

                    { q: "在 EVT 工程驗證生命週期階段，團隊的核心攻堅指標是什麼？", o: ["完成電路原理圖與 PCB Layout 首版功能通電打通", "大量複製一萬台量產裝置", "設計彩盒外包裝"], a: 0 },
                    { q: "當專案進度正式跨入 PVT 階段時，代表以下何種硬體狀態已經發生？", o: ["產品還在進行最初步市場調研", "研發設計檔案全面凍結（Freeze），重心全力轉移至工廠量產能力複製與拉速", "外殼噴砂工藝尚未決定"], a: 1 },

                    { q: "專案完成大量生產（MP）開閘出貨後，TPM 必須將本次戰役的經驗凝結成什麼文獻傳送回大圖書館？", o: ["PRD 產品規格書", "Lessons Learned (歷史經驗教訓文獻結晶)", "CAD 3D 元件模型"], a: 1 },

        let activeCourseIdx = 0; // 當前單元

            loadCourseState(activeCourseIdx, activePageIdx);
        }

        // 👑 核心重構：渲染左側單元菜單並動態追加「金屬勋章色塊」
        function renderLeftMenu() {
            const menu = document.getElementById('dynamic-course-menu');
            menu.innerHTML = '';

            codexCourseEngineData.forEach((course, idx) => {
                // 讀取快取中的大考過關評級（S/A/B/C/D）
                const savedGrade = localStorage.getItem(`talent-${course.courseId}-grade`);
                let medalClass = "";
                
                if (savedGrade === "S") medalClass = "medal-gold"; // 100% 滿分金牌勳章
                else if (savedGrade && savedGrade !== "Fail") medalClass = "medal-silver"; // 及格銀牌勳章

                const activeClass = idx === activeCourseIdx ? "active" : "";

                menu.innerHTML += `
                    <li class="chapter-tab ${activeClass} ${medalClass}" onclick="triggerCourseSelect(${idx})">
                        ${course.menuTitle}
                    </li>
                `;
            });
        }

        // 👑 核心重構：動態加載並渲染內文、圖解與底層小點點
        function loadCourseState(cIdx, pIdx) {
            activeCourseIdx = cIdx;
            const course = codexCourseEngineData[cIdx];
            const dotsBar = document.getElementById('universal-dots-bar');
            dotsBar.innerHTML = '';

            if (examActive) {
                // 進入大考模式
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'block';
                
                // 渲染點點區（大考專用點）
                course.subPages.forEach((_, sIdx) => {
                    dotsBar.innerHTML += `<div class="slider-dot" onclick="exitExamToPage(${sIdx})"></div>`;
                });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot active">⚔️</div>`;
                
                runExamEngine();
            } else {
                // 研研讀模式
                document.getElementById('textbook-viewport').style.display = 'block';
                document.getElementById('exam-viewport').style.display = 'none';
                
                activePageIdx = pIdx;
                const page = course.subPages[pIdx];

                document.getElementById('current-chapter-id').innerText = `SECTION ${pIdx + 1} / ${course.subPages.length}`;
                document.getElementById('current-chapter-name').innerText = page.title;
                document.getElementById('lesson-content').innerText = page.text;
                document.getElementById('diagram-box').innerText = page.diagram;

                // 👑 完美落實需求：動態渲染底層小點點 (● ○ ○ ○ ○)
                course.subPages.forEach((_, sIdx) => {
                    const dotActive = sIdx === pIdx ? "active" : "";
                    dotsBar.innerHTML += `<div class="slider-dot ${dotActive}" onclick="loadCourseState(${cIdx}, ${sIdx})"></div>`;
                });
                
                // 追加最後一個紅色的「大考大劍點點」
                dotsBar.innerHTML += `<div class="slider-dot exam-dot" onclick="enterExamMode()">⚔️</div>`;
            }
        }

        function triggerCourseSelect(idx) {
            examActive = false;
            activeCourseIdx = idx;
            activePageIdx = 0;
            renderLeftMenu();
            loadCourseState(idx, 0);
        }

        function exitExamToPage(pIdx) {
            examActive = false;
            loadCourseState(activeCourseIdx, pIdx);
        }

        function enterExamMode() {
            examActive = true;
            examCurrentQ = 0;
            examScoreCount = 0;
            loadCourseState(activeCourseIdx, 0);
        }

        // 👑 20題連擊大考核心引擎
        function runExamEngine() {
            const course = codexCourseEngineData[activeCourseIdx];
            if (examCurrentQ >= course.examVault.length) {
                settleExamPayload();
                return;
            }

            const qData = course.examVault[examCurrentQ];
            document.getElementById('current-chapter-id').innerText = "EXAM MODE";
            document.getElementById('current-chapter-name').innerText = "L1 階段位階終極大考";
            document.getElementById('exam-counter').innerText = `第 ${examCurrentQ + 1} / ${course.examVault.length} 題`;

            const progressPct = (examCurrentQ / course.examVault.length) * 100;
            document.getElementById('exam-progress').style.width = `${progressPct}%`;
            document.getElementById('exam-question-text').innerText = `${examCurrentQ + 1}. ${qData.q}`;

            const container = document.getElementById('exam-options-container');
            container.innerHTML = '';
            qData.o.forEach((opt, idx) => {
                container.innerHTML += `<div class="option-card" onclick="submitAnswer(${idx})">${opt}</div>`;
            });
        }

        function submitAnswer(idx) {
            const course = codexCourseEngineData[activeCourseIdx];
            if (idx === course.examVault[examCurrentQ].a) {
                examScoreCount++;
            }
            examCurrentQ++;
            runExamEngine();
        }

        // 👑 剛性職等結算與重考回溯機制
        function settleExamPayload() {
            examActive = false;
            const course = codexCourseEngineData[activeCourseIdx];
            const finalPct = (examScoreCount / course.examVault.length) * 100;
            let grade = "Fail";

            if (finalPct === 100) grade = "S";
            else if (finalPct >= 90) grade = "A";
            else if (finalPct >= 80) grade = "B";
            else if (finalPct >= 70) grade = "C";
            else if (finalPct >= 60) grade = "D";

            if (grade === "Fail") {
                alert(`💥【位階考核失敗】\n最終得分率僅有 ${finalPct}%（未達 60% 剛性門檻）。\n\n判定為 Fail！您不具備通關認證，系統已執行強退回溯，請重新研讀教材重考！`);
                localStorage.setItem(`codex-${course.courseId}-clear`, 'false');
                localStorage.removeItem(`talent-${course.courseId}-grade`);
                triggerCourseSelect(activeCourseIdx); // 重新打回第一頁重讀
            } else {
                alert(`🏆【位階考核通過】\n特工解鎖成功！您已擊碎 20 題情境 Boss 連擊！\n最終核定戰力位階：【 ${grade} 】級！`);
                localStorage.setItem(`codex-${course.courseId}-clear`, 'true');
                
                // 核心持久化儲存 ── 同步連動讓天賦樹抓到正確的金屬印章與分數
                localStorage.setItem(`talent-${course.courseId}-grade`, grade);
                localStorage.setItem(`talent-${course.courseId}-date`, new Date().toLocaleDateString());
                
                triggerCourseSelect(activeCourseIdx); // 重新渲染左側選單觸發金屬勳章
            }
        }

        // 全域語言與身分卡同步
        function setLang(lang) {
            document.querySelectorAll('.lang-btn-core').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            document.querySelectorAll('[data-i18n]').forEach(el => { 
                const key = el.getAttribute('data-i18n'); 
                if(translations[lang][key]) el.innerText = translations[lang][key]; 
            });

            document.getElementById('nav-home-text').innerText = translations[lang]["nav-home"];
            const cachedName = localStorage.getItem('tpm-user-name');
            const cachedRank = localStorage.getItem('tpm-user-rank') || "冒險者";
            let displayRank = (lang === 'tw') ? cachedRank : "Adventurer";
            
            if (cachedName) {
                document.getElementById('user-profile').innerHTML = `👤 ${displayRank}：${cachedName}`;
            }
            localStorage.setItem('tpm-lang-pref', lang);
        }

        window.onload = () => {
            setLang(localStorage.getItem('tpm-lang-pref') || 'tw'); 
            initEngine();
        };
    </script>
</body>
</html>
