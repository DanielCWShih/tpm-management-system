<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初心者寶典大廳 | System TPM Tactical Hub</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* 剛性頂部控制列 */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        /* 雙區塊工作主框架 */
        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        /* 側邊欄常駐導航面板 */
        .sidebar-panel {
            display: flex;
            width: 350px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
            background-color: #FAF9F5;
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 4px;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leaf-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.82rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            line-height: 1.4;
        }

        .leaf-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .leaf-btn.active {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        /* 右側內容面板 */
        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            overflow: hidden;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
        }

        /* 剛性顯影互鎖：容器預設底層全部鎖死隱藏 */
        .dashboard-view-hall,
        .document-canvas,
        .exam-session-box,
        .sub-pagination-dots-zone {
            display: none;
            width: 100%;
        }

        /* 👑 新版戰略 Dashboard 看板佈局 👑 */
        .dashboard-view-hall {
            height: 100%;
            overflow-y: auto;
        }

        .progress-card-master {
            background: var(--card-white);
            border: 4px solid var(--border-heavy);
            border-radius: 15px;
            padding: 40px;
            box-shadow: var(--shadow-tactical);
            max-width: 650px;
            margin-bottom: 35px;
        }

        .progress-label {
            font-family: monospace;
            font-weight: 900;
            font-size: 1.15rem;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .progress-percentage {
            font-size: 5.5rem;
            font-weight: 900;
            margin: 15px 0;
            color: var(--text-main);
            line-height: 1;
        }

        .progress-stats {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .progress-bar-bg {
            width: 100%;
            height: 26px;
            background: #E2E8F0;
            border: 3px solid var(--border-heavy);
            border-radius: 13px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--color-completed);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cdx-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            padding-top: 10px;
        }

        .cdx-dashboard-card {
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 25px 22px;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        .cdx-dashboard-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0px var(--text-main);
        }

        .document-canvas {
            flex: 1;
            overflow: hidden;
        }

        /* 二級頁籤導航列 */
        .cdx-sub-nav-bar {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 12px;
            flex-shrink: 0;
        }

        .sub-nav-btn {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            color: var(--text-main);
        }

        .sub-nav-btn.active {
            background: var(--text-main);
            color: white;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy);
        }

        .textbook-scroll-box {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            width: 100%;
        }

        /* 互動型卡牌結構組件 */
        .edu-overview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .edu-overview-card {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 16px;
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .edu-card-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-heavy);
            padding-bottom: 4px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .edu-card-body-text {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text-main);
        }

        /* 流程圖大畫布 */
        .dynamic-flow-canvas {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            background: #F8FAFC;
            border: 2px dashed var(--border-heavy);
            padding: 20px;
            border-radius: var(--radius-sm);
            margin: 15px 0;
            width: 100%;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .flow-node-block {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0px var(--border-heavy);
            white-space: nowrap;
            text-align: center;
            transition: all 0.1s;
            color: var(--text-main);
            cursor: pointer;
        }

        .flow-node-block.active-node {
            background: var(--text-main) !important;
            color: #FFFFFF !important;
            border-color: #1A1A1A !important;
            box-shadow: 3px 3px 0px var(--color-active-gold) !important;
        }

        .flow-arrow-split {
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-main);
            user-select: none;
        }

        /* 10 抽 3 閃擊戰大考場 */
        .exam-session-box {
            flex-direction: column;
        }

        .exam-progress-bar {
            width: 100%;
            background: #E2E8F0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1.5px solid #000;
        }

        .exam-progress-fill {
            height: 100%;
            background: var(--text-main);
            width: 0%;
            transition: width 0.2s;
        }

        .option-card {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 18px;
            border-radius: var(--radius-sm);
            margin-top: 14px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        .option-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
            background: var(--sidebar-cream);
        }

        /* 底部頁碼導航點點 */
        .sub-pagination-dots-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 15px 0;
            margin-top: auto;
            border-top: 2px dashed #E2E8F0;
        }

        .slider-dot {
            width: 14px;
            height: 14px;
            border: 3px solid var(--border-heavy);
            border-radius: 50%;
            background: #FFF;
            cursor: pointer;
            transition: all 0.1s;
        }

        .slider-dot.active {
            background: var(--text-main);
            transform: scale(1.2);
        }

        .slider-dot.exam-dot {
            border-color: var(--color-fail);
            background: #FEF2F2;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #B91C1C;
        }

        .slider-dot.exam-dot.active {
            background: var(--color-fail);
            color: #FFF;
        }
    </style>
</head>
<body>

    <!-- 頂部控制導航列 -->
    <div class="tactical-navbar">
        <div class="navbar-brand">
            <span style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.8rem;">SYS.BEGINNER_CODEX V6.0</span>
            <h1 style="margin: 3px 0 0 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">初心者寶典大廳</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：線上特工</div>
            <a href="index.html" class="back-btn">返回首頁</a>
        </div>
    </div>

    <!-- 工作主框架 -->
    <div class="workspace-container">
        
        <!-- 左側常駐摺疊天賦樹導航列 -->
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboardMenu()">↩ 返回戰術大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <!-- 右側動態內容主畫布 -->
        <main class="content-panel">
            
            <!-- 單元動態主標頭 -->
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">DASHBOARD</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">公會戰術天賦大廳</h2>
            </div>

            <!-- 👑 數據化進度整備盤大廳 👑 -->
            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div class="progress-card-master">
                    <div class="progress-label">CORE COMPETENCY: LEVEL 1</div>
                    <div class="progress-percentage" id="main-progress-pct">0%</div>
                    <div class="progress-stats" id="main-progress-stats">完成子單元: 0 / 0</div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="main-progress-fill"></div>
                    </div>
                </div>
                <div style="font-weight: 900; font-size: 1.15rem; margin-bottom: 15px; color: var(--text-main);">🌿 Level 1 子單元研修列表：</div>
                <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
            </div>

            <!-- 教材內容閱讀畫布 -->
            <div class="document-canvas" id="textbook-viewport">
                <div class="cdx-sub-nav-bar" id="cdx-sub-nav-wrapper" style="display:none;"></div>
                <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.15rem; margin: 0 0 15px 0;">⚡ 實戰知識核心 (Core Knowledge Base)</h3>
                <div class="dynamic-flow-canvas" id="dynamic-flow-renderer-box"></div>
                <div class="textbook-scroll-box" id="lesson-content"></div>
            </div>

            <!-- 10 抽 3 閃擊戰大考場 -->
            <div class="exam-session-box" id="exam-viewport">
                <div style="display:flex; justify-content:space-between; font-weight:900; margin-bottom:10px;">
                    <span style="color:var(--color-fail);">🔥 10 抽 3 隨機閃擊戰 (Exam Mode)</span>
                    <span id="exam-counter" style="color:var(--text-secondary);">1 / 3</span>
                </div>
                <div class="exam-progress-bar">
                    <div class="exam-progress-fill" id="exam-progress"></div>
                </div>
                <h3 id="exam-question-text" style="font-size:1.2rem; line-height:1.5; margin-bottom:25px; font-weight: 800;">載入中...</h3>
                <div id="exam-options-container"></div>
            </div>

            <!-- 底部控制點點列 -->
            <div class="sub-pagination-dots-zone" id="universal-dots-bar"></div>
            
        </main>
    </div>

    <script>
        // 全域去中心化子單元配置註冊表
        const globalSubUnitRegistry = [
            { type: 'codex', subUnitId: '1-1', title: '1-1: 基本世界觀與三方賽局', file: 'course_data_1-1.js' },
            { type: 'codex', subUnitId: '1-2', title: '1-2: 硬體生命週期與 NPI 交付', file: 'course_data_1-2.js' },
            { type: 'codex', subUnitId: '1-3', title: '1-3: 工廠地理與 4M1E 線體通識', file: 'course_data_1-3.js' }
        ];

        let activeCourseIdx = 0, activePageIdx = 0, activeSubMatrixIdx = 0, activeFlowNodeIdx = 0;
        let examActive = false, examCurrentQ = 0, examScoreCount = 0;

        window.onload = () => {
            window.codexCourseEngineData = [];
            renderGlobalTreeStructure();
            routeController();
        };

        function renderGlobalTreeStructure() {
            const root = document.getElementById('global-tree-root');
            root.innerHTML = `
                <div class="menu-category-block">
                    <button class="tree-main-toggle">🗺️ Level 1 基礎通識</button>
                    <div class="tree-sub-group">
                        ${globalSubUnitRegistry.map(u => `
                            <button class="leaf-btn" id="lf-codex-${u.subUnitId}" onclick="switchUnit('${u.type}','${u.subUnitId}')">${u.title}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function routeController(directType, directC) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramC = directC || urlParams.get('c');
            const paramType = directType || urlParams.get('type') || 'codex';

            if (!paramC) {
                // 點亮看板模式
                document.getElementById('cdx-page-header-zone').style.display = 'block';
                document.getElementById('current-chapter-id').innerText = "DASHBOARD";
                document.getElementById('current-chapter-name').innerText = "公會戰術天賦大廳";

                document.getElementById('dashboard-menu-hall').style.display = 'block';
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'none';

                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active'));
                renderExecutiveDashboard();
            } else {
                // 點亮教材大畫布模式
                document.getElementById('dashboard-menu-hall').style.display = 'none';
                const subUnitKey = `lf-${paramType}-${paramC}`;
                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active'));
                const activeLeaf = document.getElementById(subUnitKey);
                if (activeLeaf) activeLeaf.classList.add('active');

                injectContentPackScript(paramType, paramC);
            }
        }

        function renderExecutiveDashboard() {
            const grid = document.getElementById('l1-cards-grid');
            if (!grid) return;
            grid.innerHTML = '';

            let totalUnits = globalSubUnitRegistry.length;
            let completedCount = 0;

            globalSubUnitRegistry.forEach(unit => {
                const storageKey = `L1-A${unit.subUnitId.split('-')[1]}`;
                const isClear = localStorage.getItem(`codex-${storageKey}-clear`) === 'true';
                if (isClear) completedCount++;

                // 未過考核戰術黃，過考核安全綠
                const cardColor = isClear ? '#DCFCE7' : '#FEF08A';
                const statusText = isClear ? '✅ 考核通過 [ 憑證已點亮 ]' : '⏳ 尚未通過考核';

                grid.innerHTML += `
                    <div class="cdx-dashboard-card" style="background-color: ${cardColor};" onclick="switchUnit('${unit.type}', '${unit.subUnitId}')">
                        <div>
                            <div style="font-family: monospace; font-size: 0.8rem; font-weight: 900; color: var(--text-secondary);">LEVEL 1 SUB-UNIT</div>
                            <h3 style="margin: 6px 0 0 0; font-size: 1.1rem; font-weight: 900; color: var(--text-main);">${unit.title}</h3>
                        </div>
                        <div style="font-size: 0.82rem; font-weight: 900; color: var(--text-main); margin-top: 15px;">${statusText}</div>
                    </div>
                `;
            });

            // 👑 數據百分比自動化計算核心 👑
            const finalPercentage = Math.round((completedCount / totalUnits) * 100);
            document.getElementById('main-progress-pct').innerText = `${finalPercentage}%`;
            document.getElementById('main-progress-stats').innerText = `完成子單元: ${completedCount} / ${totalUnits}`;
            document.getElementById('main-progress-fill').style.width = `${finalPercentage}%`;
        }

        function switchUnit(type, subUnitId) {
            examActive = false;
            activeCourseIdx = 0; activePageIdx = 0; activeSubMatrixIdx = 0; activeFlowNodeIdx = 0;
            const newUrl = `${window.location.pathname}?type=${type}&c=${subUnitId}`;
            window.history.pushState(null, '', newUrl);
            routeController(type, subUnitId);
        }

        function exitToDashboardMenu() {
            examActive = false;
            const newUrl = window.location.pathname;
            window.history.pushState(null, '', newUrl);
            routeController(null, null);
        }

        function injectContentPackScript(type, packId) {
            window.codexCourseEngineData = [];
            const oldScript = document.getElementById('dynamic-course-pack');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'dynamic-course-pack';
            const isLocalFile = window.location.protocol === 'file:';
            script.src = isLocalFile ? `${globalSubUnitRegistry.find(u=>u.subUnitId===packId).file}` : `${globalSubUnitRegistry.find(u=>u.subUnitId===packId).file}?v=${Date.now()}`;
            
            script.onload = () => { initEngine(); };
            script.onerror = () => {
                document.getElementById('current-chapter-name').innerText = "數據包加載失敗";
                document.getElementById('lesson-content').innerHTML = `
                    <div style="padding: 30px; border: 2px dashed var(--color-fail); text-align: center; font-weight: 900; color: var(--color-fail);">
                        💥 找不到單元數據包 [ course_data_${packId}.js ]。請確認檔案放置路徑。
                    </div>`;
                document.getElementById('dynamic-flow-renderer-box').style.display = 'none';
                document.getElementById('universal-dots-bar').innerHTML = '';
            };
            document.head.appendChild(script);
        }

        function initEngine() {
            if (!window.codexCourseEngineData || window.codexCourseEngineData.length === 0) {
                document.getElementById('current-chapter-name').innerText = "數據解讀失敗";
                document.getElementById('lesson-content').innerHTML = `
                    <div style="padding: 30px; border: 3px solid var(--border-heavy); background-color: #FEE2E2; border-radius: var(--radius-sm); font-weight: 900; color: var(--color-fail); line-height: 1.6;">
                        🚨 [除錯顯影警告] window.codexCourseEngineData 數據結構為空！<br><br>
                        <strong>可能原因：</strong> 外部 JS 內部存在編譯期語法錯誤（SyntaxError），請開啟 F12 Console 檢查錯誤行數。
                    </div>`;
                document.getElementById('textbook-viewport').style.display = 'flex';
                document.getElementById('dynamic-flow-renderer-box').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'none';
                return;
            }
            loadCourseState(activeCourseIdx, activePageIdx);
        }

        function loadCourseState(cIdx, pIdx) {
            activeCourseIdx = cIdx;
            const course = window.codexCourseEngineData[cIdx];
            const dotsBar = document.getElementById('universal-dots-bar');
            dotsBar.innerHTML = '';

            if (examActive) {
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'block';
                document.getElementById('universal-dots-bar').style.display = 'flex';
                course.subPages.forEach((_, sIdx) => {
                    dotsBar.innerHTML += `<div class="slider-dot" onclick="exitExamToPage(${sIdx})"></div>`;
                });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot active">⚔️</div>`;
                runExamEngine();
            } else {
                document.getElementById('textbook-viewport').style.display = 'flex';
                document.getElementById('exam-viewport').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'flex';
                activePageIdx = pIdx;
                const page = course.subPages[pIdx];

                document.getElementById('current-chapter-id').innerText = `PAGE ${pIdx + 1} / ${course.subPages.length}`;
                document.getElementById('current-chapter-name').innerText = page.title;

                const subNavWrapper = document.getElementById('cdx-sub-nav-wrapper');
                let targetedText = page.text;
                let targetedFlow = page.diagramFlowArray;

                if (page.subMatrixBranches) {
                    if (subNavWrapper) {
                        subNavWrapper.style.display = 'flex';
                        subNavWrapper.innerHTML = '';
                        page.subMatrixBranches.forEach((branch, bIdx) => {
                            const activeBranchClass = bIdx === activeSubMatrixIdx ? 'active' : '';
                            subNavWrapper.innerHTML += `<button class="sub-nav-btn ${activeBranchClass}" onclick="switchSubMatrixBranch(${bIdx})">${branch.branchLabel}</button>`;
                        });
                    }
                    targetedText = page.subMatrixBranches[activeSubMatrixIdx].text;
                    targetedFlow = page.subMatrixBranches[activeSubMatrixIdx].diagramFlowArray;
                } else {
                    if (subNavWrapper) subNavWrapper.style.display = 'none';
                    activeSubMatrixIdx = 0;
                }

                if (targetedFlow && targetedFlow[activeFlowNodeIdx] && targetedFlow[activeFlowNodeIdx].text) {
                    document.getElementById('lesson-content').innerHTML = targetedFlow[activeFlowNodeIdx].text;
                } else {
                    document.getElementById('lesson-content').innerHTML = targetedText;
                }

                const flowRenderer = document.getElementById('dynamic-flow-renderer-box');
                if (flowRenderer && targetedFlow) {
                    flowRenderer.style.display = 'flex';
                    flowRenderer.innerHTML = '';
                    targetedFlow.forEach((node, nIdx) => {
                        const isSelected = nIdx === activeFlowNodeIdx;
                        let nodeClass = 'flow-node-block';
                        if (isSelected) nodeClass += ' active-node';
                        flowRenderer.innerHTML += `<div class="${nodeClass}" onclick="switchFlowNode(${nIdx})">${node.name}</div>`;
                        if (nIdx < targetedFlow.length - 1) flowRenderer.innerHTML += `<div class="flow-arrow-split">➔</div>`;
                    });
                } else if (flowRenderer) {
                    flowRenderer.style.display = 'none';
                }

                course.subPages.forEach((_, sIdx) => {
                    const dotActive = sIdx === pIdx ? "active" : "";
                    dotsBar.innerHTML += `<div class="slider-dot ${dotActive}" onclick="triggerMainPageChange(${sIdx})"></div>`;
                });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot" onclick="enterExamMode()">⚔️</div>`;
            }
        }

        function triggerMainPageChange(sIdx) { activeSubMatrixIdx = 0; activeFlowNodeIdx = 0; loadCourseState(activeCourseIdx, sIdx); }
        function switchSubMatrixBranch(bIdx) { activeSubMatrixIdx = bIdx; activeFlowNodeIdx = 0; loadCourseState(activeCourseIdx, activePageIdx); }
        function switchFlowNode(nIdx) { activeFlowNodeIdx = nIdx; loadCourseState(activeCourseIdx, activePageIdx); }
        function exitExamToPage(pIdx) { examActive = false; activeSubMatrixIdx = 0; activeFlowNodeIdx = 0; loadCourseState(activeCourseIdx, pIdx); }
        function enterExamMode() { examActive = true; examCurrentQ = 0; examScoreCount = 0; loadCourseState(activeCourseIdx, 0); }

        function runExamEngine() {
            const course = window.codexCourseEngineData[activeCourseIdx];
            if (examCurrentQ >= course.examVault.length) { settleExamPayload(); return; }
            const qData = course.examVault[examCurrentQ];
            document.getElementById('current-chapter-id').innerText = "EXAM MODE";
            document.getElementById('current-chapter-name').innerText = "10 抽 3 隨機閃擊戰";
            document.getElementById('exam-counter').innerText = `${examCurrentQ + 1} / 3`;

            const progressPct = (examCurrentQ / 3) * 100;
            document.getElementById('exam-progress').style.width = `${progressPct}%`;
            document.getElementById('exam-question-text').innerText = `${examCurrentQ + 1}. ${qData.q}`;

            const container = document.getElementById('exam-options-container');
            container.innerHTML = '';
            qData.o.forEach((opt, idx) => {
                container.innerHTML += `<div class="option-card" onclick="submitAnswer(${idx})">${opt}</div>`;
            });
        }

        function submitAnswer(idx) {
            const course = window.codexCourseEngineData[activeCourseIdx];
            if (idx === course.examVault[examCurrentQ].a) { examScoreCount++; }
            examCurrentQ++;
            runExamEngine();
        }

        function settleExamPayload() {
            examActive = false;
            const course = window.codexCourseEngineData[activeCourseIdx];
            
            // 3 題錯 2 題即 Fail 門檻
            if (examScoreCount < 2) {
                alert(`💥【考核失敗】答對題數 ${examScoreCount}/3，未達 2 題及格線！強制退回重訓！`);
                const storageKey = `L1-A${course.courseId.split('-')[1]}`;
                localStorage.setItem(`codex-${storageKey}-clear`, 'false');
                localStorage.removeItem(`talent-${storageKey}-grade`);
            } else {
                let grade = examScoreCount === 3 ? "S" : "A";
                alert(`🏆【考核通過】位階核定為：【 ${grade} 】級！`);
                const storageKey = `L1-A${course.courseId.split('-')[1]}`;
                localStorage.setItem(`codex-${storageKey}-clear`, 'true');
                localStorage.setItem(`talent-${storageKey}-grade`, grade);
            }
            exitToDashboardMenu();
        }

        function syncNavbarState(lang) {
            localStorage.setItem('tpm-lang-pref', lang);
        }
        function executeLangSwitch(lang) { routeController(); }
    </script>
</body>
</html>
