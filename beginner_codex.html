<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初心者寶典大廳 | Beginner's Codex Hall</title>
    
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-locked: #94A3B8;
            --color-completed: #F59E0B;
            --color-fail: #DC2626;
        }

        html, 
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* 剛性頂部控制列 */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        /* 雙區塊工作主框架 */
        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        .sidebar-panel {
            display: none;
            width: 340px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 30px 20px;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .cdx-sidebar-header {
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 15px;
            margin-bottom: 10px;
        }

        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            overflow: hidden;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
        }

        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-tab {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            font-weight: 900;
            font-size: 0.9rem;
        }

        .chapter-tab.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        /* 大廳目錄首頁預設直接點亮 */
        .dashboard-view-hall {
            display: block;
            width: 100%;
        }

        .document-canvas, 
        .exam-session-box, 
        .sub-pagination-dots-zone {
            display: none;
        }

        .level-section {
            margin-bottom: 45px;
            width: 100%;
        }

        .level-title-divider {
            font-size: 1.5rem;
            font-weight: 900;
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cdx-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .cdx-dashboard-card {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 30px;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            position: relative;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }

        .cdx-dashboard-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0px var(--text-main);
        }

        .cdx-dashboard-card.medal-gold {
            background: linear-gradient(135deg, #FFFDF4 0%, #FDE047 100%) !important;
            border-color: #B45309 !important;
            box-shadow: 4px 4px 0px #B45309 !important;
        }

        /* 二級分支導航條 */
        .cdx-sub-nav-bar {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 12px;
            flex-shrink: 0;
        }

        .sub-nav-btn {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            color: var(--text-main);
        }

        .sub-nav-btn.active {
            background: #FDE047;
            color: var(--text-main);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy);
        }

        /* 內文教材區 */
        .textbook-scroll-box {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            width: 100%;
        }

        /* 互動型卡牌佈局組件 */
        .edu-overview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .edu-overview-card {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 16px;
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .edu-card-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-heavy);
            padding-bottom: 4px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .edu-card-body-text {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text-main);
        }

        /* 互動字典按鈕網格 */
        .dict-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .dict-trigger-btn {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
        }

        .dict-trigger-btn:hover {
            background: #FAF9F5;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .dict-display-box {
            background: #FFFDF2;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 18px;
            margin-bottom: 25px;
            box-shadow: 3px 3px 0px var(--border-heavy);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.6;
            display: none;
            animation: fadeInBox 0.15s ease-out;
        }

        /* 決策模擬沙盒卡牌 */
        .sandbox-panel-card {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 20px;
            box-shadow: 4px 4px 0px var(--border-heavy);
            margin-bottom: 25px;
        }

        .sandbox-choice-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .sandbox-choice-btn {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            color: var(--text-main);
            transition: all 0.1s;
        }

        .sandbox-choice-btn:hover {
            background: #FAF5FF;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .sandbox-fallout-box {
            margin-top: 15px;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border-heavy);
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.6;
            display: none;
        }

        .sandbox-fallout-box.success {
            background: #F0FDF4;
            border-color: #16A34A;
            color: #14532D;
            box-shadow: 3px 3px 0px #16A34A;
        }

        .sandbox-fallout-box.fail {
            background: #FEF2F2;
            border-color: #DC2626;
            color: #7F1D1D;
            box-shadow: 3px 3px 0px #DC2626;
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dynamic-flow-canvas {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            background: #F8FAFC;
            border: 2px dashed var(--border-heavy);
            padding: 20px;
            border-radius: var(--radius-sm);
            margin: 15px 0;
            width: 100%;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .flow-node-block {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0px var(--border-heavy);
            white-space: nowrap;
            text-align: center;
            transition: all 0.1s;
            color: var(--text-main);
        }

        .flow-node-block.highlight {
            background: #EFF6FF;
            border-color: var(--border-heavy);
            box-shadow: 2px 2px 0px var(--border-heavy);
            color: var(--text-main);
        }

        .flow-node-block.active-node {
            background: #1A1A1A !important;
            color: #FFFFFF !important;
            border-color: #1A1A1A !important;
            box-shadow: 3px 3px 0px var(--color-completed) !important;
        }

        .flow-arrow-split {
            font-weight: 900;
            font-size: 1rem;
            color: var(--text-main);
            user-select: none;
        }

        /* 分頁小點點導航列 */
        .sub-pagination-dots-zone {
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 15px 0;
            width: 100%;
            flex-shrink: 0;
            margin-top: auto;
            border-top: 2px dashed #E2E8F0;
        }

        .slider-dot {
            width: 14px;
            height: 14px;
            border: 3px solid var(--border-heavy);
            border-radius: 50%;
            background: #FFF;
            cursor: pointer;
            transition: all 0.1s;
        }

        .slider-dot.active {
            background: var(--text-main);
            transform: scale(1.2);
        }

        .slider-dot.exam-dot {
            border-color: #DC2626;
            background: #FEF2F2;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #B91C1C;
        }

        .slider-dot.exam-dot.active {
            background: #DC2626;
            color: #FFF;
        }

        /* 大考場 */
        .exam-progress-bar {
            width: 100%;
            background: #E2E8F0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1.5px solid #000;
        }

        .exam-progress-fill {
            height: 100%;
            background: var(--text-main);
            width: 0%;
            transition: width 0.2s;
        }

        .option-card {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 18px;
            border-radius: var(--radius-sm);
            margin-top: 14px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s;
        }

        .option-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
            background: var(--sidebar-cream);
        }
    </style>
</head>
<body style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <span style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.8rem;" id="global-inject-tag">SYS.BEGINNER_CODEX V5.10</span>
            <h1 style="margin: 3px 0 0 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">初心者寶典大廳</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">🔒 認證讀取中...</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core" id="global-btn-tw" onclick="executeLangSwitch('tw')">TW</button>
                <button class="lang-btn-core" id="global-btn-en" onclick="executeLangSwitch('en')">EN</button>
            </div>
            <a href="index.html" class="back-btn" id="global-nav-home-btn">首頁</a>
        </div>
    </div>

    <div class="workspace-container">
        
        <aside class="sidebar-panel" id="shell-sidebar-area">
            <div class="cdx-sidebar-header">
                <button class="back-btn" onclick="exitToDashboardMenu()" style="width:100%; cursor:pointer;">↩ 返回目錄</button>
            </div>
            <ul class="chapter-list" id="dynamic-course-menu"></ul>
        </aside>

        <main class="content-panel">
            
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); display: none; flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;"></span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;"></h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div class="level-section">
                    <div class="level-title-divider">🌿 Level 1：基礎通識研修領域 (Foundations)</div>
                    <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
                </div>
                <div class="level-section" style="margin-top: 40px;">
                    <div class="level-title-divider" style="opacity: 0.4;">🔒 Level 2：進階專科領域 (Staging)</div>
                    <div class="cdx-dashboard-grid" style="opacity: 0.4; pointer-events: none;">
                        <div class="cdx-dashboard-card">
                            <h3>精細防水防護與氣密 DOE 研修</h3>
                            <p>專修 IPX8 膠路、O-Ring 壓縮比與氣密防線調校。</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="document-canvas" id="textbook-viewport" style="flex-direction:column; flex:1; overflow:hidden;">
                
                <div class="cdx-sub-nav-bar" id="cdx-sub-nav-wrapper" style="display:none;"></div>
                
                <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.15rem; margin: 0 0 15px 0;">⚡ 實戰知識核心 (Core Knowledge Base)</h3>
                
                <div class="dynamic-flow-canvas" id="dynamic-flow-renderer-box"></div>

                <div class="textbook-scroll-box">
                    <div id="lesson-content" class="scroll-text"></div>
                </div>
            </div>

            <div class="exam-session-box" id="exam-viewport">
                <div style="display:flex; justify-content:space-between; font-weight:900; margin-bottom:10px;">
                    <span style="color:#B91C1C;">🔥 終極大會考進行中 (Exam Mode)</span>
                    <span id="exam-counter" style="color:var(--text-secondary);">第 1 / 20 題</span>
                </div>
                <div class="exam-progress-bar">
                    <div class="exam-progress-fill" id="exam-progress"></div>
                </div>
                <h3 id="exam-question-text" style="font-size:1.2rem; line-height:1.5; margin-bottom:25px;">載入中...</h3>
                <div id="exam-options-container"></div>
            </div>

            <div class="sub-pagination-dots-zone" id="universal-dots-bar"></div>
            
        </main>
    </div>

    <script>
        const globalUiTranslations = {
            tw: { "nav-home": "首頁", "auth-locked": "🔒 未讀取公會憑證", "rank-default": "冒險者", "title": "初心者寶典大廳" },
            en: { "nav-home": "Home", "auth-locked": "🔒 No Credentials", "rank-default": "Adventurer", "title": "Beginner's Codex Hall" }
        };

        const beginnerCourseManifest = [
            { id: "1-1", level: "l1", title: "基本世界觀與 NPI 鏈條", desc: "打通硬體產品從研發端到代工製造廠的巨觀因果鏈與生命週期。", isNew: true },
            { id: "1-2", level: "l1", title: "工廠基礎與良率鐵律", desc: "主攻 SMT 焊接製程、直通率（FPY）雷區排除與線平衡調校。", isNew: true }
        ];

        let codexCourseEngineData = [];
        let activeCourseIdx = 0;
        let activePageIdx = 0;
        let examActive = false;
        let examCurrentQ = 0;
        let examScoreCount = 0;
        let activeSubMatrixIdx = 0;
        let activeFlowNodeIdx = 0; 

        // 全域動態字典引擎
        window.showTacticalDict = function(textPayload) {
            const box = document.getElementById('runtime-dict-box');
            if (box) {
                box.style.display = 'block';
                box.innerHTML = `💡 <strong>公會特工字典反饋：</strong><br>${textPayload}`;
            }
        };

        // 全域決策模擬引擎
        window.triggerSimDecision = function(isSuccess, feedbackText) {
            const box = document.getElementById('runtime-sandbox-fallout');
            if (box) {
                box.style.display = 'block';
                box.className = isSuccess ? 'sandbox-fallout-box success' : 'sandbox-fallout-box fail';
                box.innerHTML = feedbackText;
            }
        };

        window.onload = () => {
            routeController();
        };

        function routeController() {
            const currentLang = localStorage.getItem('tpm-lang-pref') || 'tw';
            const urlParams = new URLSearchParams(window.location.search);
            const contentPackId = urlParams.get('c');

            syncNavbarState(currentLang);

            if (!contentPackId) {
                document.getElementById('shell-sidebar-area').style.display = 'none';
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'none';
                document.getElementById('dashboard-menu-hall').style.display = 'block';
                
                const innerHeader = document.getElementById('cdx-page-header-zone');
                if (innerHeader) innerHeader.style.display = 'none';
                
                renderDashboardHallCards();
            } else {
                document.getElementById('dashboard-menu-hall').style.display = 'none';
                document.getElementById('shell-sidebar-area').style.display = 'flex';
                injectContentPackScript(contentPackId);
            }
        }

        function syncNavbarState(lang) {
            localStorage.setItem('tpm-lang-pref', lang);
            document.getElementById('global-nav-home-btn').innerText = globalUiTranslations[lang]["nav-home"];
            document.getElementById('global-inject-title').innerText = globalUiTranslations[lang]["title"];
            document.title = globalUiTranslations[lang]["title"];

            const twBtn = document.getElementById('global-btn-tw');
            const enBtn = document.getElementById('global-btn-en');
            if (twBtn && enBtn) {
                twBtn.classList.remove('active');
                enBtn.classList.remove('active');
                document.getElementById(`global-btn-${lang}`).classList.add('active');
            }

            const cachedName = localStorage.getItem('tpm-user-name');
            const cachedRank = localStorage.getItem('tpm-user-rank') || globalUiTranslations[lang]["rank-default"];
            const profileCard = document.getElementById('global-user-profile-card');
            if (profileCard) {
                if (cachedName) {
                    profileCard.innerHTML = `👤 ${cachedRank}：${cachedName}`;
                } else {
                    profileCard.innerText = globalUiTranslations[lang]["auth-locked"];
                }
            }
        }

        function executeLangSwitch(lang) {
            syncNavbarState(lang);
            routeController();
        }

        function renderDashboardHallCards() {
            const grid = document.getElementById('l1-cards-grid');
            grid.innerHTML = '';
            beginnerCourseManifest.forEach(course => {
                const targetNodeId = "L1-A" + course.id.split('-')[1];
                const savedGrade = localStorage.getItem(`talent-${targetNodeId}-grade`);
                let medalClass = "";
                if (savedGrade === "S") medalClass = "medal-gold";
                else if (savedGrade && savedGrade !== "Fail") medalClass = "medal-silver";

                grid.innerHTML += `
                    <div class="cdx-dashboard-card ${medalClass}" onclick="navigateToCourse('${course.id}')">
                        <h3 style="margin-top:0; font-size:1.2rem; font-weight:900;">L1-${course.id} ${course.title}</h3>
                        <p style="font-size:0.85rem; margin-top:10px; font-weight:600; line-height:1.5;">${course.desc}</p>
                    </div>
                `;
            });
        }

        function navigateToCourse(courseId) {
            window.location.search = `?c=${courseId}`;
        }

        function exitToDashboardMenu() {
            window.location.search = '';
        }

        function injectContentPackScript(packId) {
            const script = document.createElement('script');
            const isLocalFile = window.location.protocol === 'file:';
            script.src = isLocalFile ? `course_data_${packId}.js` : `course_data_${packId}.js?v=${Date.now()}`;
            
            script.onload = () => { 
                initEngine(); 
            };
            script.onerror = () => { 
                alert(`無法載入 course_data_${packId}.js 資料包。請確認檔案是否與網頁置於同一目錄夾內。`); 
                exitToDashboardMenu(); 
            };
            document.head.appendChild(script);
        }

        function initEngine() {
            renderLeftMenu();
            loadCourseState(activeCourseIdx, activePageIdx);
        }

        function renderLeftMenu() {
            const menu = document.getElementById('dynamic-course-menu');
            menu.innerHTML = '';
            codexCourseEngineData.forEach((course, idx) => {
                const savedGrade = localStorage.getItem(`talent-${course.courseId}-grade`);
                let medalClass = "";
                if (savedGrade === "S") medalClass = "medal-gold";
                else if (savedGrade && savedGrade !== "Fail") medalClass = "medal-silver";
                const activeClass = idx === activeCourseIdx ? "active" : "";
                menu.innerHTML += `<li class="chapter-tab ${activeClass} ${medalClass}" onclick="triggerCourseSelect(${idx})">${course.menuTitle}</li>`;
            });
        }

        function loadCourseState(cIdx, pIdx) {
            activeCourseIdx = cIdx;
            const course = codexCourseEngineData[cIdx];
            const dotsBar = document.getElementById('universal-dots-bar');
            dotsBar.innerHTML = '';
            
            const innerHeader = document.getElementById('cdx-page-header-zone');
            if (innerHeader) {
                innerHeader.style.display = 'block';
            }

            if (examActive) {
                document.getElementById('textbook-viewport').style.display = 'none';
                document.getElementById('exam-viewport').style.display = 'block';
                document.getElementById('universal-dots-bar').style.display = 'flex';
                course.subPages.forEach((_, sIdx) => {
                    dotsBar.innerHTML += `<div class="slider-dot" onclick="exitExamToPage(${sIdx})"></div>`;
                });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot active">⚔️</div>`;
                runExamEngine();
            } else {
                document.getElementById('textbook-viewport').style.display = 'flex';
                document.getElementById('exam-viewport').style.display = 'none';
                document.getElementById('universal-dots-bar').style.display = 'flex';
                activePageIdx = pIdx;
                const page = course.subPages[pIdx];

                document.getElementById('current-chapter-id').innerText = `SECTION ${pIdx + 1} / ${course.subPages.length}`;
                document.getElementById('current-chapter-name').innerText = page.title;

                // 👑 修正鎖定線：精確對齊 HTML 內宣告的 'cdx-sub-nav-wrapper' 節點，拔除 null 指標 👑
                const subNavWrapper = document.getElementById('cdx-sub-nav-wrapper');
                let targetedText = page.text;
                let targetedFlow = page.diagramFlowArray;

                if (page.subMatrixBranches) {
                    if (subNavWrapper) {
                        subNavWrapper.style.display = 'flex';
                        subNavWrapper.innerHTML = '';
                        page.subMatrixBranches.forEach((branch, bIdx) => {
                            const activeBranchClass = bIdx === activeSubMatrixIdx ? 'active' : '';
                            subNavWrapper.innerHTML += `<button class="sub-nav-btn ${activeBranchClass}" onclick="switchSubMatrixBranch(${bIdx})">${branch.branchLabel}</button>`;
                        });
                    }
                    targetedText = page.subMatrixBranches[activeSubMatrixIdx].text;
                    targetedFlow = page.subMatrixBranches[activeSubMatrixIdx].diagramFlowArray;
                } else {
                    if (subNavWrapper) {
                        subNavWrapper.style.display = 'none';
                    }
                    activeSubMatrixIdx = 0;
                }

                if (targetedFlow && targetedFlow[activeFlowNodeIdx] && targetedFlow[activeFlowNodeIdx].text) {
                    document.getElementById('lesson-content').innerHTML = targetedFlow[activeFlowNodeIdx].text;
                } else {
                    document.getElementById('lesson-content').innerHTML = targetedText;
                }

                const flowRenderer = document.getElementById('dynamic-flow-renderer-box');
                if (flowRenderer && targetedFlow) {
                    flowRenderer.style.display = 'flex';
                    flowRenderer.innerHTML = '';
                    targetedFlow.forEach((node, nIdx) => {
                        const isSelected = nIdx === activeFlowNodeIdx;
                        let nodeClass = 'flow-node-block';
                        
                        if (isSelected) {
                            nodeClass += ' active-node';
                        } else if (node.highlight) {
                            nodeClass += ' highlight';
                        }
                        
                        flowRenderer.innerHTML += `<div class="${nodeClass}" style="cursor:pointer;" onclick="switchFlowNode(${nIdx})">${node.name}</div>`;
                        if (nIdx < targetedFlow.length - 1) flowRenderer.innerHTML += `<div class="flow-arrow-split">➔</div>`;
                    });
                } else if (flowRenderer) {
                    flowRenderer.style.display = 'none';
                }

                course.subPages.forEach((_, sIdx) => {
                    const dotActive = sIdx === pIdx ? "active" : "";
                    dotsBar.innerHTML += `<div class="slider-dot ${dotActive}" onclick="triggerMainPageChange(${sIdx})"></div>`;
                });
                dotsBar.innerHTML += `<div class="slider-dot exam-dot" onclick="enterExamMode()">⚔️</div>`;
            }
        }

        function triggerMainPageChange(sIdx) {
            activeSubMatrixIdx = 0;
            activeFlowNodeIdx = 0; 
            loadCourseState(activeCourseIdx, sIdx);
        }

        function switchSubMatrixBranch(bIdx) {
            activeSubMatrixIdx = bIdx;
            activeFlowNodeIdx = 0; 
            loadCourseState(activeCourseIdx, activePageIdx);
        }

        function switchFlowNode(nIdx) {
            activeFlowNodeIdx = nIdx;
            loadCourseState(activeCourseIdx, activePageIdx);
        }

        function triggerCourseSelect(idx) { examActive = false; activeCourseIdx = idx; activePageIdx = 0; activeSubMatrixIdx = 0; activeFlowNodeIdx = 0; renderLeftMenu(); loadCourseState(idx, 0); }
        function exitExamToPage(pIdx) { examActive = false; activeSubMatrixIdx = 0; activeFlowNodeIdx = 0; loadCourseState(activeCourseIdx, pIdx); }
        function enterExamMode() { examActive = true; examCurrentQ = 0; examScoreCount = 0; loadCourseState(activeCourseIdx, 0); }
        
        function runExamEngine() {
            const course = codexCourseEngineData[activeCourseIdx];
            if (examCurrentQ >= course.examVault.length) { settleExamPayload(); return; }
            const qData = course.examVault[examCurrentQ];
            document.getElementById('current-chapter-id').innerText = "EXAM MODE";
            document.getElementById('current-chapter-name').innerText = "L1 階段終極大考";
            document.getElementById('exam-counter').innerText = `第 ${examCurrentQ + 1} / ${course.examVault.length} 題`;

            const progressPct = (examCurrentQ / course.examVault.length) * 100;
            document.getElementById('exam-progress').style.width = `${progressPct}%`;
            document.getElementById('exam-question-text').innerText = `${examCurrentQ + 1}. ${qData.q}`;

            const container = document.getElementById('exam-options-container');
            container.innerHTML = '';
            qData.o.forEach((opt, idx) => {
                container.innerHTML += `<div class="option-card" onclick="submitAnswer(${idx})">${opt}</div>`;
            });
        }

        function submitAnswer(idx) {
            const course = codexCourseEngineData[activeCourseIdx];
            if (idx === course.examVault[examCurrentQ].a) { examScoreCount++; }
            examCurrentQ++;
            runExamEngine();
        }

        function settleExamPayload() {
            examActive = false;
            const course = codexCourseEngineData[activeCourseIdx];
            const finalPct = (examScoreCount / course.examVault.length) * 100;
            let grade = "Fail";
            if (finalPct === 100) grade = "S";
            else if (finalPct >= 90) grade = "A";
            else if (finalPct >= 80) grade = "B";
            else if (finalPct >= 70) grade = "C";
            else if (finalPct >= 60) grade = "D";

            if (grade === "Fail") {
                alert(`💥【考核失敗】\n判定為 Fail！通行證已鎖定，強退重考！`);
                localStorage.setItem(`codex-${course.courseId}-clear`, 'false');
                localStorage.removeItem(`talent-${course.courseId}-grade`);
                triggerCourseSelect(activeCourseIdx);
            } else {
                alert(`🏆【考核通過】戰力位階核定為：【 ${grade} 】級！`);
                localStorage.setItem(`codex-${course.courseId}-clear`, 'true');
                localStorage.setItem(`talent-${course.courseId}-grade`, grade);
                localStorage.setItem(`talent-${course.courseId}-date`, new Date().toLocaleDateString());
                triggerCourseSelect(activeCourseIdx);
            }
        }
    </script>
</body>
</html>
