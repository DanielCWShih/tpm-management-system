<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公會修煉星盤 | System TPM Talent Tree (0527-V2.0)</title>
    <style>
        :root {
            --bg-color: #FEF9E7; 
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            
            --color-locked: #94A3B8;      
            --color-available: #3B82F6;   
            --color-completed: #F59E0B;   
            --color-fail: #DC2626; /* 血紅色，FAIL與封印使用 */
        }
        
        * { 
            box-sizing: border-box; 
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif; 
            color: var(--text-main); 
        }
        
        body { 
            background-color: var(--bg-color); 
            background-image: radial-gradient(var(--sidebar-cream) 2px, transparent 2px);
            background-size: 32px 32px;
            margin: 0; padding: 40px;
            width: 100vw; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        .tree-container { width: 100%; display: flex; flex-direction: column; gap: 35px; }

        /* 頂部戰術控制列 */
        .tactical-header {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--border-heavy); padding-bottom: 20px;
        }

        .header-controls { display: flex; align-items: center; gap: 15px; }

        /* 剛性隔離切換按鈕，寬度焊死在 50px，確保 0 像素佈局移位 */
        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.1s;
        }

        .lang-btn-core.active {
            background: var(--text-main);
            color: white;
        }

        /* 身分認證卡剛性化，防換行破版 */
        .auth-panel {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            padding: 10px 20px; border-radius: var(--radius-sm); font-size: 0.85rem;
            font-weight: 900; box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        /* 導航 Home 按鈕樣式對齊 */
        .back-btn {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            padding: 10px 20px; border-radius: var(--radius-sm); cursor: pointer;
            font-weight: 900; text-decoration: none; box-shadow: 3px 3px 0px var(--border-heavy);
        }
        .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }

        /* WoW-Style 階層分頁按鈕控制列 */
        .tree-tier-nav {
            display: flex; gap: 15px; width: 100%; margin-top: 10px;
        }

        .tier-tab-btn {
            background: var(--card-white); border: 3px solid var(--border-heavy);
            padding: 12px 24px; border-radius: var(--radius-sm); font-weight: 900;
            font-size: 1rem; cursor: pointer; box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s;
        }
        .tier-tab-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }
        .tier-tab-btn.active {
            background: var(--text-main); color: white; transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--border-heavy);
        }

        /* 天賦樹主星盤畫布 */
        .isekai-tree-map {
            width: 100%; background: var(--card-white); border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm); padding: 60px 40px; box-shadow: var(--shadow-tactical);
            display: none; flex-direction: column; align-items: center; position: relative;
        }
        .isekai-tree-map.active { display: flex; }

        /* 天賦樹垂直階層行 */
        .tree-tier-row {
            display: flex; justify-content: center; align-items: center; gap: 70px; width: 100%;
            position: relative; margin-bottom: 70px;
        }
        .tree-tier-row:last-child { margin-bottom: 0; }

        /* 戰術連線路徑 */
        .tree-tier-row::after {
            content: ''; position: absolute; bottom: -70px; left: 50%; width: 4px; height: 70px;
            background: var(--border-heavy); z-index: 1;
        }
        .tree-tier-row:last-child::after { display: none; }

        /* 雙重鋼鐵同心圓技能節點 */
        .talent-node {
            width: 150px; height: 150px; background: var(--card-white); 
            border: 4px double var(--color-locked); 
            border-radius: 50%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; position: relative;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center;
            padding: 15px; box-shadow: 4px 4px 0px var(--color-locked); z-index: 5;
        }

        .talent-node.locked { background: #F1F5F9; border-color: var(--color-locked); cursor: not-allowed; }
        .talent-node.locked * { color: #64748B; }

        .talent-node.available { 
            border: 4px solid var(--color-available); 
            background: #EFF6FF; box-shadow: 4px 4px 0px var(--color-available); 
        }
        .talent-node.available * { color: #1D4ED8; }
        .talent-node.available:hover { transform: translateY(-4px); box-shadow: 6px 6px 0px var(--color-available); }

        .talent-node.completed { 
            border: 5px double var(--color-completed); 
            background: #FFFDF2; box-shadow: 4px 4px 0px var(--color-completed); 
        }
        .talent-node.completed * { color: #B45309; }
        .talent-node.completed:hover { transform: translateY(-4px); box-shadow: 6px 6px 0px var(--color-completed); }

        .node-code { font-family: monospace; font-size: 0.8rem; font-weight: 900; opacity: 0.8; }
        .node-name { font-size: 0.8rem; font-weight: 900; margin-top: 5px; line-height: 1.4; }

        /* 總覽摘要公文彈窗 ── 👑 V2.0 剛性認證蓋章核心結構 👑 */
        .dungeon-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px;
        }

        .modal-content {
            background: var(--card-white); border: 3px solid var(--border-heavy); border-radius: var(--radius-sm);
            width: 100%; max-width: 650px; box-shadow: 10px 10px 0px var(--border-heavy);
            display: flex; flex-direction: column; overflow: visible; /* 👑 核心：必須設為可見，讓右上蓋章突出視窗 */
            position: relative; animation: modalSlide 0.15s ease-out;
        }

        @keyframes modalSlide { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header { 
            background: var(--sidebar-cream); padding: 20px 30px; 
            border-bottom: 3px solid var(--border-heavy); display: flex; justify-content: space-between; align-items: center; 
        }

        .modal-body { padding: 30px; display: flex; flex-direction: column; gap: 25px; overflow-y: auto; max-height: 70vh; }

        /* 剛性總覽摘要區 ── 退化玄幻詞 */
        .lexicon-section-block {
            border: 2px solid var(--border-heavy); border-radius: var(--radius-sm);
            padding: 20px; background: #FAFAFA;
        }
        .lexicon-block-label {
            font-size: 0.8rem; font-weight: 900; color: var(--text-secondary);
            font-family: monospace; text-transform: uppercase; border-bottom: 1px dashed var(--border-heavy);
            padding-bottom: 5px; margin-bottom: 10px;
        }
        .lexicon-block-text { font-size: 1rem; font-weight: 600; line-height: 1.7; white-space: pre-line; }

        /* 👑 需求重構：右上角巨大突出視窗的剛性認證印章 (Grade Sticker) 👑 */
        .talent-grade-sticker-case {
            position: absolute;
            top: -25px;   /* 突出右上邊緣 */
            right: -25px; /* 突出右上邊緣 */
            display: none; /* 預設不顯示，由JS動態點亮 */
            z-index: 3000;
            animation: stickerPasted 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes stickerPasted {
            from { transform: scale(0) rotate(15deg); opacity: 0; }
            to { transform: scale(1) rotate(-8deg); opacity: 1; } /* 稍微斜貼增加硬核感 */
        }

        /* 聖遺物精髓文獻與跳轉按鈕樣式對齊 */
        .teleport-gate-btn {
            background: var(--active-yellow); border: 3px solid var(--border-heavy);
            padding: 16px; border-radius: var(--radius-sm); width: 100%;
            font-size: 1.1rem; font-weight: 900; text-align: center; cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-heavy); text-decoration: none;
            display: block; transition: all 0.1s;
        }
        .teleport-gate-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border-heavy); }
        
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; font-weight: 900; }

        /* =================👑 0527-V2.0 剛性認證蓋章圖片 CSS 引擎區域 👑================= */
        /* 您可以將以下的 CSS 內容替換為您的 `.png` 或 `.jpg` 圖片文件！ */
        /* 將 `background-image: url('您的圖片地址')` 那一行的註解解除即可。 */
        
        .talent-grade-stamp {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Impact', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            transform: rotate(-8deg); /* 硬核斜貼 */
            
            /* 如果您嫌棄代碼設計，想用自己的 SABCD 圖片，請解除以下的註解，並上傳圖片到對應目錄 */
            /* background-size: cover; */
            /* background-position: center; */
            /* color: transparent !important; */
        }

        /* 👑 黃金認證蓋章 ── 預設代碼設計 */
        .case-S .talent-grade-stamp {
            background-color: #FFFDF2;
            border: 6px double var(--color-completed);
            color: var(--color-completed);
            box-shadow: 5px 5px 0px rgba(180, 83, 9, 0.15), inset 0 0 15px rgba(245, 158, 11, 0.2);
            /* 如果您嫌醜，想用自己設計的 S 級 `.png` 圖片，請解除下一行的註解，並註解掉上面的所有 background-color, border 等屬性 */
            /* background-image: url('images/grade-S-user.png'); */
        }

        /* 👑 FAIL 與封印蓋章 ── 預設代碼設計 */
        .case-FAIL .talent-grade-stamp {
            background-color: #FEF2F2;
            border: 6px dashed var(--color-fail); /* 破碎、裂痕 dashed */
            color: var(--color-fail);
            box-shadow: 5px 5px 0px rgba(185, 28, 28, 0.15), inset 0 0 15px rgba(220, 38, 37, 0.2);
            font-family: monospace; /* FAIL 用硬派等寬 */
            font-size: 1.4rem;
            letter-spacing: -1px;
            /* 如果您嫌醜，想用自己設計的 FAIL `.png` 圖片，請解除下一行的註解 */
            /* background-image: url('images/grade-FAIL-user.png'); */
        }
        /* 您可以依照此邏輯在網頁下方自行設計 A / B / C / D 級的代碼顏色 */
        /* ======================================================================== */
    </style>
</head>
<body>

    <div class="tree-container">
        <div class="tactical-header">
            <div>
                <span style="font-family: monospace; font-weight: 900; color: var(--text-secondary);">SYS.ATLAS_TREE V2.0 // Grade Sticker REV.1</span>
                <h1 style="margin: 5px 0 0 0; font-size: 2.2rem;" data-i18n="tree-main-title">公會技能星盤天賦樹</h1>
            </div>
            
            <div class="header-controls">
                <div class="lang-switcher-wrapper">
                    <button class="lang-btn-core active" id="btn-tw" onclick="setLang('tw')">TW</button>
                    <button class="lang-btn-core" id="btn-en" onclick="setLang('en')">EN</button>
                </div>
                
                <div id="user-profile" class="auth-panel" data-i18n="auth-unlocked">🔒 未讀取公會憑證</div>
                
                <a href="index.html" class="back-btn" id="nav-home-text">首頁</a>
            </div>
        </div>

        <div class="tree-tier-nav">
            <button class="tier-tab-btn active" id="tab-l1-btn" onclick="switchTreeTab('tab-l1')" data-i18n="tab-l1">【 初心者階層 L1 - 基礎通識 】</button>
            <button class="tier-tab-btn" id="tab-l2-btn" onclick="switchTreeTab('tab-l2')" data-i18n="tab-l2">【 冒險者階層 L2 - 進階通識 】</button>
            <button class="tier-tab-btn" id="tab-l3-btn" onclick="switchTreeTab('tab-l3')" data-i18n="tab-l3">【 傳奇專科 L3 - 高階領域 】</button>
        </div>

        <div class="isekai-tree-map active" id="tab-l1">
            <div class="tree-tier-row">
                <div class="talent-node available" id="node-L1-A1" onclick="openTalentSummary('L1-A1')">
                    <div class="node-code">L1-A1 (必修)</div>
                    <div class="node-name">基本世界觀<br>Cosmos Matrix</div>
                </div>
            </div>
        </div>

        <div class="isekai-tree-map" id="tab-l2">
            <div class="tree-tier-row">
                <div class="talent-node locked" id="node-L2-W1" onclick="openTalentSummary('L2-W1')">
                    <div class="node-code">L2-W1</div>
                    <div class="node-name">防水防護結界<br>Ingress Protection</div>
                </div>
            </div>
        </div>

        <div class="isekai-tree-map" id="tab-l3">
            <div class="tree-tier-row">
                <div class="talent-node locked" id="node-L3-N1" onclick="openTalentSummary('L3-N1')">
                    <div class="node-code">L3-N1</div>
                    <div class="node-name">跨功能談判術<br>XFN Negotiation</div>
                </div>
            </div>
        </div>
    </div>

    <div id="talent-summary-modal" class="dungeon-modal">
        <div class="modal-content">
            
            <div id="grade-sticker-wrapper" class="talent-grade-sticker-case">
                <div class="talent-grade-stamp" id="grade-stamp-core">S</div>
            </div>

            <div class="modal-header">
                <div>
                    <span id="modal-node-code" style="font-family: monospace; font-weight: 900; color: var(--text-secondary);">L1-A1</span>
                    <h2 id="modal-node-title" style="margin: 5px 0 0 0; font-size: 1.5rem; font-weight: 900;">課題總覽</h2>
                </div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div>
                    <h3 style="border-left: 5px solid var(--border-heavy); padding-left: 10px; font-size: 1.05rem; margin-top: 0;" data-i18n="modal-lesson-title">📜 聖遺物卷軸摘要 (High-Level Summary)</h3>
                    <p id="modal-node-summary" style="line-height: 1.7; font-weight: 600; white-space: pre-line; margin-bottom: 0;">載入中...</p>
                </div>
                
                <div id="modal-node-date" style="font-size: 0.85rem; font-weight: 700; color: #16A34A; padding-left: 5px;"></div>

                <a id="modal-teleport-link" href="#" class="teleport-gate-btn" data-i18n="modal-gate-link">⚡ 進入該課題修煉場 (跳轉手冊/寶典)</a>
            </div>
        </div>
    </div>

    <script>
        // 靜態雙語數據字典
        const translations = {
            tw: { "tree-main-title": "公會技能星盤天賦樹", "tab-l1": "【 初心者階層 L1 - 基礎通識 】", "tab-l2": "【 冒險者階層 L2 - 進階通識 】", "tab-l3": "【 傳奇專科 L3 - 高階領域 】", "auth-unlocked": "冒險者認證成功", "modal-lesson-title": "📜 聖遺物卷軸摘要 (High-Level Summary)", "modal-highest-grade": "公會位階成就考核 (HIGHEST GRADE)", "modal-gate-link": "⚡ 進入該課題修煉場 (跳轉手冊/寶典)", "nav-home": "首頁" },
            en: { "tree-main-title": "Adventurer Talent Tree", "tab-l1": "[ Level 1 Codex: Foundation ]", "tab-l2": "[ Level 2 Handbook: Modules ]", "tab-l3": "[ Level 3 Staging: Specialized ]", "auth-unlocked": "Adventurer Authenticated", "modal-lesson-title": "📜 Relic Scroll Summary (High-Level)", "modal-highest-grade": "Guild Highest Grade Assessment", "modal-gate-link": "⚡ Teleport to Training Grounds (Go to Handbook/Codex)", "nav-home": "Home" }
        };

        // 數據庫去玄幻化修訂
        const talentMetadata = {
            "L1-A1": { summary: "拆解硬體新產品導入（NPI）底層運行的巨觀因果。釐清天界客戶（眾神殿 (ID 設計端)）設計藍圖、供應商（幻界物料 (上游零件)）元件物料、以及物質深淵代工廠（機械熔爐 (代工廠)）複製實體化製程防線。System TPM 將在此扮演跨功能團隊仲裁使者。", targetUrl: "beginner_codex.html" },
            "L2-W1": { summary: "深入功能單位技術通識。攻克防水規格（IP67/IPX8）在結構熔爐中精準計算。剖析點膠製程（Dispensing）、防水橡膠圈（O-Ring）壓縮比對比、與氣密測試DOE驗證（Leak Rate < 1.0 sccm）防禦機制。", targetUrl: "handbook.html" },
            "L3-N1": { summary: "傳奇專科，解鎖跨功能（XFN）協作仲裁學。當工業設計ID美學、結構ME空間與射頻 RF 天線大會戰時，主導決策代價矩陣（Trade-off Matrix），逼出黃金妥協工程點。", targetUrl: "promotion_trial.html" }
        };

        // 階層分頁控制
        function switchTreeTab(tabId) {
            document.querySelectorAll('.tier-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.isekai-tree-map').forEach(map => map.classList.remove('active'));
            document.getElementById(`${tabId}-btn`).classList.add('active');
            const targetMap = document.getElementById(tabId);
            if (targetMap) targetMap.classList.add('active');
        }

        // 開啟天賦摘要面板 ── 👑 V2.0 剛性認證蓋章點亮引擎 👑
        function openTalentSummary(nodeId) {
            const nodeEl = document.getElementById(`node-${nodeId}`);
            if (nodeEl.classList.contains('locked')) { alert("【系統提示】天賦封印尚未解除！"); return; }
            const data = talentMetadata[nodeId];
            if (!data) { alert("尚未開通。"); return; }

            document.getElementById('modal-node-code').innerText = nodeId;
            const nodeNameText = nodeEl.querySelector('.node-name').innerHTML.replace('<br>', ' ');
            document.getElementById('modal-node-title').innerHTML = nodeNameText;
            document.getElementById('modal-node-summary').innerText = data.summary;

            // 👑 0527-V2.0 SABCD/Fail 認證蓋章核心動態渲染引擎 👑
            const savedGrade = localStorage.getItem(`talent-${nodeId}-grade`); // 例如從 beginner_codex.html 的 20題大考 Fail 拿來的 Fail 成績
            const savedDate = localStorage.getItem(`talent-${nodeId}-date`);
            
            const stickerWrapper = document.getElementById('grade-sticker-wrapper');
            const stampCore = document.getElementById('grade-stamp-core');
            const dateEl = document.getElementById('modal-node-date');

            if (savedGrade || nodeEl.classList.contains('completed')) {
                // 如果快取有成績（Fail或S），優先呈現 成績，否則設為 預設 S 級
                const finalGrade = savedGrade || "S"; 
                const finalDate = savedDate || new Date().toLocaleDateString();
                
                // 點亮巨大的右上印章外殼 (Case S 或 Case FAIL)
                stickerWrapper.style.display = 'block';
                stickerWrapper.className = `talent-grade-sticker-case case-${finalGrade}`;
                stampCore.innerText = finalGrade;
                
                // 日期更新
                dateEl.innerText = `完成日期：${finalDate}`;
                dateEl.style.color = (finalGrade === 'FAIL') ? "var(--color-fail)" : "#16A34A";
            } else {
                // 未過關狀態，完全移除右上蓋章
                stickerWrapper.style.display = 'none';
                stickerWrapper.className = "talent-grade-sticker-case";
                stampCore.innerText = "";
                dateEl.innerText = "";
            }

            document.getElementById('modal-teleport-link').href = data.targetUrl;
            document.getElementById('talent-summary-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('talent-summary-modal').style.display = 'none';
        }

        // 剛性語系切換引擎
        function setLang(lang) {
            document.querySelectorAll('.lang-btn-core').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            // 靜態翻譯分發
            document.querySelectorAll('[data-i18n]').forEach(el => { 
                const key = el.getAttribute('data-i18n'); 
                if(translations[lang][key]) el.innerText = translations[lang][key]; 
            });

            // Home鍵同步
            document.getElementById('nav-home-text').innerText = translations[lang]["nav-home"];

            // 身分卡同步
            const cachedName = localStorage.getItem('tpm-user-name');
            const cachedRank = localStorage.getItem('tpm-user-rank') || "冒險者";
            let displayRank = (lang === 'tw') ? cachedRank : "Adventurer";
            if (cachedName) {
                document.getElementById('user-profile').innerHTML = `👤 ${displayRank}：${cachedName}`;
            }

            localStorage.setItem('tpm-lang-pref', lang);
        }

        window.onload = () => {
            setLang(localStorage.getItem('tpm-lang-pref') || 'tw'); switchTreeTab('tab-l1'); 
        };
    </script>
</body>
</html>
