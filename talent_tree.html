<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就殿堂 | System TPM Achievement Center</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 4px 4px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-stripe-light: #FDF2D0;
            
            /* 傳奇卡牌底色 */
            --rarity-common: #F1F5F9;
            --rarity-rare: #DBEAFE;
            --rarity-epic: #F3E8FF;
            --rarity-legendary: #FEF3C7;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        /* 頂部全域控制導航列（100% 對齊寶典大廳） */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: 8px;
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        /* 主工作工作主框架 */
        .workspace-container {
            width: 100vw;
            height: calc(100vh - 85px);
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂層階層切換分頁標籤 */
        .achievement-tabs-deck {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .tab-trigger-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.92rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s ease-out;
            color: var(--text-main);
        }

        .tab-trigger-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .tab-trigger-btn.active-tab {
            background: var(--text-main) !important;
            color: #FFFFFF !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        /* 大存檔閱讀畫布區：改為縱向自適應滾動，容納上下分流專區 */
        .achievement-scroll-viewport {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            width: 100%;
        }

        /* 剛性區域標題 */
        .matrix-section-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-main);
            margin: 20px 0 12px 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 5px solid var(--border-heavy);
            padding-left: 10px;
        }

        /* 👑 鋼鐵 8 欄網格矩陣 👑 */
        .achievement-cards-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr); /* 剛性橫向平分 8 欄 */
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        /* 3D 卡牌微縮防身外殼 */
        .card-flip-stage {
            height: 175px; /* 降低高度以適應微縮寬度，達成黃金比例 */
            perspective: 1000px;
        }

        .card-flip-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-flip-stage.unlocked .card-flip-inner {
            transform: rotateY(180deg);
        }

        .card-face-front, .card-face-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 12px; /* 緊縮內襯 Padding，釋放空間 */
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-tactical);
        }

        /* 未取得面（背面） */
        .card-face-back {
            background-color: var(--card-white);
            background-image: linear-gradient(
                45deg, 
                var(--color-stripe-light) 25%, 
                transparent 25%, 
                transparent 50%, 
                var(--color-stripe-light) 50%, 
                var(--color-stripe-light) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 16px 16px;
            justify-content: center;
            align-items: center;
            transform: rotateY(0deg);
            z-index: 2;
        }

        .lock-icon-frame {
            font-size: 1.6rem;
            margin-bottom: 8px;
            filter: grayscale(100%);
            user-select: none;
        }

        .lock-condition-hint {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--text-secondary);
            background: var(--card-white);
            border: 1.5px solid var(--border-heavy);
            padding: 2px 6px;
            border-radius: 4px;
            text-align: center;
            width: 100%;
            line-height: 1.2;
            word-break: break-all;
        }

        /* 已取得面（正面） */
        .card-face-front {
            justify-content: flex-start;
            transform: rotateY(180deg);
        }

        .ach-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .ach-badge-icon {
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.04);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--border-heavy);
        }

        /* 👑 替代原 Common 標籤的年月日時間戳記 👑 */
        .ach-date-tag {
            font-size: 0.62rem;
            font-weight: 900;
            font-family: monospace;
            color: var(--text-secondary);
            letter-spacing: -0.2px;
        }

        .ach-card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .ach-card-title {
            font-size: 0.88rem;
            font-weight: 900;
            margin: 0 0 4px 0;
            letter-spacing: 0px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ach-card-desc {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-secondary);
            line-height: 1.3;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 5; /* 限制敘述行數，嚴防超出卡片底部 */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;">成就</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：Daniel Shih</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active">TW</button>
                <button class="lang-btn-core">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回總部</a>
        </div>
    </div>

    <div class="workspace-container">
        <div class="achievement-tabs-deck">
            <button class="tab-trigger-btn active-tab" id="tab-lvl-1" onclick="switchAchievementLevel(1)">【 初心者階層 L1 - 基礎通識 】</button>
            <button class="tab-trigger-btn" id="tab-lvl-2" onclick="switchAchievementLevel(2)">【 冒險者階層 L2 - 進階通識 】</button>
            <button class="tab-trigger-btn" id="tab-lvl-3" onclick="switchAchievementLevel(3)">【 傳奇專科 L3 - 高階領域 】</button>
        </div>

        <div class="achievement-scroll-viewport">
            <div id="achievements-canvas-box"></div>
        </div>
    </div>

    <script>
        // 全量高定成就卡牌原裝資料庫
        const globalAchievementRegistry = [
            // ─── LEVEL 1 成就群組 ───
            {
                levelNum: 1,
                id: "ACH-L1-001",
                badge: "🗺️",
                title: "初試啼聲",
                desc: "成功參透硬體世界的「三方賽局」，順利點亮 1-1 常規必修通識。",
                conditionHint: "通過單元 1-1 大考",
                checkKey: "codex-L1-A1-clear", 
                color: "var(--rarity-common)"
            },
            {
                levelNum: 1,
                id: "ACH-L1-002",
                badge: "⏳",
                title: "生命週期掌控者",
                desc: "掌握硬體生命週期與 NPI 核心交付節點，擊碎排產延遲呆料。",
                conditionHint: "通過單元 1-2 大考",
                checkKey: "codex-L1-A2-clear",
                color: "var(--rarity-rare)"
            },
            {
                levelNum: 1,
                id: "ACH-L1-003",
                badge: "🏭",
                title: "現地開線大師",
                desc: "精確走位工廠地理，摸清 4M1E 線體通識，具備駐廠開線通聯威能。",
                conditionHint: "通過單元 1-3 大考",
                checkKey: "codex-L1-A3-clear",
                color: "var(--rarity-rare)"
            },
            {
                levelNum: 1,
                id: "ACH-L1-004",
                badge: "🏆",
                title: "基礎通識大滿貫",
                desc: "徹底速通 LEVEL 1 所有基礎學分。恭喜你，你已經不是任人宰割的菜鳥了！",
                conditionHint: "LEVEL 1 全單元通關",
                checkKey: "SPECIAL-L1-ALL", 
                color: "var(--rarity-epic)"
            },
            
            // ─── LEVEL 2 成就群組 ───
            {
                levelNum: 2,
                id: "ACH-L2-001",
                badge: "🔍",
                title: "光學AA主導者",
                desc: "深入多軸自動化補正機台，完美解鎖高階相機 AA 主動對位與膠體校正技術。",
                conditionHint: "通過單元 2-1 品質試煉",
                checkKey: "codex-L2-A1-clear",
                color: "var(--rarity-epic)"
            },
            {
                levelNum: 2,
                id: "ACH-L2-002",
                badge: "💧",
                title: "Worst-Case 破局者",
                desc: "在結構防水設計中強行導入 Worst-Case 模擬，徹底封死線體形變流產雷區。",
                conditionHint: "通過單元 2-2 結構試煉",
                checkKey: "codex-L2-A2-clear",
                color: "var(--rarity-legendary)"
            },

            // ─── LEVEL 3 成就群組 ───
            {
                levelNum: 3,
                id: "ACH-L3-001",
                badge: "👑",
                title: "不朽的 System TPM",
                desc: "跨功能團隊修煉完成，成功統領多方賽局，具備指揮大型複雜硬體量產之不朽威望。",
                conditionHint: "完成終局全專科試煉",
                checkKey: "codex-L3-A1-clear",
                color: "var(--rarity-legendary)"
            }
        ];

        let currentSelectedLevelNum = 1;

        window.onload = () => {
            renderAchievementCardsDeck();
        };

        // 👑 滿血版：動態分流與 8 欄位 3D 渲染核心引擎 👑
        function renderAchievementCardsDeck() {
            const containerBox = document.getElementById('achievements-canvas-box');
            if (!containerBox) return;
            containerBox.innerHTML = '';

            // 1. 篩選當前分頁階層
            const filteredAch = globalAchievementRegistry.filter(ach => ach.levelNum === currentSelectedLevelNum);

            const unlockedStack = [];
            const lockedStack = [];

            // 2. 身分與條件判定分流
            filteredAch.forEach(ach => {
                let isUnlocked = false;
                if (ach.checkKey === "SPECIAL-L1-ALL") {
                    isUnlocked = (localStorage.getItem("codex-L1-A1-clear") === "true" && 
                                  localStorage.getItem("codex-L1-A2-clear") === "true" && 
                                  localStorage.getItem("codex-L1-A3-clear") === "true");
                } else {
                    isUnlocked = (localStorage.getItem(ach.checkKey) === "true");
                }

                if (isUnlocked) {
                    unlockedStack.push(ach);
                } else {
                    lockedStack.push(ach);
                }
            });

            // ─── 👑 區塊 A：已取得成就專區（置頂） ───
            if (unlockedStack.length > 0) {
                const titleNode = document.createElement('div');
                titleNode.className = 'matrix-section-title';
                titleNode.innerHTML = `🏆 已取得成就 (${unlockedStack.length})`;
                containerBox.appendChild(titleNode);

                const gridNode = document.createElement('div');
                gridNode.className = 'achievement-cards-grid';
                
                unlockedStack.forEach(ach => {
                    // 🔒 剛性時序鎖：若查無解鎖日期，則現場抓取當前時間戳記並固化存檔
                    const dateStorageKey = ach.checkKey + "-unlocked-date-stamp";
                    let savedDateStr = localStorage.getItem(dateStorageKey);
                    
                    if (!savedDateStr) {
                        const now = new Date();
                        savedDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                        localStorage.setItem(dateStorageKey, savedDateStr);
                    }

                    gridNode.innerHTML += compileCardTemplate(ach, true, savedDateStr);
                });
                containerBox.appendChild(gridNode);
            }

            // ─── 👑 區塊 B：未取得成就專區（置底） ───
            if (lockedStack.length > 0) {
                const titleNode = document.createElement('div');
                titleNode.className = 'matrix-section-title';
                titleNode.innerHTML = `🔒 未取得成就 (${lockedStack.length})`;
                containerBox.appendChild(titleNode);

                const gridNode = document.createElement('div');
                gridNode.className = 'achievement-cards-grid';
                
                lockedStack.forEach(ach => {
                    gridNode.innerHTML += compileCardTemplate(ach, false, "");
                });
                containerBox.appendChild(gridNode);
            }
        }

        // 👑 3D 微縮卡牌網格 HTML 模板產生器
        function compileCardTemplate(ach, isUnlocked, dateStr) {
            return `
                <div class="card-flip-stage ${isUnlocked ? 'unlocked' : ''}">
                    <div class="card-flip-inner">
                        <div class="card-face-back">
                            <div class="lock-icon-frame">🔒</div>
                            <div class="lock-condition-hint">${ach.conditionHint}</div>
                        </div>
                        <div class="card-face-front" style="background-color: ${ach.color};">
                            <div class="ach-card-header">
                                <div class="ach-badge-icon">${ach.badge}</div>
                                <div class="ach-date-tag">${dateStr}</div>
                            </div>
                            <div class="ach-card-body">
                                <h4 class="ach-card-title">${ach.title}</h4>
                                <p class="ach-card-desc">${ach.desc}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 階層 Tab 切換分流器
        function switchAchievementLevel(lvlNum) {
            currentSelectedLevelNum = lvlNum;
            document.querySelectorAll('.tab-trigger-btn').forEach(btn => {
                btn.classList.remove('active-tab');
            });
            document.getElementById(`tab-lvl-${lvlNum}`).classList.add('active-tab');
            renderAchievementCardsDeck();
        }
    </script>
</body>
</html>
