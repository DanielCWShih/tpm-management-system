<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就殿堂 | System TPM Achievement Center</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 12px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-stripe-light: #FDF2D0;
            
            /* 成就專屬傳奇色系 */
            --rarity-common: #F1F5F9;
            --rarity-rare: #DBEAFE;
            --rarity-epic: #F3E8FF;
            --rarity-legendary: #FEF3C7;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        /* 頂部全域控制導航列（100% 對齊寶典大廳） */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: 8px;
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        /* 主工作工作主框架 */
        .workspace-container {
            width: 100vw;
            height: calc(100vh - 85px);
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂層階層切換分頁標籤（對齊截圖按鈕外觀） */
        .achievement-tabs-deck {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-shrink: 0;
        }

        .tab-trigger-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 0.92rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s ease-out;
            color: var(--text-main);
        }

        .tab-trigger-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .tab-trigger-btn.active-tab {
            background: var(--text-main) !important;
            color: #FFFFFF !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        /* 👑 3D 卡牌看盤大畫布 👑 */
        .achievement-cards-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            overflow-y: auto;
            padding: 5px 5px 30px 5px;
            width: 100%;
        }

        /* 3D 翻轉核心容器 */
        .card-flip-stage {
            height: 220px;
            perspective: 1000px; /* 啟動 3D 空間透視度 */
        }

        .card-flip-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d; /* 強制子組件維持 3D 空間 */
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 當解鎖狀態機啟動時，卡牌無感旋轉 180 度翻開正面 */
        .card-flip-stage.unlocked .card-flip-inner {
            transform: rotateY(180deg);
        }

        /* 正反面共有鋼鐵外殼 */
        .card-face-front, .card-face-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 翻到背面時剛性隱藏對方 */
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-tactical);
        }

        /* 🔴 1. 鎖定面（背面 Back Face）：呈現未解鎖神祕狀態 */
        .card-face-back {
            background-color: var(--card-white);
            background-image: linear-gradient(
                45deg, 
                var(--color-stripe-light) 25%, 
                transparent 25%, 
                transparent 50%, 
                var(--color-stripe-light) 50%, 
                var(--color-stripe-light) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 20px 20px;
            justify-content: center;
            align-items: center;
            transform: rotateY(0deg); /* 預設朝上 */
            z-index: 2;
        }

        .lock-icon-frame {
            font-size: 2.2rem;
            margin-bottom: 12px;
            filter: grayscale(100%);
            user-select: none;
        }

        .lock-condition-hint {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-secondary);
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 4px 10px;
            border-radius: 6px;
            text-align: center;
            max-width: 90%;
        }

        /* 🟢 2. 解鎖面（正面 Front Face）：露出尊榮高定配色 */
        .card-face-front {
            justify-content: space-between;
            transform: rotateY(180deg); /* 剛性預先隱藏在 3D 背面 */
        }

        .ach-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .ach-badge-icon {
            font-size: 1.8rem;
            background: rgba(0, 0, 0, 0.05);
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border-heavy);
        }

        .ach-rarity-tag {
            font-size: 0.68rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 2px solid var(--border-heavy);
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--card-white);
        }

        .ach-card-body {
            margin-top: 10px;
            flex: 1;
        }

        .ach-card-title {
            font-size: 1.15rem;
            font-weight: 900;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }

        .ach-card-desc {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-secondary);
            line-height: 1.4;
            margin: 0;
        }

        .ach-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 2px dashed rgba(0, 0, 0, 0.1);
            padding-top: 8px;
        }

        .ach-points-label {
            font-size: 0.72rem;
            font-weight: 900;
            font-family: monospace;
            color: #B45309;
        }

        .ach-clear-badge {
            font-size: 0.72rem;
            font-weight: 900;
            color: #FFFFFF;
            background: var(--color-completed);
            border: 2px solid var(--border-heavy);
            padding: 1px 6px;
            border-radius: 4px;
            box-shadow: 1px 1px 0px var(--border-heavy);
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;">成就殿堂</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：Daniel Shih</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active">TW</button>
                <button class="lang-btn-core">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回總部</a>
        </div>
    </div>

    <div class="workspace-container">
        <div class="achievement-tabs-deck">
            <button class="tab-trigger-btn active-tab" id="tab-lvl-1" onclick="switchAchievementLevel(1)">【 初心者階層 L1 - 基礎通識 】</button>
            <button class="tab-trigger-btn" id="tab-lvl-2" onclick="switchAchievementLevel(2)">【 冒險者階層 L2 - 進階通識 】</button>
            <button class="tab-trigger-btn" id="tab-lvl-3" onclick="switchAchievementLevel(3)">【 傳奇專科 L3 - 高階領域 】</button>
        </div>

        <div class="achievement-cards-grid" id="achievements-canvas-box"></div>
    </div>

    <script>
        // 👑 全公會全量高定成就卡牌資料庫（支援 3D 動態自適應展模） 👑
        const globalAchievementRegistry = [
            // ─── LEVEL 1 成就群組 ───
            {
                levelNum: 1,
                id: "ACH-L1-001",
                badge: "🗺️",
                title: "初試啼聲",
                desc: "成功參透硬體世界的「三方賽局」，順利點亮 1-1 常規必修通識。",
                conditionHint: "解鎖條件：通過單元 1-1 大考",
                checkKey: "codex-L1-A1-clear", // 剛性比對寶典傳過來的金鑰
                rarity: "common",
                color: "var(--rarity-common)",
                points: "AP +10"
            },
            {
                levelNum: 1,
                id: "ACH-L1-002",
                badge: "⏳",
                title: "生命週期掌控者",
                desc: "掌握硬體生命週期與 NPI 核心交付節點，擊碎排產延遲呆料。",
                conditionHint: "解鎖條件：通過單元 1-2 大考",
                checkKey: "codex-L1-A2-clear",
                rarity: "rare",
                color: "var(--rarity-rare)",
                points: "AP +30"
            },
            {
                levelNum: 1,
                id: "ACH-L1-003",
                badge: "🏭",
                title: "現地開線大師",
                desc: "精確走位工廠地理，摸清 4M1E 線體通識，具備駐廠開線通聯威能。",
                conditionHint: "解鎖條件：通過單元 1-3 大考",
                checkKey: "codex-L1-A3-clear",
                rarity: "rare",
                color: "var(--rarity-rare)",
                points: "AP +30"
            },
            {
                levelNum: 1,
                id: "ACH-L1-004",
                badge: "🏆",
                title: "基礎通識大滿貫",
                desc: "徹底速通 LEVEL 1 所有基礎學分。恭喜你，你已經不是任人宰割的菜鳥了！",
                conditionHint: "解鎖條件：LEVEL 1 全單元通關",
                checkKey: "SPECIAL-L1-ALL", // 特批複合判定
                rarity: "epic",
                color: "var(--rarity-epic)",
                points: "AP +100"
            },
            
            // ─── LEVEL 2 成就群組 (預留擴展開線空間) ───
            {
                levelNum: 2,
                id: "ACH-L2-001",
                badge: "🔍",
                title: "光學AA主導者",
                desc: "深入多軸自動化補正機台，完美解鎖高階相機 AA 主動對位與膠體校正技術。",
                conditionHint: "解鎖條件：通過單元 2-1 品質試煉",
                checkKey: "codex-L2-A1-clear",
                rarity: "epic",
                color: "var(--rarity-epic)",
                points: "AP +50"
            },
            {
                levelNum: 2,
                id: "ACH-L2-002",
                badge: "💧",
                title: " Worst-Case 破局者",
                desc: "在結構防水設計中強行導入 Worst-Case 模擬，徹底封死線體形變流產雷區。",
                conditionHint: "解鎖條件：通過單元 2-2 結構試煉",
                checkKey: "codex-L2-A2-clear",
                rarity: "legendary",
                color: "var(--rarity-legendary)",
                points: "AP +150"
            },

            // ─── LEVEL 3 成就群組 (傳奇里程碑) ───
            {
                levelNum: 3,
                id: "ACH-L3-001",
                badge: "👑",
                title: "不朽的 System TPM",
                desc: "跨功能團隊修煉完成，成功統領多方賽局，具備指揮大型複雜硬體量產之不朽威望。",
                conditionHint: "解鎖條件：完成終局全專科試煉",
                checkKey: "codex-L3-A1-clear",
                rarity: "legendary",
                color: "var(--rarity-legendary)",
                points: "AP +500"
            }
        ];

        let currentSelectedLevelNum = 1;

        window.onload = () => {
            renderAchievementCardsDeck();
        };

        // 👑 核心卡牌渲染與 3D 狀態機校驗引擎 👑
        function renderAchievementCardsDeck() {
            const canvas = document.getElementById('achievements-canvas-box');
            if (!canvas) return;
            canvas.innerHTML = '';

            // 1. 過濾當前分頁選定的階層
            const filteredAch = globalAchievementRegistry.filter(ach => ach.levelNum === currentSelectedLevelNum);

            filteredAch.forEach(ach => {
                // 2. 剛性判定是否解鎖
                let isUnlocked = false;

                if (ach.checkKey === "SPECIAL-L1-ALL") {
                    // 特批複合防線：必須 1-1, 1-2, 1-3 全過才算數
                    isUnlocked = (localStorage.getItem("codex-L1-A1-clear") === "true" && 
                                  localStorage.getItem("codex-L1-A2-clear") === "true" && 
                                  localStorage.getItem("codex-L1-A3-clear") === "true");
                } else {
                    // 常規單元憑證比對
                    isUnlocked = (localStorage.getItem(ach.checkKey) === "true");
                }

                // 3. 構造 3D 雙面卡牌 HTML 骨架
                const cardStage = document.createElement('div');
                cardStage.className = `card-flip-stage ${isUnlocked ? 'unlocked' : ''}`;
                
                cardStage.innerHTML = `
                    <div class="card-flip-inner">
                        <div class="card-face-back">
                            <div class="lock-icon-frame">🔒</div>
                            <div class="lock-condition-hint">${ach.conditionHint}</div>
                        </div>
                        <div class="card-face-front" style="background-color: ${ach.color};">
                            <div class="ach-card-header">
                                <div class="ach-badge-icon">${ach.badge}</div>
                                <div class="ach-rarity-tag">${ach.rarity}</div>
                            </div>
                            <div class="ach-card-body">
                                <h4 class="ach-card-title">${ach.title}</h4>
                                <p class="ach-card-desc">${ach.desc}</p>
                            </div>
                            <div class="ach-card-footer">
                                <span class="ach-points-label">${ach.points}</span>
                                <span class="ach-clear-badge">✓ UNLOCKED</span>
                            </div>
                        </div>
                    </div>
                `;
                
                canvas.appendChild(cardStage);
            });
        }

        // 👑 階層 Tab 切換分流控制器
        function switchAchievementLevel(lvlNum) {
            currentSelectedLevelNum = lvlNum;
            
            // 復原所有按鈕外觀
            document.querySelectorAll('.tab-trigger-btn').forEach(btn => {
                btn.classList.remove('active-tab');
            });
            
            // 點亮當前按鈕
            document.getElementById(`tab-lvl-${lvlNum}`).classList.add('active-tab');
            
            // 重新開線渲染
            renderAchievementCardsDeck();
        }
    </script>
</body>
</html>
