<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公會修煉星盤 | System TPM Talent Tree</title>
    <style>
        :root {
            --bg-color: #FEF9E7; 
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --gold-unlocked: #F59E0B;
            --gold-glow: rgba(245, 158, 11, 0.4);
        }
        
        * { 
            box-sizing: border-box; 
            font-family: "Segoe UI", "Inter", "Noto Sans TC", "Noto Sans", sans-serif; 
            color: var(--text-main); 
        }
        
        body { 
            background-color: var(--bg-color); 
            background-image: radial-gradient(var(--sidebar-cream) 2px, transparent 2px);
            background-size: 32px 32px;
            margin: 0; 
            padding: 40px;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .tree-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 48px; 
        }

        .tactical-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 20px;
        }

        .back-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-flex;
            align-items: center;
        }
        .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }

        .tree-branch-section {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 35px;
            box-shadow: var(--shadow-tactical);
            width: 100%;
        }

        .branch-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin: 0 0 35px 0;
            border-bottom: 2px dashed var(--border-heavy);
            padding-bottom: 10px;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .star-node {
            aspect-ratio: 1 / 1;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: 50%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            text-align: center;
            padding: 15px;
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .star-node.locked {
            background: #E2E8F0;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .star-node.unlocked {
            border-color: var(--gold-unlocked);
            background: #FFFDF2;
            animation: goldenPulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        
        .star-node.unlocked * {
            color: #B45309; 
        }

        @keyframes goldenPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 12px var(--gold-glow), 4px 4px 0px var(--gold-unlocked);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 24px rgba(245, 158, 11, 0.65), 4px 4px 0px var(--gold-unlocked);
            }
        }

        .star-node:not(.locked):hover {
            transform: translateY(-5px);
        }

        .node-code { font-family: monospace; font-size: 0.8rem; font-weight: 900; opacity: 0.8; }
        .node-name { font-size: 0.8rem; font-weight: 800; margin-top: 6px; line-height: 1.4; }

        .dungeon-modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            width: 100%;
            max-width: 850px;
            box-shadow: 10px 10px 0px var(--border-heavy);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: modalSlide 0.2s ease-out;
        }

        @keyframes modalSlide { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            background: var(--sidebar-cream);
            padding: 25px 35px;
            border-bottom: 3px solid var(--border-heavy);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body { padding: 35px; overflow-y: auto; max-height: 75vh; }

        .trial-option {
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-top: 14px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.1s;
            background: #FFF;
        }
        .trial-option:hover { background: var(--sidebar-cream); }

        .close-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>

    <div class="tree-container">
        <div class="tactical-header">
            <div>
                <span style="font-family: monospace; font-weight: 900; color: var(--text-secondary);">SYS.TRACK_MAP V4.0</span>
                <h1 style="margin: 5px 0 0 0; font-size: 2.4rem;">冒險者修煉星盤 (Talent Tree)</h1>
            </div>
            <a href="index.html" class="back-btn">↩ 返回公會總部</a>
        </div>

        <div id="dynamic-tree-branches"></div>
    </div>

    <div id="dungeon-modal" class="dungeon-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span id="modal-node-code" style="font-family: monospace; font-weight: 900; color: var(--text-secondary);">L1-A1</span>
                    <h2 id="modal-node-title" style="margin: 5px 0 0 0; font-size: 1.6rem;">核心課題</h2>
                </div>
                <button class="close-btn" onclick="closeDungeon()">✕</button>
            </div>
            <div class="modal-body">
                <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.1rem; margin-top: 0;">📜 聖遺物卷軸 (核心教學)</h3>
                <p id="modal-node-lesson" style="line-height: 1.7; font-weight: 600; margin-bottom: 35px; white-space: pre-line;"></p>
                
                <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.1rem; margin-top: 40px;">⚔️ 守關 Boss 考驗 (情境抉擇)</h3>
                <p id="modal-node-question" style="font-weight: 800; color: #DC2626; line-height: 1.5; margin-bottom: 20px;"></p>
                <div id="modal-node-options"></div>
            </div>
        </div>
    </div>

    <script>
        // 核心數據：天賦樹五大 Layer 完全架構矩陣模型
        const skillTreeData = [
            {
                branchId: "layer1-core",
                branchTitle: "Layer 1：基礎通識 (新手村：世界觀與魔力感知) - Core Foundations 【必學】",
                nodes: [
                    {
                        code: "L1-A1",
                        name: "基本世界觀<br>(四界雙域)<br>Cosmos Matrix",
                        status: "unlocked", // 黃金脈衝測試節點
                        lesson: "在 System TPM 的世界中，運行著四界雙域。天界客戶（Client）負責下達設計靈魂與 2D 圖紙；幻界供應商（Vendor）冶煉提供核心電子物料；物質深淵代工廠（EMS Factory）則在公差與工時的物理詛咒下將圖紙轉化為實體裝置肉身，最終賣給凡間消費者。\nTPM 的本質，即是橫跨於天界與深淵兩大平行位面的秩序平衡使者。",
                        question: "當幻界供應商（Vendor）的長料期晶圓突然斷線，直接衝擊深淵代工廠（EMS Factory）的試產進度時，System TPM 的第一步核心行動是什麼？",
                        options: [
                            "立刻通報天界客戶（Client）修改產品外觀設計以配合斷料。(❌ 邏輯崩潰，冒險小隊直接滅團)",
                            "立刻調閱材料與核心元件研發星盤，與團隊啟動二線備料策略（Second Source Sourcing）並進行可製造性評估認證。(⭕ 天條認證！完美發揮中介與平衡防禦！)",
                            "待在公會辦公室，靜坐等待深淵代工廠自行解決並回報。(❌ 失去公會特工資格，直接降級)"
                        ]
                    },
                    { code: "L1-A2", name: "市場調查<br>(市場預言術)<br>Market Research", status: "locked", lesson: "未來擴充：如何將凡間數據量化為 PRD 規格書。", question: "", options: [] },
                    { code: "L1-A3", name: "外觀設計<br>(外觀幻化術)<br>Industrial Design", status: "locked", lesson: "未來擴充：CMF 材料、工藝對製程直通率的致命影響力。", question: "", options: [] },
                    { code: "L1-A4", name: "硬體開發模組<br>(魔力核心)<br>Hardware Module", status: "locked", lesson: "未來擴充：電路圖、Layout 佈線與訊號完整性防線。", question: "", options: [] },
                    { code: "L1-A5", name: "結構設計整合<br>(骨架形塑)<br>Structural Design", status: "locked", lesson: "未來擴充：3D 堆疊（Stack-up）極限空間壓縮與物理干涉消除。", question: "", options: [] },
                    { code: "L1-A6", name: "模擬測試理念<br>(考驗天條)<br>Simulation & Test", status: "locked", lesson: "未來擴充：跌落與熱流模擬分析，訂定驗證計畫（VP）。", question: "", options: [] },
                    { code: "L1-A7", name: "廠商物料圖紙<br>(萬物二維卷軸)<br>2D Drawing", status: "locked", lesson: "未來擴充：幾何公差與形位公差（GD&T）與關鍵尺寸定義。", question: "", options: [] },
                    { code: "L1-B1", name: "表面黏著技術<br>( SMT 熔爐 )<br>SMT Process", status: "locked", lesson: "未來擴充：錫膏印刷、貼片機調校、過爐溫度與 AOI 審判之門。", question: "", options: [] },
                    { code: "L1-B2", name: "組測試線配置<br>(機械巨獸)<br>Assembly & Test", status: "locked", lesson: "未來擴充：組裝工位、功能測試（FCT）與線平衡工時控管。", question: "", options: [] },
                    { code: "L1-B3", name: "製造設計審查<br>(深淵鑄造防線)<br>DFM Review", status: "locked", lesson: "未來擴充：拔模角、壁厚收縮、點膠溢膠邊界的可製造性評估。", question: "", options: [] }
                ]
            },
            {
                branchId: "layer2-functional",
                branchTitle: "Layer 2：進階通識 (屬性抉擇：四大元素地下城) - Advanced Functional Modules 【必修支線】",
                nodes: [
                    { code: "L2-W1", name: "防水環境防護<br>(狂瀾元素結界)<br>Ingress Protection", status: "locked", lesson: "解鎖防水等級物理定義與氣密測試、點膠量產製程。", question: "", options: [] },
                    { code: "L2-O1", name: "精密光學影像<br>(聖光元素對位)<br>Precision Optics", status: "locked", lesson: "解鎖鏡頭模組、AA 主動對位（Active Alignment）製程校正。", question: "", options: [] },
                    { code: "L2-S1", name: "軟韌體系統整合<br>(秘術元素核心)<br>SW/FW Integration", status: "locked", lesson: "解鎖硬體暫存器與驅動程式對接、功耗監控與 OTA 升級機制。", question: "", options: [] },
                    { code: "L2-M1", name: "結構與公差分析<br>(鋼鐵元素結構)<br>Tolerance Stack-up", status: "locked", lesson: "解鎖 Worst-case 與統計公差疊加矩陣分析。", question: "", options: [] }
                ]
            },
            {
                branchId: "layer3-senior",
                branchTitle: "Layer 3：TPM 專科 (傳奇轉職：高階核心戰略主線) - Senior TPM Specialization 【高階解鎖】",
                nodes: [
                    { code: "L3-T1", name: "時程與決策矩陣<br>(代價天平)<br>Schedule & Trade-off", status: "locked", lesson: "解鎖長料期斷料時空挪動技術，與規格、成本權衡決策模型。", question: "", options: [] },
                    { code: "L3-N1", name: "跨功能協作談判<br>(談判桌的咆哮)<br>XFN Negotiation", status: "locked", lesson: "解鎖結構工程（ME）與天線工程（Antenna）訊號爭奪戰之技術仲裁術。", question: "", options: [] }
                ]
            },
            {
                branchId: "layer4-daily",
                branchTitle: "Layer 4：日常突襲副本 (限時速通地下城) - Daily Speed-Quiz 【日常修煉】",
                nodes: [
                    { code: "L4-A", name: "術語卡牌閃擊戰<br>(古代遺物地下城)<br>Jargon Flash-Quiz", status: "locked", lesson: "高頻率限時 60 秒術語速通答題玩法，分數直連後台試算表。", question: "", options: [] }
                ]
            },
            {
                branchId: "layer5-dlc",
                branchTitle: "Layer 5：宇宙觀擴展模組 (深淵外傳 DLC 任務) - Expansion Packs 【高階非必學】",
                nodes: [
                    { code: "L5-C", name: "運營商法規認證<br>(太古聖堂認證)<br>Carrier & Regulatory", status: "locked", lesson: "解鎖全球運營商 TAC 測試、各國法規強認證（FCC/CE）與安規天條。", question: "", options: [] },
                    { code: "L5-E", name: "早期失效分析<br>(英靈轉生殿)<br>EFFA & DOA", status: "locked", lesson: "解鎖客退故障機台（Field Returns）剖析、切片與死因鑑定工程學。", question: "", options: [] }
                ]
            }
        ];

        function renderTalentTree() {
            const container = document.getElementById('dynamic-tree-branches');
            container.innerHTML = '';

            skillTreeData.forEach(branch => {
                const branchHtml = `
                    <div class="tree-branch-section">
                        <div class="branch-title">🌿 ${branch.branchTitle}</div>
                        <div class="nodes-grid">
                            ${branch.nodes.map(node => `
                                <div class="star-node ${node.status}" onclick="enterDungeon('${branch.branchId}', '${node.code}')">
                                    <div class="node-code">${node.code}</div>
                                    <div class="node-name">${node.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.innerHTML += branchHtml;
            });
        }

        function enterDungeon(branchId, nodeCode) {
            const branch = skillTreeData.find(b => b.branchId === branchId);
            const node = branch.nodes.find(n => n.code === nodeCode);
            
            if (node.status === "locked") {
                alert("【系統提示】前置修煉尚未達成，此星芒節點正處於封印狀態！");
                return;
            }

            document.getElementById('modal-node-code').innerText = node.code;
            document.getElementById('modal-node-title').innerHTML = node.name;
            document.getElementById('modal-node-lesson').innerText = node.lesson;
            document.getElementById('modal-node-question').innerText = `⚠️ 戰術情境：${node.question}`;

            const optionsBox = document.getElementById('modal-node-options');
            optionsBox.innerHTML = '';
            node.options.forEach(opt => {
                optionsBox.innerHTML += `<div class="trial-option" onclick="submitAnswer(this, '${opt.includes('⭕')}')">${opt}</div>`;
            });

            document.getElementById('dungeon-modal').style.display = 'flex';
        }

        function closeDungeon() {
            document.getElementById('dungeon-modal').style.display = 'none';
        }

        function submitAnswer(element, isCorrect) {
            if (isCorrect === "true") {
                element.style.background = "#D1FAE5";
                element.style.borderColor = "#10B981";
                alert("✨【神聖天條認證】回答完全正確！您的通關紀錄已安全寫入星盤矩陣中。");
                closeDungeon();
            } else {
                element.style.background = "#FEE2E2";
                element.style.borderColor = "#EF4444";
                alert("💥【魔力逆流】決策失誤！守關 Boss 給予工程衝擊，請重讀卷軸！");
            }
        }

        window.onload = renderTalentTree;
    </script>
</body>
</html>
