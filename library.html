<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識圖書館 | System TPM Tactical Library</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-bookmark-red: #EF4444;
            --color-locked-gray: #E2E8F0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        .sidebar-panel {
            display: flex;
            width: 350px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 4px;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leaf-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.82rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaf-btn:hover {
            transform: translate(2px, -2px);
            box-shadow: 2px 4px 0px var(--border-heavy);
        }

        .leaf-btn.active {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .mini-bookmark-dot {
            color: var(--color-bookmark-red);
            font-size: 0.8rem;
        }

        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dashboard-view-hall,
        .document-canvas,
        .sub-pagination-dots-zone {
            display: none;
            width: 100%;
        }

        .dashboard-view-hall {
            height: 100%;
            overflow-y: auto;
            padding: 5px 5px 30px 5px; 
        }

        .level-cards-parallel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
            padding: 5px 2px;
        }

        .progress-card-master {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: var(--shadow-tactical);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100px;
        }

        .progress-card-master:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--border-heavy);
        }

        .progress-card-master.active-level {
            background: linear-gradient(135deg, #FFFDF4 0%, #FAFAFA 100%) !important;
            border-width: 3px !important;
            box-shadow: 5px 5px 0px var(--border-heavy) !important;
        }

        .progress-label {
            font-family: monospace;
            font-weight: 900;
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .progress-stats {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .cdx-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            padding: 5px 2px;
        }

        .cdx-dashboard-card {
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 14px;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            transition: all 0.15s;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            min-height: 60px;
        }

        .cdx-dashboard-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--text-main);
        }

        .document-canvas {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .textbook-scroll-box {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            width: 100%;
            font-size: 0.9rem;
        }

        .textbook-section-block {
            margin-bottom: 10px;
            padding-bottom: 5px;
            width: 100%;
            animation: fadeInBox 0.12s ease-out;
        }

        .dynamic-flow-canvas {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            background: #FEF9E7;
            border: 2px solid var(--border-heavy);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            margin: 0 0 20px 0;
            overflow-x: auto;
            flex-shrink: 0;
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .flow-node-block {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.88rem;
            box-shadow: 2px 2px 0px var(--border-heavy);
            white-space: nowrap;
            text-align: center;
            transition: all 0.1s;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .flow-node-block.active-node {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .flow-arrow-split {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--border-heavy);
            user-select: none;
        }

        .sub-pagination-dots-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            padding: 15px 0;
            border-top: 2px dashed #E2E8F0;
            margin-top: auto;
            flex-shrink: 0;
        }

        .slider-dot {
            width: 14px;
            height: 14px;
            border: 3px solid var(--border-heavy);
            border-radius: 50%;
            background: #FFF;
            cursor: pointer;
            transition: all 0.1s;
        }

        .slider-dot.active {
            background: var(--text-main);
            transform: scale(1.2);
        }

        .library-bookmark-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .library-bookmark-btn.is-bookmarked {
            background: #FEE2E2;
            color: var(--color-bookmark-red);
        }

        .library-blockquote {
            border-left: 4px solid var(--border-heavy);
            background: var(--sidebar-cream);
            padding: 15px 20px;
            margin: 20px 0;
            font-weight: 700;
            border-radius: 0 6px 6px 0;
        }

        .library-h3 {
            font-size: 1.2rem;
            font-weight: 900;
            margin: 25px 0 10px 0;
            border-bottom: 2px solid var(--border-heavy);
            padding-bottom: 4px;
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">知識圖書館</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：Daniel Shih</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active">TW</button>
                <button class="lang-btn-core">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回總部</a>
        </div>
    </div>

    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboardMenu()">↩ 返回圖書大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">DASHBOARD</span>
                    <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">圖書文獻檢索大廳</h2>
                </div>
                <button id="global-bookmark-trigger" class="library-bookmark-btn" onclick="toggleLibraryAssetBookmark()" style="display:none;">🔖 收藏卷軸</button>
            </div>

            <!-- 視覺大廳 Dashboard -->
            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div class="level-cards-parallel-grid" id="global-level-flex-deck"></div>
                <div style="border-bottom: 3px dashed var(--border-heavy); width: 100%; margin: 5px 0 25px 0;"></div>
                <div style="font-weight: 900; font-size: 1rem; margin-bottom: 15px; color: var(--text-main);">文獻卷軸列表：</div>
                <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
            </div>

            <!-- 文獻 CANVAS 閱讀區 -->
            <div class="document-canvas" id="textbook-viewport">
                <div class="dynamic-flow-canvas" id="dynamic-flow-renderer-box"></div>
                <div class="textbook-scroll-box">
                    <div id="lesson-content"></div>
                </div>
            </div>

            <!-- 跨頁控制點 -->
            <div class="sub-pagination-dots-zone" id="universal-dots-bar"></div>
        </main>
    </div>

    <script>
        // 👑 剛性動態路由註冊矩陣 👑
        const globalLibraryRegistry = [
            { type: 'beginner', groupLabel: '初心者寶典文獻 (Beginner)', subUnitId: '1-1', title: '1-1: 三方賽局戰術析論', file: 'library_data_beginner_1-1.js' },
            { type: 'beginner', groupLabel: '初心者寶典文獻 (Beginner)', subUnitId: '1-2', title: '1-2: 生命週期幾何流產', file: 'library_data_beginner_1-2.js' },
            { type: 'handbook', groupLabel: '冒險者手冊文獻 (Handbook)', subUnitId: '1-1', title: '1-1: 防水結構 Worst-Case', file: 'library_data_handbook_1-1.js' }
        ];

        // 👑 對位中文化修正：BEGINNER CODEX -> 初心者寶典 | HANDBOOK SPECS -> 冒險者手冊 👑
        const globalCategoryMetadata = [
            { id: 'beginner', name: '初心者寶典', label: '寶典文獻庫' },
            { id: 'handbook', name: '冒險者手冊', label: '手冊規格庫' }
        ];

        let selectedCategoryType = 'beginner'; 
        let activeCourseIdx = 0, activePageIdx = 0, activeFlowNodeIdx = 0;

        window.onload = () => {
            renderGlobalTreeStructure();
            routeController();
        };

        function renderGlobalTreeStructure() {
            const root = document.getElementById('global-tree-root'); 
            root.innerHTML = '';
            const presentTypes = ['beginner', 'handbook'];
            
            presentTypes.forEach(type => {
                const subset = globalLibraryRegistry.filter(u => u.type === type);
                if (subset.length === 0) return;
                
                const block = document.createElement('div'); 
                block.className = 'menu-category-block';
                block.innerHTML = `
                    <button class="tree-main-toggle" onclick="toggleMenuSection('lib-accordion-${type}')">📚 ${subset[0].groupLabel.split(' (')[0]}</button>
                    <div id="lib-accordion-${type}" class="tree-sub-group" style="display: flex; flex-direction: column;">
                        ${subset.map(u => {
                            const isSaved = localStorage.getItem(`library-bookmark-${type}-${u.subUnitId}`) === 'true';
                            const savedTag = isSaved ? `<span class="mini-bookmark-dot">❤️</span>` : '';
                            return `<button class="leaf-btn" id="lf-lib-${type}-${u.subUnitId}" onclick="switchLibraryUnit('${u.type}','${u.subUnitId}')"><span>${u.title}</span>${savedTag}</button>`;
                        }).join('')}
                    </div>`;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) { 
            const el = document.getElementById(id); 
            if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none'; 
        }

        function routeController(directType, directC) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramC = directC || urlParams.get('c');
            const paramType = directType || urlParams.get('type');

            if (!paramC || !paramType) {
                document.getElementById('global-bookmark-trigger').style.display = 'none';
                document.getElementById('cdx-page-header-zone').style.display = 'flex'; 
                document.getElementById('current-chapter-id').innerText = "DASHBOARD"; 
                document.getElementById('current-chapter-name').innerText = "圖書文獻檢索大廳";
                document.getElementById('dashboard-menu-hall').style.display = 'block'; 
                document.getElementById('textbook-viewport').style.display = 'none'; 
                document.getElementById('universal-dots-bar').style.display = 'none';
                renderLibraryHubDashboard();
            } else {
                document.getElementById('dashboard-menu-hall').style.display = 'none'; 
                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active')); 
                const leaf = document.getElementById(`lf-lib-${paramType}-${paramC}`); 
                if (leaf) leaf.classList.add('active'); 
                injectLibraryPackScript(paramType, paramC);
            }
        }

        function renderLibraryHubDashboard() {
            const deckRow = document.getElementById('global-level-flex-deck');
            const grid = document.getElementById('l1-cards-grid'); 
            if (!deckRow || !grid) return;
            
            deckRow.innerHTML = ''; 
            grid.innerHTML = '';
            
            globalCategoryMetadata.forEach(cat => {
                const subUnitsInCat = globalLibraryRegistry.filter(u => u.type === cat.id); 
                let total = subUnitsInCat.length, savedCount = 0;
                subUnitsInCat.forEach(u => { 
                    if (localStorage.getItem(`library-bookmark-${cat.id}-${u.subUnitId}`) === 'true') savedCount++; 
                });
                deckRow.innerHTML += `
                    <div class="progress-card-master ${cat.id === selectedCategoryType ? 'active-level' : ''}" onclick="selectedCategoryType='${cat.id}';renderLibraryHubDashboard();">
                        <div class="progress-label">${cat.name}</div>
                        <div class="progress-stats">文獻總量: ${total} 篇 | 已收藏: ${savedCount} 篇</div>
                    </div>`;
            });

            const filteredUnits = globalLibraryRegistry.filter(u => u.type === selectedCategoryType);
            filteredUnits.forEach(unit => {
                const isSaved = localStorage.getItem(`library-bookmark-${unit.type}-${unit.subUnitId}`) === 'true';
                grid.innerHTML += `
                    <div class="cdx-dashboard-card" style="background-color: ${isSaved?'#FEE2E2':'#FFF'};" onclick="switchLibraryUnit('${unit.type}', '${unit.subUnitId}')">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-family:monospace; font-weight:900; background:rgba(0,0,0,0.06); padding:2px 4px; border-radius:4px; font-size:0.75rem;">${unit.subUnitId}</span>
                            <h3 style="margin:0; font-size:0.85rem; font-weight:900; color:var(--text-main);">${unit.title.split(': ')[1] || unit.title}</h3>
                        </div>
                        <div style="font-size:0.75rem; font-weight:900; color:var(--text-main); white-space:nowrap; padding-left:6px;">${isSaved ? `❤️ [已收藏]` : '📖 未收藏'}</div>
                    </div>`;
            });
        }

        function switchLibraryUnit(type, subUnitId) { 
            selectedCategoryType = type; 
            activeCourseIdx = 0; 
            activePageIdx = 0; 
            activeFlowNodeIdx = 0; 
            window.history.pushState(null, '', `${window.location.pathname}?type=${type}&c=${subUnitId}`); 
            routeController(type, subUnitId); 
        }

        function exitToDashboardMenu() { 
            window.history.pushState(null, '', window.location.pathname); 
            routeController(null, null); 
            renderGlobalTreeStructure();
        }

        function injectLibraryPackScript(type, packId) {
            window.libraryCourseEngineData = []; 
            const old = document.getElementById('dynamic-library-pack'); 
            if (old) old.remove();
            
            const registryItem = globalLibraryRegistry.find(u => u.type === type && u.subUnitId === packId);
            if (!registryItem) return;

            const script = document.createElement('script'); 
            script.id = 'dynamic-library-pack'; 
            script.src = `${registryItem.file}?v=${Date.now()}`;
            script.onload = () => { initLibraryEngine(); }; 
            document.head.appendChild(script);
        }

        function initLibraryEngine() {
            if (!window.libraryCourseEngineData || window.libraryCourseEngineData.length === 0) { 
                document.getElementById('current-chapter-name').innerText = "文獻解讀失敗"; 
                return; 
            }
            loadLibraryCourseState(activeCourseIdx, activePageIdx);
        }

        function loadLibraryCourseState(cIdx, pIdx) {
            activeCourseIdx = cIdx; 
            activePageIdx = pIdx;
            
            const course = window.libraryCourseEngineData[cIdx]; 
            const dotsBar = document.getElementById('universal-dots-bar'); 
            dotsBar.innerHTML = '';
            
            document.getElementById('textbook-viewport').style.display = 'flex'; 
            document.getElementById('universal-dots-bar').style.display = 'flex';
            
            const page = course.subPages[pIdx]; 
            document.getElementById('current-chapter-id').innerText = `PAGE ${pIdx + 1} / ${course.subPages.length}`; 
            document.getElementById('current-chapter-name').innerText = page.title;
            
            const bookmarkBtn = document.getElementById('global-bookmark-trigger');
            bookmarkBtn.style.display = 'flex';
            const urlParams = new URLSearchParams(window.location.search);
            const currentType = urlParams.get('type');
            const currentC = urlParams.get('c');
            
            const isSaved = localStorage.getItem(`library-bookmark-${currentType}-${currentC}`) === 'true';
            if (isSaved) {
                bookmarkBtn.className = "library-bookmark-btn is-bookmarked";
                bookmarkBtn.innerHTML = "❤️ 已收藏此卷軸";
            } else {
                bookmarkBtn.className = "library-bookmark-btn";
                bookmarkBtn.innerHTML = "🔖 收藏卷軸";
            }

            let targetedText = page.text;
            let targetedFlow = page.diagramFlowArray;
            
            const flowRenderer = document.getElementById('dynamic-flow-renderer-box');
            if (flowRenderer && targetedFlow && targetedFlow.length > 0) {
                flowRenderer.style.display = 'flex'; 
                flowRenderer.innerHTML = '';
                targetedFlow.forEach((node, nIdx) => {
                    flowRenderer.innerHTML += `<div class="flow-node-block ${nIdx===activeFlowNodeIdx?'active-node':''}" onclick="activeFlowNodeIdx=${nIdx};loadLibraryCourseState(${cIdx},${pIdx})">${node.name}</div>`;
                    if (nIdx < targetedFlow.length - 1) flowRenderer.innerHTML += `<div class="flow-arrow-split">➔</div>`;
                });
            } else if (flowRenderer) { 
                flowRenderer.style.display = 'none'; 
            }

            let compiledHtml = "";
            if (targetedFlow && targetedFlow.length > 0) {
                if (targetedFlow[activeFlowNodeIdx]) {
                    compiledHtml = `<div class="textbook-section-block"><div style="line-height:1.7;">${targetedFlow[activeFlowNodeIdx].text}</div></div>`;
                }
            } else {
                compiledHtml = `<div style="line-height: 1.7;">${targetedText || ""}</div>`;
            }
            document.getElementById('lesson-content').innerHTML = compiledHtml;

            course.subPages.forEach((_, sIdx) => { 
                dotsBar.innerHTML += `<div class="slider-dot ${sIdx===pIdx?'active':''}" onclick="activeFlowNodeIdx=0;loadLibraryCourseState(${cIdx},${sIdx})"></div>`; 
            }); 
        }

        function toggleLibraryAssetBookmark() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentType = urlParams.get('type');
            const currentC = urlParams.get('c');
            if (!currentType || !currentC) return;

            const storageKey = `library-bookmark-${currentType}-${currentC}`;
            const previousState = localStorage.getItem(storageKey) === 'true';
            
            if (previousState) {
                localStorage.removeItem(storageKey);
            } else {
                localStorage.setItem(storageKey, 'true');
            }

            loadLibraryCourseState(activeCourseIdx, activePageIdx);
        }
    </script>
</body>
</html>
