<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識圖書館 | System TPM Library Hub</title>
    <style>
        :root {
            /* 👑 外襯粗獷主義核心色盤 */
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
            --color-locked-gray: #E2E8F0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        /* 👑 剛性頂部控制導航列 */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
            transition: all 0.15s ease-out;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        /* ⚖️ 剛性對齊：左側選單欄寬度固定 262px (與手冊一致) */
        .sidebar-panel {
            display: flex;
            width: 262px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 12px;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .level-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s;
            display: flex;
            justify-content: space-between;
        }

        .level-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .level-btn.active {
            background: var(--color-active-gold) !important;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        /* 中央主觀測工作區 - 自適應寬度延伸 */
        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dashboard-view-hall,
        .document-canvas {
            display: none;
            width: 100%;
            height: 100%;
        }

        .dashboard-view-hall {
            display: block; 
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px 20px 40px 15px; 
        }

        .document-canvas {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            gap: 24px;
        }

        /* 🚀 👑 重新優化：自適應寬度流動網格，徹底填滿反人類留白 */
        .lexicon-index-column {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            grid-auto-rows: min-content;
            gap: 16px;
            padding: 10px 14px 14px 10px; 
            align-content: start; 
        }

        /* 🚀 宇宙支線卡片風格 */
        .lexicon-term-row {
            background: #FFFFFF;
            border: 3px solid var(--border-heavy);
            border-radius: 8px;
            padding: 16px 12px;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-heavy);
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            text-align: left;
            min-height: 100px; 
            word-break: break-word; 
        }

        .lexicon-term-row:hover {
            background: #FFFDF4;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border-heavy);
        }

        .lexicon-term-row.active-term {
            background: #FFFBEB !important;
            border-color: #EAB308 !important;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #EAB308 !important;
        }

        .card-cosmic-tag {
            font-family: monospace;
            font-weight: 900;
            font-size: 0.75rem;
            background: var(--text-main);
            color: #FFF;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .card-cosmic-title {
            font-size: 0.95rem;
            font-weight: 900;
            line-height: 1.4;
        }

        /* ⚖️ 剛性對齊：右側觀測儀固定寬度 380px */
        .fixed-inspector-panel {
            width: 380px;
            border: 4px solid var(--border-heavy);
            background: #FFFDF2;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-tactical);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            flex-shrink: 0;
            position: relative; 
        }

        .inspector-placeholder {
            margin: auto;
            text-align: center;
            color: #94A3B8;
            font-weight: 800;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .nordic-action-btn {
            background: var(--text-main);
            color: #FFFFFF;
            border: none;
            padding: 14px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 3px 3px 0px #475569;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .nordic-action-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--text-main);
        }

        /* 👑 🚀 全景時空天梯大浮窗劇院 (Full-screen Overlay Modal) */
        .modal-overlay-chamber {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(5px);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-brutalist-box {
            width: 100%;
            max-width: 1200px;
            height: 90vh; /* 近乎滿版 */
            background-color: var(--bg-color);
            border: 4px solid var(--border-heavy);
            border-radius: 12px;
            box-shadow: 12px 12px 0px var(--border-heavy);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.96); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header-bar {
            background-color: var(--sidebar-cream);
            border-bottom: 4px solid var(--border-heavy);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-close-x {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px var(--border-heavy);
        }

        /* 👑 橫向時空步進天梯天棚 */
        .horizontal-stepper-roof {
            background: #FFFFFF;
            border-bottom: 2px dashed var(--border-heavy);
            padding: 15px 24px;
            display: flex;
            flex-direction: row;
            gap: 12px;
            overflow-x: auto;
            flex-shrink: 0;
            align-items: center;
        }

        .horizontal-stepper-roof::-webkit-scrollbar {
            height: 8px;
        }
        .horizontal-stepper-roof::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }

        .step-node-badge {
            background: #F1F5F9;
            border: 2px solid var(--border-heavy);
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 2px 2px 0px #CBD5E1;
            transition: all 0.1s;
        }

        .step-node-badge:hover {
            background: var(--sidebar-cream);
        }

        .step-node-badge.active-step {
            background: var(--color-active-gold) !important;
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
            transform: translate(1px, 1px);
        }

        .step-arrow-divider {
            color: #94A3B8;
            font-weight: 900;
            user-select: none;
        }

        .modal-reading-chamber {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
            background: #FFFFFF;
            line-height: 1.7;
            font-size: 1rem;
            color: var(--text-main);
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .level-hero-card {
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            padding: 20px 8px;
            background: #FFF;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.12s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 70px;
        }

        .level-hero-card:hover {
            background: var(--sidebar-cream);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;">知識圖書館</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">首頁登入</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active">TW</button>
                <button class="lang-btn-core">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回首頁</a>
        </div>
    </div>

    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboard()">↩ 返回圖書大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">LEXICON INDEX</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">圖書文獻檢索大廳</h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall"></div>

            <div class="document-canvas" id="lexicon-viewport">
                <div class="lexicon-index-column" id="lexicon-terms-list"></div>
                <div class="fixed-inspector-panel" id="lexicon-inspector">
                    <div class="inspector-placeholder">
                        🎯 階層合流完成<br>請點擊左側卡片查看平行宇宙細節
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay-chamber" id="theater-modal">
        <div class="modal-brutalist-box">
            <div class="modal-header-bar">
                <div>
                    <span id="modal-branch-tag" style="font-family: monospace; font-weight: 900; background: #1A1A1A; color:#FFF; padding:4px 8px; border-radius:4px; font-size:0.85rem; margin-right:12px;">1-1</span>
                    <strong id="modal-branch-title" style="font-size: 1.25rem; font-weight: 900;">支線全景通讀艙</strong>
                </div>
                <button class="modal-close-x" onclick="closeTheaterTheater()">✕</button>
            </div>
            <div class="horizontal-stepper-roof" id="modal-stepper-track"></div>
            <div class="modal-reading-chamber" id="modal-reader-viewport"></div>
        </div>
    </div>

    <script>
        const libraryLevelRegistry = [
            { 
                category: 'beginner', 
                catName: '初心者', 
                levelNum: 1, 
                levelName: '基礎通識大辭典',
                files: [
                    'library_data/library_data_beginner_1-1.js',
                    'library_data/library_data_beginner_1-2.js',
                    'library_data/library_data_beginner_1-3.js',
                    'library_data/library_data_beginner_1-4.js'
                ]
            },
            { 
                category: 'beginner', 
                catName: '初心者', 
                levelNum: 2, 
                levelName: '進階工廠大辭典',
                files: ['library_data/library_data_beginner_2-1.js']
            },
            { 
                category: 'beginner', 
                catName: '初心者', 
                levelNum: 3, 
                levelName: 'TPM思考邏輯辭典',
                files: ['library_data/library_data_beginner_3-1.js']
            },
            { 
                category: 'handbook', 
                catName: '冒險者', 
                levelNum: 1, 
                levelName: 'TPM天職實戰手冊',
                files: [
                    'handbook_data_course/handbook_data_1-1.js',
                    'handbook_data_course/handbook_data_1-2.js',
                    'library_data/dict_ext_handbook_1-2.js'
                ]
            }
        ];

        const globalCategoryMetadata = [
            { id: 'beginner', name: '初心者' },
            { id: 'handbook', name: '冒險者' }
        ];

        let selectedActiveTabType = 'beginner'; 
        let activeTermIdx = -1;
        let currentActiveLevel = null; 
        let GLOBAL_USER_EMAIL = localStorage.getItem('tpm-user-current-email') || ""; 

        window.aggregatedTermsPool = []; 
        window.currentlyViewedTerm = null;
        window.isInsideFavoritesView = false;

        window.onload = () => {
            renderGlobalTree();
            renderDashboard();
        };

        function renderGlobalTree() {
            const root = document.getElementById('global-tree-root');
            if (!root) return;
            root.innerHTML = '';
            
            const cats = [...new Set(libraryLevelRegistry.map(r => r.category))];
            cats.forEach(catId => {
                const levels = libraryLevelRegistry.filter(r => r.category === catId);
                const block = document.createElement('div');
                block.className = 'menu-category-block';
                
                const catMeta = globalCategoryMetadata.find(m => m.id === catId);
                const catLabelName = catMeta ? catMeta.name : '未知';

                block.innerHTML = `
                    <div class="tree-main-toggle" onclick="toggleMenuSection('tree-${catId}')">
                        <span>📖 ${catLabelName}文獻</span>
                    </div>
                    <div id="tree-${catId}" class="tree-sub-group">
                        ${levels.map(l => `<button class="level-btn" id="btn-L${catId}-${l.levelNum}" onclick="loadLevelLexicon('${catId}', ${l.levelNum})">LEVEL ${l.levelNum} <span>➔</span></button>`).join('')}
                    </div>
                `;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = (el.style.display === 'none' ? 'flex' : 'none');
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-menu-hall');
            if (!container) return;
            container.innerHTML = '';

            const personalHeading = document.createElement('div');
            personalHeading.style.fontWeight = '900';
            personalHeading.style.fontSize = '1.15rem';
            personalHeading.style.margin = '20px 0 12px 2px';
            personalHeading.style.color = 'var(--text-main)';
            personalHeading.innerText = '個人:';
            container.appendChild(personalHeading);

            const personalGrid = document.createElement('div');
            personalGrid.style.display = 'grid';
            personalGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(130px, 1fr))';
            personalGrid.style.gap = '15px';
            personalGrid.style.width = '100%';
            personalGrid.style.padding = '6px';
            personalGrid.style.marginBottom = '20px';

            const favCard = document.createElement('div');
            favCard.className = 'level-hero-card';
            favCard.onclick = () => loadFavoritesLexicon();
            favCard.innerHTML = `<div style="font-size:1.1rem; font-weight:900; letter-spacing:0.5px;">我的最愛</div>`;
            personalGrid.appendChild(favCard);
            container.appendChild(personalGrid);

            const personalSep = document.createElement('div');
            personalSep.style.borderBottom = '3px dashed var(--border-heavy)';
            personalSep.style.width = '100%';
            personalSep.style.margin = '25px 0 15px 0';
            container.appendChild(personalSep);

            const targetGroups = [
                { id: 'beginner', title: '初心者:' },
                { id: 'handbook', title: '冒險者:' }
            ];

            targetGroups.forEach((group, gIdx) => {
                const heading = document.createElement('div');
                heading.style.fontWeight = '900';
                heading.style.fontSize = '1.15rem';
                heading.style.margin = '20px 0 12px 2px';
                heading.style.color = 'var(--text-main)';
                heading.innerText = group.title;
                container.appendChild(heading);

                const grid = document.createElement('div');
                grid.style.display = 'grid';
                grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(130px, 1fr))'; 
                grid.style.gap = '15px';
                grid.style.width = '100%';
                grid.style.marginBottom = '20px';

                const subset = libraryLevelRegistry.filter(l => l.category === group.id);
                
                subset.forEach(l => {
                    const card = document.createElement('div');
                    card.className = 'level-hero-card';
                    card.onclick = () => loadLevelLexicon(l.category, l.levelNum);
                    card.innerHTML = `<div style="font-size:1.1rem; font-weight:900; letter-spacing:0.5px;">LEVEL ${l.levelNum}</div>`;
                    grid.appendChild(card);
                });

                container.appendChild(grid);

                if (gIdx < targetGroups.length - 1) {
                    const separator = document.createElement('div');
                    separator.style.borderBottom = '3px dashed var(--border-heavy)';
                    separator.style.width = '100%';
                    separator.style.margin = '25px 0 15px 0';
                    container.appendChild(separator);
                }
            });
        }

        function getCleanTermName(name) {
            let clean = (name || '').replace(/🔑|關鍵詞：|關鍵詞:|增補：|增補:|⚡|⚠️|🏆|💥|🎨|📝|👤/g, '').trim();
            let engMatch = clean.match(/^([A-Za-z0-9\s\-]+)/);
            if (engMatch && engMatch[1].trim().length > 1) {
                return engMatch[1].trim();
            }
            return clean.split(/[\(\（\s]/)[0];
        }

        async function loadLevelLexicon(catId, lvlNum) {
            const target = libraryLevelRegistry.find(r => r.category === catId && r.levelNum === lvlNum);
            if (!target) return;

            window.isInsideFavoritesView = false;
            activeTermIdx = -1;
            window.aggregatedTermsPool = [];
            currentActiveLevel = target; 
            
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-L${catId}-${lvlNum}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('dashboard-menu-hall').style.display = 'none';
            document.getElementById('lexicon-viewport').style.display = 'flex';
            
            const categoryEl = document.getElementById('current-chapter-id');
            const levelEl = document.getElementById('current-chapter-name');
            if (categoryEl) categoryEl.innerText = `${catId.toUpperCase()} / LEVEL ${lvlNum}`;
            if (levelEl) levelEl.innerText = `LEVEL ${lvlNum} ${catId === 'handbook' ? '實戰宇宙圖鑑' : '大辭典'}`;

            const listContainer = document.getElementById('lexicon-terms-list');
            if (listContainer) listContainer.innerHTML = `<div class="inspector-placeholder">正在多軌並行解包 LEVEL ${lvlNum} 全量矩陣...</div>`;

            const loadPromises = target.files.map(filePath => singleScriptFetchEngine(filePath, catId));
            await Promise.all(loadPromises);

            const suppKeyBase = (catId === 'beginner' ? 'codex' : 'handbook');
            target.files.forEach(filePath => {
                const match = filePath.match(/(\d-\d)/);
                if (match) {
                    const unitId = match[0];
                    const dictKey = `${suppKeyBase}-${unitId}`;
                    if (window.globalSupplementaryDictionary && window.globalSupplementaryDictionary[dictKey]) {
                        window.globalSupplementaryDictionary[dictKey].forEach(supp => {
                            if (!window.aggregatedTermsPool.some(t => t.name === supp.name)) {
                                window.aggregatedTermsPool.push({ 
                                    ...supp, 
                                    isSupp: true,
                                    sourceLabel: `Level ${unitId} (擴展包)`
                                });
                            }
                        });
                    }
                }
            });

            // 如果是 Beginner 辭典，依照字母排序；如果是 Handbook 宇宙，保持原本解析打包的陣列順序
            if (catId === 'beginner') {
                window.aggregatedTermsPool.sort((a, b) => {
                    let nameA = getCleanTermName(a.name);
                    let nameB = getCleanTermName(b.name);
                    return nameA.localeCompare(nameB, 'en', { sensitivity: 'base', numeric: true });
                });
            }

            renderLexiconList();
        }

        window.loadFavoritesLexicon = function() {
            window.isInsideFavoritesView = true;
            activeTermIdx = -1;
            
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('dashboard-menu-hall').style.display = 'none';
            document.getElementById('lexicon-viewport').style.display = 'flex';
            
            const categoryEl = document.getElementById('current-chapter-id');
            const levelEl = document.getElementById('current-chapter-name');
            if (categoryEl) categoryEl.innerText = `PERSONAL / FAVORITES`;
            if (levelEl) levelEl.innerText = `我的最愛收藏庫`;

            const favKey = GLOBAL_USER_EMAIL ? `library-favorites-pool_${GLOBAL_USER_EMAIL}` : 'library-favorites-pool';
            window.aggregatedTermsPool = JSON.parse(localStorage.getItem(favKey) || '[]');
            
            window.aggregatedTermsPool.sort((a, b) => {
                let nameA = getCleanTermName(a.name);
                let nameB = getCleanTermName(b.name);
                return nameA.localeCompare(nameB, 'en', { sensitivity: 'base', numeric: true });
            });

            renderLexiconList();
            
            const inspector = document.getElementById('lexicon-inspector');
            if (inspector) {
                inspector.innerHTML = `
                    <div class="inspector-placeholder">
                        🎯 收藏庫載入完成<br>請點擊左側單詞查看詳細技術文獻
                    </div>
                `;
            }
        };

        // 👑 核心加載大腦：雙軌解析 (Beginner 拆詞條, Handbook 拆支線)
        function singleScriptFetchEngine(filePath, catId) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = `${filePath}?v=${Date.now()}`;
                
                const parseAndHarvest = () => {
                    let combined = [];
                    if (window.libraryCourseEngineData && window.libraryCourseEngineData.length > 0) {
                        combined = combined.concat(window.libraryCourseEngineData);
                    }
                    if (window.codexCourseEngineData && window.codexCourseEngineData.length > 0) {
                        combined = combined.concat(window.codexCourseEngineData);
                    }
                    
                    const match = filePath.match(/(\d-\d)/);
                    const unitId = match ? match[0] : "1-1";
                    const isHandbook = filePath.includes('handbook') || filePath.includes('dict_ext_handbook');
                    const unitLabel = `Level ${unitId}`;

                    const storageKey = isHandbook ? `handbook-L1-A${unitId.split('-')[1]}-clear` : `codex-L1-A${unitId.split('-')[1]}-clear`;
                    const isUnitCleared = localStorage.getItem(storageKey) === 'true';

                    // 1. Beginner 模式：常規線性詞條解析
                    if (catId === 'beginner') {
                        combined.forEach(course => {
                            if (course.subPages) {
                                course.subPages.forEach(page => {
                                    if (page.diagramFlowArray && page.diagramFlowArray.length > 0) {
                                        page.diagramFlowArray.forEach(term => {
                                            if (!window.aggregatedTermsPool.some(t => t.name === term.name)) {
                                                term.sourceLabel = unitLabel;
                                                window.aggregatedTermsPool.push(term);
                                            }
                                        });
                                    }
                                    
                                    if (page.text) {
                                        const regex = /tpmSwitchSubKwd\s*\(\s*[^,]+\s*,\s*[^,]+\s*,\s*[^,]+\s*,\s*['"]([^'"]+)['"]\s*,\s*['"]([^'"]+)['"]/g;
                                        let matchKwd;
                                        while ((matchKwd = regex.exec(page.text)) !== null) {
                                            const termName = matchKwd[1];
                                            const termDesc = matchKwd[2];
                                            const syntheticText = `<h3>全稱：${termName}</h3><div style="background:#FFFDF2; border:2px solid #1A1A1A; border-radius:6px; padding:12px; margin:12px 0; font-weight:700;">系統智能解包釋義</div><p style="line-height:1.7; font-weight:700; color:#475569;">${termDesc}</p>`;
                                            
                                            if (!window.aggregatedTermsPool.some(t => getCleanTermName(t.name) === getCleanTermName(termName))) {
                                                window.aggregatedTermsPool.push({
                                                    name: termName,
                                                    text: syntheticText,
                                                    sourceLabel: unitLabel
                                                });
                                            }
                                        }
                                    }
                                });
                            }
                        });
                    }

                    // 2. 🎯 Handbook 模式：沙盒地圖「支線打包」解析器
                    if (window.tpmSandboxScriptTree && Object.keys(window.tpmSandboxScriptTree).length > 0 && catId === 'handbook') {
                        if (isUnitCleared) {
                            const tree = window.tpmSandboxScriptTree;
                            let branchClusters = {};

                            // 透過遞迴探尋每一條支線的路徑
                            function traceBranch(currentNodeId, currentBranchLabel, currentPath) {
                                const node = tree[currentNodeId];
                                if (!node) return;

                                // 複製當前路徑
                                let newPath = [...currentPath];
                                if (!newPath.some(n => n.id === currentNodeId)) {
                                    newPath.push({
                                        id: currentNodeId,
                                        name: getCleanTermName(node.title || nodeId),
                                        title: node.title,
                                        text: node.text || node.question || "無說明文本"
                                    });
                                }

                                // 找到分流點，定義新的支線宇宙
                                if (node.type === "decision" && node.options && node.id.includes("DECISION")) {
                                    node.options.forEach(opt => {
                                        let branchKey = opt.target;
                                        let branchName = opt.text.match(/【(.*?)】/);
                                        branchName = branchName ? branchName[1] : opt.text;
                                        
                                        if (!branchClusters[branchKey]) {
                                            branchClusters[branchKey] = {
                                                id: `${unitId}-${branchKey.split('-')[1] || branchKey}`,
                                                tag: branchName,
                                                title: `${branchName} 完整宇宙劇情線`,
                                                nodes: [...newPath],
                                                sourceLabel: `${unitLabel} 沙盒`
                                            };
                                        }
                                        traceBranch(opt.target, branchKey, branchClusters[branchKey].nodes);
                                    });
                                    return;
                                }

                                // 推進子節點
                                let targets = [];
                                if (node.nextNodes) targets = targets.concat(node.nextNodes);
                                if (node.options && node.type !== "decision") node.options.forEach(o => targets.push(o.target));

                                targets.forEach(targetId => {
                                    if (currentBranchLabel && branchClusters[currentBranchLabel]) {
                                        traceBranch(targetId, currentBranchLabel, branchClusters[currentBranchLabel].nodes);
                                    } else {
                                        traceBranch(targetId, null, newPath);
                                    }
                                });
                            }

                            // 啟動探測
                            traceBranch("T0-INTRO", null, []);
                            traceBranch("T1-START", null, []); // 兼容無 INTRO 的劇本

                            // 將梳理好的宇宙支線推進 Pool
                            Object.keys(branchClusters).forEach(key => {
                                let cluster = branchClusters[key];
                                // 去除重複節點
                                let uniqueNodes = [];
                                let seenIds = new Set();
                                cluster.nodes.forEach(n => {
                                    if (!seenIds.has(n.id)) {
                                        seenIds.add(n.id);
                                        uniqueNodes.push(n);
                                    }
                                });
                                cluster.nodes = uniqueNodes;
                                cluster.isCosmicBranch = true; // 標記為整條支線
                                window.aggregatedTermsPool.push(cluster);
                            });
                        }
                        window.tpmSandboxScriptTree = null; 
                    }

                    // 3. 獨立擴展辭典接口
                    if (window.tpmStandaloneKeywords && window.tpmStandaloneKeywords.length > 0) {
                        if (isUnitCleared) {
                            window.tpmStandaloneKeywords.forEach(kw => {
                                if (!window.aggregatedTermsPool.some(t => getCleanTermName(t.name) === getCleanTermName(kw.name))) {
                                    window.aggregatedTermsPool.push({
                                        name: kw.name,
                                        text: kw.text,
                                        sourceLabel: unitLabel
                                    });
                                }
                            });
                        }
                        window.tpmStandaloneKeywords = null; 
                    }

                    window.codexCourseEngineData = [];
                    window.libraryCourseEngineData = [];
                };

                script.onload = () => {
                    parseAndHarvest();
                    resolve();
                };

                script.onerror = () => {
                    if (filePath.includes('library_data/library_data_beginner_')) {
                        const fallbackPath = filePath.replace('library_data/library_data_beginner_', 'beginner_codex_course/course_data_');
                        const fallbackScript = document.createElement('script');
                        fallbackScript.src = `${fallbackPath}?v=${Date.now()}`;
                        fallbackScript.onload = () => {
                            parseAndHarvest();
                            resolve();
                        };
                        fallbackScript.onerror = () => resolve();
                        document.head.appendChild(fallbackScript);
                    } else {
                        resolve();
                    }
                };
                document.head.appendChild(script);
            });
        }

        // ========================================================================
        // 👑 圖鑑渲染器：動態識別詞條(Beginner) vs 宇宙卡片(Handbook)
        // ========================================================================
        function renderLexiconList() {
            const list = document.getElementById('lexicon-terms-list');
            if (!list) return;
            list.innerHTML = '';
            
            if (window.aggregatedTermsPool.length === 0) {
                list.innerHTML = `
                    <div style="grid-column: 1 / -1; border:2px dashed var(--border-heavy); background:#FFF; padding:30px; text-align:center; border-radius:6px; font-weight:900; color:var(--text-secondary); width:100%; margin-top:20px;">
                        🔒 該單元文獻仍處於戰爭迷霧中，請完成首頁大考解鎖文獻 🔒
                    </div>`;
                return;
            }

            window.aggregatedTermsPool.forEach((term, idx) => {
                const row = document.createElement('div');
                
                // 🚀 如果是 Handbook 的打包支線卡片，賦予粗獷樣式
                if (term.isCosmicBranch) {
                    row.className = `lexicon-term-row ${idx === activeTermIdx ? 'active-term' : ''}`;
                    row.innerHTML = `
                        <div class="card-cosmic-tag">${term.tag}</div>
                        <div class="card-cosmic-title">${term.title}</div>
                    `;
                } else {
                    // 常規 Beginner 詞條樣式
                    row.className = `lexicon-term-row ${idx === activeTermIdx ? 'active-term' : ''}`;
                    row.style.minHeight = '75px';
                    let cleanName = getCleanTermName(term.name);
                    row.innerHTML = `<div style="line-height:1.2; font-size:0.88rem; font-weight:900;">${cleanName}</div>`;
                }
                
                row.onclick = () => {
                    activeTermIdx = idx;
                    renderLexiconList();
                    window.currentlyViewedTerm = term; 
                    showDetail(term);
                };
                list.appendChild(row);
            });
        }

        function showDetail(term) {
            const inspector = document.getElementById('lexicon-inspector');
            if (!inspector) return;

            const favKey = GLOBAL_USER_EMAIL ? `library-favorites-pool_${GLOBAL_USER_EMAIL}` : 'library-favorites-pool';
            const favoritesPool = JSON.parse(localStorage.getItem(favKey) || '[]');
            const isFav = favoritesPool.some(f => f.id === term.id || f.name === term.name);
            const finalSourceLabel = term.sourceLabel || `Level ${currentActiveLevel ? currentActiveLevel.levelNum : '1-1'}`;

            // 🚀 若是宇宙支線，提供專屬的右側簡報版面
            if (term.isCosmicBranch) {
                inspector.innerHTML = `
                    <div style="display: flex; flex-direction: column; height: 100%; width: 100%; animation: fadeInBox 0.15s ease-out;">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--border-heavy); padding-bottom: 12px; margin-bottom: 16px; flex-shrink: 0; width: 100%;">
                            <div style="font-size: 0.72rem; font-weight: 900; background: var(--text-main); color: #FFF; padding: 5px 10px; border-radius: 4px; font-family: monospace; letter-spacing: 0.5px;">
                                ${finalSourceLabel}
                            </div>
                        </div>
                        
                        <div style="flex: 1; overflow-y: auto; padding-right: 4px; color: var(--text-main);">
                            <span style="font-family:monospace; font-weight:900; background:#FEF08A; padding:2px 6px; border:1px solid var(--border-heavy); border-radius:4px; font-size:0.75rem;">${term.tag}</span>
                            <h4 style="font-size:1.25rem; font-weight:900; margin:12px 0 16px 0; line-height:1.4;">${term.title}</h4>
                            <div style="margin-top:15px; border-top:2px dashed #CBD5E1; padding-top:16px;">
                                <span style="font-weight:900; color:var(--text-secondary); font-size: 0.85rem;">📊 劇情時空節點清算：</span>
                                <ul style="margin:8px 0 0 0; padding-left:20px; font-weight:700; font-size:0.9rem; color:var(--text-main); line-height:1.6;">
                                    <li>全景串聯關卡數：<b>${term.nodes.length}</b> 關</li>
                                    <li>歷史因果鏈路：完整導通</li>
                                    <li>沙盒複盤權限：已解除隔離</li>
                                </ul>
                            </div>
                        </div>

                        <button class="nordic-action-btn" onclick="openTheaterTheater()">🔍 展開全景時空步進通讀</button>
                    </div>
                `;
            } else {
                // 常規詞條版面
                inspector.innerHTML = `
                    <div style="display: flex; flex-direction: column; height: 100%; width: 100%; animation: fadeInBox 0.15s ease-out;">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--border-heavy); padding-bottom: 12px; margin-bottom: 16px; flex-shrink: 0; width: 100%;">
                            <div style="font-size: 0.72rem; font-weight: 900; background: var(--text-main); color: #FFF; padding: 5px 10px; border-radius: 4px; font-family: monospace; letter-spacing: 0.5px;">
                                ${finalSourceLabel}
                            </div>
                            <button id="fav-toggle-btn" style="background:${isFav ? '#FFD2D2' : '#FFFFFF'}; border: 2px solid var(--border-heavy); border-radius: 6px; padding: 6px 12px; font-size: 0.8rem; font-weight: 900; cursor:pointer; box-shadow: 2px 2px 0px var(--border-heavy); display:flex; align-items:center; gap:6px; transition: all 0.1s;" onclick="window.toggleFavoriteCurrentTerm()">
                                <span>${isFav ? '❤️' : '🤍'}</span>
                                <span style="font-size:0.75rem; font-weight:900;">${isFav ? '已收藏' : '加入最愛'}</span>
                            </button>
                        </div>
                        
                        <div style="line-height: 1.7; font-size: 0.88rem; overflow-y: auto; flex: 1; padding-right: 4px; color: var(--text-main);">
                            ${term.text}
                        </div>
                    </div>
                `;
            }
        }

        window.toggleFavoriteCurrentTerm = function() {
            const term = window.currentlyViewedTerm;
            if (!term) return;

            const favKey = GLOBAL_USER_EMAIL ? `library-favorites-pool_${GLOBAL_USER_EMAIL}` : 'library-favorites-pool';
            let favoritesPool = JSON.parse(localStorage.getItem(favKey) || '[]');
            const index = favoritesPool.findIndex(f => (f.id === term.id && term.id) || f.name === term.name);

            if (index > -1) {
                favoritesPool.splice(index, 1); 
            } else {
                favoritesPool.push(term); 
            }
            localStorage.setItem(favKey, JSON.stringify(favoritesPool));

            const btn = document.getElementById('fav-toggle-btn');
            if (btn) {
                const isFav = favoritesPool.some(f => (f.id === term.id && term.id) || f.name === term.name);
                btn.style.background = isFav ? '#FFD2D2' : '#FFFFFF';
                btn.innerHTML = `<span>${isFav ? '❤️' : '🤍'}</span><span style="font-size:0.75rem; font-weight:900;">${isFav ? '已收藏' : '加入最愛'}</span>`;
            }

            if (window.isInsideFavoritesView) {
                window.aggregatedTermsPool = favoritesPool;
                window.aggregatedTermsPool.sort((a, b) => {
                    let nameA = getCleanTermName(a.name);
                    let nameB = getCleanTermName(b.name);
                    return nameA.localeCompare(nameB, 'en', { sensitivity: 'base', numeric: true });
                });
                renderLexiconList();
            }
        };

        // ========================================================================
        // 👑 🚀 橫向時空天梯步進大浮窗控制中心 (滿版置中)
        // ========================================================================
        function openTheaterTheater() {
            const term = window.currentlyViewedTerm;
            if (!term || !term.isCosmicBranch) return;

            document.getElementById('modal-branch-tag').innerText = term.tag;
            document.getElementById('modal-branch-title').innerText = term.title;

            const track = document.getElementById('modal-stepper-track');
            track.innerHTML = '';

            currentChamberNodesList = term.nodes;

            // 部署橫向時空天梯 Stepper
            currentChamberNodesList.forEach((node, idx) => {
                const badge = document.createElement('div');
                badge.className = 'step-node-badge';
                badge.id = `step-badge-${idx}`;
                badge.innerText = `${node.id.split('-')[0]}: ${node.name}`; // 顯示 T0: 通識導讀
                badge.onclick = () => { triggerChamberReadingNode(idx); };

                track.appendChild(badge);

                if (idx < currentChamberNodesList.length - 1) {
                    const arrow = document.createElement('span');
                    arrow.className = 'step-arrow-divider';
                    arrow.innerText = '➔';
                    track.appendChild(arrow);
                }
            });

            if (currentChamberNodesList.length > 0) {
                triggerChamberReadingNode(0);
            }

            document.getElementById('theater-modal').style.display = 'flex';
        }

        function triggerChamberReadingNode(poolIdx) {
            document.querySelectorAll('.step-node-badge').forEach(b => b.classList.remove('active-step'));
            const activeBadge = document.getElementById(`step-badge-${poolIdx}`);
            if (activeBadge) {
                activeBadge.classList.add('active-step');
            }

            const nodeData = currentChamberNodesList[poolIdx];
            const viewer = document.getElementById('modal-reader-viewport');
            
            if (nodeData && viewer) {
                viewer.innerHTML = `
                    <div style="animation: fadeInBox 0.15s ease-out;">
                        <span style="font-family:monospace; font-weight:900; color:var(--text-secondary); font-size:0.85rem;">[時空錨點: ${nodeData.id}]</span>
                        <h2 style="margin:10px 0 24px 0; font-weight:900; font-size:1.8rem; color:var(--text-main);">${nodeData.title}</h2>
                        <div style="border-top:2px solid #E2E8F0; padding-top:20px; color: var(--text-main); font-size: 1.05rem;">
                            ${nodeData.text}
                        </div>
                    </div>
                `;
                viewer.scrollTop = 0; 
            }
        }

        function closeTheaterTheater() {
            document.getElementById('theater-modal').style.display = 'none';
        }

        function exitToDashboard() {
            const menuHall = document.getElementById('dashboard-menu-hall');
            const viewport = document.getElementById('lexicon-viewport');
            const categoryEl = document.getElementById('current-chapter-id');
            const levelEl = document.getElementById('current-chapter-name');

            if (menuHall) menuHall.style.display = 'block';
            if (viewport) viewport.style.display = 'none';
            if (categoryEl) categoryEl.innerText = `LEXICON INDEX`;
            if (levelEl) levelEl.innerText = "圖書文獻檢索大廳";
            
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            renderDashboard();
        }

        (function() {
            const PILOT_EMAIL = localStorage.getItem('tpm-user-current-email') || "";

            function computeLocalUserRankTitle() {
                if (!PILOT_EMAIL || PILOT_EMAIL.trim() === "") return { text: "首頁登入", isLogged: false };

                let nameStr = "Daniel Shih";
                const emailLower = PILOT_EMAIL.toLowerCase().trim();
                if (emailLower !== "danielcwshih@fih-foxconn.com") {
                    nameStr = emailLower.split('@')[0].replace(/[\._\-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                }

                const beginnerKeys = ['codex-L1-A1-clear', 'codex-L1-A2-clear', 'codex-L1-A3-clear', 'codex-L1-A4-clear', 'codex-L2-A1-clear', 'codex-L3-A1-clear'];
                const isAllBeginnerCleared = beginnerKeys.every(k => localStorage.getItem(k) === 'true');

                const adventureKeys = ['handbook-L1-A1-clear', 'handbook-L1-A2-clear'];
                const isAllAdventureCleared = adventureKeys.every(k => localStorage.getItem(k) === 'true');

                if (isAllBeginnerCleared && isAllAdventureCleared) return { text: `👤 統籌者 : ${nameStr}`, isLogged: true };
                if (isAllBeginnerCleared) return { text: `👤 冒險者 : ${nameStr}`, isLogged: true };
                return { text: `👤 初心者 : ${nameStr}`, isLogged: true };
            }

            const originalOnload = window.onload;
            window.onload = function() {
                if (originalOnload) originalOnload();
                const profileBox = document.getElementById('global-user-profile-card');
                if (profileBox) {
                    const rankInfo = computeLocalUserRankTitle();
                    profileBox.innerHTML = rankInfo.text;
                    if (!rankInfo.isLogged) {
                        profileBox.style.color = "#DC2626";
                        profileBox.style.borderColor = "#DC2626";
                        profileBox.style.boxShadow = "3px 3px 0px #DC2626";
                    }
                }
            };
        })();
    </script>
