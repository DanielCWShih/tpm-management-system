<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識圖書館 | System TPM Library Hub</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
            --color-locked-gray: #E2E8F0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.1s;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        .sidebar-panel {
            display: flex;
            width: 350px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 6px;
        }

        /* 👑 側邊欄 Level 子分類次級折疊鈕 👑 */
        .tree-level-toggle {
            width: 100%;
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            margin-bottom: 4px;
            box-shadow: 2px 2px 0px var(--border-heavy);
            display: flex;
            justify-content: space-between;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .leaf-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.82rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            line-height: 1.4;
        }

        .leaf-btn:hover {
            transform: translate(2px, -2px);
            box-shadow: 2px 4px 0px var(--border-heavy);
        }

        .leaf-btn.active {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dashboard-view-hall,
        .document-canvas {
            display: none;
            width: 100%;
        }

        .dashboard-view-hall {
            height: 100%;
            overflow-y: auto;
            padding: 5px 5px 30px 5px; 
        }

        .level-cards-parallel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
            padding: 5px 2px;
        }

        .progress-card-master {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            border-radius: 10px;
            padding: 12px 16px;
            box-shadow: var(--shadow-tactical);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .progress-card-master:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--border-heavy);
        }

        .progress-card-master.active-level {
            background: linear-gradient(135deg, #FFFDF4 0%, #FAFAFA 100%) !important;
            border-width: 3px !important;
            box-shadow: 5px 5px 0px var(--border-heavy) !important;
        }

        .progress-label {
            font-family: monospace;
            font-weight: 900;
            font-size: 0.72rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .progress-percentage {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 2px 0;
            color: var(--text-main);
            line-height: 1;
        }

        .progress-stats {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .cdx-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            padding: 5px 2px;
        }

        .cdx-dashboard-card {
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            transition: all 0.15s;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            min-height: 52px;
        }

        .cdx-dashboard-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--text-main);
        }

        /* ─── ⚖️ 左右雙軌戰術分流觀測大盤 ─── */
        .document-canvas {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: row; /* 剛性左右並行 */
            gap: 24px;
            width: 100%;
            height: 100%;
        }

        /* 左側：全局關鍵字大會總牌海 */
        .library-deck-column {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 雙列剛性咬合 */
            gap: 12px;
            padding-right: 6px;
            height: 100%;
        }

        .library-term-badge-card {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 16px;
            font-weight: 900;
            font-size: 0.88rem;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .library-term-badge-card:hover {
            background: #FFFDF4;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .library-term-badge-card.active-term {
            background: var(--color-active-gold) !important;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        /* 右側：固定式戰術解包觀測儀 */
        .fixed-inspector-panel {
            width: 440px;
            border: 3px solid var(--border-heavy);
            background: #FFFDF2;
            border-radius: var(--radius-sm);
            padding: 24px;
            box-shadow: var(--shadow-tactical);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100%;
            flex-shrink: 0;
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="library_data/library_supplementary.js?v=20260604"></script>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">知識圖書館</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：Daniel Shih</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active">TW</button>
                <button class="lang-btn-core">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回總部</a>
        </div>
    </div>

    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboardMenu()">↩ 返回圖書大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">DASHBOARD</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">圖書文獻檢索大廳</h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div class="level-cards-parallel-grid" id="global-level-flex-deck"></div>
                <div style="border-bottom: 3px dashed var(--border-heavy); width: 100%; margin: 5px 0 25px 0;"></div>
                <div style="font-weight: 900; font-size: 1rem; margin-bottom: 15px; color: var(--text-main);">文獻卷軸列表：</div>
                <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
            </div>

            <div class="document-canvas" id="textbook-viewport">
                <div class="library-deck-column" id="library-master-badge-deck"></div>
                
                <div class="fixed-inspector-panel" id="library-fixed-inspector">
                    <div style="color:var(--text-secondary); font-weight:800; text-align:center; margin-top:auto; margin-bottom:auto;">
                        🎯 請點擊左側關鍵字卡牌<br>發動現地技術解包
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ========================================================================
        // 👑 靜態資料結構對位清單 👑
        // ========================================================================
        const globalSubUnitRegistry = [
            { category: 'beginner', levelNum: 1, subUnitId: '1-1', title: '1-1: 三方賽局戰術析論', file: 'beginner_codex_course/course_data_1-1.js' },
            { category: 'beginner', levelNum: 1, subUnitId: '1-2', title: '1-2: 硬體生命週期與 NPI 交付', file: 'beginner_codex_course/course_data_1-2.js' },
            { category: 'beginner', levelNum: 1, subUnitId: '1-3', title: '1-3: 工廠地理與 4M1E 線體通識', file: 'beginner_codex_course/course_data_1-3.js' },
            { category: 'beginner', levelNum: 1, subUnitId: '1-4', title: '1-4: 終端市場調查與產品規格定義', file: 'beginner_codex_course/course_data_1-4.js' },
            { category: 'beginner', levelNum: 2, subUnitId: '2-1', title: '2-1: 相機AA品質大氣大考', file: 'beginner_codex_course/course_data_2-1.js' },
            { category: 'beginner', levelNum: 3, subUnitId: '3-1', title: '3-1: SYSTEM TPM 天職與 TechOps 核心', file: 'beginner_codex_course/course_data_3-1.js' },
            { category: 'adventure', levelNum: 1, subUnitId: '1-1', title: '1-1: 系統 TPM 職能運作實戰手冊', file: 'handbook_data_course/handbook_data_1-1.js' },
            { category: 'adventure', levelNum: 1, subUnitId: '1-2', title: '1-2: 系統 TPM 職能運作實戰手冊二', file: 'handbook_data_course/handbook_data_1-2.js' }
        ];

        const globalCategoryMetadata = [
            { id: 'beginner', name: '初心者' },
            { id: 'adventure', name: '冒險者' },
            { id: 'coordinator', name: '統籌者 (待開發)' },
            { id: 'slayer', name: '屠龍者 (待開發)' }
        ];

        let selectedActiveTabType = 'beginner'; 
        let activeTermIdx = 0;

        window.onload = () => {
            renderGlobalTreeStructure();
            routeController();
        };

        // 🎯 👑 樹狀大腦進化：完美對齊 「種類大分類 ➔ LEVEL 子標籤 ➔ 單元葉子」 三級剛性網格
        function renderGlobalTreeStructure() {
            const root = document.getElementById('global-tree-root'); 
            root.innerHTML = '';
            
            globalCategoryMetadata.forEach(cat => {
                const subset = globalSubUnitRegistry.filter(u => u.category === cat.id);
                if (subset.length === 0) return;
                
                const block = document.createElement('div'); 
                block.className = 'menu-category-block';
                
                // 1. 抓出該文獻大類底下所有的不重複 LEVEL 階層
                const presentLevels = [...new Set(subset.map(u => u.levelNum))].sort();
                
                // 2. 迭代組裝子選單 HTML 結構體
                let subLevelsHtml = "";
                presentLevels.forEach(lvlNum => {
                    const levelUnits = subset.filter(u => u.levelNum === lvlNum);
                    subLevelsHtml += `
                        <div style="margin-bottom: 6px;">
                            <div class="tree-level-toggle" onclick="toggleMenuSection('sub-accordion-${cat.id}-${lvlNum}')">
                                <span>📁 LEVEL ${lvlNum}</span><span>▾</span>
                            </div>
                            <div id="sub-accordion-${cat.id}-${lvlNum}" style="display:flex; flex-direction:column; gap:6px; padding-left:8px; margin-top:4px;">
                                ${levelUnits.map(u => `<button class="leaf-btn" id="lf-${u.category}-${u.subUnitId}" onclick="switchUnit('${u.category}','${u.subUnitId}')">${u.title}</button>`).join('')}
                            </div>
                        </div>
                    `;
                });

                block.innerHTML = `
                    <button class="tree-main-toggle" onclick="toggleMenuSection('main-accordion-${cat.id}')">📖 ${cat.name}文獻</button>
                    <div id="main-accordion-${cat.id}" class="tree-sub-group" style="display: flex; flex-direction: column;">
                        ${subLevelsHtml}
                    </div>`;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) { 
            const el = document.getElementById(id); 
            if (el) el.style.display = el.style.display === 'none' ? 'flex' : 'none'; 
        }

        function routeController(directType, directC) {
            document.getElementById('global-user-profile-card').innerHTML = `👤 冒險者：Daniel Shih`;

            const urlParams = new URLSearchParams(window.location.search);
            const paramC = directC || urlParams.get('c');
            const paramType = directType || urlParams.get('type') || 'beginner';

            if (!paramC) {
                document.getElementById('cdx-page-header-zone').style.display = 'block'; 
                document.getElementById('current-chapter-id').innerText = "DASHBOARD"; 
                document.getElementById('current-chapter-name').innerText = "圖書文獻檢索大廳";
                document.getElementById('dashboard-menu-hall').style.display = 'block'; 
                document.getElementById('textbook-viewport').style.display = 'none'; 
                renderMultiLevelHubDashboard();
            } else {
                document.getElementById('dashboard-menu-hall').style.display = 'none'; 
                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active')); 
                const leaf = document.getElementById(`lf-${paramType}-${paramC}`); 
                if (leaf) leaf.classList.add('active'); 
                injectContentPackScript(paramType, paramC);
            }
        }

        function renderMultiLevelHubDashboard() {
            const deckRow = document.getElementById('global-level-flex-deck');
            const grid = document.getElementById('l1-cards-grid'); 
            if (!deckRow || !grid) return;
            
            deckRow.innerHTML = ''; 
            grid.innerHTML = '';
            
            globalCategoryMetadata.forEach(cat => {
                const subset = globalSubUnitRegistry.filter(u => u.category === cat.id);
                let total = subset.length;
                let collected = 0;
                subset.forEach(u => { 
                    if (localStorage.getItem(`library-${cat.id}-${u.subUnitId}-clear`) === 'true') collected++; 
                });
                
                deckRow.innerHTML += `
                    <div class="progress-card-master ${cat.id === selectedActiveTabType ? 'active-level' : ''}" onclick="selectedActiveTabType='${cat.id}';renderMultiLevelHubDashboard();" style="min-height:100px;">
                        <div style="font-weight:900; font-size:1.05rem; color:var(--text-main); margin-bottom:8px;">${cat.name}文獻</div>
                        <div class="progress-stats" style="font-size:0.8rem; font-weight:800; color:var(--text-secondary);">文獻總量: ${total} 篇 | 已收藏: ${collected} 篇</div>
                    </div>`;
            });

            const filteredUnits = globalSubUnitRegistry.filter(u => u.category === selectedActiveTabType);
            filteredUnits.forEach(unit => {
                const isClear = localStorage.getItem(`library-${unit.category}-${unit.subUnitId}-clear`) === 'true';
                grid.innerHTML += `
                    <div class="cdx-dashboard-card" style="background-color: ${isClear ? '#DCFCE7' : '#FFFFFF'}; border: 2px solid var(--border-heavy);" onclick="switchUnit('${unit.category}', '${unit.subUnitId}')">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span style="font-family:monospace; font-weight:900; background:rgba(0,0,0,0.06); padding:4px 8px; border-radius:4px; font-size:0.8rem;">${unit.subUnitId}</span>
                            <h3 style="margin:0; font-size:0.88rem; font-weight:900; color:var(--text-main);">${unit.title.split(': ')[1] || unit.title}</h3>
                        </div>
                        <div style="font-size:0.8rem; font-weight:900; color:var(--text-secondary); white-space:nowrap; display:flex; align-items:center; gap:4px; padding-left:10px;">
                            <span> 📖</span> ${isClear ? '已收藏' : '未收藏'}
                        </div>
                    </div>`;
            });

            if (filteredUnits.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: span 4; border:3px dashed var(--border-heavy); background:#FFF; padding:50px; text-align:center; border-radius:8px; font-weight:900; color:var(--text-secondary); width:100%;">
                        ⚡ 該領域職能文獻正處於排產封裝階段 (待開發) ⚡
                    </div>`;
            }
        }

        function switchUnit(type, subUnitId) { 
            selectedActiveTabType = type; 
            activeTermIdx = 0; 
            window.history.pushState(null, '', `${window.location.pathname}?type=${type}&c=${subUnitId}`); 
            routeController(type, subUnitId); 
        }

        function exitToDashboardMenu() { 
            window.history.pushState(null, '', window.location.pathname); 
            routeController(null, null); 
        }

        function injectContentPackScript(type, packId) {
            window.libraryCourseEngineData = []; 
            window.codexCourseEngineData = [];
            const old = document.getElementById('dynamic-course-pack'); 
            if (old) old.remove();
            
            const script = document.createElement('script'); 
            script.id = 'dynamic-course-pack'; 
            
            const currentUnit = globalSubUnitRegistry.find(u => u.category === type && u.subUnitId === packId);
            if (!currentUnit) return;
            
            const targetFile = currentUnit.file;
            script.src = `${targetFile}?v=${Date.now()}`;
            script.onload = () => { initEngine(); }; 
            script.onerror = () => { console.error("加載失敗:", targetFile); };
            document.head.appendChild(script);
        }

        // ========================================================================
        // 👑 核心大腦：關鍵字矩陣動態收攏合流渲染矩陣 (0 重工) 👑
        // ========================================================================
        function initEngine() {
            const rawPayload = (window.libraryCourseEngineData && window.libraryCourseEngineData.length > 0) 
                                        ? window.libraryCourseEngineData 
                                        : window.codexCourseEngineData;

            if (!rawPayload || rawPayload.length === 0) return;

            const course = rawPayload[0];
            document.getElementById('current-chapter-id').innerText = `LIBRARY DIRECTORY`; 
            document.getElementById('current-chapter-name').innerText = `技術圖書特輯：${course.menuTitle}`;

            // 1. 全域合流緩衝區陣列初始化
            window.libraryMergedTermsPool = [];

            // 2. 迴圈自動抓取：將該課程所有 subPages 內含的 diagramFlowArray 詞條通統原位抓取
            course.subPages.forEach(page => {
                if (page.diagramFlowArray && page.diagramFlowArray.length > 0) {
                    page.diagramFlowArray.forEach(term => {
                        // 防重複注入
                        if (!window.libraryMergedTermsPool.some(t => t.name === term.name)) {
                            window.libraryMergedTermsPool.push({
                                name: term.name.replace(/🔑/g, "").trim(),
                                text: term.text
                            });
                        }
                    });
                }
            });

            // 3. 全球字典互鎖合流：自動到全域 supplementary 檔案中提取額外增補詞條
            const urlParams = new URLSearchParams(window.location.search);
            const packId = urlParams.get('c');
            const dictKey = `${selectedActiveTabType}-${packId}`;
            
            if (window.globalSupplementaryDictionary && window.globalSupplementaryDictionary[dictKey]) {
                const suppTerms = window.globalSupplementaryDictionary[dictKey];
                suppTerms.forEach(sterm => {
                    if (!window.libraryMergedTermsPool.some(t => t.name === sterm.name)) {
                        window.libraryMergedTermsPool.push(sterm);
                    }
                });
            }

            // 4. 擊發雙軌制渲染
            executeRenderLibraryWorkspace();
        }

        // 👑 左右分流戰術觀測台實體渲染器
        function executeRenderLibraryWorkspace() {
            document.getElementById('dashboard-menu-hall').style.display = 'none'; 
            document.getElementById('textbook-viewport').style.display = 'flex'; 

            const deckColumn = document.getElementById('library-master-badge-deck');
            if (!deckColumn) return;
            deckColumn.innerHTML = '';

            // 1. 渲染左側牌海
            window.libraryMergedTermsPool.forEach((term, idx) => {
                const card = document.createElement('div');
                card.className = `library-term-badge-card ${idx === activeTermIdx ? 'active-term' : ''}`;
                // 判定是否為增補詞條，賦予不同的前置小標籤
                const iconPrefix = term.name.includes("增補") ? "🔥" : "🏷️";
                card.innerHTML = `<span>${iconPrefix}</span> <span>${term.name}</span>`;
                
                card.onclick = () => {
                    activeTermIdx = idx;
                    window.executeRenderLibraryWorkspace();
                };
                deckColumn.appendChild(card);
            });

            // 2. 渲染右側固定解包觀測面板
            const inspector = document.getElementById('library-fixed-inspector');
            if (window.libraryMergedTermsPool[activeTermIdx]) {
                inspector.innerHTML = `
                    <div style="animation: fadeInBox 0.15s ease-out; line-height: 1.6; font-size:0.88rem;">
                        ${window.libraryMergedTermsPool[activeTermIdx].text}
                    </div>
                `;
            } else {
                inspector.innerHTML = `<div style='color:var(--text-secondary); text-align:center; margin:auto;'>鎖片解鎖失敗</div>`;
            }
        }
    </script>
</body>
</html>
