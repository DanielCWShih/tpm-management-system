<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識圖書館 | System TPM Library Hub</title>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
            --color-locked-gray: #E2E8F0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        .sidebar-panel {
            display: flex;
            width: 350px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 12px;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 👑 Level 葉子切換鈕：改為書本目錄型態 👑 */
        .level-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s;
            display: flex;
            justify-content: space-between;
        }

        .level-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .level-btn.active {
            background: var(--color-active-gold) !important;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dashboard-view-hall,
        .document-canvas {
            display: none;
            width: 100%;
            height: 100%;
        }

        .dashboard-view-hall {
            display: block; /* 初始大廳 */
            height: 100%;
            overflow-y: auto;
        }

        /* ─── ⚖️ 左右雙軌戰術分流觀測大盤 (辭典版) ─── */
        .document-canvas {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            gap: 24px;
        }

        /* 左側：單詞索引列表 */
        .lexicon-index-column {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 6px;
        }

        .lexicon-term-row {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: 6px;
            padding: 14px 20px;
            font-weight: 900;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lexicon-term-row:hover {
            background: #FFFDF4;
            transform: translateX(4px);
        }

        .lexicon-term-row.active-term {
            background: var(--color-active-gold) !important;
            border-width: 3px;
            transform: translateX(8px);
            box-shadow: 4px 4px 0px var(--border-heavy) !important;
        }

        /* 右側：固定細節觀測儀 */
        .fixed-inspector-panel {
            width: 500px;
            border: 4px solid var(--border-heavy);
            background: #FFFDF2;
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow-tactical);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100%;
            flex-shrink: 0;
            animation: fadeInBox 0.2s ease-out;
        }

        .inspector-placeholder {
            margin: auto;
            text-align: center;
            color: #94A3B8;
            font-weight: 800;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 大廳 Level 選擇卡 */
        .level-hero-card {
            border: 3px solid var(--border-heavy);
            border-radius: 12px;
            padding: 24px;
            background: #FFF;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .level-hero-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px var(--border-heavy);
        }
    </style>
    <script src="library_data/library_supplementary.js?v=20260604"></script>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;">知識圖書館</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：Daniel Shih</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active">TW</button>
                <button class="lang-btn-core">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回總部</a>
        </div>
    </div>

    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboard()">↩ 返回圖書大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-category-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">LEXICON INDEX</span>
                <h2 id="current-level-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">圖書文獻檢索大廳</h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div style="font-weight: 900; font-size: 1.1rem; margin-bottom: 15px;">📖 請選擇欲檢索之職能階層：</div>
                <div class="level-cards-parallel-grid" id="category-selector-grid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:15px;">
                    </div>
            </div>

            <div class="document-canvas" id="lexicon-viewport">
                <div class="lexicon-index-column" id="lexicon-terms-list">
                    </div>
                
                <div class="fixed-inspector-panel" id="lexicon-inspector">
                    <div class="inspector-placeholder">
                        🎯 階層合流完成<br>請點擊左側單詞查看技術細節
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ========================================================================
        // 👑 LEVEL 合流註冊名冊大盤 👑
        // 我們將單元 (Unit) 降級為屬性，改以 LEVEL 為加載主體
        // ========================================================================
        const libraryLevelRegistry = [
            { 
                category: 'beginner', 
                catName: '初心者文獻', 
                levelNum: 1, 
                levelName: '基礎通識大辭典',
                files: [
                    'beginner_codex_course/course_data_1-1.js',
                    'beginner_codex_course/course_data_1-2.js',
                    'beginner_codex_course/course_data_1-3.js',
                    'beginner_codex_course/course_data_1-4.js'
                ]
            },
            { 
                category: 'beginner', 
                catName: '初心者文獻', 
                levelNum: 2, 
                levelName: '進階工廠大辭典',
                files: ['beginner_codex_course/course_data_2-1.js']
            },
            { 
                category: 'beginner', 
                catName: '初心者文獻', 
                levelNum: 3, 
                levelName: 'TPM思考邏輯辭典',
                files: ['beginner_codex_course/course_data_3-1.js']
            },
            { 
                category: 'handbook', 
                catName: '冒險者文獻', 
                levelNum: 1, 
                levelName: 'TPM天職實戰手冊',
                files: [
                    'handbook_data_course/handbook_data_1-1.js',
                    'handbook_data_course/handbook_data_1-2.js'
                ]
            }
        ];

        let currentActiveCategory = 'beginner';
        let currentActiveLevel = null;
        let activeTermIdx = -1;
        window.aggregatedTermsPool = []; // 全量詞條池

        window.onload = () => {
            renderGlobalTree();
            renderDashboard();
        };

        // 🎯 👑 側邊欄：收攏至階層維度
        function renderGlobalTree() {
            const root = document.getElementById('global-tree-root');
            root.innerHTML = '';
            
            const cats = [...new Set(libraryLevelRegistry.map(r => r.category))];
            cats.forEach(catId => {
                const levels = libraryLevelRegistry.filter(r => r.category === catId);
                const block = document.createElement('div');
                block.className = 'menu-category-block';
                block.innerHTML = `
                    <div class="tree-main-toggle" onclick="toggleMenuSection('tree-${catId}')">
                        <span>📖 ${levels[0].catName}</span>
                    </div>
                    <div id="tree-${catId}" class="tree-sub-group">
                        ${levels.map(l => `<button class="level-btn" id="btn-L${catId}-${l.levelNum}" onclick="loadLevelLexicon('${catId}', ${l.levelNum})">LEVEL ${l.levelNum} 辭典 <span>➔</span></button>`).join('')}
                    </div>
                `;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = (el.style.display === 'none' ? 'flex' : 'none');
        }

        function renderDashboard() {
            const grid = document.getElementById('category-selector-grid');
            grid.innerHTML = '';
            libraryLevelRegistry.forEach(l => {
                grid.innerHTML += `
                    <div class="level-hero-card" onclick="loadLevelLexicon('${l.category}', ${l.levelNum})">
                        <div style="font-family:monospace; font-weight:900; color:#94A3B8;">${l.category.toUpperCase()}</div>
                        <div style="font-size:1.3rem; font-weight:900;">LEVEL ${l.levelNum}</div>
                        <div style="font-size:0.85rem; font-weight:800; color:var(--text-secondary);">${l.levelName}</div>
                    </div>
                `;
            });
        }

        // ========================================================================
        // 👑 核心引擎：多軌並行加載器 (Sequential Batch Loader) 👑
        // ========================================================================
        async function loadLevelLexicon(catId, lvlNum) {
            const target = libraryLevelRegistry.find(r => r.category === catId && r.levelNum === lvlNum);
            if (!target) return;

            // 視覺狀態重置
            currentActiveLevel = target;
            activeTermIdx = -1;
            window.aggregatedTermsPool = [];
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-L${catId}-${lvlNum}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('dashboard-menu-hall').style.display = 'none';
            document.getElementById('lexicon-viewport').style.display = 'flex';
            document.getElementById('current-category-id').innerText = `${catId.toUpperCase()} / LEVEL ${lvlNum}`;
            document.getElementById('current-level-name').innerText = target.levelName;
            document.getElementById('lexicon-terms-list').innerHTML = `<div class="inspector-placeholder">正在檢索 Level ${lvlNum} 全量文獻...</div>`;

            // 發動批次載入遞迴
            await sequenceLoadScripts(target.files, 0);

            // 合流 Supplementary 全球增補字典
            const suppKeyBase = (catId === 'beginner' ? 'codex' : 'handbook');
            target.files.forEach(filePath => {
                // 從路徑抓取 ID (例如 1-1)
                const match = filePath.match(/(\d-\d)/);
                if (match) {
                    const unitId = match[0];
                    const dictKey = `${suppKeyBase}-${unitId}`;
                    if (window.globalSupplementaryDictionary && window.globalSupplementaryDictionary[dictKey]) {
                        window.globalSupplementaryDictionary[dictKey].forEach(supp => {
                            if (!window.aggregatedTermsPool.some(t => t.name === supp.name)) {
                                window.aggregatedTermsPool.push({ ...supp, isSupp: true });
                            }
                        });
                    }
                }
            });

            renderLexiconList();
        }

        // 遞迴按順序載入 JS 檔案並現地解包
        function sequenceLoadScripts(fileList, index) {
            return new Promise((resolve) => {
                if (index >= fileList.length) {
                    resolve();
                    return;
                }

                const script = document.createElement('script');
                script.src = `${fileList[index]}?v=${Date.now()}`;
                script.onload = () => {
                    // 解包目前變數
                    const payload = (window.codexCourseEngineData && window.codexCourseEngineData.length > 0)
                                    ? window.codexCourseEngineData
                                    : window.libraryCourseEngineData;
                    
                    if (payload && payload[0]) {
                        payload[0].subPages.forEach(page => {
                            if (page.diagramFlowArray) {
                                page.diagramFlowArray.forEach(term => {
                                    if (!window.aggregatedTermsPool.some(t => t.name === term.name)) {
                                        window.aggregatedTermsPool.push(term);
                                    }
                                });
                            }
                        });
                    }
                    // 清空變數防止下一個檔案污染
                    window.codexCourseEngineData = [];
                    window.libraryCourseEngineData = [];
                    
                    sequenceLoadScripts(fileList, index + 1).then(resolve);
                };
                script.onerror = () => {
                    console.error("加載遺失:", fileList[index]);
                    sequenceLoadScripts(fileList, index + 1).then(resolve);
                };
                document.head.appendChild(script);
            });
        }

        // 👑 渲染左側列表
        function renderLexiconList() {
            const list = document.getElementById('lexicon-terms-list');
            list.innerHTML = '';
            
            if (window.aggregatedTermsPool.length === 0) {
                list.innerHTML = `<div class="inspector-placeholder">該階層尚無術語存檔</div>`;
                return;
            }

            window.aggregatedTermsPool.forEach((term, idx) => {
                const row = document.createElement('div');
                row.className = `lexicon-term-row ${idx === activeTermIdx ? 'active-term' : ''}`;
                const prefix = term.isSupp ? "🔥" : "📘";
                row.innerHTML = `<span>${prefix} ${term.name.replace(/🔑/g,'').trim()}</span> <span>➔</span>`;
                row.onclick = () => {
                    activeTermIdx = idx;
                    renderLexiconList();
                    showDetail(term.text);
                };
                list.appendChild(row);
            });
        }

        function showDetail(html) {
            const inspector = document.getElementById('lexicon-inspector');
            inspector.innerHTML = `
                <div style="animation: fadeInBox 0.2s ease-out; line-height:1.7;">
                    ${html}
                </div>
            `;
        }

        function exitToDashboard() {
            document.getElementById('dashboard-menu-hall').style.display = 'block';
            document.getElementById('lexicon-viewport').style.display = 'none';
            document.getElementById('current-category-id').innerText = `LEXICON INDEX`;
            document.getElementById('current-level-name').innerText = "圖書文獻檢索大廳";
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
        }
    </script>
</body>
</html>
