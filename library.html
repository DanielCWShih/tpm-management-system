<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識圖書館 | System TPM Library Hub</title>
    <style>
        /* ========================================================================
        REVISION HISTORY / VERSION LOG
        ========================================================================
        2026-06-04 V11.00-LEXICON-SUPREME: 👑 知識圖書館終極完全體（A-Z排序與我的最愛快取合流完璧版）
        1. 移除卡牌標籤：全面摘除小卡片頂部的 Core 與 SUPP 標籤字樣，卡片畫面純淨輸出單個核心名詞縮寫。
        2. A-Z 剛性數理排序：不論進入何種 LEVEL 或是我的最愛收藏庫，字盤大腦全自動依據 A-Z 字母與音序進行剛性升序排列。
        3. 我的最愛全域大腦：Dashboard 頂部全新增設「個人:」群組與「❤️ 我的最愛」大卡牌，內頁觀測儀內建 🤍/❤️ 狀態機切換。
        4. 3D 邊界防火牆：100% 維持外襯四邊安全 Padding 緩衝，留足 3D 按壓懸浮像素空間，絕不切除最左側卡片黑框邊界。
        ========================================================================
        */
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
            --color-locked-gray: #E2E8F0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        .sidebar-panel {
            display: flex;
            width: 350px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 12px;
        }

        .tree-level-toggle {
            width: 100%;
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            margin-bottom: 4px;
            box-shadow: 2px 2px 0px var(--border-heavy);
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .level-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.1s;
            display: flex;
            justify-content: space-between;
        }

        .level-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .level-btn.active {
            background: var(--color-active-gold) !important;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dashboard-view-hall,
        .document-canvas {
            display: none;
            width: 100%;
            height: 100%;
        }

        .dashboard-view-hall {
            display: block; 
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px 20px 40px 15px; 
        }

        .document-canvas {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            gap: 24px;
        }

        /* ─── ⚖️ 左右雙軌戰術分流觀測大盤 ─── */
        .lexicon-index-column {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden; 
            display: grid;
            grid-template-columns: repeat(6, 1fr); 
            grid-auto-rows: min-content;
            gap: 12px;
            padding: 10px 14px 14px 10px; 
            align-content: start; 
        }

        /* 🎯 UI 重構：極簡純淨小卡片樣式 */
        .lexicon-term-row {
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            border-radius: 6px;
            padding: 12px 6px;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 75px; 
            word-break: break-word; 
        }

        .lexicon-term-row:hover {
            background: #FFFDF4;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--border-heavy);
        }

        .lexicon-term-row.active-term {
            background: var(--color-active-gold) !important;
            border-width: 2.5px;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .fixed-inspector-panel {
            width: 460px;
            border: 4px solid var(--border-heavy);
            background: #FFFDF2;
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow-tactical);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100%;
            flex-shrink: 0;
            position: relative; /* 預留心形釘死定位 */
        }

        .inspector-placeholder {
            margin: auto;
            text-align: center;
            color: #94A3B8;
            font-weight: 800;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        @keyframes fadeInBox {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .level-hero-card {
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            padding: 20px 8px;
            background: #FFF;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            transition: all 0.12s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 70px;
        }

        .level-hero-card:hover {
            background: var(--sidebar-cream);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;">知識圖書館</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">👤 冒險者：Daniel Shih</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core active">TW</button>
                <button class="lang-btn-core">EN</button>
            </div>
            <a href="index.html" class="back-btn">返回總部</a>
        </div>
    </div>

    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboard()">↩ 返回圖書大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">LEXICON INDEX</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">圖書文獻檢索大廳</h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall"></div>

            <div class="document-canvas" id="lexicon-viewport">
                <div class="lexicon-index-column" id="lexicon-terms-list"></div>
                <div class="fixed-inspector-panel" id="lexicon-inspector">
                    <div class="inspector-placeholder">
                        🎯 階層合流完成<br>請點擊左側單詞查看技術細節
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const libraryLevelRegistry = [
            { 
                category: 'beginner', 
                catName: '初心者', 
                levelNum: 1, 
                levelName: '基礎通識大辭典',
                files: [
                    'library_data/library_data_beginner_1-1.js',
                    'library_data/library_data_beginner_1-2.js',
                    'library_data/library_data_beginner_1-3.js',
                    'library_data/library_data_beginner_1-4.js'
                ]
            },
            { 
                category: 'beginner', 
                catName: '初心者', 
                levelNum: 2, 
                levelName: '進階工廠大辭典',
                files: ['library_data/library_data_beginner_2-1.js']
            },
            { 
                category: 'beginner', 
                catName: '初心者', 
                levelNum: 3, 
                levelName: 'TPM思考邏輯辭典',
                files: ['library_data/library_data_beginner_3-1.js']
            },
            { 
                category: 'handbook', 
                catName: '冒險者', 
                levelNum: 1, 
                levelName: 'TPM天職實戰手冊',
                files: [
                    'handbook_data_course/handbook_data_1-1.js',
                    'handbook_data_course/handbook_data_1-2.js'
                ]
            }
        ];

        const globalCategoryMetadata = [
            { id: 'beginner', name: '初心者' },
            { id: 'handbook', name: '冒險者' }
        ];

        let selectedActiveTabType = 'beginner'; 
        let activeTermIdx = -1;
        window.aggregatedTermsPool = []; 
        window.currentlyViewedTerm = null;
        window.isInsideFavoritesView = false;

        window.onload = () => {
            renderGlobalTree();
            renderDashboard();
        };

        function renderGlobalTree() {
            const root = document.getElementById('global-tree-root');
            if (!root) return;
            root.innerHTML = '';
            
            const cats = [...new Set(libraryLevelRegistry.map(r => r.category))];
            cats.forEach(catId => {
                const levels = libraryLevelRegistry.filter(r => r.category === catId);
                const block = document.createElement('div');
                block.className = 'menu-category-block';
                
                const catMeta = globalCategoryMetadata.find(m => m.id === catId);
                const catLabelName = catMeta ? catMeta.name : '未知';

                block.innerHTML = `
                    <div class="tree-main-toggle" onclick="toggleMenuSection('tree-${catId}')">
                        <span>📖 ${catLabelName}文獻</span>
                    </div>
                    <div id="tree-${catId}" class="tree-sub-group">
                        ${levels.map(l => `<button class="level-btn" id="btn-L${catId}-${l.levelNum}" onclick="loadLevelLexicon('${catId}', ${l.levelNum})">LEVEL ${l.levelNum} <span>➔</span></button>`).join('')}
                    </div>
                `;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = (el.style.display === 'none' ? 'flex' : 'none');
        }

        // 🎯 👑 變更點：完美平鋪「個人、初心者、冒險者」三大層級 7欄網格矩陣
        function renderDashboard() {
            const container = document.getElementById('dashboard-menu-hall');
            if (!container) return;
            container.innerHTML = '';

            // ─── 👑 1. 個人專區 (置頂首發) ───
            const personalHeading = document.createElement('div');
            personalHeading.style.fontWeight = '900';
            personalHeading.style.fontSize = '1.15rem';
            personalHeading.style.margin = '20px 0 12px 2px';
            personalHeading.style.color = 'var(--text-main)';
            personalHeading.innerText = '個人:';
            container.appendChild(personalHeading);

            const personalGrid = document.createElement('div');
            personalGrid.style.display = 'grid';
            personalGrid.style.gridTemplateColumns = 'repeat(7, 1fr)';
            personalGrid.style.gap = '15px';
            personalGrid.style.width = '100%';
            personalGrid.style.padding = '6px';
            personalGrid.style.marginBottom = '20px';

            const favCard = document.createElement('div');
            favCard.className = 'level-hero-card';
            favCard.onclick = () => loadFavoritesLexicon();
            favCard.innerHTML = `<div style="font-size:1.1rem; font-weight:900; letter-spacing:0.5px;">❤️ 我的最愛</div>`;
            personalGrid.appendChild(favCard);
            container.appendChild(personalGrid);

            const personalSep = document.createElement('div');
            personalSep.style.borderBottom = '3px dashed var(--border-heavy)';
            personalSep.style.width = '100%';
            personalSep.style.margin = '25px 0 15px 0';
            container.appendChild(personalSep);

            // ─── 👑 2. 核心文獻專區分流 ───
            const targetGroups = [
                { id: 'beginner', title: '初心者:' },
                { id: 'handbook', title: '冒險者:' }
            ];

            targetGroups.forEach((group, gIdx) => {
                const heading = document.createElement('div');
                heading.style.fontWeight = '900';
                heading.style.fontSize = '1.15rem';
                heading.style.margin = '20px 0 12px 2px';
                heading.style.color = 'var(--text-main)';
                heading.innerText = group.title;
                container.appendChild(heading);

                const grid = document.createElement('div');
                grid.style.display = 'grid';
                grid.style.gridTemplateColumns = 'repeat(7, 1fr)'; 
                grid.style.gap = '15px';
                grid.style.width = '100%';
                grid.style.padding = '6px';
                grid.style.marginBottom = '20px';

                const subset = libraryLevelRegistry.filter(l => l.category === group.id);
                
                subset.forEach(l => {
                    const card = document.createElement('div');
                    card.className = 'level-hero-card';
                    card.onclick = () => loadLevelLexicon(l.category, l.levelNum);
                    card.innerHTML = `<div style="font-size:1.1rem; font-weight:900; letter-spacing:0.5px;">LEVEL ${l.levelNum}</div>`;
                    grid.appendChild(card);
                });

                container.appendChild(grid);

                if (gIdx < targetGroups.length - 1) {
                    const separator = document.createElement('div');
                    separator.style.borderBottom = '3px dashed var(--border-heavy)';
                    separator.style.width = '100%';
                    separator.style.margin = '25px 0 15px 0';
                    container.appendChild(separator);
                }
            });
        }

        // 🎯 👑 變更點：清洗提取名詞大腦，只留單個純淨代碼
        function getCleanTermName(name) {
            let clean = (name || '').replace(/🔑|關鍵詞：|關鍵詞:|增補：|增補:/g, '').trim();
            let engMatch = clean.match(/^([A-Za-z0-9\s\-]+)/);
            if (engMatch && engMatch[1].trim().length > 1) {
                return engMatch[1].trim();
            }
            return clean.split(/[\(\（\s]/)[0];
        }

        async function loadLevelLexicon(catId, lvlNum) {
            const target = libraryLevelRegistry.find(r => r.category === catId && r.levelNum === lvlNum);
            if (!target) return;

            window.isInsideFavoritesView = false;
            activeTermIdx = -1;
            window.aggregatedTermsPool = [];
            
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-L${catId}-${lvlNum}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('dashboard-menu-hall').style.display = 'none';
            document.getElementById('lexicon-viewport').style.display = 'flex';
            
            const categoryEl = document.getElementById('current-chapter-id');
            const levelEl = document.getElementById('current-chapter-name');
            if (categoryEl) categoryEl.innerText = `${catId.toUpperCase()} / LEVEL ${lvlNum}`;
            if (levelEl) levelEl.innerText = `LEVEL ${lvlNum} 大辭典`;

            const listContainer = document.getElementById('lexicon-terms-list');
            if (listContainer) listContainer.innerHTML = `<div class="inspector-placeholder">正在多軌並行解包 LEVEL ${lvlNum} 全量關鍵字...</div>`;

            const loadPromises = target.files.map(filePath => singleScriptFetchEngine(filePath));
            await Promise.all(loadPromises);

            const suppKeyBase = (catId === 'beginner' ? 'codex' : 'handbook');
            target.files.forEach(filePath => {
                const match = filePath.match(/(\d-\d)/);
                if (match) {
                    const unitId = match[0];
                    const dictKey = `${suppKeyBase}-${unitId}`;
                    if (window.globalSupplementaryDictionary && window.globalSupplementaryDictionary[dictKey]) {
                        window.globalSupplementaryDictionary[dictKey].forEach(supp => {
                            if (!window.aggregatedTermsPool.some(t => t.name === supp.name)) {
                                window.aggregatedTermsPool.push({ ...supp, isSupp: true });
                            }
                        });
                    }
                }
            });

            // 🎯 👑 變更點：強制 A-Z 剛性排序
            window.aggregatedTermsPool.sort((a, b) => {
                let nameA = getCleanTermName(a.name);
                let nameB = getCleanTermName(b.name);
                return nameA.localeCompare(nameB, 'en', { sensitivity: 'base', numeric: true });
            });

            renderLexiconList();
        }

        // ─── 👑 4. 我的最愛動態解包引擎 ───
        window.loadFavoritesLexicon = function() {
            window.isInsideFavoritesView = true;
            activeTermIdx = -1;
            
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('dashboard-menu-hall').style.display = 'none';
            document.getElementById('lexicon-viewport').style.display = 'flex';
            
            const categoryEl = document.getElementById('current-chapter-id');
            const levelEl = document.getElementById('current-chapter-name');
            if (categoryEl) categoryEl.innerText = `PERSONAL / FAVORITES`;
            if (levelEl) levelEl.innerText = `我的最愛收藏庫`;

            window.aggregatedTermsPool = JSON.parse(localStorage.getItem('library-favorites-pool') || '[]');
            
            window.aggregatedTermsPool.sort((a, b) => {
                let nameA = getCleanTermName(a.name);
                let nameB = getCleanTermName(b.name);
                return nameA.localeCompare(nameB, 'en', { sensitivity: 'base', numeric: true });
            });

            renderLexiconList();
            
            const inspector = document.getElementById('lexicon-inspector');
            if (inspector) {
                inspector.innerHTML = `
                    <div class="inspector-placeholder">
                        ❤️ 收藏庫載入完成<br>請點擊左側單詞查看詳細技術文獻
                    </div>
                `;
            }
        };

        function singleScriptFetchEngine(filePath) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = `${filePath}?v=${Date.now()}`;
                
                const parseAndHarvest = () => {
                    let combined = [];
                    if (window.libraryCourseEngineData && window.libraryCourseEngineData.length > 0) {
                        combined = combined.concat(window.libraryCourseEngineData);
                    }
                    if (window.codexCourseEngineData && window.codexCourseEngineData.length > 0) {
                        combined = combined.concat(window.codexCourseEngineData);
                    }
                    
                    combined.forEach(course => {
                        if (course.subPages) {
                            course.subPages.forEach(page => {
                                if (page.diagramFlowArray && page.diagramFlowArray.length > 0) {
                                    page.diagramFlowArray.forEach(term => {
                                        if (!window.aggregatedTermsPool.some(t => t.name === term.name)) {
                                            window.aggregatedTermsPool.push(term);
                                        }
                                    });
                                }
                                
                                if (page.text) {
                                    const regex = /tpmSwitchSubKwd\s*\(\s*[^,]+\s*,\s*[^,]+\s*,\s*[^,]+\s*,\s*['"]([^'"]+)['"]\s*,\s*['"]([^'"]+)['"]/g;
                                    let match;
                                    while ((match = regex.exec(page.text)) !== null) {
                                        const termName = match[1];
                                        const termDesc = match[2];
                                        const syntheticText = `<h3>全稱：${termName}</h3><div style="background:#FFFDF2; border:2px solid #1A1A1A; border-radius:6px; padding:12px; margin:12px 0; font-weight:700;">系統智能解包釋義</div><p style="line-height:1.7; font-weight:700; color:#475569;">${termDesc}</p>`;
                                        
                                        if (!window.aggregatedTermsPool.some(t => getCleanTermName(t.name) === getCleanTermName(termName))) {
                                            window.aggregatedTermsPool.push({
                                                name: termName,
                                                text: syntheticText
                                            });
                                        }
                                    }
                                }
                            });
                        }
                    });
                    window.codexCourseEngineData = [];
                    window.libraryCourseEngineData = [];
                };

                script.onload = () => {
                    parseAndHarvest();
                    resolve();
                };

                script.onerror = () => {
                    if (filePath.includes('library_data/library_data_beginner_')) {
                        const fallbackPath = filePath.replace('library_data/library_data_beginner_', 'beginner_codex_course/course_data_');
                        const fallbackScript = document.createElement('script');
                        fallbackScript.src = `${fallbackPath}?v=${Date.now()}`;
                        fallbackScript.onload = () => {
                            parseAndHarvest();
                            resolve();
                        };
                        fallbackScript.onerror = () => resolve();
                        document.head.appendChild(fallbackScript);
                    } else {
                        resolve();
                    }
                };
                document.head.appendChild(script);
            });
        }

        // 🎯 👑 變更點：完全移除 Core/SUPP 大頭行，只吐純粹名詞
        function renderLexiconList() {
            const list = document.getElementById('lexicon-terms-list');
            if (!list) return;
            list.innerHTML = '';
            
            if (window.aggregatedTermsPool.length === 0) {
                list.innerHTML = `
                    <div style="grid-column: span 6; border:2px dashed var(--border-heavy); background:#FFF; padding:30px; text-align:center; border-radius:6px; font-weight:900; color:var(--text-secondary); width:100%; margin-top:20px;">
                        ⚡ 該 LEVEL 階層文獻尚處於待開發排產階段 ⚡
                    </div>`;
                return;
            }

            window.aggregatedTermsPool.forEach((term, idx) => {
                const row = document.createElement('div');
                row.className = `lexicon-term-row ${idx === activeTermIdx ? 'active-term' : ''}`;
                let cleanName = getCleanTermName(term.name);
                
                row.innerHTML = `<div style="line-height:1.2; font-size:0.88rem; font-weight:900;">${cleanName}</div>`;
                
                row.onclick = () => {
                    activeTermIdx = idx;
                    renderLexiconList();
                    window.currentlyViewedTerm = term; 
                    showDetail(term);
                };
                list.appendChild(row);
            });
        }

        // ─── 👑 5. 觀測儀我的最愛雙向切換引擎 ───
        function showDetail(term) {
            const inspector = document.getElementById('lexicon-inspector');
            if (!inspector) return;

            const favoritesPool = JSON.parse(localStorage.getItem('library-favorites-pool') || '[]');
            const isFav = favoritesPool.some(f => f.name === term.name);

            inspector.innerHTML = `
                <div style="position:relative; width:100%; height:100%; animation: fadeInBox 0.15s ease-out;">
                    <div style="position:absolute; top:-10px; right:-10px; z-index:100;">
                        <button id="fav-toggle-btn" style="background:${isFav ? '#FFD2D2' : '#FFFFFF'}; border:2px solid var(--border-heavy); border-radius:6px; width:40px; height:40px; font-size:1.3rem; cursor:pointer; box-shadow:2px 2px 0px var(--border-heavy); display:flex; align-items:center; justify-content:center; transition:transform 0.1s;" onclick="window.toggleFavoriteCurrentTerm()">
                            ${isFav ? '❤️' : '🤍'}
                        </button>
                    </div>
                    <div style="line-height:1.7; font-size:0.88rem; padding-top:10px;">
                        ${term.text}
                    </div>
                </div>
            `;
        }

        window.toggleFavoriteCurrentTerm = function() {
            const term = window.currentlyViewedTerm;
            if (!term) return;

            let favoritesPool = JSON.parse(localStorage.getItem('library-favorites-pool') || '[]');
            const index = favoritesPool.findIndex(f => f.name === term.name);

            if (index > -1) {
                favoritesPool.splice(index, 1); 
            } else {
                favoritesPool.push(term); 
            }
            localStorage.setItem('library-favorites-pool', JSON.stringify(favoritesPool));

            const btn = document.getElementById('fav-toggle-btn');
            if (btn) {
                const isFav = favoritesPool.some(f => f.name === term.name);
                btn.style.background = isFav ? '#FFD2D2' : '#FFFFFF';
                btn.innerText = isFav ? '❤️' : '🤍';
            }

            if (window.isInsideFavoritesView) {
                window.aggregatedTermsPool = favoritesPool;
                window.aggregatedTermsPool.sort((a, b) => {
                    let nameA = getCleanTermName(a.name);
                    let nameB = getCleanTermName(b.name);
                    return nameA.localeCompare(nameB, 'en', { sensitivity: 'base', numeric: true });
                });
                renderLexiconList();
            }
        };

        function exitToDashboard() {
            const menuHall = document.getElementById('dashboard-menu-hall');
            const viewport = document.getElementById('lexicon-viewport');
            const categoryEl = document.getElementById('current-category-id');
            const levelEl = document.getElementById('current-level-name');

            if (menuHall) menuHall.style.display = 'block';
            if (viewport) viewport.style.display = 'none';
            if (categoryEl) categoryEl.innerText = `LEXICON INDEX`;
            if (levelEl) levelEl.innerText = "圖書文獻檢索大廳";
            
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            renderDashboard();
        }
    </script>
</body>
