<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.M. 戰略調度室 | Resource Allocation</title>
    <link rel="stylesheet" href="global_theme.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 僅保留調度室專屬拖曳與 Chart 排版樣式表 */
        .workspace-row { display: flex; flex: 1; width: 100%; overflow: hidden; }
        .side-dashboard-menu { width: 280px; background-color: var(--sidebar-cream); border-right: 3px solid var(--border-heavy); display: flex; flex-direction: column; padding: 25px; flex-shrink: 0; }
        .side-dashboard-menu li { padding: 14px 20px; margin-bottom: 10px; border-radius: var(--radius-sm); border: 2px solid var(--border-heavy); background: #FFF; cursor: pointer; font-weight: 800; box-shadow: 2px 2px 0px #000; }
        .side-dashboard-menu li.active { background: var(--text-main); color: #FFF; }
        .alloc-view { flex: 1; padding: 40px; overflow-y: auto; display: none; }
        .alloc-view.active { display: block; }
        .stats-grid-row { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-badge-box { flex: 1; background: #FFF; border: 3px solid var(--border-heavy); padding: 20px; border-radius: var(--radius-sm); text-align: center; box-shadow: var(--shadow-tactical); }
        .pool-dashed-box { background: #FFFDF0; border: 3px dashed var(--border-heavy); padding: 30px; border-radius: var(--radius-sm); margin-bottom: 30px; }
        .member-drag-card { background: #FFF; border: 2px solid #000; padding: 12px; border-radius: var(--radius-sm); cursor: grab; font-weight: 800; text-align: center; width: 110px; box-shadow: 3px 3px 0px #000; display: inline-block; margin: 8px; }
    </style>
</head>
<body style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

    <div class="workspace-row">
        <aside class="side-dashboard-menu">
            <ul style="list-style:none; padding:0; margin:0;">
                <li id="nav-overview" class="active" onclick="switchAllocView('overview')">📊 數據總覽</li>
                <li id="nav-kanban" onclick="switchAllocView('kanban')">📂 專案分配看板</li>
            </ul>
        </aside>

        <main style="padding:0; flex:1;">
            <div id="view-overview" class="alloc-view active">
                <div class="stats-grid-row">
                    <div class="stat-badge-box"><div style="font-size:0.85rem;font-weight:800;color:var(--text-secondary);">課內總編制</div><div style="font-size:2.5rem;font-weight:900;" id="total-m-count">3</div></div>
                    <div class="stat-badge-box" style="background:#FFF1F2;"><div style="font-size:0.85rem;font-weight:800;color:#E11D48;">戰力超負荷</div><div style="font-size:2.5rem;font-weight:900;color:#E11D48;">0</div></div>
                </div>
                <div style="background:#FFF; border:3px solid #000; padding:25px; border-radius:8px; box-shadow:var(--shadow-tactical); max-width:600px;">
                    <canvas id="loadChart"></canvas>
                </div>
            </div>

            <div id="view-kanban" class="alloc-view">
                <div class="pool-dashed-box">
                    <div style="font-weight:900;text-align:center;margin-bottom:15px;">📦 人才資源庫 (Common Pool)</div>
                    <div id="pool-container" style="min-height:80px;" ondrop="dropToPool(event)" ondragover="allowDrop(event)"></div>
                </div>
                <div style="display:flex; gap:25px;" id="project-board-row"></div>
            </div>
        </main>
    </div>

    <script src="global_ui.js"></script>
    <script>
        let members = [
            { id: 'm1', name: '施正偉', load: 80, assigned: 'ksh5' },
            { id: 'm2', name: '許源', load: 60, assigned: 'pool' },
            { id: 'm3', name: 'Daniel Shih', load: 45, assigned: 'pool' }
        ];
        let projects = [{ id: 'ksh5', name: 'KSH5 (P27)' }];
        function switchAllocView(id) {
            document.querySelectorAll('.alloc-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.side-dashboard-menu li').forEach(l => l.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('active');
            if(id === 'kanban') renderKanban();
        }
        function renderKanban() {
            document.getElementById('pool-container').innerHTML = '';
            const board = document.getElementById('project-board-row'); board.innerHTML = '';
            projects.forEach(p => {
                board.innerHTML += `<div class="dashboard-card" style="min-height:220px; justify-content:flex-start;"><h3 style="margin:0 0 15px 0;">${p.name}</h3><div id="proj-${p.id}" style="min-height:100px; width:100%; border:2px dashed #CBD5E1; padding:10px;" ondrop="dropToProj(event,'${p.id}')" ondragover="allowDrop(event)"></div></div>`;
            });
            members.forEach(m => {
                const card = `<div class="member-drag-card" draggable="true" id="card-${m.id}" ondragstart="drag(event)">${m.name}</div>`;
                if(m.assigned === 'pool') { document.getElementById('pool-container').innerHTML += card; }
                else { const zone = document.getElementById('proj-' + m.assigned); if(zone) zone.innerHTML += card; }
            });
        }
        function allowDrop(e) { e.preventDefault(); }
        function drag(e) { e.dataTransfer.setData("text", e.target.id); }
        function dropToProj(e, pid) { e.preventDefault(); const id = e.dataTransfer.getData("text").replace('card-',''); members.find(m=>m.id===id).assigned = pid; renderKanban(); }
        function dropToPool(e) { e.preventDefault(); const id = e.dataTransfer.getData("text").replace('card-',''); members.find(m=>m.id===id).assigned = 'pool'; renderKanban(); }
        function setLang(lang) {
            const ctx = document.getElementById('loadChart');
            if(ctx) { new Chart(ctx, { type: 'bar', data: { labels: ['施正偉', '許源', 'Daniel'], datasets: [{ label: '戰力負荷 (HRS/WK)', data: [80, 60, 45], backgroundColor: ['#3B82F6', '#F59E0B', '#10B981'], borderColor: '#1A1A1A', borderWidth: 2 }] }, options: { scales: { y: { beginAtZero: true } } } }); }
        }
    </script>
</body>
</html>
