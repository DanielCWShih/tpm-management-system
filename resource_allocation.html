<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.M. 調度室 | System TPM Resource Allocation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #FEF9E7; --sidebar-cream: #FDF2D0; --card-white: #FFFFFF;
            --text-main: #1A1A1A; --text-secondary: #475569; --border-heavy: #1A1A1A;
            --shadow-tactical: 6px 6px 0px #1A1A1A; --radius-sm: 12px;
            --tier-hard: #DC2626;
        }
        * { box-sizing: border-box; font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif; color: var(--text-main); }
        body { background-color: var(--bg-color); background-image: radial-gradient(var(--sidebar-cream) 2px, transparent 2px); background-size: 32px 32px; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }

        header { text-align: center; margin-bottom: 40px; width: 100%; position: relative; }
        .back-btn { position: absolute; top: 0; left: 0; background: var(--card-white); border: 3px solid var(--border-heavy); padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 900; text-decoration: none; box-shadow: 4px 4px 0px var(--border-heavy); }
        .head-controls { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 20px; }
        .auth-panel { background: var(--card-white); border: 3px solid var(--border-heavy); padding: 12px 25px; border-radius: var(--radius-sm); font-weight: 900; box-shadow: 4px 4px 0px var(--border-heavy); color:var(--tier-hard); }
        h1 { font-size: 2.8rem; margin: 0; font-weight: 900; }
        
        .alloc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; width: 100%; margin-top: 40px; }
        .stat-card { background: var(--card-white); border: 3px solid var(--border-heavy); border-radius: var(--radius-sm); padding: 30px; box-shadow: var(--shadow-tactical); }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn" data-i18n="back-to-hq">↩ 返回公會總部</a>
        
        <div class="head-controls">
            <div id="user-profile" class="auth-panel">👤 G.M. Daniel認證中</div>
        </div>

        <h1 data-i18n="gm-title">G.M. 公會長戰略調度室</h1>
    </header>

    <div class="alloc-grid">
        <div class="stat-card" style="grid-column: span 2;">
            <canvas id="loadChart"></canvas>
        </div>
    </div>

    <footer><span data-i18n="operator">OPERATOR: DANIEL SHIH / GUILD.STRATEGY V1</span></footer>

    <script>
        const translations = {
            tw: { "back-to-hq": "↩ 返回公會總部", "gm-title": "G.M. 公會長戰略調度室", "operator": "OPERATOR: DANIEL SHIH / GUILD.STRATEGY V1" },
            en: { "back-to-hq": "↩ Back to HQ", "gm-title": "G.M. Strategy Desk", "operator": "OPERATOR: DANIEL SHIH / GUILD.STRATEGY V1" }
        };

        // 雖然G.M.房不顯示 lang-switcher，但我們必須讀取 index.html 保存的狀態，並執行靜態元素翻譯
        function initLang() {
            const lang = localStorage.getItem('tpm-lang-pref') || 'tw';
            document.querySelectorAll('[data-i18n]').forEach(el => { 
                const key = el.getAttribute('data-i18n'); 
                if(translations[lang][key]) el.innerText = translations[lang][key]; 
            });
        }

        window.onload = () => {
            initLang(); // 繼承 TW/EN 翻譯

            // 繼承身份識別
            const cachedName = localStorage.getItem('tpm-user-name');
            if (cachedName) {
                // 調度室固定顯示G.M.頭銜
                document.getElementById('user-profile').innerHTML = `👤 G.M.：${cachedName}`;
            }

            // 初始化 Chart.js 數據水晶
            const ctx = document.getElementById('loadChart');
            new Chart(ctx, { type: 'bar', data: { labels: ['Daniel', 'Rob', 'AD'], datasets: [{ label: '戰力負荷 (HRS/WK)', data: [110, 117, 78], backgroundColor: ['#3B82F6', '#3B82F6', '#FDE047'], borderColor: '#1A1A1A', borderWidth: 2 }] }, options: { scales: { y: { beginAtZero: true } } } });
        };
    </script>
</body>
</html>
