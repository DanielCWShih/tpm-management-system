<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職能手冊大廳 | System TPM Handbook Hub</title>
    <style>
        :root {
            --nordic-bg: #FAFAFA;
            --nordic-card: #FFFFFF;
            --nordic-text-main: #1C1917;
            --nordic-text-sub: #78716C;
            --nordic-border: #E7E5E4;
            --nordic-gray-dot: #D1D5DB;
            --nordic-yellow-dot: #EAB308;
            --radius-md: 6px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--nordic-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--nordic-text-main);
        }

        * {
            box-sizing: border-box;
        }

        /* 極簡頂部全域導航列 */
        .tactical-navbar {
            width: 100vw;
            height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--nordic-border);
            padding: 0 40px;
            background-color: var(--nordic-card);
            flex-shrink: 0;
            z-index: 1000;
        }

        .auth-panel {
            background: var(--nordic-bg);
            border: 1px solid var(--nordic-border);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .back-btn {
            background: var(--nordic-text-main);
            color: #FFFFFF;
            border: none;
            padding: 9px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.82rem;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.15s;
        }

        .back-btn:hover {
            opacity: 0.85;
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 75px);
            overflow: hidden;
        }

        /* 左側：北歐極簡沙盒無限畫布地圖 */
        .sandbox-map-canvas {
            flex: 1;
            height: 100%;
            background-color: var(--nordic-bg);
            position: relative;
            overflow: auto;
            cursor: grab;
        }

        .sandbox-map-canvas:active {
            cursor: grabbing;
        }

        /* SVG 連線層 */
        .map-svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 2000px;
            height: 2000px;
            pointer-events: none;
            z-index: 1;
        }

        /* 剛性極簡圓點 */
        .map-node-dot {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            z-index: 10;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--nordic-gray-dot);
            border: 2px solid transparent;
        }

        /* 圓點狀態機 */
        .map-node-dot.passed {
            background-color: var(--nordic-yellow-dot) !important;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
        }

        .map-node-dot.active-target {
            border-color: var(--nordic-text-main) !important;
            animation: pulseCircle 1.8s infinite ease-in-out;
        }

        .map-node-dot.locked {
            background-color: var(--nordic-gray-dot);
            opacity: 0.4;
            cursor: not-allowed;
        }

        @keyframes pulseCircle {
            0% { box-shadow: 0 0 0 0 rgba(28, 25, 23, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(28, 25, 23, 0); }
            100% { box-shadow: 0 0 0 0 rgba(28, 25, 23, 0); }
        }

        /* 節點微縮文字提示 */
        .node-mini-label {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--nordic-text-sub);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        /* 右側：冷色調戰術觀測儀 */
        .fixed-inspector-panel {
            width: 480px;
            height: 100%;
            background: var(--nordic-card);
            border-left: 1px solid var(--nordic-border);
            padding: 35px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 100;
        }

        .inspector-scroll-box {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .inspector-placeholder {
            margin: auto;
            text-align: center;
            color: var(--nordic-text-sub);
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* 選擇題與按鈕極簡樣式 */
        .nordic-option-btn {
            width: 100%;
            background: var(--nordic-bg);
            border: 1px solid var(--nordic-border);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            margin-top: 12px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--nordic-text-main);
            transition: all 0.1s ease;
        }

        .nordic-option-btn:hover {
            background: #F5F5F4;
            border-color: #B45309;
        }

        .nordic-action-btn {
            background: var(--nordic-text-main);
            color: #FFFFFF;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: opacity 0.1s;
        }

        .nordic-action-btn:hover {
            opacity: 0.9;
        }

        @keyframes fadeInNode {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">冒險者手冊</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">首頁登入</div>
            <div class="lang-switcher-wrapper" style="display:none;"></div>
            <a href="index.html" class="back-btn">返回首頁</a>
        </div>
    </div>

    <div class="workspace-container">
        <main class="sandbox-map-canvas" id="map-scroll-stage">
            <svg class="map-svg-layer" id="map-svg-canvas"></svg>
            <div id="map-nodes-container"></div>
        </main>

        <aside class="fixed-inspector-panel" id="sandbox-inspector">
            <div class="inspector-placeholder">
                🗺️ 沙盒模組載入完成<br>請點擊左側地圖圓點開啟戰術步道
            </div>
        </aside>
    </div>

    <script src="handbook_data_course/handbook_data_1-2.js?v=20260604"></script>

    <script>
        // ========================================================================
        // 👑 北歐極簡自動化拓撲渲染引擎 (Nordic Graph Engine) 👑
        // ========================================================================
        
        // 🎯 坐標清單大盤：精準配置各節點在無限畫布上的黃金分配坐標 (X, Y)
        const nodeLayoutCoordinates = {
            "START-NODE": { x: 120, y: 300, name: "事件爆發" },
            "DECISION-NODE-01": { x: 300, y: 300, name: "決策分流" },
            "FAIL-NODE-SKIP": { x: 500, y: 160, name: "盲目放行" },
            "WARN-NODE-FIGHT": { x: 500, y: 300, name: "剛性抗爭" },
            "QUIZ-NODE-STACKUP": { x: 500, y: 440, name: "技術排查" },
            "WIN-NODE-CONQUER": { x: 720, y: 440, name: "完美通關" }
        };

        // 核心動態進度狀態機組
        let unlockedNodesList = ["START-NODE"]; 
        let passedNodesList = []; 
        let currentlySelectedNodeId = null;

        // 頁面加載主通航線
        window.addEventListener('DOMContentLoaded', () => {
            initSandboxProgressStore();
            renderNordicSandboxMap();
        });

        // 進度快取調閱器
        function initSandboxProgressStore() {
            const savedPassed = localStorage.getItem('tpm-sandbox-passed-nodes');
            const savedUnlocked = localStorage.getItem('tpm-sandbox-unlocked-nodes');
            if (savedPassed) passedNodesList = JSON.parse(savedPassed);
            if (savedUnlocked) unlockedNodesList = JSON.parse(savedUnlocked);
            
            // 確保起點永久開通
            if (!unlockedNodesList.includes("START-NODE")) unlockedNodesList.push("START-NODE");
        }

        function saveSandboxProgressStore() {
            localStorage.setItem('tpm-sandbox-passed-nodes', JSON.stringify(passedNodesList));
            localStorage.setItem('tpm-sandbox-unlocked-nodes', JSON.stringify(unlockedNodesList));
        }

        // 👑 核心網格繪製器：渲染圓點與極細 SVG 指針連線
        function renderNordicSandboxMap() {
            const nodesContainer = document.getElementById('map-nodes-container');
            const svgCanvas = document.getElementById('map-svg-canvas');
            if (!nodesContainer || !svgCanvas || !window.tpmSandboxScriptTree) return;

            nodesContainer.innerHTML = '';
            svgCanvas.innerHTML = '';

            const tree = window.tpmSandboxScriptTree;

            // 1. 雙向合流：依據關卡定義動態拉出 SVG 連線
            Object.keys(tree).forEach(srcId => {
                const srcNode = tree[srcId];
                const srcPos = nodeLayoutCoordinates[srcId];
                if (!srcPos || !srcNode.nextNodes) return;

                srcNode.nextNodes.forEach(tarId => {
                    const tarPos = nodeLayoutCoordinates[tarId];
                    if (!tarPos) return;

                    // 判斷該連線是否已被學員激活開通
                    const isLineActive = passedNodesList.includes(srcId) && unlockedNodesList.includes(tarId);

                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", srcPos.x);
                    line.setAttribute("y1", srcPos.y);
                    line.setAttribute("x2", tarPos.x);
                    line.setAttribute("y2", tarPos.y);
                    line.setAttribute("stroke", isLineActive ? "#EAB308" : "#E2E8F0");
                    line.setAttribute("stroke-width", isLineActive ? "2" : "1.5");
                    if (!isLineActive) line.setAttribute("stroke-dasharray", "4,4"); // 未解鎖走虛線迷霧
                    svgCanvas.appendChild(line);
                });
            });

            // 2. 實體點對位：渲染北歐風極簡圓點
            Object.keys(tree).forEach(nodeId => {
                const nodeData = tree[nodeId];
                const pos = nodeLayoutCoordinates[nodeId];
                if (!pos) return;

                const dot = document.createElement('div');
                const isUnlocked = unlockedNodesList.includes(nodeId);
                const isPassed = passedNodesList.includes(nodeId);

                dot.id = `dot-${nodeId}`;
                dot.className = 'map-node-dot';
                dot.style.left = `${pos.x}px`;
                dot.style.top = `${pos.y}px`;

                // 注入微縮標籤文字
                dot.innerHTML = `<div class="node-mini-label">${pos.name}</div>`;

                // 狀態機濾鏡分配
                if (isPassed) {
                    dot.classList.add('passed');
                } else if (isUnlocked) {
                    // 若已解鎖但未通過，且非當前選中，則為潛在目標
                    if (nodeId === currentlySelectedNodeId) dot.classList.add('active-target');
                } else {
                    dot.classList.add('locked');
                }

                // 綁定點擊事件
                dot.onclick = () => {
                    if (!unlockedNodesList.includes(nodeId)) {
                        alert("🔒 該戰術路徑前方迷霧未解鎖，請先通過上游決策關卡。");
                        return;
                    }
                    currentlySelectedNodeId = nodeId;
                    renderNordicSandboxMap(); // 刷新高亮狀態
                    inspectNodeDetail(nodeId);
                };

                nodesContainer.appendChild(dot);
            });
        }

        // ========================================================================
        // 👑 右側戰術通聯儀內容調度大腦 👑
        // ========================================================================
        function inspectNodeDetail(nodeId) {
            const inspector = document.getElementById('sandbox-inspector');
            const node = window.tpmSandboxScriptTree[nodeId];
            if (!inspector || !node) return;

            let contentHtml = `<div class="inspector-scroll-box" style="animation: fadeInNode 0.15s ease-out;">`;

            if (node.type === "story") {
                // 📖 劇情故事關卡
                contentHtml += `
                    <div style="font-size:0.75rem; color:var(--nordic-text-sub); font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">STORY MODULE</div>
                    <h2 style="margin:0 0 16px 0; font-size:1.4rem; font-weight:800; letter-spacing:-0.5px;">${node.title}</h2>
                    <div style="color:#444;">${node.text}</div>
                    <button class="nordic-action-btn" onclick="executePassNode('${nodeId}')">➔ 前進至決策關卡</button>
                `;
            } else if (node.type === "decision") {
                // ⚔️ 分支抉擇關卡
                contentHtml += `
                    <div style="font-size:0.75rem; color:#B45309; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">DECISION HUB</div>
                    <h2 style="margin:0 0 16px 0; font-size:1.35rem; font-weight:800; color:#B45309;">${node.title}</h2>
                    <p style="font-weight:700; font-size:0.95rem; background:#FFFBEB; padding:12px; border-left:4px solid #F59E0B; border-radius:4px;">${node.question}</p>
                    <div style="margin-top:20px;">
                        ${node.options.map((opt, idx) => `
                            <button class="nordic-option-btn" onclick="executeSelectBranch('${nodeId}', '${opt.target}')">
                                <b>決策 ${idx + 1}：</b> ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (node.type === "quiz") {
                // 📝 隨機大考關卡
                contentHtml += `
                    <div style="font-size:0.75rem; color:#1D4ED8; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">TACTICAL QUIZ</div>
                    <h2 style="margin:0 0 16px 0; font-size:1.35rem; font-weight:800; color:#1D4ED8;">${node.title}</h2>
                    <p style="font-weight:700; margin-bottom:20px;">${node.question}</p>
                    <div id="quiz-options-zone">
                        ${node.options.map((opt, idx) => `
                            <button class="nordic-option-btn" onclick="executeSubmitQuiz('${nodeId}', ${idx})">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (node.type.startsWith("end_")) {
                // 🏁 多重結局關卡 (end_win, end_fail, end_warn)
                let endColor = (node.type === "end_win") ? "#15803D" : (node.type === "end_fail" ? "#B91C1C" : "#6B7280");
                contentHtml += `
                    <div style="font-size:0.75rem; color:${endColor}; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;">SCENARIO ENDING</div>
                    <h2 style="margin:0 0 16px 0; font-size:1.4rem; font-weight:800; color:${endColor};">${node.title}</h2>
                    <div style="background:#FAF8F5; padding:16px; border-radius:6px; border:1px solid var(--nordic-border);">${node.text}</div>
                    <button class="nordic-action-btn" style="background:${endColor};" onclick="executeResetSandboxRoute()">🔄 重置沙盒重新抉擇</button>
                `;
            }

            contentHtml += `</div>`;
            inspector.innerHTML = contentHtml;
        }

        // 節點事件擊發：常規完成
        window.executePassNode = function(nodeId) {
            if (!passedNodesList.includes(nodeId)) passedNodesList.push(nodeId);
            
            const nodeData = window.tpmSandboxScriptTree[nodeId];
            if (nodeData && nodeData.nextNodes) {
                nodeData.nextNodes.forEach(nxt => {
                    if (!unlockedNodesList.includes(nxt)) unlockedNodesList.push(nxt);
                });
            }
            saveSandboxProgressStore();
            renderNordicSandboxMap();
            
            // 自動推進至下一個關卡點
            if (nodeData.nextNodes && nodeData.nextNodes.length > 0) {
                currentlySelectedNodeId = nodeData.nextNodes[0];
                inspectNodeDetail(currentlySelectedNodeId);
                renderNordicSandboxMap();
            }
        };

        // 節點事件擊發：抉擇分支選擇
        window.executeSelectBranch = function(nodeId, targetNodeId) {
            if (!passedNodesList.includes(nodeId)) passedNodesList.push(nodeId);
            if (!unlockedNodesList.includes(targetNodeId)) unlockedNodesList.push(targetNodeId);
            
            saveSandboxProgressStore();
            renderNordicSandboxMap();
            
            currentlySelectedNodeId = targetNodeId;
            inspectNodeDetail(targetNodeId);
            renderNordicSandboxMap();
        };

        // 節點事件擊發：技術考題提交與原地顯示解答
        window.executeSubmitQuiz = function(nodeId, selectedIdx) {
            const zone = document.getElementById('quiz-options-zone');
            const node = window.tpmSandboxScriptTree[nodeId];
            if (!zone || !node) return;

            const isCorrect = node.options[selectedIdx].isCorrect;
            
            // 原地解鎖渲染解答與下一步按鈕
            zone.innerHTML = `
                <div style="margin-top:15px; padding:16px; background:${isCorrect ? '#F0FDF4':'#FEF2F2'}; border-radius:6px; border:1px solid ${isCorrect?'#BBF7D0':'#FCA5A5'}; font-size:0.85rem;">
                    <div style="font-weight:800; font-size:1rem; color:${isCorrect?'#16A34A':'#DC2626'}; margin-bottom:6px;">
                        ${isCorrect ? '🏆 回答正確！':'💥 判斷錯誤！但身為 System TPM 仍需通讀以下詳解：'}
                    </div>
                    <div>${node.explanation}</div>
                </div>
                <button class="nordic-action-btn" onclick="executePassQuizNode('${nodeId}')">查看劇本最終大結局 ➔</button>
            `;
        };

        window.executePassQuizNode = function(nodeId) {
            if (!passedNodesList.includes(nodeId)) passedNodesList.push(nodeId);
            const nodeData = window.tpmSandboxScriptTree[nodeId];
            if (nodeData && nodeData.nextNodes) {
                nodeData.nextNodes.forEach(nxt => {
                    if (!unlockedNodesList.includes(nxt)) unlockedNodesList.push(nxt);
                });
            }
            saveSandboxProgressStore();
            renderNordicSandboxMap();

            if (nodeData.nextNodes && nodeData.nextNodes.length > 0) {
                currentlySelectedNodeId = nodeData.nextNodes[0];
                inspectNodeDetail(currentlySelectedNodeId);
                renderNordicSandboxMap();
            }
        };

        // 沙盒重置金鑰：允許反覆修煉
        window.executeResetSandboxRoute = function() {
            if (confirm("是否確認重置沙盒？這將重置本單元的分支地圖，但不會影響您的首頁總進度分數。")) {
                unlockedNodesList = ["START-NODE"];
                passedNodesList = [];
                currentlySelectedNodeId = null;
                saveSandboxProgressStore();
                renderNordicSandboxMap();
                document.getElementById('sandbox-inspector').innerHTML = `
                    <div class="inspector-placeholder">
                        🗺️ 沙盒模組重置完成<br>請點擊左側地圖圓點重啟戰術步道
                    </div>
                `;
            }
        };

        // ========================================================================
        // 👑 換裝定位點 2: 全域多階層頭銜連鎖同步大腦 (V11.50-AUTH-SHIELD) 👑
        // ========================================================================
        (function() {
            const PILOT_EMAIL = localStorage.getItem('tpm-user-current-email') || "";

            function computeLocalUserRankTitle() {
                if (!PILOT_EMAIL || PILOT_EMAIL.trim() === "") return { text: "首頁登入", isLogged: false };

                let nameStr = "Daniel Shih";
                const emailLower = PILOT_EMAIL.toLowerCase().trim();
                if (emailLower !== "danielcwshih@fih-foxconn.com") {
                    nameStr = emailLower.split('@')[0].replace(/[\._\-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                }

                const beginnerKeys = ['codex-L1-A1-clear', 'codex-L1-A2-clear', 'codex-L1-A3-clear', 'codex-L1-A4-clear', 'codex-L2-A1-clear', 'codex-L3-A1-clear'];
                const isAllBeginnerCleared = beginnerKeys.every(k => localStorage.getItem(k) === 'true');

                const adventureKeys = ['handbook-L1-A1-clear', 'handbook-L1-A2-clear'];
                const isAllAdventureCleared = adventureKeys.every(k => localStorage.getItem(k) === 'true');

                if (isAllBeginnerCleared && isAllAdventureCleared) return { text: `👤 統籌者 : ${nameStr}`, isLogged: true };
                if (isAllBeginnerCleared) return { text: `👤 冒險者 : ${nameStr}`, isLogged: true };
                return { text: `👤 初心者 : ${nameStr}`, isLogged: true };
            }

            const originalOnload = window.onload;
            window.onload = function() {
                if (originalOnload) originalOnload();
                const profileBox = document.getElementById('global-user-profile-card');
                if (profileBox) {
                    const rankInfo = computeLocalUserRankTitle();
                    profileBox.innerHTML = rankInfo.text;
                    if (!rankInfo.isLogged) {
                        profileBox.style.color = "#DC2626";
                        profileBox.style.borderColor = "#DC2626";
                        profileBox.style.boxShadow = "none";
                    }
                }
            };
        })();
    </script>
</body>
</html>
