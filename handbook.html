<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒險者手冊 | Adventurer's Handbook (0527-V1.0)</title>
    <style>
        :root {
            --bg-color: #FEF9E7; --sidebar-cream: #FDF2D0; --card-white: #FFFFFF;
            --text-main: #1A1A1A; --text-secondary: #475569; --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A; --radius-sm: 8px;
            --color-locked: #94A3B8; --color-available: #3B82F6; --color-completed: #F59E0B;
        }
        * { box-sizing: border-box; font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif; color: var(--text-main); }
        body { background-color: var(--bg-color); margin: 0; padding: 0; width: 100vw; height: 100vh; display: flex; overflow: hidden; }
        aside { width: 320px; background-color: var(--sidebar-cream); border-right: 3px solid var(--border-heavy); display: flex; flex-direction: column; padding: 30px 20px; flex-shrink: 0; height: 100%; }
        .aside-header { border-bottom: 3px solid var(--border-heavy); padding-bottom: 20px; margin-bottom: 25px; }
        .back-btn { display: block; background: var(--card-white); border: 2px solid var(--border-heavy); padding: 10px; border-radius: var(--radius-sm); text-align: center; font-weight: 900; text-decoration: none; box-shadow: 3px 3px 0px var(--border-heavy); margin-bottom: 20px; }
        .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-heavy); }
        .chapter-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .chapter-item { background: var(--card-white); border: 2px solid var(--border-heavy); border-radius: var(--radius-sm); padding: 15px; margin-bottom: 15px; cursor: pointer; box-shadow: 3px 3px 0px var(--border-heavy); transition: all 0.15s; }
        .chapter-item.locked { border-color: var(--color-locked); opacity: 0.6; cursor: not-allowed; }
        .chapter-item.locked * { color: var(--color-locked); }
        .chapter-item.available { border-color: var(--color-available); box-shadow: 3px 3px 0px var(--color-available); }
        .chapter-item.completed { border-color: var(--color-completed); box-shadow: 3px 3px 0px var(--color-completed); background: #FFFDF4; }
        .chapter-item.active { background: var(--text-main) !important; }
        .chapter-item.active * { color: white !important; }
        .chapter-badge { font-size: 0.7rem; font-weight: 900; text-transform: uppercase; font-family: monospace; }
        .chapter-title { font-size: 0.9rem; font-weight: 800; margin-top: 5px; }
        main { flex: 1; height: 100%; padding: 40px; overflow-y: auto; background: var(--card-white); position: relative; }
        .main-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--border-heavy); padding-bottom: 20px; margin-bottom: 30px; }
        .auth-panel { background: var(--bg-color); border: 2px solid var(--border-heavy); padding: 8px 15px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 800; box-shadow: 2px 2px 0px var(--border-heavy); }
        .lang-switcher-box { display: flex; gap: 5px; }
        .lang-btn-sub { background:#fff; border:2px solid #000; padding:5px 10px; font-weight:900; cursor:pointer; border-radius:4px; }
        .lang-btn-sub.active { background:#000; color:#fff; }
        .scroll-text { font-size: 1.05rem; line-height: 1.8; font-weight: 600; white-space: pre-line; margin-bottom: 40px; }
        .boss-trial-section { border: 3px solid #DC2626; border-radius: var(--radius-sm); padding: 30px; background: #FEF2F2; box-shadow: 5px 5px 0px #000; margin-top: 50px; }
        .option-card { background: white; border: 2px solid var(--border-heavy); padding: 18px; border-radius: var(--radius-sm); margin-top: 15px; cursor: pointer; font-weight: 700; }
        .option-card:hover { background: var(--sidebar-cream); }
        .clear-seal-overlay { display: none; position: absolute; top: 200px; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); border: 6px double var(--color-completed); background: rgba(254, 249, 231, 0.95); padding: 15px 50px; z-index: 1000; pointer-events: none; }
        .clear-seal-overlay text { font-family: sans-serif; font-size: 36px; font-weight: 900; fill: var(--color-completed); letter-spacing: 3px; }
    </style>
</head>
<body>
    <aside>
        <div class="aside-header">
            <a href="index.html" class="back-btn" data-i18n="back-to-hq">↩ 返回公會總部</a>
            <h2 style="margin: 5px 0 0 0;" data-i18n="handbook-title">冒險者手冊</h2>
        </div>
        <ul class="chapter-list" id="handbook-menu"></ul>
    </aside>
    <main>
        <div id="quest-clear-stamp" class="clear-seal-overlay"><svg width="300" height="80" viewBox="0 0 300 80"><text x="50%" y="60%" text-anchor="middle">QUEST CLEAR</text></svg></div>
        <div class="main-header">
            <div><span id="current-chapter-id" style="font-family: monospace; font-weight: 900;">LAYER 02 / FU-01</span><h1 id="current-chapter-name" style="margin: 5px 0 0 0;">加載中...</h1></div>
            <div class="header-controls" style="display: flex; align-items: center; gap: 20px;">
                <div class="lang-switcher-box">
                    <button class="lang-btn-sub active" id="sub-tw" onclick="setLang('tw')">TW</button>
                    <button class="lang-btn-sub" id="sub-en" onclick="setLang('en')">EN</button>
                </div>
                <div id="user-profile" class="auth-panel">👤 冒險者認證中...</div>
            </div>
        </div>
        <div class="document-canvas">
            <h3 style="border-left: 6px solid var(--border-heavy); padding-left: 12px; font-size: 1.2rem;" data-i18n="doc-relic-title">📜 聖遺物卷軸</h3>
            <div id="lesson-content" class="scroll-text"></div>
            <div id="boss-battleground" class="boss-trial-section">
                <h3 style="margin-top:0; color:#B91C1C;">⚔️ 守關 Boss 考驗 (屬性抉擇)</h3>
                <p id="trial-question" style="font-weight: 800; font-size: 1.1rem; line-height: 1.5;"></p>
                <div id="trial-options-box"></div>
            </div>
        </div>
    </main>
    <script>
        const translations = {
            tw: { "handbook-title": "冒險者手冊", "back-to-hq": "↩ 返回公會總部", "doc-relic-title": "📜 聖遺物卷軸" },
            en: { "handbook-title": "Adventurer's Handbook", "back-to-hq": "↩ Back to HQ", "doc-relic-title": "📜 Relic Scroll" }
        };
        const handbookDatabase = {
            "FU-01": {
                id: "FU-01", badge: "🌊 狂瀾元素", title: "防水與環境防護結界", defaultStatus: "available",
                lesson: "在進階硬體中，防水等級（IP67/IPX8）是一道嚴苛的物理防線。\n\nTPM 必須掌握的核心工程點包括：\n1. 點膠製程（Dispensing）：膠水黏度、精密點膠路徑與固化時間控管，若發生膠路偏移，水元素將直接滲透。\n2. O-Ring 防水圈：形變率必須維持在 25%~40% 的黃金壓縮比，過低漏水，過高則會導致主殼體結構擠壓形變。\n3. 氣密測試（Leak Test）：工廠量產端使用高壓差檢測儀進行氣體充壓檢測，藉由設定漏氣率（Leak Rate < 1.0 sccm）直接進行判定，不需實體泡水。",
                question: "在 DVT 階段進行氣密測試時，發現某特定外殼角落連續 5 台樣機判定 Leak（漏氣）。結構工程師（ME）堅持是工廠點膠製程膠水問題，System TPM 該如何主導驗證（DOE）？",
                options: [
                    "聽從 ME 意見，直接開單要求代工廠重新調整膠水配方參數。(❌ 盲目偏袒，未抓出公差根本原因)",
                    "利用千分尺精密量測外殼組裝間隙，安排一組『手動鎖附扭力對比』與『點膠軌跡寬度微調』的交叉驗證（DOE）矩陣。(⭕ 天條認證！標準的 TPM 跨功能技術仲裁思維！)",
                    "直接向客戶提議把防水規格從 IPX8 降到 IPX4。(❌ 嚴重降低公會產品規格，直接除名)"
                ]
            }
        };
        let currentActiveId = "FU-01";
        function initHandbook() { renderMenu(); loadChapter(currentActiveId); }
        function renderMenu() {
            const menu = document.getElementById('handbook-menu'); menu.innerHTML = '';
            Object.keys(handbookDatabase).forEach(key => {
                const item = handbookDatabase[key]; const isCleared = localStorage.getItem(`handbook-${item.id}-clear`) === 'true';
                let statusClass = item.defaultStatus; if (isCleared) statusClass = "completed";
                const activeClass = item.id === currentActiveId ? "active" : "";
                menu.innerHTML += `<li class="chapter-item ${statusClass} ${activeClass}" onclick="switchChapter('${item.id}', '${statusClass}')"><div class="chapter-badge">${item.badge}</div><div class="chapter-title">${item.title}</div></li>`;
            });
        }
        function loadChapter(id) {
            currentActiveId = id; const data = handbookDatabase[id];
            document.getElementById('current-chapter-id').innerText = data.id; document.getElementById('current-chapter-name').innerText = data.title; document.getElementById('lesson-content').innerText = data.lesson; document.getElementById('trial-question').innerText = `⚠️ 實戰情境：${data.question}`;
            const stamp = document.getElementById('quest-clear-stamp'); const isCleared = localStorage.getItem(`handbook-${id}-clear`) === 'true';
            stamp.style.display = isCleared ? 'block' : 'none'; document.getElementById('boss-battleground').style.display = isCleared ? 'none' : 'block';
            const optionsBox = document.getElementById('trial-options-box'); optionsBox.innerHTML = '';
            data.options.forEach(opt => { optionsBox.innerHTML += `<div class="option-card" onclick="checkChoice(this, '${opt.includes('⭕')}', '${id}')">${opt}</div>`; });
        }
        function switchChapter(id, status) { if (status === 'locked') { alert("請先點亮前置技術結界！"); return; } currentActiveId = id; renderMenu(); loadChapter(id); }
        function checkChoice(element, isCorrect, id) {
            if (isCorrect === "true") {
                element.style.background = "#D1FAE5"; element.style.borderColor = "#10B981"; document.getElementById('quest-clear-stamp').style.display = 'block';
                setTimeout(() => { alert("🏆 QUEST CLEAR！資料已成功同步儲存。"); localStorage.setItem(`handbook-${id}-clear`, 'true'); initHandbook(); }, 300);
            } else { element.style.background = "#FEE2E2"; element.style.borderColor = "#EF4444"; alert("💥 屬性反噬！決策錯誤引發製程崩潰，請重新修煉！"); }
        }
        function setLang(lang) {
            document.querySelectorAll('.lang-btn-sub').forEach(btn => btn.classList.remove('active')); document.getElementById(`sub-${lang}`).classList.add('active');
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(translations[lang][key]) el.innerText = translations[lang][key]; });
            localStorage.setItem('tpm-lang-pref', lang);
        }
        window.onload = () => {
            setLang(localStorage.getItem('tpm-lang-pref') || 'tw'); initHandbook();
            const cachedName = localStorage.getItem('tpm-user-name');
            if (cachedName) { const currentRank = localStorage.getItem('tpm-user-rank') || "冒險者"; document.getElementById('user-profile').innerHTML = `👤 ${currentRank}：${cachedName}`; }
        };
    </script>
</body>
</html>
