<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職能手冊大廳 | System TPM Handbook Hub</title>
    <style>
        :root {
            /* 👑 外襯粗獷主義核心色盤 (100% 對齊寶典大廳與總部) */
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-completed: #22C55E;
            --color-active-gold: #FDE047;
            --color-fail: #DC2626;
            --color-locked-gray: #E2E8F0;

            /* 🎨 內襯北歐極簡沙盒地圖色盤 */
            --nordic-bg: #FAFAFA;
            --nordic-gray-dot: #D1D5DB;
            --nordic-yellow-dot: #EAB308;
            --nordic-border: #E7E5E4;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--text-main);
        }

        * {
            box-sizing: border-box;
        }

        /* 👑 剛性頂部全域控制導航列 */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .workspace-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        /* 👑 左側戰術選單清單欄 */
        .sidebar-panel {
            display: flex;
            width: 262px; 
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px 18px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .hub-return-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            text-align: center;
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            transition: all 0.1s;
        }

        .hub-return-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        .menu-category-block {
            width: 100%;
            margin-bottom: 4px;
        }

        .tree-main-toggle {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tree-sub-group {
            padding-left: 10px;
            border-left: 3px solid var(--border-heavy);
            margin-left: 8px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leaf-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 0.82rem;
            text-align: left;
            cursor: pointer;
            width: 100%;
            color: var(--text-main);
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            line-height: 1.4;
        }

        .leaf-btn:hover {
            transform: translate(2px, -2px);
            box-shadow: 2px 4px 0px var(--border-heavy);
        }

        .leaf-btn.active {
            background: var(--color-active-gold) !important;
            color: var(--text-main) !important;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy) !important;
        }

        .content-panel {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dashboard-view-hall,
        .sandbox-game-container {
            display: none;
            width: 100%;
            height: 100%;
        }

        .dashboard-view-hall {
            display: block; 
            overflow-y: auto;
            padding: 5px 5px 30px 5px; 
        }

        .level-cards-parallel-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
            padding: 5px 2px;
        }

        .progress-card-master {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            border-radius: 10px;
            padding: 12px 16px;
            box-shadow: var(--shadow-tactical);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .progress-card-master:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--border-heavy);
        }

        .progress-card-master.active-level {
            background: linear-gradient(135deg, #FFFDF4 0%, #FAFAFA 100%) !important;
            border-width: 3px !important;
            box-shadow: 5px 5px 0px var(--border-heavy) !important;
        }

        .progress-label {
            font-family: monospace;
            font-weight: 900;
            font-size: 0.72rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .progress-percentage {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 2px 0;
            color: var(--text-main);
            line-height: 1;
        }

        .progress-stats {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #E2E8F0;
            border: 2px solid var(--border-heavy);
            border-radius: 5px;
            margin-top: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--color-completed);
            width: 0%;
            transition: width 0.4s ease-out;
        }

        .cdx-dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            padding: 5px 2px;
        }

        .cdx-dashboard-card {
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: var(--shadow-tactical);
            transition: all 0.15s;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            min-height: 52px;
        }

        .cdx-dashboard-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px var(--text-main);
        }

        /* ─── 🎨 內襯北歐沙盒地圖容器 ─── */
        .sandbox-game-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            overflow: hidden;
        }

        .sandbox-map-canvas {
            flex: 1;
            height: 100%;
            background-color: var(--nordic-bg);
            border: 3px solid var(--border-heavy);
            border-radius: 12px;
            position: relative;
            overflow-y: auto;   
            overflow-x: hidden; 
            box-shadow: var(--shadow-tactical);
        }

        /* 👑 固定寬體置中場域 */
        .map-inner-flow-field {
            width: 100%; 
            height: 2200px;
            position: relative;
            margin: 0 auto;    
        }

        .map-svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 2200px;
            pointer-events: none;
            z-index: 1;
        }

        .map-node-card {
            position: absolute;
            width: 145px;
            height: 52px;
            border-radius: 6px;
            border: 2px solid var(--border-heavy);
            background-color: #E2E8F0; 
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            text-align: center;
            font-size: 0.76rem;
            font-weight: 800;
            line-height: 1.3;
            cursor: pointer;
            z-index: 10;
            transform: translate(-50%, -50%);
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.18s ease;
            user-select: none;
            white-space: normal; 
        }

        .map-node-card.locked {
            background-color: #E5E7EB !important;
            color: #9CA3AF !important;
            border-color: #CBD5E1 !important;
            box-shadow: none !important;
        }

        .map-node-card.passed {
            background-color: var(--nordic-yellow-dot) !important;
            color: var(--text-main) !important;
            box-shadow: 3px 3px 0px var(--border-heavy) !important;
        }

        .map-node-card.active-target {
            background-color: #FFFDF0 !important;
            border-color: #EAB308 !important;
            color: #1A1A1A !important;
            box-shadow: 0 0 0 3px #FDE047, 4px 4px 0px var(--border-heavy) !important;
            animation: pulseCard 2s infinite ease-in-out;
        }

        .map-node-card.fail-node {
            background-color: #FCA5A5 !important;
            border-color: #DC2626 !important;
            color: #991B1B !important;
            box-shadow: 2px 2px 0px #991B1B !important;
        }

        @keyframes pulseCard {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4), 4px 4px 0px var(--border-heavy); }
            70% { box-shadow: 0 0 0 6px rgba(234, 179, 8, 0), 4px 4px 0px var(--border-heavy); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0), 4px 4px 0px var(--border-heavy); }
        }

        /* 👑 右側戰術觀測儀 */
        .fixed-inspector-panel {
            width: 380px; 
            height: 100%;
            background: #FFFFFF;
            border: 3px solid var(--border-heavy);
            border-radius: 12px;
            padding: 26px;
            box-shadow: var(--shadow-tactical);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .inspector-scroll-box {
            flex: 1;
            overflow-y: auto;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .inspector-placeholder {
            margin: auto;
            text-align: center;
            color: var(--text-secondary);
            font-weight: 800;
            font-size: 1rem;
        }

        .nordic-option-btn {
            width: 100%;
            background: #FFFFFF;
            border: 2px solid var(--border-heavy);
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 10px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
        }

        .nordic-option-btn:hover {
            background: var(--sidebar-cream);
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--border-heavy);
        }

        .nordic-action-btn {
            background: var(--text-main);
            color: #FFFFFF;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        @keyframes fadeInNode {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <h1 style="margin: 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">冒險者手冊</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">首頁登入</div>
            <div class="lang-switcher-wrapper" style="display:none;"></div>
            <a href="index.html" class="back-btn">返回首頁</a>
        </div>
    </div>

    <div class="workspace-container">
        <aside class="sidebar-panel">
            <button class="hub-return-btn" onclick="exitToDashboardMenu()">↩ 返回戰術大廳</button>
            <div id="global-tree-root"></div>
        </aside>

        <main class="content-panel">
            <div id="cdx-page-header-zone" style="margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px dashed var(--border-heavy); flex-shrink:0;">
                <span id="current-chapter-id" style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.9rem;">DASHBOARD</span>
                <h2 id="current-chapter-name" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">冒險者戰術大廳</h2>
            </div>

            <div class="dashboard-view-hall" id="dashboard-menu-hall">
                <div class="level-cards-parallel-grid" id="global-level-flex-deck"></div>
                <div style="border-bottom: 3px dashed var(--border-heavy); width: 100%; margin: 5px 0 25px 0;"></div>
                <div style="font-weight: 900; font-size: 1rem; margin-bottom: 15px; color: var(--text-main);">子單元列表：</div>
                <div class="cdx-dashboard-grid" id="l1-cards-grid"></div>
            </div>

            <div class="sandbox-game-container" id="sandbox-viewport">
                <div class="sandbox-map-canvas" id="map-scroll-stage">
                    <div class="map-inner-flow-field" id="map-lock-field">
                        <svg class="map-svg-layer" id="map-svg-canvas"></svg>
                        <div id="map-nodes-container" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:10;"></div>
                    </div>
                </div>
                <aside class="fixed-inspector-panel" id="sandbox-inspector">
                    <div class="inspector-placeholder">
                        🎯 請點擊左側地圖圓點<br>解包防水戰術劇本事件
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <script>
        const GLOBAL_GAS_URL = "https://script.google.com/a/macros/fih-foxconn.com/s/AKfycbydOQ2Iyk8wVABxUDWJchx1eiCN4Hc_Fg226uJAkLS0wIpsWty-ewDwxQPG3dGSDv3pFQ/exec";

        const globalSubUnitRegistry = [
            { type: 'handbook', levelNum: 1, subUnitId: '1-1', title: '1-1: 系統 TPM 職能運作實戰手冊', file: 'handbook_data_course/handbook_data_1-1.js' },
            { type: 'handbook', levelNum: 1, subUnitId: '1-2', title: '1-2: 防水結構 Worst-Case 模擬與幾何流產盲區', file: 'handbook_data_course/handbook_data_1-2.js' }
        ];

        const globalLevelMetadata = [
            { num: 1, name: 'LEVEL 1', label: '待開發' },
            { num: 2, name: 'LEVEL 2', label: '待開發' },
            { num: 3, name: 'LEVEL 3', label: '待開發' },
            { num: 4, name: 'LEVEL 4', label: '待開發' },
            { num: 5, name: 'LEVEL 5', label: '待開發' },
            { num: 6, name: 'LEVEL 6', label: '待開發' },
            { num: 7, name: 'LEVEL 7', label: '待開發' }
        ];

        // 👑 全域虛擬動態佈局大盤
        let nodeLayoutCoordinates = {};

        // ========================================================================
        // 👑 萬能幾何分流分層編譯大腦：實時清算畫布實體寬度，完美橫向等距拉開！
        // ========================================================================
        function calculateDynamicCosmicTopology() {
            const tree = window.tpmSandboxScriptTree;
            if (!tree) {
                return;
            }

            nodeLayoutCoordinates = {};
            let tierBuckets = {};

            // 1. 縱向天梯層級分水嶺
            Object.keys(tree).forEach(nodeId => {
                let tierNum = 0;
                const match = nodeId.match(/^T(\d+)/);
                if (match) {
                    tierNum = parseInt(match[1], 10);
                } else {
                    if (nodeId.includes("START")) {
                        tierNum = 1;
                    } else if (nodeId.includes("DECISION")) {
                        tierNum = 2;
                    } else if (nodeId.includes("FAIL") || nodeId.includes("WARN") || nodeId.includes("STACKUP")) {
                        tierNum = 3;
                    } else if (nodeId.includes("CONQUER") || nodeId.includes("WIN")) {
                        tierNum = 4;
                    }
                }

                if (!tierBuckets[tierNum]) {
                    tierBuckets[tierNum] = [];
                }
                tierBuckets[tierNum].push({ id: nodeId, rawNode: tree[nodeId] });
            });

            const lockField = document.getElementById('map-lock-field');
            let containerWidth = 720;
            if (lockField) {
                containerWidth = lockField.clientWidth;
            }

            // 2. 橫向等距發散分配矩陣
            Object.keys(tierBuckets).forEach(tierStr => {
                const tierNum = parseInt(tierStr, 10);
                let nodes = tierBuckets[tierNum];
                
                nodes.sort((a, b) => {
                    return a.id.localeCompare(b.id);
                });

                const count = nodes.length;
                const yCoord = tierNum * 130 + 60; 

                nodes.forEach((node, idx) => {
                    let xCoord = containerWidth / 2; 
                    if (count > 1) {
                        const startX = 90;
                        const endX = containerWidth - 90;
                        xCoord = startX + (idx * ((endX - startX) / (count - 1)));
                    }
                    
                    let cleanName = node.rawNode.title || node.id;
                    if (cleanName.includes("：")) {
                        cleanName = cleanName.split("：")[1];
                    } else if (cleanName.includes(":")) {
                        cleanName = cleanName.split(":")[1];
                    }
                    cleanName = cleanName.replace(/[📚🛑🏆⚡⚠️💥📍🎯]/g, "").trim();

                    nodeLayoutCoordinates[node.id] = {
                        x: Math.round(xCoord),
                        y: yCoord,
                        name: cleanName
                    };
                });
            });
        }

        let selectedActiveLevelNum = 1; 
        let unlockedNodesList = []; 
        let passedNodesList = []; 
        
        let activeFrontierNodeId = null;     
        let currentlySelectedNodeId = null;  
        let activePackUnitId = null;

        window.onload = () => {
            renderGlobalTreeStructure();
            routeController();
        };

        function renderGlobalTreeStructure() {
            const root = document.getElementById('global-tree-root'); 
            if (!root) {
                return;
            }
            root.innerHTML = '';
            const presentLevels = [...new Set(globalSubUnitRegistry.map(u => u.levelNum))].sort();
            
            presentLevels.forEach(lvlNum => {
                const subset = globalSubUnitRegistry.filter(u => u.levelNum === lvlNum);
                const block = document.createElement('div'); 
                block.className = 'menu-category-block';
                
                const currentLvlMeta = globalLevelMetadata.find(l => l.num === lvlNum);
                const lvlLabelName = currentLvlMeta ? currentLvlMeta.label : '展開';

                block.innerHTML = `
                    <button class="tree-main-toggle" onclick="toggleMenuSection('lvl-accordion-${lvlNum}')">🗺️ Level ${lvlNum} ${lvlLabelName}</button>
                    <div id="lvl-accordion-${lvlNum}" class="tree-sub-group" style="display: flex; flex-direction: column;">
                        ${subset.map(u => `<button class="leaf-btn" id="lf-${u.type}-${u.subUnitId}" onclick="switchUnit('${u.type}','${u.subUnitId}', ${u.levelNum})">${u.title}</button>`).join('')}
                    </div>`;
                root.appendChild(block);
            });
        }

        function toggleMenuSection(id) { 
            const el = document.getElementById(id); 
            if (el) {
                if (el.style.display === 'none') {
                    el.style.display = 'flex';
                } else {
                    el.style.display = 'none';
                }
            }
        }

        function routeController(directType, directC) {
            const urlParams = new URLSearchParams(window.location.search);
            const paramC = directC || urlParams.get('c');
            const paramType = directType || urlParams.get('type') || 'handbook';

            if (!paramC) {
                document.getElementById('cdx-page-header-zone').style.display = 'block'; 
                document.getElementById('current-chapter-id').innerText = "DASHBOARD"; 
                document.getElementById('current-chapter-name').innerText = "冒險者戰術大廳";
                document.getElementById('dashboard-menu-hall').style.display = 'block'; 
                document.getElementById('sandbox-viewport').style.display = 'none'; 
                renderMultiLevelHubDashboard();
            } else {
                document.getElementById('dashboard-menu-hall').style.display = 'none'; 
                document.getElementById('sandbox-viewport').style.display = 'flex'; 
                document.querySelectorAll('.leaf-btn').forEach(b => b.classList.remove('active')); 
                const leaf = document.getElementById(`lf-${paramType}-${paramC}`); 
                if (leaf) {
                    leaf.classList.add('active'); 
                }
                activePackUnitId = paramC;
                injectContentPackScript(paramType, paramC);
            }
        }

        function renderMultiLevelHubDashboard() {
            const deckRow = document.getElementById('global-level-flex-deck');
            const grid = document.getElementById('l1-cards-grid'); 
            if (!deckRow || !grid) {
                return;
            }
            
            deckRow.innerHTML = ''; 
            grid.innerHTML = '';
            
            globalLevelMetadata.forEach(lvl => {
                const subUnitsInLvl = globalSubUnitRegistry.filter(u => u.levelNum === lvl.num); 
                let total = subUnitsInLvl.length;
                let done = 0;
                subUnitsInLvl.forEach(u => { 
                    if (localStorage.getItem(`handbook-L1-A${u.subUnitId.split('-')[1]}-clear`) === 'true') {
                        done++; 
                    }
                });
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                deckRow.innerHTML += `
                    <div class="progress-card-master ${lvl.num === selectedActiveLevelNum ? 'active-level' : ''}" onclick="selectedActiveLevelNum=${lvl.num};renderMultiLevelHubDashboard();">
                        <div class="progress-label">${lvl.name} : ${lvl.label}</div>
                        <div class="progress-percentage">${pct}%</div>
                        <div class="progress-stats">完成指標: ${done} / ${total}</div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${pct}%;"></div></div>
                    </div>`;
            });

            const filteredUnits = globalSubUnitRegistry.filter(u => u.levelNum === selectedActiveLevelNum);
            filteredUnits.forEach(unit => {
                const storageKey = `L1-A${unit.subUnitId.split('-')[1]}`;
                const isClear = localStorage.getItem(`handbook-${storageKey}-clear`) === 'true';
                grid.innerHTML += `
                    <div class="cdx-dashboard-card" style="background-color: ${isClear ? '#DCFCE7' : '#FEF08A'};" onclick="switchUnit('${unit.type}', '${unit.subUnitId}', ${unit.levelNum})">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-family:monospace; font-weight:900; background:rgba(0,0,0,0.06); padding:2px 4px; border-radius:4px; font-size:0.75rem;">${unit.subUnitId}</span>
                            <h3 style="margin:0; font-size:0.82rem; font-weight:900; color:var(--text-main);">${unit.title.split(': ')[1] || unit.title}</h3>
                        </div>
                        <div style="font-size:0.75rem; font-weight:900; color:var(--text-main); white-space:nowrap; padding-left:6px;">${isClear ? `✅ [通過]` : '⏳ 待考核'}</div>
                    </div>`;
            });
        }

        function switchUnit(type, subUnitId, lvlNum) { 
            selectedActiveLevelNum = lvlNum; 
            window.history.pushState(null, '', `${window.location.pathname}?type=${type}&c=${subUnitId}`); 
            routeController(type, subUnitId); 
        }

        function exitToDashboardMenu() { 
            window.history.pushState(null, '', window.location.pathname); 
            routeController(null, null); 
        }

        function injectContentPackScript(type, packId) {
            const old = document.getElementById('dynamic-course-pack'); 
            if (old) {
                old.remove();
            }
            
            const script = document.createElement('script'); 
            script.id = 'dynamic-course-pack'; 
            
            const currentUnit = globalSubUnitRegistry.find(u => u.type === type && u.subUnitId === packId);
            if (!currentUnit) {
                return;
            }
            
            script.src = `${currentUnit.file}?v=${Date.now()}`;
            script.onload = () => { 
                initSandboxEngine(); 
            }; 
            document.head.appendChild(script);
        }

        function initSandboxEngine() {
            if (!activePackUnitId) {
                return; 
            }
            document.getElementById('current-chapter-id').innerText = `HANDBOOK / UNIT ${activePackUnitId}`; 
            document.getElementById('current-chapter-name').innerText = globalSubUnitRegistry.find(u => u.subUnitId === activePackUnitId).title;

            const savedPassed = localStorage.getItem(`tpm-sandbox-passed-${activePackUnitId}`);
            const savedUnlocked = localStorage.getItem(`tpm-sandbox-unlocked-${activePackUnitId}`);
            
            passedNodesList = savedPassed ? JSON.parse(savedPassed) : [];
            unlockedNodesList = savedUnlocked ? JSON.parse(savedUnlocked) : [];
            
            let initialStartNode = "START-NODE";
            if (window.tpmSandboxScriptTree) {
                if (window.tpmSandboxScriptTree["T0-INTRO"]) {
                    initialStartNode = "T0-INTRO";
                } else if (window.tpmSandboxScriptTree["T1-START"]) {
                    initialStartNode = "T1-START";
                }
            }
            
            let curr = initialStartNode;
            while (passedNodesList.includes(curr)) {
                let nodeData = window.tpmSandboxScriptTree[curr];
                if (!nodeData) {
                    break;
                }
                if (nodeData.nextNodes && nodeData.nextNodes.length > 0) {
                    curr = nodeData.nextNodes[0];
                } else {
                    let foundNext = false;
                    if (nodeData.options) {
                        let nextTarget = null;
                        for (let opt of nodeData.options) {
                            if (passedNodesList.includes(opt.target)) {
                                nextTarget = opt.target;
                                break;
                            }
                        }
                        if (!nextTarget) {
                            for (let opt of nodeData.options) {
                                if (unlockedNodesList.includes(opt.target)) {
                                    nextTarget = opt.target;
                                    break;
                                }
                            }
                        }
                        if (nextTarget) {
                            curr = nextTarget;
                            foundNext = true;
                        }
                    }
                    if (!foundNext) {
                        break;
                    }
                }
            }
            
            activeFrontierNodeId = curr;
            currentlySelectedNodeId = activeFrontierNodeId;

            if (!unlockedNodesList.includes(initialStartNode)) {
                unlockedNodesList.push(initialStartNode);
            }
            if (!unlockedNodesList.includes(activeFrontierNodeId)) {
                unlockedNodesList.push(activeFrontierNodeId);
            }

            calculateDynamicCosmicTopology();
            renderNordicSandboxMap();
            inspectNodeDetail(currentlySelectedNodeId);

            window.onresize = () => {
                calculateDynamicCosmicTopology();
                renderNordicSandboxMap();
            };
        }

        function saveSandboxProgress() {
            localStorage.setItem(`tpm-sandbox-passed-${activePackUnitId}`, JSON.stringify(passedNodesList));
            localStorage.setItem(`tpm-sandbox-unlocked-${activePackUnitId}`, JSON.stringify(unlockedNodesList));
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                let temp = shuffled[i];
                shuffled[i] = shuffled[j];
                shuffled[j] = temp;
            }
            return shuffled;
        }

        function findParentDecisionNode(childId) {
            const tree = window.tpmSandboxScriptTree;
            if (!tree) {
                return null;
            }
            for (let key in tree) {
                const node = tree[key];
                if (node.options && node.options.some(opt => opt.target === childId)) {
                    return node;
                }
                if (node.nextNodes && node.nextNodes.includes(childId)) {
                    return node;
                }
            }
            return null;
        }

        // ========================================================================
        // 👑 拓撲地圖繪製艙 (全自動卡片流與動態分流渲染)
        // ========================================================================
        function renderNordicSandboxMap() {
            const nodesContainer = document.getElementById('map-nodes-container');
            const svgCanvas = document.getElementById('map-svg-canvas');
            if (!nodesContainer || !svgCanvas || !window.tpmSandboxScriptTree) {
                return;
            }

            nodesContainer.innerHTML = '';
            svgCanvas.innerHTML = '';

            const tree = window.tpmSandboxScriptTree;
            const isUnitCleared = localStorage.getItem(`handbook-L1-A${activePackUnitId.split('-')[1]}-clear`) === 'true';

            const activeVisibleNodesSet = new Set();
            Object.keys(tree).forEach(nodeId => {
                if (isUnitCleared) {
                    activeVisibleNodesSet.add(nodeId);
                } else {
                    if (unlockedNodesList.includes(nodeId) || nodeId === activeFrontierNodeId || passedNodesList.includes(nodeId)) {
                        activeVisibleNodesSet.add(nodeId);
                    }
                    if (passedNodesList.includes(nodeId) || nodeId === activeFrontierNodeId) {
                        if (tree[nodeId].nextNodes) {
                            tree[nodeId].nextNodes.forEach(nxt => {
                                activeVisibleNodesSet.add(nxt);
                            });
                        }
                        if (tree[nodeId].options) {
                            tree[nodeId].options.forEach(opt => {
                                activeVisibleNodesSet.add(opt.target);
                            });
                        }
                    }
                }
            });

            // 🚀 👑 剛性修正 1：刪除不必要的分界線邏輯 decisionYSet，還原極簡畫布。

            Object.keys(tree).forEach(srcId => {
                const srcNode = tree[srcId];
                const srcPos = nodeLayoutCoordinates[srcId];
                if (!srcPos) {
                    return;
                }

                let branchTargets = [];
                if (srcNode.nextNodes) {
                    branchTargets = branchTargets.concat(srcNode.nextNodes);
                }
                if (srcNode.options) {
                    srcNode.options.forEach(opt => {
                        if (opt.target) {
                            branchTargets.push(opt.target);
                        }
                    });
                }

                branchTargets.forEach(tarId => {
                    const tarPos = nodeLayoutCoordinates[tarId];
                    if (!tarPos) {
                        return;
                    }
                    if (!activeVisibleNodesSet.has(srcId) || !activeVisibleNodesSet.has(tarId)) {
                        return;
                    }

                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", srcPos.x);
                    line.setAttribute("y1", srcPos.y);
                    line.setAttribute("x2", tarPos.x);
                    line.setAttribute("y2", tarPos.y);

                    const isTargetFail = tarId.includes("FAIL") || tarId.includes("WARN") || (tree[tarId] && (tree[tarId].type === "end_fail" || tree[tarId].type === "end_warn"));
                    const isTargetUnlocked = unlockedNodesList.includes(tarId);

                    if (isUnitCleared) {
                        line.setAttribute("stroke", "#CBD5E1");
                        line.setAttribute("stroke-width", "1.5");
                    } else if (isTargetFail && isTargetUnlocked) {
                        line.setAttribute("stroke", "#F87171"); 
                        line.setAttribute("stroke-width", "2.5");
                    } else if ((passedNodesList.includes(srcId) && passedNodesList.includes(tarId)) || (passedNodesList.includes(srcId) && tarId === activeFrontierNodeId)) {
                        line.setAttribute("stroke", "#EAB308");
                        line.setAttribute("stroke-width", "3");
                    } else if (srcId === activeFrontierNodeId) {
                        line.setAttribute("stroke", "#475569");
                        line.setAttribute("stroke-width", "2");
                        line.setAttribute("stroke-dasharray", "4,4");
                    } else {
                        line.setAttribute("stroke", "#D1D5DB");
                        line.setAttribute("stroke-width", "1.5");
                    }
                    svgCanvas.appendChild(line);
                });
            });

            Object.keys(tree).forEach(nodeId => {
                const pos = nodeLayoutCoordinates[nodeId];
                if (!pos) {
                    return;
                }
                if (!activeVisibleNodesSet.has(nodeId)) {
                    return;
                }

                const card = document.createElement('div');
                card.id = `card-${nodeId}`;
                card.className = 'map-node-card';
                card.style.left = `${pos.x}px`;
                card.style.top = `${pos.y}px`;
                
                let displayName = pos.name;
                const isPassed = passedNodesList.includes(nodeId);
                const isUnlocked = unlockedNodesList.includes(nodeId);

                if (!isUnitCleared && nodeId !== activeFrontierNodeId && !isPassed && !isUnlocked) {
                    displayName = "🔒 未知分流";
                }
                card.innerText = displayName;

                const isFailNode = nodeId.includes("FAIL") || nodeId.includes("WARN") || (tree[nodeId] && (tree[nodeId].type === "end_fail" || tree[nodeId].type === "end_warn"));

                if (isUnitCleared) {
                    if (tree[nodeId] && tree[nodeId].type === "end_win") {
                        card.classList.add('passed');
                    } else if (isFailNode) {
                        card.classList.add('fail-node');
                    } else {
                        card.classList.add('passed');
                    }
                    if (nodeId === activeFrontierNodeId) {
                        card.classList.add('active-target');
                    }
                } else {
                    if (isPassed) {
                        card.classList.add('passed');
                    } else if (isFailNode && isUnlocked) {
                        card.classList.add('fail-node');
                    } else {
                        if (nodeId === activeFrontierNodeId) {
                            card.classList.add('active-target');
                        } else if (!isUnlocked && !isPassed) {
                            card.classList.add('locked');
                        }
                    }
                }

                card.onclick = () => {
                    if (!activeVisibleNodesSet.has(nodeId)) {
                        return;
                    }
                    
                    if (!isUnitCleared && nodeLayoutCoordinates[nodeId] && nodeLayoutCoordinates[activeFrontierNodeId]) {
                        if (nodeLayoutCoordinates[nodeId].y > nodeLayoutCoordinates[activeFrontierNodeId].y) {
                            alert("🔒 當前階段戰術賽局正在進行，請由右側控制台點選按鈕進行推進，禁止由地圖直接點擊未來分流窺視答案。");
                            return;
                        }
                    }

                    if (!isUnlocked && !isPassed && nodeId !== activeFrontierNodeId) {
                        unlockedNodesList.push(nodeId);
                        saveSandboxProgress();
                    }
                    
                    currentlySelectedNodeId = nodeId;
                    renderNordicSandboxMap();
                    inspectNodeDetail(nodeId);
                };

                nodesContainer.appendChild(card);
            });

            const scrollStage = document.getElementById('map-scroll-stage');
            const activeCard = document.getElementById(`card-${activeFrontierNodeId}`);
            if (scrollStage && activeCard) {
                setTimeout(() => {
                    scrollStage.scrollTo({
                        top: activeCard.offsetTop - (scrollStage.clientHeight / 2),
                        behavior: 'smooth'
                    });
                }, 50);
            }
        }

        // ========================================================================
        // 👑 右側戰術儀控制中樞 (解決唯讀死鎖與 END 原位分流跳轉)
        // ========================================================================
        function inspectNodeDetail(nodeId) {
            const inspector = document.getElementById('sandbox-inspector');
            const node = window.tpmSandboxScriptTree[nodeId];
            if (!inspector || !node) {
                return;
            }

            // 🚀 👑 剛性修正 2：如果節點已被解鎖，且它的下一步「沒有被走過」，它就具備前進主權！解除 ReviewMode 唯讀鎖死。
            let isReviewMode = true;
            if (nodeId === activeFrontierNodeId) {
                isReviewMode = false;
            } else if (unlockedNodesList.includes(nodeId)) {
                let hasMovedForward = false;
                if (node.nextNodes && node.nextNodes.length > 0) {
                    if (passedNodesList.includes(node.nextNodes[0])) {
                        hasMovedForward = true;
                    }
                }
                if (node.options && node.options.length > 0) {
                    for (let opt of node.options) {
                        if (passedNodesList.includes(opt.target)) {
                            hasMovedForward = true;
                            break;
                        }
                    }
                }
                // 節點是終點沒有退路，或下一步完全沒走過，就解除唯讀
                if (!hasMovedForward) {
                    isReviewMode = false;
                }
            }

            let contentHtml = `<div class="inspector-scroll-box" style="animation: fadeInNode 0.12s ease-out;">`;

            if (node.type === "story") {
                contentHtml += `
                    <div style="font-size:0.72rem; color:var(--text-secondary); font-weight:900; letter-spacing:1px; margin-bottom:6px;">STORY MODULE ${isReviewMode ? ' (歷程複盤)' : ''}</div>
                    <h2 style="margin:0 0 14px 0; font-size:1.3rem; font-weight:900;">${node.title}</h2>
                    <div style="color:#2D3748;">${node.text}</div>
                `;
                if (!isReviewMode) {
                    contentHtml += `<button class="nordic-action-btn" onclick="executePassNode('${nodeId}')">➔ 繼續前進</button>`;
                }
            } else if (node.type === "decision") {
                contentHtml += `
                    <div style="font-size:0.72rem; color:#B45309; font-weight:900; letter-spacing:1px; margin-bottom:6px;">DECISION HUB ${isReviewMode ? ' (歷程複盤)' : ''}</div>
                    <h2 style="margin:0 0 14px 0; font-size:1.25rem; font-weight:900; color:#B45309;">${node.title}</h2>
                    <p style="font-weight:700; background:#FFFBEB; padding:12px; border-left:4px solid #F59E0B; border-radius:4px; line-height:1.5;">${node.question}</p>
                `;
                if (!isReviewMode) {
                    let randomizedOptions = shuffleArray(node.options);
                    contentHtml += `<div style="margin-top:15px;">`;
                    randomizedOptions.forEach(opt => {
                        contentHtml += `<button class="nordic-option-btn" onclick="executeSelectBranch('${nodeId}', '${opt.target}')"><b>決策分流：</b> ${opt.text}</button>`;
                    });
                    contentHtml += `</div>`;
                }
            } else if (node.type === "quiz") {
                contentHtml += `
                    <div style="font-size:0.72rem; color:#1D4ED8; font-weight:900; letter-spacing:1px; margin-bottom:6px;">TACTICAL QUIZ ${isReviewMode ? ' (歷程複盤)' : ''}</div>
                    <h2 style="margin:0 0 14px 0; font-size:1.25rem; font-weight:900; color:#1D4ED8;">${node.title}</h2>
                    <p style="font-weight:700; margin-bottom:15px; line-height:1.5;">${node.question}</p>
                `;
                if (!isReviewMode) {
                    let randomizedQuizOpts = shuffleArray(node.options);
                    contentHtml += `<div id="quiz-options-zone">`;
                    randomizedQuizOpts.forEach(opt => {
                        contentHtml += `<button class="nordic-option-btn" onclick="executeSubmitQuiz('${nodeId}', '${opt.target || ''}')">${opt.text}</button>`;
                    });
                    contentHtml += `</div>`;
                }
            } else if (node.type.startsWith("end_")) {
                let endColor = "#475569"; // 默認深灰 (非錯誤結局)
                if (node.type === "end_win") {
                    endColor = "#15803D"; // 勝利綠
                } else if (node.id.includes("FAIL") || node.id.includes("WARN") || node.type === "end_fail" || node.type === "end_warn") {
                    endColor = "#B91C1C"; // 失敗紅
                }
                
                contentHtml += `
                    <div style="font-size:0.72rem; color:${endColor}; font-weight:900; letter-spacing:1px; margin-bottom:6px;">SCENARIO ENDING ${isReviewMode ? ' (歷程複盤)' : ''}</div>
                    <h2 style="margin:0 0 14px 0; font-size:1.3rem; font-weight:900; color:${endColor};">${node.title}</h2>
                    <div style="background:#FAF8F5; padding:14px; border-radius:6px; border:1px solid var(--nordic-border); margin-bottom:15px;">${node.text}</div>
                `;

                if (node.type === "end_win") {
                    if (!isReviewMode) {
                        contentHtml += `<button class="nordic-action-btn" style="background:${endColor};" onclick="executeSettleHandbookUnit(true)">🏆 記錄戰績並上傳 GAS</button>`;
                    }
                } else {
                    // 🚀 👑 剛性修正 3：無論是哪種結局 (包含正確的分支結局)，只要它沒有下一步，就可以原地觸發親代選項，供學員躍遷開線！
                    if (!isReviewMode) {
                        const parentDecision = findParentDecisionNode(nodeId);
                        if (parentDecision && parentDecision.options) {
                            let remainingOptions = parentDecision.options.filter(opt => {
                                return !passedNodesList.includes(opt.target);
                            });
                            let randomizedRetry = shuffleArray(remainingOptions);
                            
                            if (randomizedRetry.length > 0) {
                                contentHtml += `
                                    <div style="margin-top:20px; padding-top:16px; border-top:2px dashed var(--border-heavy);">
                                        <p style="font-weight:900; color:#1E3A8A; margin-bottom:10px;">🔄 探索其他實戰領域：請選擇其餘分支開線：</p>
                                `;
                                randomizedRetry.forEach(opt => {
                                    contentHtml += `<button class="nordic-option-btn" onclick="executeSelectBranch('${parentDecision.id}', '${opt.target}')"><b>開闢新宇宙：</b> ${opt.text}</button>`;
                                });
                                contentHtml += `</div>`;
                            }
                        }
                    }
                }
            }

            contentHtml += `</div>`;
            inspector.innerHTML = contentHtml;
        }

        window.executePassNode = function(nodeId) {
            if (!passedNodesList.includes(nodeId)) {
                passedNodesList.push(nodeId);
            }
            const nodeData = window.tpmSandboxScriptTree[nodeId];
            if (nodeData && nodeData.nextNodes) {
                nodeData.nextNodes.forEach(nxt => { 
                    if (!unlockedNodesList.includes(nxt)) {
                        unlockedNodesList.push(nxt); 
                    }
                });
            }
            saveSandboxProgress();
            if (nodeData.nextNodes && nodeData.nextNodes.length > 0) {
                activeFrontierNodeId = currentlySelectedNodeId = nodeData.nextNodes[0];
                inspectNodeDetail(currentlySelectedNodeId);
            }
            renderNordicSandboxMap();
        };

        window.executeSelectBranch = function(nodeId, targetNodeId) {
            if (!passedNodesList.includes(nodeId)) {
                passedNodesList.push(nodeId);
            }
            if (!unlockedNodesList.includes(targetNodeId)) {
                unlockedNodesList.push(targetNodeId);
            }
            saveSandboxProgress();
            activeFrontierNodeId = currentlySelectedNodeId = targetNodeId;
            inspectNodeDetail(currentlySelectedNodeId);
            renderNordicSandboxMap();
        };

        window.executeSubmitQuiz = function(nodeId, targetNodeId) {
            const zone = document.getElementById('quiz-options-zone');
            const node = window.tpmSandboxScriptTree[nodeId];
            if (!zone || !node) {
                return;
            }

            let isCorrect = false;
            let targetNode = targetNodeId;
            
            if (!targetNode && node.options) {
                const rawEvent = window.event?.target?.innerText || "";
                const foundOpt = node.options.find(o => rawEvent.includes(o.text));
                isCorrect = foundOpt ? foundOpt.isCorrect : false;
                targetNode = node.nextNodes ? node.nextNodes[0] : "WIN-NODE-CONQUER";
            } else {
                isCorrect = (targetNode === "WIN-NODE-CONQUER" || targetNode === "T14-PASS-4" || targetNode === "T7-A-WIN-FINAL");
            }

            zone.innerHTML = `
                <div style="margin-top:10px; padding:14px; background:${isCorrect ? '#F0FDF4':'#FEF2F2'}; border-radius:6px; border:1px solid ${isCorrect?'#BBF7D0':'#FCA5A5'}; font-size:0.85rem; line-height:1.5;">
                    <div style="font-weight:900; font-size:0.95rem; color:${isCorrect?'#16A34A':'#DC2626'}; margin-bottom:4px;">${isCorrect ? '🏆 回答正確！':'💥 判斷錯誤！'}</div>
                    <div>${node.explanation}</div>
                </div>
                <button class="nordic-action-btn" onclick="executePassQuizNode('${nodeId}', '${targetNode}')">➔ 繼續前進</button>
            `;
        };

        window.executePassQuizNode = function(nodeId, targetNodeId) {
            if (!passedNodesList.includes(nodeId)) {
                passedNodesList.push(nodeId);
            }
            let finalTarget = targetNodeId;
            
            if (!finalTarget || finalTarget === "undefined") {
                finalTarget = window.tpmSandboxScriptTree[nodeId].nextNodes[0];
            }

            if (!unlockedNodesList.includes(finalTarget)) {
                unlockedNodesList.push(finalTarget);
            }
            saveSandboxProgress();
            
            activeFrontierNodeId = currentlySelectedNodeId = finalTarget;
            inspectNodeDetail(currentlySelectedNodeId);
            renderNordicSandboxMap();
        };

        window.executeSettleHandbookUnit = function(isWin) {
            if (!isWin) {
                return;
            }
            const checkLiveEmail = localStorage.getItem('tpm-user-current-email');
            if (!checkLiveEmail || checkLiveEmail.trim() === "") {
                alert("❌ 偵測到未登入身分！請先返回首頁完成企業 Email 認證，否則公會將拒絕保存您的實戰進度與 GAS 戰績。");
                exitToDashboardMenu();
                return;
            }

            localStorage.setItem(`handbook-L1-A${activePackUnitId.split('-')[1]}-clear`, 'true');
            
            try {
                const finalPushUrl = GLOBAL_GAS_URL + 
                    "?action=push" +
                    "&courseId=" + encodeURIComponent("HB-" + activePackUnitId) + 
                    "&status=" + encodeURIComponent("通過");
                window.open(finalPushUrl, '_blank', 'width=500,height=400,scrollbars=no,resizable=no');
            } catch(e) {
                console.error("GAS 擊發流產:", e);
            }
            exitToDashboardMenu();
        };

        (function() {
            const PILOT_EMAIL = localStorage.getItem('tpm-user-current-email') || "";
            
            function computeLocalUserRankTitle() {
                if (!PILOT_EMAIL || PILOT_EMAIL.trim() === "") {
                    return { text: "首頁登入", isLogged: false };
                }
                let nameStr = "Daniel Shih";
                const emailLower = PILOT_EMAIL.toLowerCase().trim();
                if (emailLower !== "danielcwshih@fih-foxconn.com") {
                    nameStr = emailLower.split('@')[0].replace(/[\._\-]/g, ' ').replace(/\b\w/g, function(c) {
                        return c.toUpperCase();
                    });
                }
                const beginnerKeys = ['codex-L1-A1-clear', 'codex-L1-A2-clear', 'codex-L1-A3-clear', 'codex-L1-A4-clear', 'codex-L2-A1-clear', 'codex-L3-A1-clear'];
                const isAllBeginnerCleared = beginnerKeys.every(function(k) {
                    return localStorage.getItem(k) === 'true';
                });
                const adventureKeys = ['handbook-L1-A1-clear', 'handbook-L1-A2-clear'];
                const isAllAdventureCleared = adventureKeys.every(function(k) {
                    return localStorage.getItem(k) === 'true';
                });
                if (isAllBeginnerCleared && isAllAdventureCleared) {
                    return { text: "👤 統籌者 : " + nameStr, isLogged: true };
                }
                if (isAllBeginnerCleared) {
                    return { text: "👤 冒險者 : " + nameStr, isLogged: true };
                }
                return { text: "👤 初心者 : " + nameStr, isLogged: true };
            }
            
            const originalOnload = window.onload;
            window.onload = function() {
                if (originalOnload) {
                    originalOnload();
                }
                const profileBox = document.getElementById('global-user-profile-card');
                if (profileBox) {
                    const rankInfo = computeLocalUserRankTitle();
                    profileBox.innerHTML = rankInfo.text;
                    if (!rankInfo.isLogged) {
                        profileBox.style.color = "#DC2626";
                        profileBox.style.borderColor = "#DC2626";
                        profileBox.style.boxShadow = "3px 3px 0px #DC2626";
                    }
                }
            };
        })();
    </script>
