        const enBtn = document.getElementById('global-btn-en');
        if (twBtn && enBtn) {
            twBtn.classList.remove('active');
            enBtn.classList.remove('active');
            document.getElementById(`global-btn-${lang}`).classList.add('active');
        }

        const cachedName = localStorage.getItem('tpm-user-name');
        const cachedRank = localStorage.getItem('tpm-user-rank') || globalUiTranslations[lang]["rank-default"];
        const profileCard = document.getElementById('global-user-profile-card');
        if (profileCard) {
            if (cachedName) {
                profileCard.innerHTML = `👤 ${cachedRank}：${cachedName}`;
            } else {
                profileCard.innerText = globalUiTranslations[lang]["auth-locked"];
            }
        }

        renderGroupedLexicon();
    }

    function executeLangSwitch(lang) {
        syncNavbarState(lang);
    }

    /* 樹狀折疊控制器 */
    function toggleMenuSection(containerId, toggleId) {
        const container = document.getElementById(containerId);
        const toggleBtn = document.getElementById(toggleId);
        
        if (container.style.display === 'none') {
            container.style.display = 'flex';
            toggleBtn.classList.remove('collapsed');
        } else {
            container.style.display = 'none';
            toggleBtn.classList.add('collapsed');
        }
    }

    /* 側邊欄點選連動核心：切換時子流程節點默認全部強制歸零重置 */
    function selectLibraryUnit(type, unit) {
        document.getElementById('btn-show-all').classList.remove('active');
        document.querySelectorAll('.tree-leaf-container .leaf-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        if (type === 'all') {
            document.getElementById('btn-show-all').classList.add('active');
        } else {
            const leafId = `lf-${type}-${unit}`;
            const targetLeaf = document.getElementById(leafId);
            if (targetLeaf) {
                targetLeaf.classList.add('active');
            }
        }

        activeType = type;
        activeUnit = unit;
        
        renderGroupedLexicon();
    }

    /* 頂部二級導航篩選範疇切換器 */
    function filterTopCategory(category) {
        document.querySelectorAll('#library-sub-nav-wrapper .sub-nav-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        const tgtBtn = document.getElementById(`cat-btn-${category}`);
        if (tgtBtn) {
            tgtBtn.classList.add('active');
        }

        activeCategory = category;
        renderGroupedLexicon();
    }

    /* 核心分流分組渲染引擎：加裝剛性黑虛分隔線 */
    function renderGroupedLexicon() {
        const canvas = document.getElementById('lexicon-canvas');
        canvas.innerHTML = '';

        const scanMap = [];
        if (activeType === 'all') {
            scanMap.push({ type: 'codex', unit: '1-1', label: '📦 初心者寶典 ── SECTION 1-1 基本世界觀與 NPI 鏈條' });
            scanMap.push({ type: 'codex', unit: '1-2', label: '📦 初心者寶典 ── SECTION 1-2 工廠基礎與良率鐵律' });
            scanMap.push({ type: 'handbook', unit: '1-1', label: '📦 冒險者手冊 ── SECTION 1-1 防水設計與環境防護結界' });
        } else {
            let currentLabelText = '';
            if (activeType === 'codex' && activeUnit === '1-1') {
                currentLabelText = '📦 初心者寶典 ── SECTION 1-1 基本世界觀與 NPI 鏈條';
            }
            if (activeType === 'codex' && activeUnit === '1-2') {
                currentLabelText = '📦 初心者寶典 ── SECTION 1-2 工廠基礎與良率鐵律';
            }
            if (activeType === 'handbook' && activeUnit === '1-1') {
                currentLabelText = '📦 冒險者手冊 ── SECTION 1-1 防水設計與環境防護結界';
            }
            scanMap.push({ type: activeType, unit: activeUnit, label: currentLabelText });
        }

        let renderedBlocksCount = 0;

        scanMap.forEach((block) => {
            const dataSlice = libraryLexicon.filter(item => {
                const matchType = item.type === block.type;
                const matchUnit = item.unit === block.unit;
                const matchCategory = activeCategory === 'all' || item.category === activeCategory;
                return matchType && matchUnit && matchCategory;
            });

            if (dataSlice.length > 0) {
                if (renderedBlocksCount > 0) {
                    const dividerLine = document.createElement('div');
                    dividerLine.style.cssText = "border-bottom: 3px dashed var(--border-heavy); margin: 35px 0; width: 100%;";
                    canvas.appendChild(dividerLine);
                }

                const sectionHeader = document.createElement('div');
                sectionHeader.style.cssText = "width: 100%; font-size: 1.3rem; font-weight: 900; margin-top: 10px; margin-bottom: 20px; color: var(--text-main); letter-spacing: -0.5px;";
                sectionHeader.innerText = block.label;
                canvas.appendChild(sectionHeader);

                const gridContainer = document.createElement('div');
                gridContainer.className = 'lib-lexicon-grid';

                dataSlice.forEach(item => {
                    gridContainer.innerHTML += `
                        <div class="lib-jargon-card" onclick="openLexiconDetail('${item.id}')">
                            <div class="jargon-tag-box">🏷️ ${item.tag}</div>
                            <div class="jargon-main-term">${item.term}</div>
                            <div class="jargon-sub-game-term">(${item.gameTerm})</div>
                            <div style="font-family: monospace; font-size: 0.7rem; opacity: 0.5; margin-top: 10px; text-transform: uppercase;">${item.en}</div>
                        </div>
                    `;
                });

                canvas.appendChild(gridContainer);
                renderedBlocksCount++;
            }
        });

        if (renderedBlocksCount === 0) {
            canvas.innerHTML = `
                <div style="width: 100%; padding: 40px; text-align: center; font-weight: 900; color: var(--text-secondary); border: 2px dashed var(--border-heavy); border-radius: var(--radius-sm);">
                    📭 當前篩選條件下，大圖書館內無對應之術語圖鑑文件。
                </div>
            `;
        }
    }

    function openLexiconDetail(id) {
        const data = libraryLexicon.find(item => item.id === id);
        if (!data) return;
        document.getElementById('modal-jargon-tag').innerText = `🏷️ ${data.tag} [ ${data.en} ]`;
        document.getElementById('modal-jargon-term').innerText = data.term;
        document.getElementById('modal-jargon-lore').innerText = data.lore;
        document.getElementById('modal-jargon-def').innerText = data.def;
        document.getElementById('modal-jargon-lessons').innerText = data.lessons;
        document.getElementById('lexicon-modal').style.display = 'flex';
    }

    function closeLexicon() {
        document.getElementById('lexicon-modal').style.display = 'none';
    }
</script>
</body>
</html>
