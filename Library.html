<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識圖書館 | System TPM Knowledge Library (0527-V1.0)</title>
    <style>
        :root {
            --bg-color: #FEF9E7; --sidebar-cream: #FDF2D0; --card-white: #FFFFFF; --active-yellow: #FDE047;
            --text-main: #1A1A1A; --text-secondary: #475569; --border-heavy: #1A1A1A;
            --shadow-tactical: 6px 6px 0px #1A1A1A; --radius-sm: 12px;
            --tier-blue: #3B82F6; --tier-gold: #F59E0B;
        }
        * { box-sizing: border-box; font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif; color: var(--text-main); }
        body { background-color: var(--bg-color); background-image: radial-gradient(var(--sidebar-cream) 2px, transparent 2px); background-size: 32px 32px; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100vw; min-height: 100vh; padding: 40px; overflow-x: hidden; }
        header { text-align: center; margin-bottom: 50px; width: 100%; position: relative; }
        .back-btn { position: absolute; top: 0; left: 0; background: var(--card-white); border: 3px solid var(--border-heavy); padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 900; text-decoration: none; box-shadow: 4px 4px 0px var(--border-heavy); }
        .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border-heavy); }
        .head-controls { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 20px; }
        .auth-panel { background: var(--card-white); border: 3px solid var(--border-heavy); padding: 12px 25px; border-radius: var(--radius-sm); font-weight: 900; box-shadow: 4px 4px 0px var(--border-heavy); }
        .lang-switcher-hq { display: flex; background: var(--card-white); border: 3px solid var(--border-heavy); border-radius: var(--radius-sm); box-shadow: 4px 4px 0px var(--border-heavy); padding: 2px; }
        .lang-btn-hq { padding: 8px 16px; border-radius: 6px; border: none; background: transparent; cursor: pointer; font-size: 0.8rem; font-weight: 900; color: var(--text-secondary); }
        .lang-btn-hq.active { background: var(--text-main); color: white; }
        h1 { font-size: 3rem; margin: 0; font-weight: 900; letter-spacing: -1px; }
        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 30px; width: 100%; margin-top: 50px; }
        .archive-card { background: var(--card-white); border: 3px solid var(--border-heavy); border-radius: var(--radius-sm); padding: 30px; box-shadow: var(--shadow-tactical); position: relative; cursor: pointer; transition: all 0.15s; }
        .archive-card:hover { transform: translate(-4px, -4px); box-shadow: 10px 10px 0px var(--text-main); }
        .status-badge { position: absolute; top: 20px; right: 20px; font-size: 0.7rem; font-weight: 900; padding: 4px 10px; border-radius: 6px; border: 2px solid var(--border-heavy); background: #FFF; font-family: monospace; }
        .archive-card h3 { font-size: 1.3rem; font-weight: 900; margin: 0 0 10px 0; }
        .archive-card p { font-size: 0.95rem; color: var(--text-secondary); font-weight: 600; margin: 0; line-height: 1.6; }
        .lexicon-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-white); border: 3px solid var(--border-heavy); border-radius: var(--radius-sm); width: 100%; max-width: 700px; box-shadow: 10px 10px 0px var(--border-heavy); display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { background: var(--sidebar-cream); padding: 20px 30px; border-bottom: 3px solid var(--border-heavy); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 35px; display: flex; flex-direction: column; gap: 25px; overflow-y: auto; max-height: 70vh; }
        .lexicon-section-block { border: 2px solid var(--border-heavy); border-radius: var(--radius-sm); padding: 20px; background: #FAFAFA; }
        .lexicon-block-label { font-size: 0.8rem; font-weight: 900; color: var(--text-secondary); font-family: monospace; border-bottom: 1px dashed var(--border-heavy); padding-bottom: 5px; margin-bottom: 10px; }
        .lexicon-block-text { font-size: 1rem; font-weight: 600; line-height: 1.7; white-space: pre-line; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; font-weight: 900; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn" data-i18n="back-to-hq">↩ 返回公會總部</a>
        <div class="head-controls">
            <div class="lang-switcher-hq">
                <button class="lang-btn-hq active" id="btn-tw" onclick="setLang('tw')">TW</button>
                <button class="lang-btn-hq" id="btn-en" onclick="setLang('en')">EN</button>
            </div>
            <div id="user-profile" class="auth-panel" data-i18n="auth-unlocked">👤 冒險者認證中...</div>
        </div>
        <h1 data-i18n="library-title">知識圖書館文檔庫</h1>
    </header>

    <div class="archive-grid" id="library-cards-container"></div>

    <div id="lexicon-modal" class="lexicon-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div><span id="modal-jargon-tag" style="font-family: monospace; font-weight: 900; color: var(--tier-blue);">TAG</span><h2 id="modal-jargon-term" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">專有名詞</h2></div>
                <button class="close-btn" onclick="closeLexicon()">✕</button>
            </div>
            <div class="modal-body">
                <div class="lexicon-section-block" style="background-color: #FFFDF2; border-color: var(--tier-gold);">
                    <div class="lexicon-block-label" style="color: #B45309;">🌌 異世界公會奇幻包裝 (Guild Lore)</div>
                    <div id="modal-jargon-lore" class="lexicon-block-text" style="color: #B45309; font-weight: 800;"></div>
                </div>
                <div class="lexicon-section-block">
                    <div class="lexicon-block-label">📘 正統實務工程學定義 (Technical Definition)</div>
                    <div id="modal-jargon-def" class="lexicon-block-text"></div>
                </div>
                <div class="lexicon-section-block" style="background-color: #FEF2F2; border-color: #EF4444;">
                    <div class="lexicon-block-label" style="color: #B91C1C;">🔥 歷代英雄血淚戰役史詩 (Lessons Learned)</div>
                    <div id="modal-jargon-lessons" class="lexicon-block-text" style="color: #DC2626;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            tw: { "back-to-hq": "↩ 返回公會總部", "library-title": "知識圖書館文檔庫", "auth-unlocked": "冒險者認證成功" },
            en: { "back-to-hq": "↩ Back to HQ", "library-title": "Knowledge Library Archive", "auth-unlocked": "Adventurer Authenticated" }
        };
        const libraryData = [
            {
                id: "L-01", tag: "FATP / 製程", term: "FPY (直通率)", en: "First Pass Yield", gameTerm: "純淨血統鐵律",
                desc: "衡量製程健康度與重工隱形成本的終極指標。",
                lore: "指神器在深淵流水線中，從第一站鑄造到最後一站測試，完全沒有重工修復、一氣呵成順利通關的完美概率。",
                def: "First Pass Yield。第一次就製造出完全合格產品的比例。公式為：(不需重工即合格的產品數 / 投入生產總數) × 100%。",
                lessons: "某專案試產時宣稱良率 98%，但 TPM 抓出 FPY 僅有 45%！這代表有過半產品都是被手工重修拆解過才合格，導致運往市場後開箱 DOA 良率大爆炸。此役後確立鐵律：不看最後良率，只斬直通率！"
            },
            {
                id: "L-02", tag: "材料 / 供應鏈", term: "Lead Time (長料期)", en: "Lead Time", gameTerm: "長料期的沉沒詛咒",
                desc: "物料確認下單到送抵工廠倉庫的總交期沙漏長度。",
                lore: "從向幻界供應商下達召喚聖旨開始，到零件跨海運抵深淵倉庫的漫長時間阻礙。在特定高階 IC 上常高達 12 週以上。",
                def: "從訂單下達、產線排產、封裝測試到跨國海空運物流抵達的總時間長度。控制長料期風險是 TPM 的核心技能。",
                lessons: "試產前夕主晶片供應商突發地震，交期暴增一個月。TPM 發動時空挪動法：試產不延期，前半段以 Dummy 板空板過 SMT 火山爐，等一個月後晶片運抵，再在後段架設 Rework 專屬手工工位後補焊，專案如期發布 Exit！"
            }
        ];
        function renderCards() {
            const container = document.getElementById('library-cards-container'); container.innerHTML = libraryData.map(item => `
                <div class="archive-card" onclick="openLexiconDetail('${item.id}')">
                    <div class="status-badge">🏷️ ${item.tag}</div>
                    <h3>${item.term}</h3>
                    <p>${item.desc}</p>
                    <div style="font-family: monospace; font-size: 0.75rem; opacity: 0.5; margin-top: 15px; text-transform: uppercase;">${item.en}</div>
                </div>
            `).join('');
        }
        function openLexiconDetail(id) {
            const data = libraryData.find(item => item.id === id); if (!data) return;
            document.getElementById('modal-jargon-tag').innerText = `🏷️ ${data.tag} [ ${data.en} ]`;
            document.getElementById('modal-jargon-term').innerText = data.term;
            document.getElementById('modal-jargon-lore').innerText = data.lore;
            document.getElementById('modal-jargon-def').innerText = data.def;
            document.getElementById('modal-jargon-lessons').innerText = data.lessons;
            document.getElementById('lexicon-modal').style.display = 'flex';
        }
        function closeLexicon() { document.getElementById('lexicon-modal').style.display = 'none'; }
        function setLang(lang) {
            document.querySelectorAll('.lang-btn-hq').forEach(btn => btn.classList.remove('active')); document.getElementById(`btn-${lang}`).classList.add('active');
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(translations[lang][key]) el.innerText = translations[lang][key]; });
            localStorage.setItem('tpm-lang-pref', lang);
        }
        window.onload = () => {
            setLang(localStorage.getItem('tpm-lang-pref') || 'tw'); renderCards();
            const cachedName = localStorage.getItem('tpm-user-name');
            if (cachedName) { const currentRank = localStorage.getItem('tpm-user-rank') || "冒險者"; document.getElementById('user-profile').innerHTML = `👤 ${currentRank}：${cachedName}`; }
        };
    </script>
</body>
</html>
