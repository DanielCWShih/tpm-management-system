<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大圖書館術語圖鑑庫 | Knowledge Lexicon Library</title>
    
    <style>
        :root {
            --bg-color: #FEF9E7;
            --sidebar-cream: #FDF2D0;
            --card-white: #FFFFFF;
            --text-main: #1A1A1A;
            --text-secondary: #475569;
            --border-heavy: #1A1A1A;
            --shadow-tactical: 5px 5px 0px #1A1A1A;
            --radius-sm: 8px;
            --color-locked: #94A3B8;
            --color-completed: #F59E0B;
            --color-fail: #DC2626;
            --tier-gold: #F59E0B;
        }

        html, 
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", "Inter", "Noto Sans TC", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* 剛性頂部控制列 */
        .tactical-navbar {
            width: 100vw;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--border-heavy);
            padding: 0 40px;
            background-color: var(--bg-color);
            flex-shrink: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            flex-direction: column;
        }

        .navbar-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lang-switcher-wrapper {
            display: flex;
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 0px var(--border-heavy);
            padding: 2px;
        }

        .lang-btn-core {
            width: 50px;
            height: 35px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .lang-btn-core.active {
            background: var(--text-main) !important;
            color: white !important;
        }

        .auth-panel {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 900;
            box-shadow: 3px 3px 0px var(--border-heavy);
            white-space: nowrap;
        }

        .back-btn {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            padding: 10px 15px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 3px 3px 0px var(--border-heavy);
            display: inline-block;
            text-align: center;
            min-width: 95px;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-heavy);
        }

        /* 雙區塊工作主框架 */
        .lib-workspace {
            display: flex;
            width: 100vw;
            height: calc(100vh - 85px);
            overflow: hidden;
        }

        .lib-sidebar {
            width: 280px;
            background-color: var(--sidebar-cream);
            border-right: 4px solid var(--border-heavy);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
        }

        .lib-content-canvas {
            flex: 1;
            height: 100%;
            padding: 35px 40px;
            overflow-y: auto;
            background-color: var(--card-white);
            display: flex;
            flex-direction: column;
        }

        /* 側邊類別導航按鈕 */
        .category-btn {
            background: var(--card-white);
            border: 2px solid var(--border-heavy);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-heavy);
            width: 100%;
            color: var(--text-main);
        }

        .category-btn.active {
            background: var(--text-main);
            color: white;
            box-shadow: 1px 1px 0px var(--border-heavy);
        }

        /* 頂部二級單元分頁切換模組樣式表 */
        .cdx-sub-nav-bar {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--border-heavy);
            padding-bottom: 15px;
            flex-shrink: 0;
        }

        .sub-nav-btn {
            background: #FFF;
            border: 2px solid var(--border-heavy);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-heavy);
            transition: all 0.1s;
            color: var(--text-main);
        }

        .sub-nav-btn.active {
            background: #FDE047;
            color: var(--text-main);
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-heavy);
        }

        /* 圖鑑卡牌密排網格 */
        .lib-lexicon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            width: 100%;
            margin-bottom: 10px;
        }

        .lib-jargon-card {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 25px 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-heavy);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            min-height: 150px;
        }

        .lib-jargon-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--text-main);
            background-color: #FFFDF4;
        }

        .jargon-tag-box {
            font-family: monospace;
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .jargon-main-term {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .jargon-sub-game-term {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 詳情彈窗遮罩防線 */
        .dungeon-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-white);
            border: 3px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            width: 100%;
            max-width: 650px;
            box-shadow: 10px 10px 0px var(--border-heavy);
            display: flex;
            flex-direction: column;
            overflow: visible;
            position: relative;
        }

        .modal-header {
            background: var(--sidebar-cream);
            padding: 20px 30px;
            border-bottom: 3px solid var(--border-heavy);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            max-height: 70vh;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: 900;
            color: var(--text-main);
        }

        .lexicon-section-block {
            border: 2px solid var(--border-heavy);
            border-radius: var(--radius-sm);
            padding: 20px;
            background: #FAFAFA;
            margin-bottom: 15px;
        }

        .lexicon-block-label {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--text-secondary);
            font-family: monospace;
            border-bottom: 1px dashed var(--border-heavy);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .lexicon-block-text {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.7;
            white-space: pre-line;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="tactical-navbar">
        <div class="navbar-brand">
            <span style="font-family: monospace; font-weight: 900; color: var(--text-secondary); font-size: 0.8rem;" id="global-inject-tag">SYS.LEXICON_LIBRARY V5.0</span>
            <h1 style="margin: 3px 0 0 0; font-size: 2.1rem; font-weight: 900;" id="global-inject-title">大圖書館術語圖鑑庫</h1>
        </div>
        <div class="navbar-controls">
            <div id="global-user-profile-card" class="auth-panel">🔒 認證讀取中...</div>
            <div class="lang-switcher-wrapper">
                <button class="lang-btn-core" id="global-btn-tw" onclick="executeLangSwitch('tw')">TW</button>
                <button class="lang-btn-core" id="global-btn-en" onclick="executeLangSwitch('en')">EN</button>
            </div>
            <a href="index.html" class="back-btn" id="global-nav-home-btn">首頁</a>
        </div>
    </div>

    <div class="lib-workspace">
        
        <aside class="lib-sidebar">
            <button class="category-btn active" id="btn-all" onclick="filterCategory('all')">【 顯示全部圖鑑 】</button>
            <button class="category-btn" id="btn-abyss" onclick="filterCategory('abyss')">⚙️ 物質製造 (工廠製程)</button>
            <button class="category-btn" id="btn-pantheon" onclick="filterCategory('pantheon')">🏛️ 核心研發 (研發設計)</button>
            <button class="category-btn" id="btn-phantom" onclick="filterCategory('phantom')">🔮 供應鏈採購 (供應鏈)</button>
        </aside>

        <main class="lib-content-canvas">
            
            <div class="cdx-sub-nav-bar" id="library-sub-nav-wrapper">
                <button class="sub-nav-btn active" id="unit-btn-all" onclick="filterUnit('all')">【 全部單元 】</button>
                <button class="sub-nav-btn" id="unit-btn-1-1" onclick="filterUnit('1-1')">單元 1-1</button>
                <button class="sub-nav-btn" id="unit-btn-1-2" onclick="filterUnit('1-2')">單元 1-2</button>
                <button class="sub-nav-btn" id="unit-btn-1-3" onclick="filterUnit('1-3')">單元 1-3</button>
            </div>

            <div id="lexicon-canvas" style="width: 100%; flex: 1;"></div>
            
        </main>
        
    </div>

    <div id="lexicon-modal" class="dungeon-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span id="modal-jargon-tag" style="font-family: monospace; font-weight: 900; color: var(--text-main);">TAG</span>
                    <h2 id="modal-jargon-term" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">專有名詞</h2>
                </div>
                <button class="close-btn" onclick="closeLexicon()">✕</button>
            </div>
            <div class="modal-body">
                <div class="lexicon-section-block" style="background-color: #FFFDF2; border-color: var(--tier-gold);">
                    <div class="lexicon-block-label">🌌 實務情境案例解說 (Technical Lore)</div>
                    <div id="modal-jargon-lore" class="lexicon-block-text" style="color: #B45309; font-weight: 800;"></div>
                </div>
                <div class="lexicon-section-block">
                    <div class="lexicon-block-label">📘 正統實務工程學定義 (Technical Definition)</div>
                    <div id="modal-jargon-def" class="lexicon-block-text"></div>
                </div>
                <div class="lexicon-section-block" style="background-color: #FEF2F2; border-color: #EF4444;">
                    <div class="lexicon-block-label" style="color: #B91C1C;">🔥 歷代專案經驗教訓歷史文檔 (Lessons Learned / Post-Mortem)</div>
                    <div id="modal-jargon-lessons" class="lexicon-block-text" style="line-height: 1.6;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const globalUiTranslations = {
            tw: { "nav-home": "首頁", "auth-locked": "🔒 未讀取公會憑證", "rank-default": "冒險者", "title": "大圖書館術語圖鑑庫" },
            en: { "nav-home": "Home", "auth-locked": "🔒 No Credentials", "rank-default": "Adventurer", "title": "Knowledge Lexicon Library" }
        };

        const libraryLexicon = [
            { id: "J-01", unit: "1-2", category: "abyss", tag: "FATP / Process", term: "FPY (直通率)", en: "First Pass Yield", gameTerm: "製造防線鐵律", lore: "一個產品在流水線中，完全沒有重工修復、一氣合成順利通關的完美機率。", def: "First Pass Yield。第一次就製造出合格產品的比例。公式為：(不需重工合格數 / 投入總數) × 100%。", lessons: "某手機試產良率 98%，但 FPY 只有 45%！代表過半都是手工重修三次勉強過關。運到市場開箱 DOA 良率炸裂。確立鐵律：不斬良率，只斬直通率！" },
            { id: "J-02", unit: "1-2", category: "abyss", tag: "SMT / Production", term: "AOI (自動光學檢測)", en: "Automated Optical Inspection", gameTerm: "第一審判之門", lore: "架設在 SMT 火山熔爐出口，毫秒間高速掃描主板是否有印歪、短路 or 偏移浮起。", def: "Automated Optical Inspection。利用光學攝影機與影像演算法，自動檢測 PCBA 上零件的缺件、墓碑（Tombstoning）、短路等外觀缺陷。", lessons: "EVT 出現集體電阻浮起（墓碑效應）。工廠堅持是設計問題，TPM 調閱第一道審判（SPI 錫膏檢查）與 AOI 數據，精確抓到是鋼網（Stencil）厚度磨損。工廠當場認賠經營。" },
            { id: "J-03", unit: "1-3", category: "pantheon", tag: "Design / CMF", term: "Anodization (陽極氧化)", en: "Anodization", gameTerm: "表面保護皮層", lore: "利用電化學製程，在鋁合金骨架表面形成一層高硬度、抗刮、且能吸附色彩的防禦皮層。", def: "一種電化學製程，將金屬（主要是鋁合金）物件作為陽極，置於電解液中施加電流，使其表面形成一層具保護性與裝飾性的氧化膜。涉及極度敏感的酸鹼度控制。", lessons: "設計師要求高階無人機外殼必須呈現深邃極光藍。然而工廠回報：該電化學製程色差極難控制，直通率雪崩。TPM 緊急介入，在圖紙端妥協微調噴砂顆粒度，增加光線漫反射，完美遮蓋色差，拯救了大量專案時程。" },
            { id: "J-04", unit: "1-1", category: "phantom", tag: "Supply Chain / Logistics", term: "Lead Time (料期)", en: "Lead Time", gameTerm: "下單到交貨時程", lore: "指的是從你向廠商下達下單指令那一刻起，到零件原料真正送進代工廠倉庫，所需耗費的時間總長度。", def: "從訂單確認下達，到物料或成品實際交付到指定地點的這段總時間。在特定晶片上，長料期通常高達 12 至 16 週。", lessons: "某次 DVT 階段前夕，特定光學 IC 的 Lead Time 瞬間暴增一倍。TPM 大膽決定：試產不延期，前半段空板（Dummy Board）上線過爐，等 4 週後晶片運抵，再在工廠後段架設手工專屬工位進行後補後焊，如期 Exit！" }
        ];

        let activeCategory = 'all';
        let activeUnit = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            const currentLang = localStorage.getItem('tpm-lang-pref') || 'tw';
            syncNavbarState(currentLang);
        });

        function syncNavbarState(lang) {
            localStorage.setItem('tpm-lang-pref', lang);
            document.getElementById('global-nav-home-btn').innerText = globalUiTranslations[lang]["nav-home"];
            document.getElementById('global-inject-title').innerText = globalUiTranslations[lang]["title"];
            document.title = globalUiTranslations[lang]["title"];

            const twBtn = document.getElementById('global-btn-tw');
            const enBtn = document.getElementById('global-btn-en');
            if (twBtn && enBtn) {
                twBtn.classList.remove('active');
                enBtn.classList.remove('active');
                document.getElementById(`global-btn-${lang}`).classList.add('active');
            }

            const cachedName = localStorage.getItem('tpm-user-name');
            const cachedRank = localStorage.getItem('tpm-user-rank') || globalUiTranslations[lang]["rank-default"];
            const profileCard = document.getElementById('global-user-profile-card');
            if (profileCard) {
                if (cachedName) {
                    profileCard.innerHTML = `👤 ${cachedRank}：${cachedName}`;
                } else {
                    profileCard.innerText = globalUiTranslations[lang]["auth-locked"];
                }
            }

            renderGroupedLexicon();
        }

        function executeLangSwitch(lang) {
            syncNavbarState(lang);
        }

        function renderGroupedLexicon() {
            const canvas = document.getElementById('lexicon-canvas');
            canvas.innerHTML = '';

            const unitsToScan = activeUnit === 'all' ? ['1-1', '1-2', '1-3'] : [activeUnit];
            let renderedSectionsCount = 0;

            unitsToScan.forEach((unitId) => {
                const filteredData = libraryLexicon.filter(item => {
                    const matchUnit = item.unit === unitId;
                    const matchCat = activeCategory === 'all' || item.category === activeCategory;
                    return matchUnit && matchCat;
                });

                if (filteredData.length > 0) {
                    if (renderedSectionsCount > 0) {
                        const dividerLine = document.createElement('div');
                        dividerLine.style.cssText = "border-bottom: 3px dashed var(--border-heavy); margin: 35px 0; width: 100%;";
                        canvas.appendChild(dividerLine);
                    }

                    const sectionHeader = document.createElement('div');
                    sectionHeader.style.cssText = "width: 100%; font-size: 1.3rem; font-weight: 900; margin-top: 10px; margin-bottom: 20px; color: var(--text-main); font-family: sans-serif; letter-spacing: -0.5px;";
                    sectionHeader.innerText = `📦 NPI 專案進程單元 ── SECTION ${unitId}`;
                    canvas.appendChild(sectionHeader);

                    const gridContainer = document.createElement('div');
                    gridContainer.className = 'lib-lexicon-grid';

                    filteredData.forEach(item => {
                        gridContainer.innerHTML += `
                            <div class="lib-jargon-card" onclick="openLexiconDetail('${item.id}')">
                                <div class="jargon-tag-box">🏷️ ${item.tag}</div>
                                <div class="jargon-main-term">${item.term}</div>
                                <div class="jargon-sub-game-term">(${item.gameTerm})</div>
                                <div style="font-family: monospace; font-size: 0.7rem; opacity: 0.5; margin-top: 10px; text-transform: uppercase;">${item.en}</div>
                            </div>
                        `;
                    });

                    canvas.appendChild(gridContainer);
                    renderedSectionsCount++;
                }
            });

            if (renderedSectionsCount === 0) {
                canvas.innerHTML = `
                    <div style="width: 100%; padding: 40px; text-align: center; font-weight: 900; color: var(--text-secondary); border: 2px dashed var(--border-heavy); border-radius: var(--radius-sm);">
                        📭 當前單元分流下無對應之術語圖鑑。
                    </div>
                `;
            }
        }

        function filterCategory(category) {
            document.querySelectorAll('.lib-sidebar .category-btn').forEach(btn => btn.classList.remove('active'));
            let btnId = category === 'all' ? 'btn-all' : 'btn-' + category;
            const tgtBtn = document.getElementById(btnId);
            if(tgtBtn) tgtBtn.classList.add('active');
            
            activeCategory = category;
            renderGroupedLexicon();
        }

        function filterUnit(unitId) {
            document.querySelectorAll('#library-sub-nav-wrapper .sub-nav-btn').forEach(btn => btn.classList.remove('active'));
            let btnId = unitId === 'all' ? 'unit-btn-all' : 'unit-btn-' + unitId;
            const tgtBtn = document.getElementById(btnId);
            if(tgtBtn) tgtBtn.classList.add('active');

            activeUnit = unitId;
            renderGroupedLexicon();
        }

        function openLexiconDetail(id) {
            const data = libraryLexicon.find(item => item.id === id);
            if (!data) return;
            document.getElementById('modal-jargon-tag').innerText = `🏷️ ${data.tag} [ ${data.en} ]`;
            document.getElementById('modal-jargon-term').innerText = data.term;
            document.getElementById('modal-jargon-lore').innerText = data.lore;
            document.getElementById('modal-jargon-def').innerText = data.def;
            document.getElementById('modal-jargon-lessons').innerText = data.lessons;
            document.getElementById('lexicon-modal').style.display = 'flex';
        }

        function closeLexicon() {
            document.getElementById('lexicon-modal').style.display = 'none';
        }
    </script>
</body>
</html>
