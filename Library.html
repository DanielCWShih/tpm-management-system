<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大圖書館文檔庫 | System TPM Knowledge Library</title>
    <link rel="stylesheet" href="global_theme.css">
</head>
<body style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

    <div style="display: flex; flex: 1; width: 100%; overflow: hidden;">
        <aside>
            <button class="category-btn active" id="btn-all" onclick="filterLexicon('all')" data-i18n="cat-all">【 顯示全部圖鑑 】</button>
            <button class="category-btn" id="btn-abyss" onclick="filterLexicon('abyss')" data-i18n="cat-abyss">⚙️ 物質深淵 (工廠製程)</button>
            <button class="category-btn" id="btn-pantheon" onclick="filterLexicon('pantheon')" data-i18n="cat-pantheon">🏛️ 眾神殿 (研發設計)</button>
            <button class="category-btn" id="btn-phantom" onclick="filterLexicon('phantom')" data-i18n="cat-phantom">🔮 幻界位面 (供應鏈)</button>
        </aside>

        <main style="padding: 40px;">
            <div class="jargon-lexicon-grid" id="lexicon-canvas"></div>
        </main>
    </div>

    <div id="lexicon-modal" class="lexicon-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div><span id="modal-jargon-tag" style="font-family: monospace; font-weight: 900; color: var(--tier-blue);">TAG</span><h2 id="modal-jargon-term" style="margin: 5px 0 0 0; font-size: 1.6rem; font-weight: 900;">專有名詞</h2></div>
                <button class="close-btn" onclick="closeLexicon()">✕</button>
            </div>
            <div class="modal-body">
                <div class="lexicon-section-block" style="background-color: #FFFDF2; border-color: var(--tier-gold);">
                    <div class="lexicon-block-label" style="color: #B45309;" data-i18n="modal-lore-label">🌌 異世界奇幻包裝 (Guild Lore Translation)</div>
                    <div id="modal-jargon-lore" class="lexicon-block-text" style="color: #B45309; font-weight: 800;"></div>
                </div>
                <div class="lexicon-section-block">
                    <div class="lexicon-block-label" data-i18n="modal-def-label">📘 正統實務工程學定義 (Technical Definition)</div>
                    <div id="modal-jargon-def" class="lexicon-block-text"></div>
                </div>
                <div class="lexicon-section-block" style="background-color: #FEF2F2; border-color: #EF4444;">
                    <div class="lexicon-block-label" style="color: #B91C1C;" data-i18n="modal-lessons-label">🔥 歷代英雄血淚戰役史詩 (Lessons Learned / Post-Mortem)</div>
                    <div id="modal-jargon-lessons" class="lexicon-block-text" style="line-height: 1.6;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="global_ui.js"></script>
    <script>
        const translations = {
            tw: { "cat-all": "【 顯示全部圖鑑 】", "cat-abyss": "⚙️ 物質深淵 (工廠製程)", "cat-pantheon": "🏛️ 眾神殿 (研發設計)", "cat-phantom": "🔮 幻界位面 (供應鏈)", "modal-lore-label": "🌌 異世界奇幻包裝 (Guild Lore)", "modal-def-label": "📘 正統實務工程學定義 (Technical Definition)", "modal-lessons-label": "🔥 歷代英雄血淚戰役史詩 (Lessons Learned)" },
            en: { "cat-all": "[ Show All Lexicons ]", "cat-abyss": "⚙️ Factory Process", "cat-pantheon": "🏛️ R&D Design", "cat-phantom": "🔮 Supply Chain", "modal-lore-label": "🌌 Guild Lore Translation", "modal-def-label": "📘 Technical Definition", "modal-lessons-label": "🔥 Guild Historical Post-Mortem Logs" }
        };
        const libraryLexicon = [
            { id: "J-01", category: "abyss", tag: "FATP / Process", term: "FPY (直通率)", en: "First Pass Yield", gameTerm: "純淨血統鐵律", lore: "【純淨血統鐵律】一個神器在深淵流水線中，完全沒有重工修復、一氣呵成順利通關的完美機率。", def: "First Pass Yield。第一次就製造出合格產品的比例。公式為：(不需重工合格數 / 投入總數) × 100%。", lessons: "某手機試產良率 98%，但 FPY 只有 45%！代表過半都是手工重修三次勉強過關。運到市場開箱 DOA 良率炸裂。確立鐵律：不斬良率，只斬直通率！" },
            { id: "J-02", category: "abyss", tag: "SMT / Production", term: "AOI (自動光學檢測)", en: "Automated Optical Inspection", gameTerm: "深淵第一審判之門", lore: "【深淵第一審判之門】架設在 SMT 火山熔爐出口，毫秒間高速掃描晶片符文是否有印歪、短路或偏移浮起。", def: "Automated Optical Inspection。利用光學攝影機與影像演算法，自動檢測 PCBA 上零件的缺件、墓碑（Tombstoning）、短路等外觀缺陷。", lessons: "EVT 出現集體電阻浮起（墓碑效應）。工廠黑手堅持是設計問題，TPM 調閱第一道審判之門（SPI 錫膏檢查）與 AOI 數據，精確抓到是鋼網（Stencil）厚度磨損。工廠當場認賠。" }
        ];
        function renderLexicon(data) {
            const canvas = document.getElementById('lexicon-canvas'); canvas.innerHTML = '';
            data.forEach(item => {
                canvas.innerHTML += `<div class="jargon-card" onclick="openLexiconDetail('${item.id}')"><div class="jargon-tag-box">🏷️ ${item.tag}</div><div class="jargon-main-term">${item.term}</div><div class="jargon-sub-game-term">(${item.gameTerm})</div><div style="font-family: monospace; font-size: 0.7rem; opacity: 0.5; margin-top: 10px; text-transform: uppercase;">${item.en}</div></div>`;
            });
        }
        function filterLexicon(category) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            let btnId = category === 'all' ? 'btn-all' : 'btn-' + category; const tgtBtn = document.getElementById(btnId); if(tgtBtn) tgtBtn.classList.add('active');
            if (category === 'all') { renderLexicon(libraryLexicon); } else { renderLexicon(libraryLexicon.filter(item => item.category === category)); }
        }
        function openLexiconDetail(id) {
            const data = libraryLexicon.find(item => item.id === id); if (!data) return;
            document.getElementById('modal-jargon-tag').innerText = `🏷️ ${data.tag} [ ${data.en} ]`; document.getElementById('modal-jargon-term').innerText = data.term; document.getElementById('modal-jargon-lore').innerText = data.lore; document.getElementById('modal-jargon-def').innerText = data.def; document.getElementById('modal-jargon-lessons').innerText = data.lessons;
            document.getElementById('lexicon-modal').style.display = 'flex';
        }
        function closeLexicon() { document.getElementById('lexicon-modal').style.display = 'none'; }
        function setLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(translations[lang][key]) el.innerText = translations[lang][key]; });
            renderLexicon(libraryLexicon);
        }
    </script>
</body>
</html>
